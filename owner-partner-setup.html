 <style>
  :root{color-scheme:light;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;color:#16304c;background:#f4f7fb}
  *,*::before,*::after{box-sizing:border-box}
  body{margin:0;min-height:100vh}
  header{background:#12375d;color:white;padding:16px max(16px,calc((100vw - 820px)/2))}
  header a{color:#d9edff;text-decoration:none}
  main{max-width:820px;margin:0 auto;padding:16px;display:grid;gap:18px}
  main>h1{font-size:1.5rem;margin:0}
  main>h2{font-size:1.16rem;margin:4px 0 0}
  main>p{line-height:1.7;margin:0}
  main>section{min-width:0}
  main>select{font-size:16px;width:100%;min-height:48px;border:1px solid #afbed0;border-radius:10px;padding:10px;background:#fff;color:#16304c}
  .note{font-size:.87rem;color:#47576c;line-height:1.6}
  .ranking-owner-settings{background:white;padding:14px;border-radius:14px;display:grid;gap:12px}
  .ranking-owner-company{border:1px solid #d7e1ec;border-radius:12px;padding:12px;display:grid;gap:8px}
  .ranking-owner-company h3,.ranking-owner-settings h2{margin:0}
  .ranking-owner-company p{margin:0}
  .ranking-owner-save{min-height:44px;border:0;background:#1763ba;color:#fff;border-radius:9px;font-size:15px;font-weight:700}
  .ranking-owner-save:disabled{opacity:.5}
  .ranking-owner-confirm{display:flex;gap:10px;align-items:center;line-height:1.5}
  .ranking-owner-confirm input{width:22px;height:22px}
  @media(max-width:540px){main{padding:12px;gap:14px}header{padding:12px 16px}}
