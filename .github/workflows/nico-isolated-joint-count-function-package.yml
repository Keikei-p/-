name: NICO isolated joint count API function packaging (STAGING / NO DEPLOY)
on:
  pull_request:
    branches: [main]
    paths:
      - 'functions-ranking-approvals/**'
      - 'tests/isolated-joint-count-function-package.test.mjs'
      - 'tests/owner-sku-mapping-controller.test.cjs'
      - 'ranking/owner-reviewed-sku-mapping-store.mjs'
      - 'scripts/ci/review-approved-partner-count-rank.cjs'
      - '.github/workflows/nico-isolated-joint-count-function-package.yml'
  push:
    branches: [main]
    paths:
      - 'functions-ranking-approvals/**'
      - 'tests/isolated-joint-count-function-package.test.mjs'
      - 'tests/owner-sku-mapping-controller.test.cjs'
      - 'ranking/owner-reviewed-sku-mapping-store.mjs'
      - 'scripts/ci/review-approved-partner-count-rank.cjs'
      - '.github/workflows/nico-isolated-joint-count-function-package.yml'
permissions:
  contents: read
jobs:
  validate-disabled-isolated-function:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      FIREBASE_SERVICE_ACCOUNT_JSON: ''
      GOOGLE_APPLICATION_CREDENTIALS: ''
      NICO_JOINT_COUNT_RANKING_ENABLED: ''
      NICO_OWNER_PRODUCT_VISIBILITY_ENABLED: ''
      NICO_OWNER_SKU_MAPPING_ENABLED: ''
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Prevent data, existing Functions, Hosting and Rules changes
        shell: bash
        run: |
          set -euo pipefail
          test -z "$FIREBASE_SERVICE_ACCOUNT_JSON"
          test -z "$GOOGLE_APPLICATION_CREDENTIALS"
          test -z "$NICO_JOINT_COUNT_RANKING_ENABLED"
          test -z "$NICO_OWNER_PRODUCT_VISIBILITY_ENABLED"
          test -z "$NICO_OWNER_SKU_MAPPING_ENABLED"
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ] ||
             { [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF" = "refs/heads/main" ]; }; then
            if { [ "$GITHUB_EVENT_NAME" = "pull_request" ] &&
                 [ "${GITHUB_HEAD_REF:-}" = "feat/partner-published-count-input-20261111" ]; } ||
               { [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF" = "refs/heads/main" ]; }; then
              # Count UI/transaction changes are pinned by the exact integrated
              # reviewer. Financial source, Rules and project config stay frozen.
              test "$(git hash-object scripts/ci/review-approved-partner-count-rank.cjs)" = '00627520040fcd05538755fc4348aff861986844'
              node scripts/ci/review-approved-partner-count-rank.cjs
              git diff --exit-code "origin/main...HEAD" -- firestore.rules firebase.json .firebaserc functions firebase.partner-workspace.json
            elif [ "${GITHUB_HEAD_REF:-}" = "feat/verified-partner-daily-month-count-ranking-main-20261110" ]; then
              test "$(git hash-object scripts/ci/review-approved-partner-count-rank.cjs)" = '3f1447f9f45fcfa34da6c25dc10165da54b2f833'
              node scripts/ci/review-approved-partner-count-rank.cjs
              # Only the separately reviewed count-only files may differ;
              # finance, Rules, auth config and main app remain untouched.
              git diff --exit-code "origin/main...HEAD" -- firestore.rules firebase.json .firebaserc index.html functions firebase.partner-workspace.json
            else
              git diff --exit-code "origin/main...HEAD" -- firestore.rules firebase.json .firebaserc index.html partner-workspace.html functions functions-partner-workspace firebase.partner-workspace.json
            fi
          fi
          node --check functions-ranking-approvals/index.js
          node --check functions-ranking-approvals/joint-count-http-adapter.cjs
          node --check functions-ranking-approvals/owner-sku-mapping-controller.cjs
          node --check functions-ranking-approvals/ranking/owner-reviewed-sku-mapping-store.mjs
          cmp ranking/owner-reviewed-sku-mapping-store.mjs functions-ranking-approvals/ranking/owner-reviewed-sku-mapping-store.mjs
          grep -Fq 'NICO_OWNER_SKU_MAPPING_ENABLED===' functions-ranking-approvals/index.js
      - name: Verify exact canonical module graph and OFF-by-default HTTP route
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/isolated-joint-count-function-package.test.mjs tests/joint-count-http-adapter.test.cjs
          node --test tests/canonical-owner-count-server-factory.test.mjs
          node --test tests/owner-sku-mapping-controller.test.cjs tests/owner-reviewed-sku-mapping-store.test.mjs
          echo 'ISOLATED_COUNT_FUNCTION_READY_STAGING_ONLY_NO_DEPLOY'
