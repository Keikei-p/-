name: NICO partner SB hikari/Air v2 offline invariant tests (NO DEPLOY)
on:
  pull_request:
    branches: [main]
    paths:
      - 'functions-partner-workspace/service.cjs'
      - 'functions-partner-workspace/sb-category-v2.cjs'
      - 'tests/partner-workspace.test.cjs'
      - 'tests/partner-sb-category-v2.test.cjs'
      - '.github/workflows/nico-partner-sb-split-offline.yml'
  push:
    branches: [main]
    paths:
      - 'functions-partner-workspace/service.cjs'
      - 'functions-partner-workspace/sb-category-v2.cjs'
      - 'tests/partner-workspace.test.cjs'
      - 'tests/partner-sb-category-v2.test.cjs'
      - '.github/workflows/nico-partner-sb-split-offline.yml'
permissions:
  contents: read
jobs:
  history-and-categories:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Check additive schema with NO Firebase deploy, data changes or Rules changes
        shell: bash
        run: |
          set -euo pipefail
          node --check functions-partner-workspace/service.cjs
          node --check functions-partner-workspace/sb-category-v2.cjs
          node --test tests/partner-sb-category-v2.test.cjs tests/partner-workspace.test.cjs
          test "$(git hash-object functions/index.js)" = 'dfb4c48ada6fa89a24c898cd4a2f911bcede822f'
          test "$(git hash-object firestore.rules)" = 'd9f4df6a2ac0f8b5720534a2461ec66b94379190'
          test "$(git hash-object functions-partner-workspace/index.js)" = '38da7e9174ffea7c406c92292dccfc651b565eb0'
          test "$(git hash-object partner-workspace.html)" = '0930abb188165afea19ef427308ea22fddf636e7'
          node <<'NODE'
          const fs=require('node:fs');
          const current=fs.readFileSync('functions-partner-workspace/service.cjs','utf8');
          const helper=fs.readFileSync('functions-partner-workspace/sb-category-v2.cjs','utf8');
          if(!current.includes('sbBreakdownSchema:"sb-separated-v1"')||
            !current.includes('previousSbBreakdown:')||
            !helper.includes('旧未分類')||
            /collection\("(?:products|records|recordCorrections|revenueGoals)"\)/.test(helper))
            throw Error('SPLIT_OR_HISTORY_PROTECTION_MISSING');
          NODE
