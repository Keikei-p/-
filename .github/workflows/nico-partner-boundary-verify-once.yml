name: NICO one-shot partner finance boundary verified inventory (READ ONLY)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/nico-partner-boundary-verify-once.yml'
permissions:
  contents: read
concurrency:
  group: firebase-rules-production
  cancel-in-progress: false
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - name: Verify transport, rollback, existing finance and full candidate Rules
        run: |
          set -euo pipefail
          node --test tests/partner-boundary-release.test.mjs tests/live-rules-surgical-preview.test.mjs tests/internal-owner-finance-visibility.test.cjs tests/sales-regressions.cjs
          node --test tools/readonly-backup/backup.test.mjs
          npm install --prefix tests --ignore-scripts --no-audit --no-fund
          npm install -g firebase-tools@15.34.1 --no-audit --no-fund
          firebase emulators:exec --project demo-sales-support --only firestore 'node --test tests/rules.test.cjs'
  controlled:
    needs: offline
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.offline.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      FIREBASE_PROJECT_ID: sales-management-cc116
      NICO_USAGE_APPROVAL: EXISTING_FUNCTIONS_AND_FULL_INVENTORY_APPROVED
      NICO_RULES_APPROVAL: VERIFY_ONLY
      RELEASE_MODE: verify
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.sha }}', persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - name: Bind verification to the exact current main commit (no writes)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api repos/Keikei-p/-/branches/main --jq '.commit.sha')" = "$GITHUB_SHA" || { echo 'STOP_MAIN_CHANGED'; exit 1; }
          test "$RELEASE_MODE" = verify
          test "$NICO_RULES_APPROVAL" = VERIFY_ONLY
          test "$NICO_USAGE_APPROVAL" = EXISTING_FUNCTIONS_AND_FULL_INVENTORY_APPROVED
      - name: Install existing SDK and local emulator tooling
        run: |
          npm install --prefix functions --ignore-scripts --package-lock=false --no-audit --no-fund
          npm install -g firebase-tools@15.34.1 --no-audit --no-fund
      - name: Supply existing service identity without exposing it
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          test -n "$FIREBASE_SERVICE_ACCOUNT_JSON"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/partner-boundary-identity.json"
          chmod 600 "$RUNNER_TEMP/partner-boundary-identity.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/partner-boundary-identity.json" >> "$GITHUB_ENV"
      - name: Full inventory, isolated field-and-ID restore, stable comparison and optional exact Rules switch
        run: |
          set -euo pipefail
          test "$RELEASE_MODE" = verify || { echo 'STOP_READONLY_ONLY'; exit 1; }
          # Actual values stay in memory and in the disposable localhost emulator.
          # Emulator logs are private temporary files, NEVER artifacts or console output.
          result=0
          firebase emulators:exec --project demo-sales-restore --only firestore \
            "node tools/production/release-partner-boundary.mjs $RELEASE_MODE" \
            > "$RUNNER_TEMP/partner-boundary-private.log" 2>&1 || result=$?
          grep -E '^(STOP_[A-Z0-9_]+$|PARTNER_BOUNDARY_(CHECK|RESULT) )' "$RUNNER_TEMP/partner-boundary-private.log" || true
          test "$result" = 0
      - name: Keep only redacted verification proof
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: partner-boundary-verify-once-proof
          path: ${{ runner.temp }}/partner-boundary-summary.json
          if-no-files-found: error
          retention-days: 7
      - name: Remove private temporary credentials and logs
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/partner-boundary-identity.json" "$RUNNER_TEMP/partner-boundary-private.log" firestore-debug.log firebase-debug.log ui-debug.log
