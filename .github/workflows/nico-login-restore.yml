name: NICO emergency existing-user login restore (index only)
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'tests/legacy-finance-entry-guard.test.mjs'
      - '.github/workflows/nico-login-restore.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nico-surgical-index-release
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify old-user login regression and finance isolation
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/hosting/surgical-existing-index.mjs
          node --test tests/legacy-finance-entry-guard.test.mjs
          node --test tests/surgical-existing-index.test.mjs
          node --test tests/partner-existing-ranking.test.cjs
          node --test tests/sales-regressions.cjs
          node <<'NODE'
          const fs=require('node:fs');
          const html=fs.readFileSync('index.html','utf8');
          if(!html.includes('const memberForCheck=trustedMember.companyId==null'))
            throw Error('REVIEWED_LOGIN_REPAIR_NOT_PRESENT');
          if(!html.includes('member:memberForCheck')||
             !html.includes('getDocFromServer(doc(db,"companies",profile.companyId,"members",user.uid))'))
            throw Error('UNTRUSTED_COMPANY_MEMBERSHIP');
          const guard=fs.readFileSync('legacy-finance-entry-guard.mjs','utf8');
          if(!guard.includes('mode:"partner"'))throw Error('FINANCE_GUARD_MISSING');
          NODE
  release:
    needs: validate
    if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.validate.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NICO_PARTNER_RELEASE_CONFIRMATION: CONFIRM_ADD_PARTNER_RANKING_INDEX_ONLY
      FIREBASE_PROJECT_ID: sales-management-cc116
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Hold direct-role bundle until four Functions are published first
        shell: bash
        run: |
          set -euo pipefail
          # This exact reviewed UI + backend pair requires an explicitly
          # sequenced release. Never let an ordinary main push serve the new
          # invitation UI against the old workspace API.
          if [ "$(git hash-object index.html)" = 'd68e0be91d5933c03ed0657a73751573fb5c7344' ] &&
             [ "$(git hash-object functions-partner-workspace/service.cjs)" = '29c0e3b29863e654ba70fd5b3f4a8efe4d0827d8' ]; then
            echo 'STOP_DIRECT_ROLE_REQUIRES_SEQUENCED_FUNCTIONS_FIRST'
            exit 1
          fi
      - name: Verify finance guard embedded in self-contained login screen
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('node:fs');
          const html=fs.readFileSync('index.html','utf8');
          const src=fs.readFileSync('legacy-finance-entry-guard.mjs','utf8')
             .replace('export function classifyLegacySalesEntrypoint','function classifyLegacySalesEntrypoint');
          if(!html.includes(src)||html.includes('from "./legacy-finance-entry-guard.mjs"'))
            throw Error('UNSAFE_EXTERNAL_MODULE_DEPENDENCY');
          console.log('Finance guard embedded unchanged; no external module needed');
          NODE
      - name: Load approved Hosting-only service identity
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${FIREBASE_SERVICE_ACCOUNT_JSON:-}"
          node -e "const fs=require('node:fs');if(JSON.parse(fs.readFileSync('.firebaserc','utf8')).projects.default!=='sales-management-cc116')process.exit(1)"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/nico-login-hosting-only.json"
          chmod 600 "$RUNNER_TEMP/nico-login-hosting-only.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/nico-login-hosting-only.json" >> "$GITHUB_ENV"
      - name: Install only REST authentication library, not Firestore / Rules / Functions
        run: npm install --prefix functions --ignore-scripts --package-lock=false
      - name: Validate live Hosting assets without modifications
        run: node tools/hosting/surgical-existing-index.mjs --dry-run
      - name: Publish only repaired index.html preserving ALL other deployed blobs
        run: node tools/hosting/surgical-existing-index.mjs --release
      - name: Verify production HTML contains the reviewed login fix and no new files removed
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --max-time 30 'https://nico-factory.web.app/?nocache=nico-login-restore' > "$RUNNER_TEMP/nico-login-index.html"
          grep -Fq 'const memberForCheck=trustedMember.companyId==null' "$RUNNER_TEMP/nico-login-index.html"
          grep -Fq 'member:memberForCheck' "$RUNNER_TEMP/nico-login-index.html"
          grep -Fq 'function classifyLegacySalesEntrypoint' "$RUNNER_TEMP/nico-login-index.html"
          for route in /partner-invite.html /partner-counts.html /partner-workspace.html; do
            code=$(curl -sSL -o /dev/null -w '%{http_code}' --max-time 30 "https://nico-factory.web.app$route")
            test "$code" = 200
          done
          echo 'PASS login repair is publicly served; all required existing resources preserved'
