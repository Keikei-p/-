name: NICO SB hikari Air v2 partner UI surgical release (MANUAL APPROVAL ONLY)
on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/hosting/surgical-partner-sb-v2-ui.mjs'
      - 'tests/surgical-partner-sb-v2-ui.test.mjs'
      - '.github/workflows/nico-partner-sb-v2-ui-surgical.yml'
  push:
    branches: [main]
    paths:
      - 'tools/hosting/surgical-partner-sb-v2-ui.mjs'
      - 'tests/surgical-partner-sb-v2-ui.test.mjs'
      - '.github/workflows/nico-partner-sb-v2-ui-surgical.yml'
  workflow_dispatch:
    inputs:
      reviewed_main_sha:
        description: Exact approved main commit SHA
        type: string
        required: true
      functions_approval:
        description: FOUR_COUNT_FUNCTIONS_ACTIVE_AND_REAL_COUNT_SUBMISSION_PROVEN
        type: string
        required: true
      finance_approval:
        description: OWNER_FINANCE_ALLOWED_AND_PARTNER_FINANCE_GET_LIST_DENIED_PROVEN
        type: string
        required: true
      hosting_approval:
        description: REPLACE_PARTNER_WORKSPACE_PAGE_ONLY
        type: string
        required: true
      usage_approval:
        description: HOSTING_PUBLISH_POSSIBLE_USAGE_CHARGES_EXPLICITLY_APPROVED
        type: string
        required: true

permissions:
  contents: read
concurrency:
  group: nico-sb-v2-hosting-one-page-only
  cancel-in-progress: false

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Prove original finance, input page, backend, new staging blob and exact one-page Hosting manifest
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object firestore.rules)" = 'd9f4df6a2ac0f8b5720534a2461ec66b94379190'
          test "$(git hash-object index.html)" = '88ef5636bfe9254e71f2109d452b6d3049f99861'
          test "$(git hash-object partner-workspace.html)" = '0930abb188165afea19ef427308ea22fddf636e7'
          test "$(git hash-object functions/index.js)" = 'dfb4c48ada6fa89a24c898cd4a2f911bcede822f'
          test "$(git hash-object functions-partner-workspace/index.js)" = '38da7e9174ffea7c406c92292dccfc651b565eb0'
          test "$(git hash-object functions-partner-workspace/service.cjs)" = 'b94a6aba231dc2569009580a178297a5b6194bda'
          test "$(git hash-object staging/partner-sb-v2/partner-workspace.html)" = '82a1ed0c67b14ea3fd915419da7864b7c99ffe7b'
          node --check tools/hosting/surgical-partner-sb-v2-ui.mjs
          node --test tests/surgical-partner-sb-v2-ui.test.mjs
          node --test tests/partner-sb-v2-dashboard.test.cjs tests/partner-sb-v2-workspace.test.cjs
          node --test tests/partner-workspace.test.cjs
          node --test tests/finance-boundary-ondevice.test.mjs

  gated-publish:
    needs: offline
    if: >-
      ${{ github.event_name == 'workflow_dispatch' &&
        github.repository == 'Keikei-p/-' &&
        github.ref == 'refs/heads/main' &&
        inputs.reviewed_main_sha == github.sha &&
        inputs.functions_approval == 'FOUR_COUNT_FUNCTIONS_ACTIVE_AND_REAL_COUNT_SUBMISSION_PROVEN' &&
        inputs.finance_approval == 'OWNER_FINANCE_ALLOWED_AND_PARTNER_FINANCE_GET_LIST_DENIED_PROVEN' &&
        inputs.hosting_approval == 'REPLACE_PARTNER_WORKSPACE_PAGE_ONLY' &&
        inputs.usage_approval == 'HOSTING_PUBLISH_POSSIBLE_USAGE_CHARGES_EXPLICITLY_APPROVED' &&
        needs.offline.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      FIREBASE_PROJECT_ID: sales-management-cc116
      NICO_SB_V2_PARTNER_UI_RELEASE_CONFIRMATION: CONFIRM_SB_V2_ONLY_AFTER_REAL_PARTNER_PROOF
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Freeze approved SHA, original backend and finance Rules before receiving private credentials
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_SHA" = "$(git rev-parse HEAD)"
          test "$GITHUB_SHA" = "$(gh api repos/Keikei-p/-/branches/main --jq '.commit.sha')"
          test "$(git hash-object firestore.rules)" = 'd9f4df6a2ac0f8b5720534a2461ec66b94379190'
          test "$(git hash-object index.html)" = '88ef5636bfe9254e71f2109d452b6d3049f99861'
          test "$(git hash-object partner-workspace.html)" = '0930abb188165afea19ef427308ea22fddf636e7'
          test "$(git hash-object staging/partner-sb-v2/partner-workspace.html)" = '82a1ed0c67b14ea3fd915419da7864b7c99ffe7b'
          test "$(git hash-object functions-partner-workspace/service.cjs)" = 'b94a6aba231dc2569009580a178297a5b6194bda'
          node --test tests/surgical-partner-sb-v2-ui.test.mjs tests/partner-sb-v2-dashboard.test.cjs
      - name: Load protected Firebase Hosting audit identity into ephemeral runner file
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          test -n "$FIREBASE_SERVICE_ACCOUNT_JSON"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/nico-sb-v2-hosting-identity.json"
          chmod 600 "$RUNNER_TEMP/nico-sb-v2-hosting-identity.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/nico-sb-v2-hosting-identity.json" >> "$GITHUB_ENV"
      - name: Install existing Firebase metadata authentication library only
        shell: bash
        run: npm install --prefix functions --ignore-scripts --package-lock=false --no-audit --no-fund
      - name: Require all four actual Cloud Functions metadata ACTIVE and feature enabled (READ ONLY)
        shell: bash
        run: |
          set -euo pipefail
          node tools/production/inspect-live-partner-callables-readonly.mjs \
            > "$RUNNER_TEMP/nico-sb-v2-count-functions-private.log" 2>&1 ||
            { echo 'STOP_COUNT_FUNCTIONS_CANNOT_BE_VERIFIED'; exit 1; }
          grep '^PARTNER_COUNT_FUNCTION_METADATA ' "$RUNNER_TEMP/nico-sb-v2-count-functions-private.log" \
            | grep -q '"countFunctionsConfiguredEnabled":true' ||
            { echo 'STOP_COUNT_FUNCTIONS_DISABLED_OR_MISSING'; exit 1; }
          grep '^PARTNER_COUNT_FUNCTION_METADATA ' "$RUNNER_TEMP/nico-sb-v2-count-functions-private.log" \
            | grep -q '"countFunctionsActive":true' ||
            { echo 'STOP_COUNT_FUNCTIONS_NOT_ACTIVE'; exit 1; }
          echo 'LIVE_FOUR_COUNT_FUNCTIONS_CONFIGURED_ACTIVE_METADATA_ONLY'
      - name: Independently prove original six invite/quick/LINE Functions remain unmodified (GET only)
        shell: bash
        run: |
          set -euo pipefail
          node tools/production/protect-original-functions-versions.mjs before
          node tools/production/protect-original-functions-versions.mjs after
      - name: Inspect exact live Hosting version/12 original assets without a write
        shell: bash
        run: node tools/hosting/surgical-partner-sb-v2-ui.mjs --dry-run
      - name: Publish ONLY partner workspace page to existing Hosting snapshot
        shell: bash
        run: node tools/hosting/surgical-partner-sb-v2-ui.mjs --release
      - name: Confirm original finance diagnostic, login, invite and all other 11 asset hashes unchanged
        shell: bash
        run: |
          set -euo pipefail
          verified=false
          for n in $(seq 1 12); do
            curl -fsSL --max-time 25 \
              "https://nico-factory.web.app/partner-workspace.html?sbv2=$GITHUB_SHA-$n" \
              > "$RUNNER_TEMP/nico-sb-v2-ui-live.html" || true
            if cmp -s "$RUNNER_TEMP/nico-sb-v2-ui-live.html" \
              staging/partner-sb-v2/partner-workspace.html; then
              verified=true;break
            fi
            sleep 5
          done
          test "$verified" = true || { echo 'STOP_PARTNER_WORKSPACE_PARITY_UNVERIFIED'; exit 1; }
          for route in / /partner-invite.html /partner-counts.html /finance-boundary-check.html; do
            test "$(curl -fsSL -o /dev/null -w '%{http_code}' --max-time 25 "https://nico-factory.web.app$route")" = '200'
          done
          node tools/production/protect-original-functions-versions.mjs after
          echo 'POST_DEPLOY_ONE_PAGE_PARTNER_SB_V2_MATCHES_11_OTHER_FILES_AND_BACKEND_UNCHANGED'
      - name: Erase private credential, function metadata and page copies
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/nico-sb-v2-hosting-identity.json" \
            "$RUNNER_TEMP/nico-sb-v2-count-functions-private.log" \
            "$RUNNER_TEMP/nico-sb-v2-ui-live.html" \
            "$RUNNER_TEMP/nico-original-six-immutable-versions.private.json"
