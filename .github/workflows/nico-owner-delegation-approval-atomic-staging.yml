name: NICO Owner delegated grants atomic transaction staging (NO DEPLOY)
on:
  pull_request:
    branches: [main]
    paths:
      - 'staging/owner-delegation-v1/owner-approval-service.cjs'
      - 'tests/owner-delegate-approval-staging.test.cjs'
      - '.github/workflows/nico-owner-delegation-approval-atomic-staging.yml'
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify reviewed staging code and unchanged backend boundaries
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object staging/owner-delegation-v1/owner-approval-service.cjs)" = 5784dcd2a591fcf33013ef28dcd3b6e3cca0336d
          test "$(git hash-object tests/owner-delegate-approval-staging.test.cjs)" = 74908ace7077543c6df97e5148b9b8e002eb8466
          test "$(git hash-object staging/owner-delegation-v1/verified-hub-owner.cjs)" = eba49490458ce5732c6eebd9f9633d04f9ff414d
          test "$(git hash-object functions-partner-workspace/service.cjs)" = b94a6aba231dc2569009580a178297a5b6194bda
          test "$(git hash-object staging/partner-owner-correction-v3/trusted-auth.cjs)" = a3e1f03f3e7032024e00109d9211bc34384b9a49
          test "$(git hash-object firestore.rules)" = d9f4df6a2ac0f8b5720534a2461ec66b94379190
          node --check staging/owner-delegation-v1/owner-approval-service.cjs
          node --check tests/owner-delegate-approval-staging.test.cjs
          node --test tests/owner-delegate-approval-staging.test.cjs
          node --test tests/explicit-hub-owner-delegation-staging.test.cjs
          echo 'OWNER_DELEGATION_APPROVAL_STAGED_ONLY_NO_PRODUCTION_WRITES'
