name: NICO shared partner team CB count GET-only guarded production update
on:
  push:
    branches: [release/nico-partner-cb-team-card-20261102]
    paths: [.github/workflows/nico-partner-cb-team-cards-get-only-prod-20261102.yml]
permissions: {contents: read}
concurrency:
  group: nico-partner-workspace-production
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Exact count-only CB source and no-finance regression
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object functions-partner-workspace/service.cjs)" = bcfc59a7f8173c18b8982f30f4abe2aa0d08b0a7
          test "$(git hash-object index.html)" = 7cc7709f4aef8b68b0f1caececee678a6a2a3bcd
          test "$(git hash-object functions-partner-workspace/index.js)" = 38da7e9174ffea7c406c92292dccfc651b565eb0
          test "$(git hash-object functions/index.js)" = dfb4c48ada6fa89a24c898cd4a2f911bcede822f
          test "$(git hash-object firestore.rules)" = d9f4df6a2ac0f8b5720534a2461ec66b94379190
          test "$(git hash-object firebase.partner-workspace.json)" = a6ceedec5fab4e22e0a8efe19c685716a2db9750
          node --check functions-partner-workspace/service.cjs
          node --test tests/partner-workspace.test.cjs tests/internal-owner-finance-visibility.test.cjs
          node --test tests/partner-unified-team-cards-20261102.test.mjs
          node --test tests/partner-managed-staff-archive-20261102.test.mjs
          node --test tests/partner-history-direct-correction-20261102.test.mjs
          node --test tests/partner-save-readback-20261102.test.mjs
          node --test tests/partner-unified-ranks-save-feedback-20261102.test.mjs
          node --test tests/dashboard-inline-original-partner-parity.test.mjs
          echo PASS_CB_COUNT_GET_REDACTED_AND_FINANCE_PROTECTED
  release:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      FIREBASE_PROJECT_ID: sales-management-cc116
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify approved tests and unchanged main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api repos/Keikei-p/-/branches/main --jq .commit.sha)" = 283bc749c97756fc3de03671ae7bac4eccdc46c3 || { echo STOP_MAIN_CHANGED; exit 1; }
          test "$(gh api repos/Keikei-p/-/actions/runs/41459450428 --jq .conclusion)" = success || { echo STOP_NO_VERIFIED_TESTS; exit 1; }
          test "$(gh api repos/Keikei-p/-/actions/runs/41453571896 --jq .conclusion)" = success || { echo STOP_ORIGINAL_HOSTING_NOT_VERIFIED; exit 1; }
          test "$(git hash-object functions-partner-workspace/service.cjs)" = bcfc59a7f8173c18b8982f30f4abe2aa0d08b0a7
      - name: Load existing production identity
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$FIREBASE_SERVICE_ACCOUNT_JSON"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/nico-cb-count-cred.json"
          chmod 600 "$RUNNER_TEMP/nico-cb-count-cred.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/nico-cb-count-cred.json" >> "$GITHUB_ENV"
      - name: Install existing dependencies and pinned CLI
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix functions-partner-workspace --ignore-scripts --package-lock=false --no-audit --no-fund
          npm install --prefix functions --ignore-scripts --package-lock=false --no-audit --no-fund
          npm install -g firebase-tools@15.34.1 --no-audit --no-fund
      - name: Preserve exact current active function names and env; refuse changed finance rules
        shell: bash
        run: |
          set -euo pipefail
          firebase functions:list --project "$FIREBASE_PROJECT_ID" --json > "$RUNNER_TEMP/nico-functions-before.json"
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          import {createRequire} from 'node:module';
          const require=createRequire(process.cwd()+'/functions/package.json');
          const {applicationDefault}=require('firebase-admin/app');
          const token=(await applicationDefault().getAccessToken()).access_token;
          const get=async url=>{
           const r=await fetch(url,{headers:{Authorization:'Bearer '+token}});
           if(!r.ok)throw Error('STOP_METADATA_HTTP_'+r.status);
           return r.json();
          };
          const fn=await get('https://cloudfunctions.googleapis.com/v2/projects/sales-management-cc116/locations/asia-northeast1/functions/getPartnerWorkspace');
          if(fn.state!=='ACTIVE'||fn.environment!=='GEN_2'||fn.serviceConfig?.environmentVariables?.PARTNER_WORKSPACE_ENABLED!=='enabled')
           throw Error('STOP_LIVE_GET_FUNCTION_NOT_ACTIVE_WITH_CORRECT_FLAG');
          if(fn.serviceConfig?.environmentVariables?.PARTNER_COMPANY_CODE_AUTH_ENABLED!=='enabled')
           throw Error('STOP_CODE_AUTH_FLAG_CHANGED');
          const rel=await get('https://firebaserules.googleapis.com/v1/projects/sales-management-cc116/releases/cloud.firestore');
          if(!/^projects\/sales-management-cc116\/rulesets\//.test(rel.rulesetName||''))
           throw Error('STOP_RULES_NOT_VERIFIABLE');
          console.log('PASS_UNCHANGED_ACTIVE_GET_AND_RULES_RELEASE');
          NODE
          curl -fsSL --max-time 25 "https://nico-factory.web.app/?pre_managed_release=1" > "$RUNNER_TEMP/nico-cb-count-before.html"
          test "$(git hash-object "$RUNNER_TEMP/nico-cb-count-before.html")" = 2e8b85703d8770f88a2939d2d7ccea397c80fa1f || { echo STOP_UNREVIEWED_CURRENT_HOSTING; exit 1; }
      - name: Update getPartnerWorkspace only; never save, management, auth, Rules or Hosting
        shell: bash
        run: |
          set -euo pipefail
          test ! -e functions-partner-workspace/.env.sales-management-cc116
          printf 'PARTNER_WORKSPACE_ENABLED=enabled\nPARTNER_COMPANY_CODE_AUTH_ENABLED=enabled\n' > functions-partner-workspace/.env.sales-management-cc116
          date -u +%Y-%m-%dT%H:%M:%SZ > "$RUNNER_TEMP/nico-cb-count-start.txt"
          set +e
          firebase deploy --non-interactive --project "$FIREBASE_PROJECT_ID" --config firebase.partner-workspace.json \
            --only functions:partner-workspace:getPartnerWorkspace > "$RUNNER_TEMP/nico-cb-count-deploy.log" 2>&1
          result=$?
          set -e
          grep -F 'functions[partner-workspace:getPartnerWorkspace(asia-northeast1)]' "$RUNNER_TEMP/nico-cb-count-deploy.log" | grep -Fq 'Successful update operation' || { echo STOP_GET_DEPLOY_UNCONFIRMED; tail -n 18 "$RUNNER_TEMP/nico-cb-count-deploy.log" | sed -E 's/[[:alnum:]_-]{45,}/[REDACTED]/g'; exit 1; }
          if [ "$result" -ne 0 ]; then
            grep -Fq 'Functions successfully deployed but could not set up cleanup policy' "$RUNNER_TEMP/nico-cb-count-deploy.log" || { echo STOP_UNKNOWN_DEPLOY_FAILURE; exit 1; }
          fi
          echo PASS_ONE_GET_FUNCTION_UPDATED
      - name: Verify all existing functions survive and new one is ACTIVE
        shell: bash
        run: |
          set -euo pipefail
          firebase functions:list --project "$FIREBASE_PROJECT_ID" --json > "$RUNNER_TEMP/nico-functions-after.json"
          node <<'NODE'
          const fs=require('node:fs');
          const names=path=>(JSON.parse(fs.readFileSync(path,'utf8')).result||[]).map(x=>x.id||x.name||'');
          const before=names(process.env.RUNNER_TEMP+'/nico-functions-before.json'),after=names(process.env.RUNNER_TEMP+'/nico-functions-after.json');
          if(!before.length||before.some(x=>!after.includes(x)))throw Error('STOP_EXISTING_FUNCTION_MISSING');
          console.log('PASS_ALL_ORIGINAL_FUNCTIONS_PRESERVED');
          NODE
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          import {createRequire} from 'node:module';
          const require=createRequire(process.cwd()+'/functions/package.json');
          const token=(await require('firebase-admin/app').applicationDefault().getAccessToken()).access_token;
          const r=await fetch('https://cloudfunctions.googleapis.com/v2/projects/sales-management-cc116/locations/asia-northeast1/functions/getPartnerWorkspace',{headers:{Authorization:'Bearer '+token}});
          if(!r.ok)throw Error('STOP_GET_METADATA_HTTP_'+r.status);
          const fn=await r.json(),started=Date.parse(readFileSync(process.env.RUNNER_TEMP+'/nico-cb-count-start.txt','utf8'));
          if(fn.state!=='ACTIVE'||fn.buildConfig?.entryPoint!=='getPartnerWorkspace'||Date.parse(fn.updateTime)<started||
             fn.serviceConfig?.environmentVariables?.PARTNER_WORKSPACE_ENABLED!=='enabled'||fn.serviceConfig?.environmentVariables?.PARTNER_COMPANY_CODE_AUTH_ENABLED!=='enabled')
            throw Error('STOP_NEW_GET_RUNTIME_NOT_ACTIVE');
          const anonymous=await fetch('https://asia-northeast1-sales-management-cc116.cloudfunctions.net/getPartnerWorkspace',{
           method:'POST',headers:{'Content-Type':'application/json'},body:'{"data":{"action":"removeManaged"}}'});
          if(anonymous.status!==401&&anonymous.status!==403)throw Error('STOP_UNAUTHENTICATED_GET_ACCESS');
          console.log('PASS_GET_FUNCTION_ACTIVE_AND_ANONYMOUS_DENIED');
          NODE
      - name: Always clean credentials and temporary flag
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/nico-cb-count-cred.json" "$RUNNER_TEMP/nico-cb-count-deploy.log" "$RUNNER_TEMP/nico-functions-before.json" "$RUNNER_TEMP/nico-functions-after.json" "$RUNNER_TEMP/nico-cb-count-start.txt" "$RUNNER_TEMP/nico-cb-count-before.html" functions-partner-workspace/.env.sales-management-cc116
