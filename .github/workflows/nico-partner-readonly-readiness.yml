name: NICO partner public readiness (read-only)
on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/production/partner-live-readiness.mjs'
      - 'tests/partner-live-readiness.test.mjs'
      - '.github/workflows/nico-partner-readonly-readiness.yml'
  push:
    branches: [main]
    paths:
      - 'tools/production/partner-live-readiness.mjs'
      - 'tests/partner-live-readiness.test.mjs'
      - '.github/workflows/nico-partner-readonly-readiness.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check-public-only:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check syntax and production public endpoints (NO secrets)
        run: |
          node --check tools/production/partner-live-readiness.mjs
          node --test tests/partner-live-readiness.test.mjs
          node tools/production/partner-live-readiness.mjs
