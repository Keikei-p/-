name: NICO partner verified repeat-login preference regression (no deploy)
on:
  push:
    branches: [fix/partner-repeat-login-preference-guard-20261102]
    paths: [index.html, tests/partner-relogin-preference-safety.test.mjs, .github/workflows/nico-partner-relogin-preference-no-deploy.yml]
  pull_request:
    branches: [fix/partner-email-link-first-password-20261102]
    paths: [index.html, tests/partner-relogin-preference-safety.test.mjs, .github/workflows/nico-partner-relogin-preference-no-deploy.yml]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify partner relogin, count boundary, and existing finance separation
        run: |
          set -euo pipefail
          node --test tests/partner-relogin-preference-safety.test.mjs
          node --test tests/partner-repeat-login-cb-parity.test.mjs
          node --test tests/partner-one-login-same-app.test.cjs
          node --test tests/partner-money-free-workspace.test.cjs
