name: NICO login reactivation client write deny emulator (NO DEPLOY)
on:
  pull_request:
    branches: [main]
    paths:
      - 'tests/login-reactivation-client-denial-emulator.test.cjs'
      - '.github/workflows/nico-login-reactivation-emulator-no-deploy.yml'
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FIREBASE_PROJECT_ID: demo-sales-support
      GCLOUD_PROJECT: demo-sales-support
      GOOGLE_APPLICATION_CREDENTIALS: ''
      FIREBASE_SERVICE_ACCOUNT_JSON: ''
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify unchanged real Rules and recovery gate (no production write)
        shell: bash
        run: |
          set -euo pipefail
          test -z "$GOOGLE_APPLICATION_CREDENTIALS"
          test -z "$FIREBASE_SERVICE_ACCOUNT_JSON"
          test "$FIREBASE_PROJECT_ID" = demo-sales-support
          test "$(git hash-object firestore.rules)" = d9f4df6a2ac0f8b5720534a2461ec66b94379190
          test "$(git hash-object tests/login-reactivation-client-denial-emulator.test.cjs)" = d33cd4b680d207cb86c68d00f56da9315936574b
          test "$(git hash-object staging/owner-login-recovery-v1/service.cjs)" = e8527a36c413ceab44d73ffd2a5de0ef7598f190
          test "$(git hash-object staging/owner-login-recovery-v1/entry.cjs)" = cfc41ae85f410cc6c3a354ec2c3195c5047ff477
          node --check tests/login-reactivation-client-denial-emulator.test.cjs
      - name: Install isolated local emulator dependencies only
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix tests --ignore-scripts --no-audit --no-fund --package-lock=false
          npm install -g firebase-tools@15.34.1 --no-audit --no-fund
      - name: Prove actual Rules reject every client recovery and forged audit
        shell: bash
        run: |
          set -euo pipefail
          firebase emulators:exec --project demo-sales-support --only firestore \
            "node --test tests/login-reactivation-client-denial-emulator.test.cjs"
          echo "LOGIN_RECOVERY_RULES_CLIENT_REACTIVATION_DENIED"
          echo "EXISTING_OWNER_RENAME_STILL_ALLOWED"
          echo "PRODUCTION_FIREBASE_ACCOUNTS_CHANGED=0"
