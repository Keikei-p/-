name: NICO Owner-only workspace GET (ONE FUNCTION / MANUAL)
on:
  pull_request:
    branches: [main]
    paths:
      - 'functions-partner-workspace/service.cjs'
      - 'tests/partner-workspace.test.cjs'
      - 'tests/owner-workspace-get-only-release-safety.test.mjs'
      - 'tools/production/owner-get-single-function-guard.mjs'
      - 'tests/owner-get-single-function-guard.test.mjs'
      - '.github/workflows/nico-owner-workspace-get-single-function.yml'
  push:
    branches: [main]
    paths:
      - 'functions-partner-workspace/service.cjs'
      - 'tests/partner-workspace.test.cjs'
      - '.github/workflows/nico-owner-workspace-get-single-function.yml'
  workflow_dispatch:
    inputs:
      reviewed_main_sha:
        description: Exact reviewed main SHA
        type: string
        required: true
      mode:
        description: Inspect, or release only the existing getPartnerWorkspace callable
        type: choice
        options: [inspect, release]
        default: inspect
        required: true
      deployment_approval:
        type: string
        required: false
      cost_approval:
        type: string
        required: false
permissions:
  contents: read
concurrency:
  group: nico-owner-get-one-function-${{ github.ref }}
  cancel-in-progress: false
jobs:
  offline:
    if: ${{ github.event_name != 'pull_request' || github.head_ref == 'fix/owner-workspace-get-readonly-20261117' || github.head_ref == 'release/owner-get-live-inventory-once-20261117' || github.head_ref == 'release/owner-get-live-inventory-retry-20261117' }}
    runs-on: ubuntu-latest
    timeout-minutes: 13
    env:
      FIREBASE_SERVICE_ACCOUNT_JSON: ''
      GOOGLE_APPLICATION_CREDENTIALS: ''
      FIREBASE_TOKEN: ''
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Pin exact read-only changes and preserve every unrelated backend and financial Rule
        shell: bash
        run: |
          set -euo pipefail
          test -z "$FIREBASE_SERVICE_ACCOUNT_JSON"
          test -z "$GOOGLE_APPLICATION_CREDENTIALS"
          test -z "$FIREBASE_TOKEN"
          test "$(git hash-object firestore.rules)" = d9f4df6a2ac0f8b5720534a2461ec66b94379190
          test "$(git hash-object functions/index.js)" = dfb4c48ada6fa89a24c898cd4a2f911bcede822f
          test "$(git hash-object functions-partner-workspace/index.js)" = 42eea81ab01449bedbbedabdc1a8fb6bfba1e284
          test "$(git hash-object functions-partner-workspace/workspace-identity.cjs)" = e06305c7dd151a3e5bab93a394396754fd25088e
          test "$(git hash-object firebase.partner-workspace.json)" = a6ceedec5fab4e22e0a8efe19c685716a2db9750
          test "$(git hash-object functions-partner-workspace/service.cjs)" = 712bf523ac83942c02767c25321bfed7059055be
          test "$(git hash-object tests/partner-workspace.test.cjs)" = 94c7b76caaa7cf057c0bf8361d188d61ffe8a07d
          test "$(git hash-object tests/owner-workspace-get-only-release-safety.test.mjs)" = d2071e8dfed1a07386aaf1f34464df067a90a99e
          test "$(git hash-object tools/production/owner-get-single-function-guard.mjs)" = b777e31f62b34ec47a403b52560ad4f61cd16f02
          test "$(git hash-object tests/owner-get-single-function-guard.test.mjs)" = d8c80a32d5d89a9ef1cd1f4d6cd521a04883b9e3
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            git fetch --no-tags origin main
            while IFS= read -r file; do
              case "$file" in
                functions-partner-workspace/service.cjs|tests/partner-workspace.test.cjs|tests/owner-workspace-get-only-release-safety.test.mjs|tools/production/owner-get-single-function-guard.mjs|tests/owner-get-single-function-guard.test.mjs|.github/workflows/nico-owner-workspace-get-single-function.yml) ;;
                *) echo 'STOP_UNREVIEWED_OWNER_GET_SOURCE'; exit 1 ;;
              esac
            done < <(git diff --name-only origin/main...HEAD)
          fi
      - name: Verify unchanged count writer, Auth, original finance, and Owner-only GET regressions
        run: |
          set -euo pipefail
          node --check functions-partner-workspace/service.cjs
          node --check tools/production/owner-get-single-function-guard.mjs
          node --test tests/owner-workspace-get-only-release-safety.test.mjs tests/owner-get-single-function-guard.test.mjs
          node --test tests/partner-workspace.test.cjs tests/partner-company-code-auth.test.cjs tests/partner-quick-counts.test.cjs
          echo 'OWNER_GET_SOURCE_AND_LEDGER_TESTS_PASS_NO_DEPLOY'
  manually-inspect-or-release:
    needs: offline
    if: >-
      ${{ (github.event_name == 'workflow_dispatch' && inputs.reviewed_main_sha == github.sha || github.event_name == 'push' && github.event.before == '26e2f3aac53009bcc6fd1adc1b757e68cdd19593' && github.actor == 'Keikei-p' && startsWith(github.event.head_commit.message, 'audit(sales): one-time live GET owner workspace inventory retry')) && github.repository == 'Keikei-p/-' && github.ref == 'refs/heads/main' && needs.offline.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FIREBASE_PROJECT_ID: sales-management-cc116
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Confirm exact current approved main before any remote action
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_SHA" = "$(git rev-parse HEAD)"
          test "$GITHUB_SHA" = "$(gh api repos/Keikei-p/-/branches/main --jq .commit.sha)"
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            test "$(git rev-parse HEAD^1)" = 26e2f3aac53009bcc6fd1adc1b757e68cdd19593
            test "$(git show -s --format=%s HEAD)" = 'audit(sales): one-time live GET owner workspace inventory retry'
            test "$(git diff-tree --no-commit-id --name-only -r HEAD)" = '.github/workflows/nico-owner-workspace-get-single-function.yml'
          else
            test "$GITHUB_SHA" = "${{ inputs.reviewed_main_sha }}"
          fi
      - name: Install existing Admin SDK for read-only Cloud Functions metadata
        run: npm install --prefix functions --ignore-scripts --package-lock=false --no-audit --no-fund
      - name: Keep existing authorized service identity private to this runner
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          test -n "$FIREBASE_SERVICE_ACCOUNT_JSON"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/owner-get-identity.json"
          chmod 600 "$RUNNER_TEMP/owner-get-identity.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/owner-get-identity.json" >> "$GITHUB_ENV"
      - name: Live GET-only full inventory and exact preserved feature flags
        env:
          RELEASE_MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {writeFileSync,existsSync} from 'node:fs';
          import {createRequire} from 'node:module';
          import {inspectOwnerGetMetadata} from './tools/production/owner-get-single-function-guard.mjs';
          const require=createRequire(new URL('./functions/package.json',import.meta.url));
          const token=(await require('firebase-admin/app').applicationDefault().getAccessToken())?.access_token;
          if(!token)throw Error('STOP_OWNER_GET_TOKEN');
          const url='https://cloudfunctions.googleapis.com/v2/projects/sales-management-cc116/locations/asia-northeast1/functions?pageSize=1000';
          const res=await fetch(url,{method:'GET',cache:'no-store',redirect:'error',headers:{Authorization:'Bearer '+token}});
          if(res.status!==200)throw Error('STOP_OWNER_GET_METADATA_HTTP');
          const payload=await res.json();
          if(!Array.isArray(payload.functions)||payload.nextPageToken)throw Error('STOP_OWNER_GET_METADATA_INCOMPLETE');
          const before=inspectOwnerGetMetadata(payload.functions);
          writeFileSync(process.env.RUNNER_TEMP+'/owner-get-before.json',
            JSON.stringify(payload.functions),{mode:0o600,flag:'wx'});
          if(process.env.RELEASE_MODE==='release'){
           const file='functions-partner-workspace/.env.sales-management-cc116';
           if(existsSync(file))throw Error('STOP_OWNER_GET_EXISTING_ENV');
           writeFileSync(file,before.envText,{mode:0o600,flag:'wx'});
          }
          console.log('LIVE_OWNER_GET_READ_ONLY_PREFLIGHT_PASS functions='+before.count+' flagsUnchanged=true');
          NODE
      - name: Require explicit reviewed one-Function release scope and cost approval
        if: ${{ inputs.mode == 'release' }}
        env:
          APPROVAL: ${{ inputs.deployment_approval }}
          COST: ${{ inputs.cost_approval }}
        run: |
          set -euo pipefail
          test "$APPROVAL" = APPROVE_EXISTING_GET_PARTNER_WORKSPACE_ONLY
          test "$COST" = APPROVE_ONE_FIREBASE_FUNCTION_BUILD
          test -f functions-partner-workspace/.env.sales-management-cc116
      - name: Deploy exactly ONE existing read callable (not manage, submit, Rules or Hosting)
        if: ${{ inputs.mode == 'release' }}
        run: |
          set -euo pipefail
          npm install --prefix functions-partner-workspace --ignore-scripts --package-lock=false --no-audit --no-fund
          npm install -g firebase-tools@15.34.1
          firebase deploy --non-interactive --project "$FIREBASE_PROJECT_ID" \
            --config firebase.partner-workspace.json \
            --only functions:partner-workspace:getPartnerWorkspace
      - name: Verify one target changed, all other functions and flags unchanged
        if: ${{ inputs.mode == 'release' }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          import {createRequire} from 'node:module';
          import {inspectOwnerGetMetadata,compareSingleFunctionRollout} from './tools/production/owner-get-single-function-guard.mjs';
          const before=inspectOwnerGetMetadata(JSON.parse(readFileSync(process.env.RUNNER_TEMP+'/owner-get-before.json','utf8')));
          const require=createRequire(new URL('./functions/package.json',import.meta.url));
          const token=(await require('firebase-admin/app').applicationDefault().getAccessToken())?.access_token;
          if(!token)throw Error('STOP_OWNER_GET_POST_TOKEN');
          const url='https://cloudfunctions.googleapis.com/v2/projects/sales-management-cc116/locations/asia-northeast1/functions?pageSize=1000';
          const res=await fetch(url,{method:'GET',cache:'no-store',redirect:'error',headers:{Authorization:'Bearer '+token}});
          if(res.status!==200)throw Error('STOP_OWNER_GET_POST_HTTP');
          const payload=await res.json();
          if(!Array.isArray(payload.functions)||payload.nextPageToken)throw Error('STOP_OWNER_GET_POST_INCOMPLETE');
          const proof=compareSingleFunctionRollout(before,inspectOwnerGetMetadata(payload.functions));
          if(!proof.exactlyOneFunctionUpdated||proof.productionDocumentWrites!==0)
           throw Error('STOP_OWNER_GET_RELEASE_INCOMPLETE');
          console.log('ONLY_GET_PARTNER_WORKSPACE_FUNCTION_UPDATED_OTHER_FUNCTIONS_UNCHANGED');
          console.log('OWNER_AUTHENTICATED_GET_UNVERIFIED UI_HOSTING_UNCHANGED');
          NODE
      - name: Always delete temporary credentials, metadata and uncommitted runtime flags
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/owner-get-identity.json" "$RUNNER_TEMP/owner-get-before.json"
          rm -f functions-partner-workspace/.env.sales-management-cc116
