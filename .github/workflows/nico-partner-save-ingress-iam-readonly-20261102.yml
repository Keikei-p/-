name: NICO partner GET vs SAVE ingress and IAM comparison (READ ONLY)
on:
  push:
    branches: [diagnose/partner-save-ingress-iam-20261102]
    paths: [.github/workflows/nico-partner-save-ingress-iam-readonly-20261102.yml]
permissions: {contents: read}
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Load existing audit credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$FIREBASE_SERVICE_ACCOUNT_JSON"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/partner-save-ingress-audit.json"
          chmod 600 "$RUNNER_TEMP/partner-save-ingress-audit.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/partner-save-ingress-audit.json" >> "$GITHUB_ENV"
      - name: Compare exact callable CORS, public ingress, and Cloud Run invoker without writes
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix functions --ignore-scripts --package-lock=false --no-audit --no-fund >/dev/null
          node --input-type=module <<'NODE'
          import {createRequire} from 'node:module';
          const require=createRequire(process.cwd()+'/functions/package.json');
          const {applicationDefault}=require('firebase-admin/app');
          const token=(await applicationDefault().getAccessToken()).access_token;
          const pid='sales-management-cc116',loc='asia-northeast1';
          for(const name of ['getPartnerWorkspace','submitPartnerWorkspaceCounts']){
           const url='https://cloudfunctions.googleapis.com/v2/projects/'+pid+'/locations/'+loc+'/functions/'+name;
           const r=await fetch(url,{headers:{Authorization:'Bearer '+token}});
           if(!r.ok)throw Error('STOP_FUNCTION_METADATA_HTTP_'+r.status);
           const fn=await r.json(),service=fn.serviceConfig?.service;
           console.log('FUNCTION_CONFIG',JSON.stringify({
             fn:name,state:fn.state,environment:fn.environment,
             ingressSettings:fn.serviceConfig?.ingressSettings||null,
             allTrafficOnLatest:fn.serviceConfig?.allTrafficOnLatestRevision||false,
             uriConfigured:Boolean(fn.serviceConfig?.uri),cloudRunServiceConfigured:Boolean(service)
           }));
           if(service){
            const res=await fetch('https://run.googleapis.com/v2/'+service+':getIamPolicy',
             {headers:{Authorization:'Bearer '+token}});
            console.log('RUN_IAM_STATUS',name,res.status);
            if(res.ok){
             const policy=await res.json(),b=policy.bindings||[];
             console.log('RUN_IAM_SUMMARY',JSON.stringify({fn:name,
              publicInvoker:b.some(x=>(x.role==='roles/run.invoker'||x.role==='roles/cloudfunctions.invoker')&&x.members?.includes('allUsers')),
              publicRoles:b.filter(x=>x.members?.includes('allUsers')).map(x=>x.role),
              invokerBindings:b.filter(x=>x.role==='roles/run.invoker').length
             }));
            }
           }
           const endpoint='https://asia-northeast1-'+pid+'.cloudfunctions.net/'+name;
           const opts=await fetch(endpoint,{method:'OPTIONS',headers:{
            Origin:'https://nico-factory.web.app',
            'Access-Control-Request-Method':'POST',
            'Access-Control-Request-Headers':'authorization,content-type'
           },redirect:'manual'});
           console.log('CORS_PREFLIGHT',JSON.stringify({fn:name,http:opts.status,
            allowedOrigin:opts.headers.get('access-control-allow-origin')==='https://nico-factory.web.app',
            allowedMethod:String(opts.headers.get('access-control-allow-methods')||'').includes('POST')
           }));
           const post=await fetch(endpoint,{method:'POST',redirect:'manual',
            headers:{'Content-Type':'application/json','Origin':'https://nico-factory.web.app'},
            body:JSON.stringify({data:{}})});
           let jsonStatus='unavailable';
           if((post.headers.get('content-type')||'').includes('application/json')){
            try{const body=await post.json();jsonStatus=String(body?.error?.status||'none');}catch{}
           }
           console.log('ANON_REJECT_RESPONSE',JSON.stringify({fn:name,http:post.status,
            jsonStatus,contentType:(post.headers.get('content-type')||'').split(';')[0],
            allowedOrigin:post.headers.get('access-control-allow-origin')==='https://nico-factory.web.app'
           }));
          }
          console.log('INGRESS_READONLY_DONE_NO_RECORDS_CHANGED');
          NODE
      - name: Remove credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/partner-save-ingress-audit.json"
