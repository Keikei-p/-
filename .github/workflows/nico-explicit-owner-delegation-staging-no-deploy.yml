name: NICO verified explicit secondary Owner staging (NO DEPLOY)
on:
  pull_request:
    branches: [main]
    paths:
      - 'staging/owner-delegation-v1/verified-hub-owner.cjs'
      - 'tests/explicit-hub-owner-delegation-staging.test.cjs'
      - '.github/workflows/nico-explicit-owner-delegation-staging-no-deploy.yml'
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Pin default-DENY staged owner verifier and unchanged production authorization sources
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object staging/owner-delegation-v1/verified-hub-owner.cjs)" = eba49490458ce5732c6eebd9f9633d04f9ff414d
          test "$(git hash-object tests/explicit-hub-owner-delegation-staging.test.cjs)" = 90bb05f1801b1ca47c2104e89391b6111562af8c
          test "$(git hash-object functions-partner-workspace/service.cjs)" = b94a6aba231dc2569009580a178297a5b6194bda
          test "$(git hash-object staging/partner-owner-correction-v3/trusted-auth.cjs)" = a3e1f03f3e7032024e00109d9211bc34384b9a49
          test "$(git hash-object firestore.rules)" = d9f4df6a2ac0f8b5720534a2461ec66b94379190
          node --check staging/owner-delegation-v1/verified-hub-owner.cjs
          node --test tests/explicit-hub-owner-delegation-staging.test.cjs
          node --test tests/partner-owner-correction-v3-auth.test.cjs
          echo 'EXPLICIT_SECONDARY_OWNER_DEFAULT_DENY_NO_DEPLOY_NO_ROLE_GRANTS'
