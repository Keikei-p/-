name: NICO count pricing hotfix (manual index only)
on:
  workflow_dispatch:
    inputs:
      reviewed_main_sha:
        description: Exact merged main SHA reviewed for this hotfix
        required: true
        type: string
      reviewed_pr:
        description: Reviewed and merged hotfix PR number
        required: true
        type: string
      confirmation:
        description: Type RELEASE_COUNT_PRICING_INDEX_ONLY
        required: true
        type: string
permissions:
  contents: read
  pull-requests: read
  actions: read
concurrency:
  group: nico-surgical-index-release
  cancel-in-progress: false
jobs:
  release-reviewed-pricing-only:
    if: github.ref == 'refs/heads/main' && github.actor == 'Keikei-p' && github.triggering_actor == 'Keikei-p'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      REVIEWED_MAIN_SHA: ${{ inputs.reviewed_main_sha }}
      REVIEWED_PR: ${{ inputs.reviewed_pr }}
      NICO_COUNT_PRICING_CONFIRMATION: ${{ inputs.confirmation }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify exact historical live source object
        run: |
          git fetch --no-tags --depth=1 origin 455a5bb852e87ecae39b37d39c981043fdd6845f
          test "$(git rev-parse 455a5bb852e87ecae39b37d39c981043fdd6845f:index.html)" = 6478197c52cd3a9fd6570e7214ed744e3ac93576
      - name: Verify actual human review and exact merged main before reading credentials
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$REVIEWED_MAIN_SHA" = "$GITHUB_SHA"
          test "$GITHUB_TRIGGERING_ACTOR" = Keikei-p
          test "$NICO_COUNT_PRICING_CONFIRMATION" = RELEASE_COUNT_PRICING_INDEX_ONLY
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {execFileSync} from 'node:child_process';
          const stop=()=>{throw Error('STOP_COUNT_PRICING_REVIEW_NOT_COMPLETE')};
          if(!/^[0-9a-f]{40}$/.test(process.env.REVIEWED_MAIN_SHA||'')||
             !/^[1-9][0-9]{0,7}$/.test(process.env.REVIEWED_PR||''))stop();
          const get=async path=>{
            const r=await fetch('https://api.github.com/repos/Keikei-p/-/'+path,
              {headers:{Authorization:'Bearer '+process.env.GH_TOKEN,Accept:'application/vnd.github+json'}});
            if(!r.ok)stop();return r.json();
          };
          const pr=await get('pulls/'+process.env.REVIEWED_PR);
          const main=await get('git/ref/heads/main');
          if(pr.merged!==true||pr.draft||pr.base?.ref!=='main'||
             pr.head?.repo?.full_name!=='Keikei-p/-'||
             pr.merge_commit_sha!==process.env.GITHUB_SHA||
             main.object?.sha!==process.env.GITHUB_SHA||
             !pr.labels?.some(x=>x.name==='sales-production-reviewed'))stop();
          const sections=fs.readFileSync('docs/SALES_RELEASE_SIGNOFF.md','utf8')
            .split('## COUNT_PRICING_HOTFIX_20261114');
          if(sections.length!==2)stop();
          const note=sections[1].split(/\r?\n## /,1)[0];
          if(!note||!/- 本人レビュー日: [0-9]{4}-[0-9]{2}-[0-9]{2}\s*(?:\r?\n|$)/.test(note)||
             !/- 本人GitHubアカウント: Keikei-p\s*(?:\r?\n|$)/.test(note)||
             !/- 本人署名: Keikei-p\s*(?:\r?\n|$)/.test(note))stop();
          const runs=await get('actions/runs?head_sha='+pr.head.sha+'&event=pull_request&per_page=100');
          for(const path of ['.github/workflows/pr38-validation.yml','.github/workflows/sales-safety-guard.yml'])
            if(!runs.workflow_runs?.some(x=>x.path===path&&x.head_sha===pr.head.sha&&
              x.status==='completed'&&x.conclusion==='success'))stop();
          const event=process.env.RUNNER_TEMP+'/count-pricing-reviewed-pr.json';
          fs.writeFileSync(event,JSON.stringify({pull_request:pr,repository:{full_name:'Keikei-p/-'}}),{mode:0o600});
          execFileSync('node',['scripts/check-sales-safe-pr.mjs'],{
            stdio:'inherit',env:{...process.env,GITHUB_EVENT_PATH:event}});
          console.log('Exact merged main, signed human note, review label and both protected CI checks verified');
          NODE
      - name: Recheck sales and package source without production credentials
        run: node --test tests/sales-regressions.cjs tests/count-pricing-update-hotfix.test.cjs tests/count-pricing-live-package.test.mjs tests/count-pricing-release.test.mjs
      - name: Prepare only the three-function live candidate
        run: node tools/hosting/prepare-count-pricing-hotfix.mjs --prepare "$RUNNER_TEMP/count-pricing-live-index.html"
      - name: Install existing Hosting credential dependencies
        run: npm install --prefix functions --ignore-scripts --package-lock=false --no-audit --no-fund
      - name: Read protected Hosting identity only after review verification
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          test -n "$FIREBASE_SERVICE_ACCOUNT_JSON"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/count-pricing-hosting.json"
          chmod 600 "$RUNNER_TEMP/count-pricing-hosting.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/count-pricing-hosting.json" >> "$GITHUB_ENV"
      - name: Verify exact existing 33-asset release (read only)
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/hosting/release-count-pricing-hotfix.mjs --dry-run
      - name: Release only the reviewed index candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/hosting/release-count-pricing-hotfix.mjs --release
      - name: Verify exact production bytes after publication
        run: |
          set -euo pipefail
          verified=false
          for attempt in $(seq 1 8); do
            curl -fsS --max-time 30 "https://nico-factory.web.app/index.html?count_pricing_verify=$GITHUB_SHA-$attempt" > "$RUNNER_TEMP/count-pricing-post.html"
            if cmp -s "$RUNNER_TEMP/count-pricing-live-index.html" "$RUNNER_TEMP/count-pricing-post.html"; then verified=true; break; fi
            sleep 3
          done
          test "$verified" = true
          echo 'EXACT_INDEX_HTTP_PARITY_VERIFIED; REAL_ACCOUNT_SAVE_CHECK_STILL_REQUIRED'
      - name: Remove runner credential file
        if: always()
        run: rm -f -- "$RUNNER_TEMP/count-pricing-hosting.json"
