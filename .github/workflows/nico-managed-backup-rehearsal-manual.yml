name: NICO managed backup isolated restore and cleanup (MANUAL)
on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/production/rehearse-managed-backup.mjs'
      - 'tests/managed-backup-rehearsal.test.mjs'
      - '.github/workflows/nico-managed-backup-rehearsal-manual.yml'
  push:
    branches: [main]
    paths:
      - 'tools/production/rehearse-managed-backup.mjs'
      - 'tests/managed-backup-rehearsal.test.mjs'
      - '.github/workflows/nico-managed-backup-rehearsal-manual.yml'
  workflow_dispatch:
    inputs:
      reviewed_main_sha:
        description: Exact reviewed current main SHA
        required: true
        type: string
      mode:
        description: Inspect permissions/backup metadata, or rehearse then remove only the new temporary DB
        required: true
        default: inspect
        type: choice
        options: [inspect, rehearse]
      confirmation:
        description: INSPECT_ONLY or RESTORE_TEMPORARY_DATABASE_AND_CLEAN_UP
        default: INSPECT_ONLY
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: nico-managed-backup-isolated-rehearsal
  cancel-in-progress: false
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - name: Check immutable read/localhost restore implementations and adversarial rehearsal tests
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object tools/readonly-backup/backup.mjs)" = a7f21e94857a0e515655b99a725382974646dad7
          test "$(git hash-object tools/readonly-backup/restore-emulator.mjs)" = 638bd79ed31ad28e7298d8ed2e6927730ec129b1
          test "$(git hash-object firestore.rules)" = d9f4df6a2ac0f8b5720534a2461ec66b94379190
          node --check tools/production/rehearse-managed-backup.mjs
          node --test tests/managed-backup-rehearsal.test.mjs tests/managed-backup-restore-preflight-readonly.test.mjs tools/readonly-backup/backup.test.mjs
          npx --yes firebase-tools@15.34.1 emulators:exec --project demo-sales-restore --only firestore 'node --test tests/managed-backup-rehearsal.test.mjs'
  manual:
    needs: offline
    if: >-
      ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' &&
          github.repository == 'Keikei-p/-' && inputs.reviewed_main_sha == github.sha &&
          needs.offline.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      FIREBASE_PROJECT_ID: sales-management-cc116
      NICO_REVIEWED_MAIN: ${{ inputs.reviewed_main_sha }}
      NICO_BACKUP_REHEARSAL_CONFIRMATION: ${{ inputs.confirmation }}
      NICO_BACKUP_REHEARSAL_MODE: ${{ inputs.mode }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - name: Lock current main and explicit manual mode before credential access
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_SHA" = "$(gh api repos/Keikei-p/-/branches/main --jq .commit.sha)"
          test "$GITHUB_SHA" = "$NICO_REVIEWED_MAIN"
          case "$NICO_BACKUP_REHEARSAL_MODE:$NICO_BACKUP_REHEARSAL_CONFIRMATION" in
            inspect:INSPECT_ONLY|rehearse:RESTORE_TEMPORARY_DATABASE_AND_CLEAN_UP) ;;
            *) echo STOP_INVALID_MANUAL_REHEARSAL_MODE; exit 1;;
          esac
          node --test tests/managed-backup-rehearsal.test.mjs
      - name: Install existing SDK and pinned local emulator
        run: |
          npm install --prefix functions --ignore-scripts --no-audit --no-fund --package-lock=false
          npm install --global firebase-tools@15.34.1 --no-audit --no-fund
      - name: Supply the existing identity privately; never grant new IAM access
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$FIREBASE_SERVICE_ACCOUNT_JSON"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/nico-managed-rehearsal.private.json"
          chmod 600 "$RUNNER_TEMP/nico-managed-rehearsal.private.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/nico-managed-rehearsal.private.json" >> "$GITHUB_ENV"
      - name: Restore existing backup only to fixed unused temporary DB; verify then clean up
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_SHA" = "$(gh api repos/Keikei-p/-/branches/main --jq .commit.sha)"
          status=0
          firebase emulators:exec --project demo-sales-restore --only firestore \
            'node tools/production/rehearse-managed-backup.mjs "$NICO_BACKUP_REHEARSAL_MODE"' \
            > "$RUNNER_TEMP/nico-managed-rehearsal.private.log" 2>&1 || status=$?
          # Never publish emulator logs, customer fields/IDs, source archives or credentials.
          grep -E '^(NICO_MANAGED_REHEARSAL_(CHECK|RESULT) |STOP_MANAGED_[A-Z0-9_]+$)' "$RUNNER_TEMP/nico-managed-rehearsal.private.log" || true
          test "$status" = 0
      - name: Always remove identity and private emulator logs; no artifacts
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/nico-managed-rehearsal.private.json" "$RUNNER_TEMP/nico-managed-rehearsal.private.log"
          rm -f firestore-debug.log firebase-debug.log ui-debug.log
