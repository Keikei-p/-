name: NICO partner email backend after confirmed index - one-shot
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/nico-partner-email-backend-recover-once.yml']
  push:
    branches: [main]
    paths: ['.github/workflows/nico-partner-email-backend-recover-once.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Exact approved backend and deployed interface, all original finance tests
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object index.html)" = '88ef5636bfe9254e71f2109d452b6d3049f99861'
          test "$(git hash-object functions-partner-workspace/service.cjs)" = 'b94a6aba231dc2569009580a178297a5b6194bda'
          test "$(git hash-object functions-partner-workspace/index.js)" = '38da7e9174ffea7c406c92292dccfc651b565eb0'
          test "$(git hash-object functions/index.js)" = 'dfb4c48ada6fa89a24c898cd4a2f911bcede822f'
          test "$(git hash-object firebase.partner-workspace.json)" = 'a6ceedec5fab4e22e0a8efe19c685716a2db9750'
          node --check functions-partner-workspace/service.cjs
          node --test tests/partner-workspace.test.cjs tests/partner-email-resend-and-join.test.mjs tests/partner-invite-resend-and-accept.test.cjs
          node --test tests/internal-owner-finance-visibility.test.cjs tests/partner-money-free-workspace.test.cjs tests/partner-company-code-auth.test.cjs
          node --test tests/sales-regressions.cjs tests/partner-existing-ranking.test.cjs
          node <<'NODE'
          const fs=require('fs'),w=fs.readFileSync('.github/workflows/nico-partner-email-backend-recover-once.yml','utf8');
          const forbidden=['firebase'+' deploy --only hosting','firestore:'+'delete','--'+'force','functions:artifacts:'+'setpolicy'];
          if(forbidden.some(x=>w.includes(x)))throw Error('STOP_DESTRUCTIVE_OR_UNSCOPED_RELEASE');
          if(!w.includes('functions:partner-workspace:managePartnerWorkspace,functions:partner-workspace:acceptPartnerWorkspaceInvite'))
            throw Error('STOP_WRONG_TWO_FUNCTION_SCOPE');
          if(JSON.parse(fs.readFileSync('.firebaserc','utf8')).projects.default!=='sales-management-cc116')
            throw Error('STOP_WRONG_PROJECT');
          console.log('PASS_BACKEND_ONLY_REVIEW');
          NODE
  release:
    needs: validate
    concurrency:
      group: nico-partner-workspace-production
      cancel-in-progress: false
    if: >-
      ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.actor == 'Keikei-p' && startsWith(github.event.head_commit.message, 'release: recover partner email backend after verified index') && needs.validate.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      FIREBASE_PROJECT_ID: sales-management-cc116
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Check immutable frontend and backend and exact main before identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api repos/Keikei-p/-/branches/main --jq '.commit.sha')" = "$GITHUB_SHA" || { echo STOP_MAIN_CHANGED; exit 1; }
          test "$(git hash-object index.html)" = '88ef5636bfe9254e71f2109d452b6d3049f99861'
          test "$(git hash-object functions-partner-workspace/service.cjs)" = 'b94a6aba231dc2569009580a178297a5b6194bda'
          test "$(git hash-object functions/index.js)" = 'dfb4c48ada6fa89a24c898cd4a2f911bcede822f'
          test "$(git hash-object firebase.partner-workspace.json)" = 'a6ceedec5fab4e22e0a8efe19c685716a2db9750'
          curl -fsSL --retry 3 --max-time 35 'https://nico-factory.web.app/?partner_backend_recover_preflight=1' > "$RUNNER_TEMP/partner-email-live-before.html"
          cmp -s "$RUNNER_TEMP/partner-email-live-before.html" index.html || { echo STOP_PRODUCTION_INDEX_NOT_REVIEWED; exit 1; }
          echo 'PASS exact reviewed new client already live, do not redeploy Hosting'
      - name: Use protected Firebase identity without exposing secrets
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          test -n "${FIREBASE_SERVICE_ACCOUNT_JSON:-}"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/partner-email-recovery-identity.json"
          chmod 600 "$RUNNER_TEMP/partner-email-recovery-identity.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/partner-email-recovery-identity.json" >> "$GITHUB_ENV"
      - name: Install existing pinned SDK and CLI, no production writes
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix functions --ignore-scripts --package-lock=false --no-audit --no-fund
          npm install --prefix functions-partner-workspace --ignore-scripts --package-lock=false --no-audit --no-fund
          npm install -g firebase-tools@15.34.1 --no-audit --no-fund
      - name: Read-only proof of existing finance Rules, ready backups, four callable Functions
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {createRequire} from 'node:module';
          import {createHash} from 'node:crypto';
          import {inspect} from './tools/production/inspect-firestore-backups-readonly.mjs';
          const require=createRequire(process.cwd()+'/functions/package.json');
          const {applicationDefault}=require('firebase-admin/app');
          const token=(await applicationDefault().getAccessToken()).access_token;
          async function get(url){
            const r=await fetch(url,{headers:{Authorization:'Bearer '+token},redirect:'error'});
            if(!r.ok)throw Error('STOP_READ_ONLY_API_'+r.status);
            return r.json();
          }
          const rulesRoot='https://firebaserules.googleapis.com/v1/';
          const release=await get(rulesRoot+'projects/sales-management-cc116/releases/cloud.firestore');
          if(!/^projects\/sales-management-cc116\/rulesets\/[A-Za-z0-9_-]+$/.test(release.rulesetName))
            throw Error('STOP_RULESET_REF');
          const set=await get(rulesRoot+release.rulesetName);
          if(set.source?.files?.length!==1)throw Error('STOP_RULES_SOURCE');
          const sha=createHash('sha256').update(set.source.files[0].content.replace(/\r\n/g,'\n').trim()).digest('hex');
          if(sha!=='d1d9998d874a1a31c81ddf6996e08cd9de3a3d13bd684e245140bf03cab32179')
            throw Error('STOP_FINANCE_BOUNDARY_CHANGED');
          const backups=await inspect(),age=Date.now()-Date.parse(backups.latestReadySnapshot||'');
          if(backups.readyBackups<1||!Number.isFinite(age)||age<0||age>48*3600000)
            throw Error('STOP_RECENT_BACKUP_REQUIRED');
          for(const name of ['getPartnerWorkspace','managePartnerWorkspace','acceptPartnerWorkspaceInvite','submitPartnerWorkspaceCounts']){
            const fn=await get('https://cloudfunctions.googleapis.com/v2/projects/sales-management-cc116/locations/asia-northeast1/functions/'+name);
            if(fn.state!=='ACTIVE'||fn.environment!=='GEN_2'||fn.buildConfig?.runtime!=='nodejs22'||
               fn.serviceConfig?.environmentVariables?.PARTNER_WORKSPACE_ENABLED!=='enabled')
              throw Error('STOP_ORIGINAL_FUNCTION_NOT_ACTIVE_'+name);
          }
          console.log('PASS_PRODUCTION_FINANCE_RULES_BACKUP_FOUR_FUNCTIONS_READONLY');
          NODE
          firebase functions:list --project "$FIREBASE_PROJECT_ID" --json > "$RUNNER_TEMP/partner-email-functions-before.json"
      - name: Update only two existing partner invite Functions once (no Hosting, Rules, Auth, Artifact settings)
        shell: bash
        run: |
          set -euo pipefail
          test ! -e functions-partner-workspace/.env.sales-management-cc116
          printf 'PARTNER_WORKSPACE_ENABLED=enabled\nPARTNER_COMPANY_CODE_AUTH_ENABLED=enabled\n' > functions-partner-workspace/.env.sales-management-cc116
          date -u +%Y-%m-%dT%H:%M:%SZ > "$RUNNER_TEMP/partner-email-started.txt"
          set +e
          firebase deploy --non-interactive --project "$FIREBASE_PROJECT_ID" --config firebase.partner-workspace.json --only functions:partner-workspace:managePartnerWorkspace,functions:partner-workspace:acceptPartnerWorkspaceInvite > "$RUNNER_TEMP/partner-email-deploy.log" 2>&1
          rc=$?
          set -e
          for name in managePartnerWorkspace acceptPartnerWorkspaceInvite; do
            grep -F "functions[partner-workspace:${name}(asia-northeast1)]" "$RUNNER_TEMP/partner-email-deploy.log" | grep -Fq 'Successful update operation' || {
              echo "STOP_FUNCTION_UPDATE_LOG_MISSING_${name}"; exit 1;
            }
          done
          if [ "$rc" -ne 0 ]; then
            grep -Fq 'Functions successfully deployed but could not set up cleanup policy in location asia-northeast1' "$RUNNER_TEMP/partner-email-deploy.log" || {
              echo STOP_UNKNOWN_DEPLOY_EXIT; exit 1;
            }
            echo 'KNOWN_ARTIFACT_CLEANUP_POLICY_WARNING; verify live Functions next'
          fi
      - name: Read-only actual deployment verification, existing Function protection, anonymous rejection
        shell: bash
        run: |
          set -euo pipefail
          firebase functions:list --project "$FIREBASE_PROJECT_ID" --json > "$RUNNER_TEMP/partner-email-functions-after.json"
          node <<'NODE'
          const fs=require('fs');
          const load=p=>(JSON.parse(fs.readFileSync(p,'utf8')).result||[]).map(x=>x.id||x.name||'');
          const before=load(process.env.RUNNER_TEMP+'/partner-email-functions-before.json');
          const after=load(process.env.RUNNER_TEMP+'/partner-email-functions-after.json');
          if(!before.length||before.some(x=>!after.includes(x)))throw Error('STOP_PREEXISTING_FUNCTION_MISSING');
          console.log('PASS_ALL_ORIGINAL_FUNCTIONS_PRESERVED');
          NODE
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          import {createRequire} from 'node:module';
          const require=createRequire(process.cwd()+'/functions/package.json');
          const {applicationDefault}=require('firebase-admin/app');
          const token=(await applicationDefault().getAccessToken()).access_token;
          const started=Date.parse(readFileSync(process.env.RUNNER_TEMP+'/partner-email-started.txt','utf8').trim());
          for(const name of ['managePartnerWorkspace','acceptPartnerWorkspaceInvite']){
            const res=await fetch('https://cloudfunctions.googleapis.com/v2/projects/sales-management-cc116/locations/asia-northeast1/functions/'+name,{headers:{Authorization:'Bearer '+token},redirect:'error'});
            if(!res.ok)throw Error('STOP_FUNCTION_METADATA_'+res.status);
            const fn=await res.json();
            if(fn.state!=='ACTIVE'||fn.environment!=='GEN_2'||fn.buildConfig?.runtime!=='nodejs22'||
               fn.buildConfig?.entryPoint!==name||!fn.buildConfig?.source?.storageSource?.object||
               fn.serviceConfig?.environmentVariables?.PARTNER_WORKSPACE_ENABLED!=='enabled'||
               !Number.isFinite(Date.parse(fn.updateTime))||Date.parse(fn.updateTime)<started)
              throw Error('STOP_UPDATED_FUNCTION_NOT_ACTIVE_'+name);
            console.log('PASS_UPDATED_ACTIVE_'+name);
          }
          for(const name of ['getPartnerWorkspace','managePartnerWorkspace','acceptPartnerWorkspaceInvite','submitPartnerWorkspaceCounts']){
            const res=await fetch('https://asia-northeast1-sales-management-cc116.cloudfunctions.net/'+name,
             {method:'POST',headers:{'Content-Type':'application/json'},body:'{"data":{}}'});
            if(![401,403].includes(res.status))throw Error('STOP_ANONYMOUS_ACCESS_'+name+'_'+res.status);
          }
          console.log('PASS_ALL_FOUR_ANONYMOUS_REQUESTS_DENIED');
          NODE
          curl -fsSL --retry 3 --max-time 35 'https://nico-factory.web.app/?partner_backend_recovery_after=1' > "$RUNNER_TEMP/partner-email-live-after.html"
          cmp -s "$RUNNER_TEMP/partner-email-live-after.html" index.html || { echo STOP_PUBLIC_INDEX_CHANGED; exit 1; }
          echo 'PASS_PARTNER_EMAIL_BACKEND_RECOVERED: two Functions only; approved index already live; original data intact'
      - name: Remove temporary credentials and private evidence
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/partner-email-recovery-identity.json" "$RUNNER_TEMP/partner-email-live-before.html" "$RUNNER_TEMP/partner-email-live-after.html" "$RUNNER_TEMP/partner-email-functions-before.json" "$RUNNER_TEMP/partner-email-functions-after.json" "$RUNNER_TEMP/partner-email-started.txt" "$RUNNER_TEMP/partner-email-deploy.log" functions-partner-workspace/.env.sales-management-cc116
