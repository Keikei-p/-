name: NICO partner verified invite mail resend and safe join
on:
  pull_request:
    branches: [main]
    paths:
      - index.html
      - functions-partner-workspace/service.cjs
      - tests/partner-workspace.test.cjs
      - tests/partner-email-resend-and-join.test.mjs
      - .github/workflows/nico-partner-email-retry-join-release.yml
  push:
    branches: [main]
    paths:
      - .github/workflows/nico-partner-email-retry-join-release.yml
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - name: Verify exact minimal changes and original finance sources
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object index.html)" = '88ef5636bfe9254e71f2109d452b6d3049f99861'
          test "$(git hash-object functions-partner-workspace/service.cjs)" = 'b94a6aba231dc2569009580a178297a5b6194bda'
          test "$(git hash-object functions-partner-workspace/index.js)" = '38da7e9174ffea7c406c92292dccfc651b565eb0'
          test "$(git hash-object functions/index.js)" = 'dfb4c48ada6fa89a24c898cd4a2f911bcede822f'
          test "$(git hash-object firebase.partner-workspace.json)" = 'a6ceedec5fab4e22e0a8efe19c685716a2db9750'
          node --check functions-partner-workspace/service.cjs
          node <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('index.html','utf8');
          const script=html.match(/<script type="module">([\s\S]*?)<\/script>/)?.[1];
          if(!script)throw Error('STOP_CANONICAL_APP_JS_MISSING');
          fs.writeFileSync('/tmp/nico-partner-email-join.mjs',script);
          if(JSON.parse(fs.readFileSync('.firebaserc','utf8')).projects.default!=='sales-management-cc116')
            throw Error('STOP_WRONG_FIREBASE_PROJECT');
          NODE
          node --check /tmp/nico-partner-email-join.mjs
          node --test tests/partner-email-resend-and-join.test.mjs
          node --test tests/partner-workspace.test.cjs tests/internal-owner-finance-visibility.test.cjs
          node --test tests/partner-company-code-auth.test.cjs tests/partner-money-free-workspace.test.cjs
          node --test tests/sales-regressions.cjs tests/partner-existing-ranking.test.cjs tests/partner-one-login-same-app.test.cjs
          node --test tests/partner-invite-mobile-layout.test.cjs tests/surgical-existing-index.test.mjs
      - name: Verify existing financial restrictions in disposable Firestore emulator
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix tests --ignore-scripts --no-audit --no-fund
          npm install -g firebase-tools@15.34.1 --no-audit --no-fund
          RULES_ONLY=1 firebase emulators:exec --project demo-sales-support --only firestore 'node --test tests/rules.test.cjs'
  release:
    needs: validate
    concurrency:
      group: nico-partner-workspace-production
      cancel-in-progress: false
    if: >-
      ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.actor == 'Keikei-p' && startsWith(github.event.head_commit.message, 'release: partner verified invite email retry and join') && needs.validate.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      FIREBASE_PROJECT_ID: sales-management-cc116
      NICO_PARTNER_RELEASE_CONFIRMATION: CONFIRM_ADD_PARTNER_RANKING_INDEX_ONLY
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Require current main SHA and exact previously reviewed source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api repos/Keikei-p/-/branches/main --jq '.commit.sha')" = "$GITHUB_SHA" || { echo 'STOP_MAIN_CHANGED'; exit 1; }
          test "$(git hash-object index.html)" = '88ef5636bfe9254e71f2109d452b6d3049f99861'
          test "$(git hash-object functions-partner-workspace/service.cjs)" = 'b94a6aba231dc2569009580a178297a5b6194bda'
          test "$(git hash-object functions/index.js)" = 'dfb4c48ada6fa89a24c898cd4a2f911bcede822f'
          test "$(git hash-object firebase.partner-workspace.json)" = 'a6ceedec5fab4e22e0a8efe19c685716a2db9750'
          node --test tests/partner-workspace.test.cjs tests/internal-owner-finance-visibility.test.cjs tests/partner-email-resend-and-join.test.mjs
          git show bb912fe4d72282c95740c41908612dfdb6f485ac:index.html > "$RUNNER_TEMP/partner-mail-original-index.html"
          curl -fsSL --retry 3 --max-time 35 'https://nico-factory.web.app/?partner_mail_before=1' > "$RUNNER_TEMP/partner-mail-live-before.html"
          cmp -s "$RUNNER_TEMP/partner-mail-live-before.html" "$RUNNER_TEMP/partner-mail-original-index.html" ||
            { echo 'STOP_UNKNOWN_LIVE_UI'; exit 1; }
      - name: Load existing protected service identity
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${FIREBASE_SERVICE_ACCOUNT_JSON:-}"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/partner-mail-identity.json"
          chmod 600 "$RUNNER_TEMP/partner-mail-identity.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/partner-mail-identity.json" >> "$GITHUB_ENV"
      - name: Install existing pinned Firebase tools (no Functions changes yet)
        shell: bash
        run: |
          set -euo pipefail
          npm install -g firebase-tools@15.34.1 --no-audit --no-fund
          npm install --prefix functions --ignore-scripts --package-lock=false --no-audit --no-fund
          npm install --prefix functions-partner-workspace --ignore-scripts --package-lock=false --no-audit --no-fund
      - name: READ ONLY validate finance Rules backup and existing four callable Functions
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {createHash} from 'node:crypto';
          import {createRequire} from 'node:module';
          import {inspect} from './tools/production/inspect-firestore-backups-readonly.mjs';
          const require=createRequire(process.cwd()+'/functions/package.json');
          const {applicationDefault}=require('firebase-admin/app');
          const token=(await applicationDefault().getAccessToken()).access_token;
          const get=async url=>{
           const r=await fetch(url,{headers:{Authorization:'Bearer '+token},redirect:'error'});
           if(!r.ok)throw Error('STOP_PREDEPLOY_API_'+r.status);
           return r.json();
          };
          const root='https://firebaserules.googleapis.com/v1/';
          const rel=await get(root+'projects/sales-management-cc116/releases/cloud.firestore');
          const rules=await get(root+rel.rulesetName);
          if(rules?.source?.files?.length!==1)throw Error('STOP_LIVE_RULES_SOURCE');
          const digest=createHash('sha256').update(rules.source.files[0].content.replace(/\r\n/g,'\n').trim()).digest('hex');
          if(digest!=='d1d9998d874a1a31c81ddf6996e08cd9de3a3d13bd684e245140bf03cab32179')
           throw Error('STOP_FINANCE_RULES_CHANGED');
          const backup=await inspect(),age=Date.now()-Date.parse(backup.latestReadySnapshot||'');
          if(backup.readyBackups<1||!Number.isFinite(age)||age<0||age>48*60*60*1000)
           throw Error('STOP_BACKUP_NOT_RECENT');
          for(const name of ['getPartnerWorkspace','managePartnerWorkspace','acceptPartnerWorkspaceInvite','submitPartnerWorkspaceCounts']){
           const f=await get('https://cloudfunctions.googleapis.com/v2/projects/sales-management-cc116/locations/asia-northeast1/functions/'+name);
           if(f.state!=='ACTIVE'||f.environment!=='GEN_2'||f.buildConfig?.runtime!=='nodejs22'||
              f.serviceConfig?.environmentVariables?.PARTNER_WORKSPACE_ENABLED!=='enabled')
            throw Error('STOP_ORIGINAL_FUNCTION_NOT_ACTIVE_'+name);
          }
          console.log('PASS_FINANCE_RULES_BACKUP_FOUR_FUNCTIONS');
          NODE
          firebase functions:list --project "$FIREBASE_PROJECT_ID" --json > "$RUNNER_TEMP/partner-mail-fns-before.json"
      - name: Deploy only two changed invitation Functions, not Firestore or original sales
        shell: bash
        run: |
          set -euo pipefail
          test ! -e functions-partner-workspace/.env.sales-management-cc116
          printf 'PARTNER_WORKSPACE_ENABLED=enabled\nPARTNER_COMPANY_CODE_AUTH_ENABLED=enabled\n' > functions-partner-workspace/.env.sales-management-cc116
          date -u +%Y-%m-%dT%H:%M:%SZ > "$RUNNER_TEMP/partner-mail-started.txt"
          set +e
          firebase deploy --non-interactive --project "$FIREBASE_PROJECT_ID" --config firebase.partner-workspace.json --only functions:partner-workspace:managePartnerWorkspace,functions:partner-workspace:acceptPartnerWorkspaceInvite > "$RUNNER_TEMP/partner-mail-deploy-output.log" 2>&1
          rc=$?
          set -e
          for n in managePartnerWorkspace acceptPartnerWorkspaceInvite; do
            grep -F "functions[partner-workspace:${n}(asia-northeast1)]" "$RUNNER_TEMP/partner-mail-deploy-output.log" | grep -Fq "Successful update operation" ||
              { echo "STOP_FUNCTION_UPDATE_NOT_CONFIRMED_${n}"; exit 1; }
          done
          if [ "$rc" -ne 0 ]; then
            grep -Fq 'Functions successfully deployed but could not set up cleanup policy in location asia-northeast1' "$RUNNER_TEMP/partner-mail-deploy-output.log" ||
              { echo 'STOP_UNKNOWN_DEPLOY_FAILURE'; exit 1; }
            echo 'KNOWN_ARTIFACT_CLEANUP_POLICY_WARNING_NO_SETTINGS_CHANGED'
          fi
          echo 'PASS_TWO_FUNCTIONS_DEPLOY_LOGS'
      - name: Verify updated Functions, pre-existing Functions and authenticated-only access
        shell: bash
        run: |
          set -euo pipefail
          firebase functions:list --project "$FIREBASE_PROJECT_ID" --json > "$RUNNER_TEMP/partner-mail-fns-after.json"
          node <<'NODE'
          const fs=require('fs');
          const list=p=>(JSON.parse(fs.readFileSync(p,'utf8')).result||[]).map(x=>x.id||x.name||'');
          const a=list(process.env.RUNNER_TEMP+'/partner-mail-fns-before.json'),b=list(process.env.RUNNER_TEMP+'/partner-mail-fns-after.json');
          if(!a.length||a.some(x=>!b.includes(x)))throw Error('STOP_EXISTING_FUNCTION_MISSING');
          console.log('PASS_EXISTING_FUNCTION_INVENTORY_UNCHANGED');
          NODE
          node --input-type=module <<'NODE'
          import {createRequire} from 'node:module';
          import {readFileSync} from 'node:fs';
          const require=createRequire(process.cwd()+'/functions/package.json');
          const {applicationDefault}=require('firebase-admin/app');
          const token=(await applicationDefault().getAccessToken()).access_token;
          const start=Date.parse(readFileSync(process.env.RUNNER_TEMP+'/partner-mail-started.txt','utf8').trim());
          for(const name of ['managePartnerWorkspace','acceptPartnerWorkspaceInvite']){
           const r=await fetch('https://cloudfunctions.googleapis.com/v2/projects/sales-management-cc116/locations/asia-northeast1/functions/'+name,
            {headers:{Authorization:'Bearer '+token},redirect:'error'});
           if(!r.ok)throw Error('STOP_FUNCTION_READ_'+r.status);
           const f=await r.json();
           if(f.state!=='ACTIVE'||f.environment!=='GEN_2'||f.buildConfig?.runtime!=='nodejs22'||
              f.buildConfig?.entryPoint!==name||Date.parse(f.updateTime)<start||
              !f.buildConfig?.source?.storageSource?.object||
              f.serviceConfig?.environmentVariables?.PARTNER_WORKSPACE_ENABLED!=='enabled')
             throw Error('STOP_REPAIRED_FUNCTION_NOT_ACTIVE_'+name);
           console.log('PASS_REPAIRED_FUNCTION_ACTIVE_'+name);
          }
          for(const name of ['getPartnerWorkspace','managePartnerWorkspace','acceptPartnerWorkspaceInvite','submitPartnerWorkspaceCounts']){
           const r=await fetch('https://asia-northeast1-sales-management-cc116.cloudfunctions.net/'+name,{
            method:'POST',headers:{'Content-Type':'application/json'},body:'{"data":{}}'});
           if(![401,403].includes(r.status))throw Error('STOP_ANON_ACCESS_'+name+'_'+r.status);
          }
          console.log('PASS_FOUR_ENDPOINTS_REJECT_UNAUTHENTICATED_USERS');
          NODE
      - name: Recheck exact current main, existing live UI, and one-file Hosting manifest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api repos/Keikei-p/-/branches/main --jq '.commit.sha')" = "$GITHUB_SHA" || { echo STOP_MAIN_CHANGED; exit 1; }
          curl -fsSL --retry 2 --max-time 35 'https://nico-factory.web.app/?partner_mail_before_hosting=1' > "$RUNNER_TEMP/partner-mail-before-hosting.html"
          cmp -s "$RUNNER_TEMP/partner-mail-before-hosting.html" "$RUNNER_TEMP/partner-mail-original-index.html" ||
            { echo STOP_LIVE_HTML_CHANGED; exit 1; }
          node tools/hosting/surgical-existing-index.mjs --dry-run
      - name: Publish reviewed main index only after two Functions passed live verification
        run: node tools/hosting/surgical-existing-index.mjs --release
      - name: Verify new production invite UI, finance baseline and old routes
        shell: bash
        run: |
          set -euo pipefail
          match=false
          for i in $(seq 1 10); do
            curl -fsSL --retry 2 --max-time 35 "https://nico-factory.web.app/?partner_mail_verified=$GITHUB_SHA-$i" > "$RUNNER_TEMP/partner-mail-live-after.html"
            if cmp -s "$RUNNER_TEMP/partner-mail-live-after.html" index.html; then match=true; break; fi
            sleep 3
          done
          [ "$match" = true ] || { echo 'STOP_LIVE_HTML_NOT_APPROVED'; exit 1; }
          for id in partnerInviteResendEmailButton partnerInviteSendEmailButton pMainChangeInviteAccount partnerInviteInline; do
            grep -Fq "$id" "$RUNNER_TEMP/partner-mail-live-after.html"
          done
          for path in /partner-invite.html /partner-counts.html /partner-workspace.html; do
            [ "$(curl -sSL -o /dev/null -w '%{http_code}' --max-time 30 "https://nico-factory.web.app$path")" = 200 ]
          done
          echo 'PASS_PARTNER_INVITE_MAIL_RETRY_AND_JOIN_PRODUCTION: two Functions then single index; original data untouched'
      - name: Remove temporary credentials and logs
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/partner-mail-identity.json" "$RUNNER_TEMP/partner-mail-original-index.html" "$RUNNER_TEMP/partner-mail-live-before.html" "$RUNNER_TEMP/partner-mail-before-hosting.html" "$RUNNER_TEMP/partner-mail-live-after.html" "$RUNNER_TEMP/partner-mail-fns-before.json" "$RUNNER_TEMP/partner-mail-fns-after.json" "$RUNNER_TEMP/partner-mail-started.txt" "$RUNNER_TEMP/partner-mail-deploy-output.log" functions-partner-workspace/.env.sales-management-cc116
