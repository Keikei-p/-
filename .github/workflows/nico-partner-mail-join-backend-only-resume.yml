name: NICO one-shot verified invitation backend resume - Hosting already live
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/nico-partner-mail-join-backend-only-resume.yml']
  push:
    branches: [main]
    paths: ['.github/workflows/nico-partner-mail-join-backend-only-resume.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify exact reviewed HTML/backend pair without write credentials
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object index.html)" = '88ef5636bfe9254e71f2109d452b6d3049f99861'
          test "$(git hash-object functions-partner-workspace/service.cjs)" = 'b94a6aba231dc2569009580a178297a5b6194bda'
          test "$(git hash-object functions-partner-workspace/index.js)" = '38da7e9174ffea7c406c92292dccfc651b565eb0'
          test "$(git hash-object firebase.partner-workspace.json)" = 'a6ceedec5fab4e22e0a8efe19c685716a2db9750'
          test "$(git hash-object functions/index.js)" = 'dfb4c48ada6fa89a24c898cd4a2f911bcede822f'
          test "$(node -p "JSON.parse(require('fs').readFileSync('.firebaserc','utf8')).projects.default")" = 'sales-management-cc116'
          node --check functions-partner-workspace/service.cjs
          node --test tests/partner-workspace.test.cjs tests/internal-owner-finance-visibility.test.cjs tests/partner-email-resend-and-join.test.mjs tests/partner-invite-resend-and-accept.test.cjs
          node --test tests/partner-money-free-workspace.test.cjs tests/partner-company-code-auth.test.cjs
  release-backend-only:
    needs: validate
    if: >-
      ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.actor == 'Keikei-p' && startsWith(github.event.head_commit.message, 'release: repair partner invite backend after verified live UI') && needs.validate.result == 'success' }}
    concurrency:
      group: nico-partner-workspace-production
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 48
    env:
      FIREBASE_PROJECT_ID: sales-management-cc116
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Require exact current main and LIVE reviewed canonical HTML (no Hosting write)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api repos/Keikei-p/-/branches/main --jq '.commit.sha')" = "$GITHUB_SHA" || { echo 'STOP_MAIN_CHANGED'; exit 1; }
          test "$(git hash-object index.html)" = '88ef5636bfe9254e71f2109d452b6d3049f99861'
          test "$(git hash-object functions-partner-workspace/service.cjs)" = 'b94a6aba231dc2569009580a178297a5b6194bda'
          test "$(git hash-object functions-partner-workspace/index.js)" = '38da7e9174ffea7c406c92292dccfc651b565eb0'
          test "$(git hash-object functions/index.js)" = 'dfb4c48ada6fa89a24c898cd4a2f911bcede822f'
          test "$(git hash-object firebase.partner-workspace.json)" = 'a6ceedec5fab4e22e0a8efe19c685716a2db9750'
          curl -fsSL --retry 3 --max-time 35 'https://nico-factory.web.app/?invitation_backend_resume_before=1' > "$RUNNER_TEMP/partner-resume-live-index.html"
          cmp -s "$RUNNER_TEMP/partner-resume-live-index.html" index.html ||
            { echo 'STOP_LIVE_UI_NOT_THE_APPROVED_NEW_VERSION'; exit 1; }
          node --test tests/partner-workspace.test.cjs tests/internal-owner-finance-visibility.test.cjs tests/partner-email-resend-and-join.test.mjs
          echo 'PASS_NEW_CANONICAL_INVITE_UI_ALREADY_LIVE_NO_HOSTING_ACTION_NEEDED'
      - name: Load existing Firebase identity for only two scoped Functions
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          test -n "${FIREBASE_SERVICE_ACCOUNT_JSON:-}"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/partner-resume-service-account.json"
          chmod 600 "$RUNNER_TEMP/partner-resume-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/partner-resume-service-account.json" >> "$GITHUB_ENV"
      - name: Install unchanged original Firebase tools and Admin SDK
        shell: bash
        run: |
          set -euo pipefail
          npm install -g firebase-tools@15.34.1 --no-audit --no-fund
          npm install --prefix functions --ignore-scripts --package-lock=false --no-audit --no-fund
          npm install --prefix functions-partner-workspace --ignore-scripts --package-lock=false --no-audit --no-fund
      - name: READ ONLY verify finance Rules, recent backup and no newer competing deployment
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {createHash} from 'node:crypto';
          import {createRequire} from 'node:module';
          import {inspect} from './tools/production/inspect-firestore-backups-readonly.mjs';
          const require=createRequire(process.cwd()+'/functions/package.json');
          const {applicationDefault}=require('firebase-admin/app');
          const token=(await applicationDefault().getAccessToken()).access_token;
          async function get(url){
           const r=await fetch(url,{headers:{Authorization:'Bearer '+token},redirect:'error'});
           if(!r.ok)throw Error('STOP_CLOUD_READ_'+r.status);
           return r.json();
          }
          const root='https://firebaserules.googleapis.com/v1/';
          const release=await get(root+'projects/sales-management-cc116/releases/cloud.firestore');
          const src=(await get(root+release.rulesetName)).source?.files;
          if(src?.length!==1)throw Error('STOP_RULES_UNREADABLE');
          const digest=createHash('sha256').update(src[0].content.replace(/\r\n/g,'\n').trim()).digest('hex');
          if(digest!=='d1d9998d874a1a31c81ddf6996e08cd9de3a3d13bd684e245140bf03cab32179')
           throw Error('STOP_PRODUCTION_FINANCE_RULES_CHANGED');
          const b=await inspect(),age=Date.now()-Date.parse(b.latestReadySnapshot||'');
          if(b.readyBackups<1||!Number.isFinite(age)||age<0||age>48*3600000)
           throw Error('STOP_RECENT_BACKUP_NOT_READY');
          for(const name of ['getPartnerWorkspace','managePartnerWorkspace','acceptPartnerWorkspaceInvite','submitPartnerWorkspaceCounts']){
           const f=await get('https://cloudfunctions.googleapis.com/v2/projects/sales-management-cc116/locations/asia-northeast1/functions/'+name);
           if(f.state!=='ACTIVE'||f.environment!=='GEN_2'||f.buildConfig?.runtime!=='nodejs22'||
              f.serviceConfig?.environmentVariables?.PARTNER_WORKSPACE_ENABLED!=='enabled')
            throw Error('STOP_FUNCTION_NOT_CURRENTLY_HEALTHY_'+name);
           if(['managePartnerWorkspace','acceptPartnerWorkspaceInvite'].includes(name)&&
              Date.parse(f.updateTime)>=Date.parse('2026-11-02T03:48:00Z'))
            throw Error('STOP_CONCURRENT_NEWER_FUNCTION_RELEASE_'+name);
          }
          console.log('PASS_APPROVED_RULES_BACKUP_EXISTING_FUNCTIONS_NO_CONCURRENT_UPDATE');
          NODE
          firebase functions:list --project "$FIREBASE_PROJECT_ID" --json > "$RUNNER_TEMP/partner-resume-fns-before.json"
      - name: Update only the two invitation Functions, never write Hosting/Firestore/LINE
        shell: bash
        run: |
          set -euo pipefail
          test ! -e functions-partner-workspace/.env.sales-management-cc116
          printf 'PARTNER_WORKSPACE_ENABLED=enabled\nPARTNER_COMPANY_CODE_AUTH_ENABLED=enabled\n' > functions-partner-workspace/.env.sales-management-cc116
          date -u +%Y-%m-%dT%H:%M:%SZ > "$RUNNER_TEMP/partner-resume-start.txt"
          set +e
          firebase deploy --non-interactive --project "$FIREBASE_PROJECT_ID" \
            --config firebase.partner-workspace.json \
            --only functions:partner-workspace:managePartnerWorkspace,functions:partner-workspace:acceptPartnerWorkspaceInvite \
            > "$RUNNER_TEMP/partner-resume-deploy.log" 2>&1
          rc=$?
          set -e
          for name in managePartnerWorkspace acceptPartnerWorkspaceInvite; do
            grep -F "functions[partner-workspace:${name}(asia-northeast1)]" "$RUNNER_TEMP/partner-resume-deploy.log" |
              grep -Fq 'Successful update operation' ||
              { echo "STOP_FUNCTION_UPDATE_UNCONFIRMED_${name}"; exit 1; }
          done
          if [ "$rc" -ne 0 ]; then
            grep -Fq 'Functions successfully deployed but could not set up cleanup policy in location asia-northeast1' "$RUNNER_TEMP/partner-resume-deploy.log" ||
              { echo 'STOP_UNEXPECTED_DEPLOY_ERROR'; exit 1; }
            echo 'KNOWN_ARTIFACT_CLEANUP_POLICY_WARNING; no cleanup or IAM setting changes'
          fi
          echo 'PASS_TWO_FUNCTIONS_DEPLOY_LOGS'
      - name: Read current Cloud Functions v2 to prove repaired versions and old Functions retained
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          firebase functions:list --project "$FIREBASE_PROJECT_ID" --json > "$RUNNER_TEMP/partner-resume-fns-after.json"
          node <<'NODE'
          const fs=require('fs');
          const list=p=>(JSON.parse(fs.readFileSync(p,'utf8')).result||[]).map(x=>x.id||x.name||'');
          const before=list(process.env.RUNNER_TEMP+'/partner-resume-fns-before.json');
          const after=list(process.env.RUNNER_TEMP+'/partner-resume-fns-after.json');
          if(!before.length||before.some(x=>!after.includes(x)))throw Error('STOP_ORIGINAL_FUNCTION_MISSING');
          console.log('PASS_PREEXISTING_FUNCTIONS_RETAINED');
          NODE
          node --input-type=module <<'NODE'
          import {createRequire} from 'node:module';
          import {readFileSync} from 'node:fs';
          const require=createRequire(process.cwd()+'/functions/package.json');
          const {applicationDefault}=require('firebase-admin/app');
          const token=(await applicationDefault().getAccessToken()).access_token;
          const started=Date.parse(readFileSync(process.env.RUNNER_TEMP+'/partner-resume-start.txt','utf8').trim());
          for(const name of ['managePartnerWorkspace','acceptPartnerWorkspaceInvite']){
           const r=await fetch('https://cloudfunctions.googleapis.com/v2/projects/sales-management-cc116/locations/asia-northeast1/functions/'+name,{headers:{Authorization:'Bearer '+token},redirect:'error'});
           if(!r.ok)throw Error('STOP_FN_READ_HTTP_'+r.status);
           const f=await r.json();
           if(f.state!=='ACTIVE'||f.environment!=='GEN_2'||f.buildConfig?.runtime!=='nodejs22'||
              f.buildConfig?.entryPoint!==name||!f.buildConfig?.source?.storageSource?.object||
              Date.parse(f.updateTime)<started||f.serviceConfig?.environmentVariables?.PARTNER_WORKSPACE_ENABLED!=='enabled')
            throw Error('STOP_NOT_RECENT_ACTIVE_FN_'+name);
           console.log('PASS_ACTIVE_UPDATED_INVITATION_FN '+name);
          }
          for(const name of ['getPartnerWorkspace','managePartnerWorkspace','acceptPartnerWorkspaceInvite','submitPartnerWorkspaceCounts']){
           const r=await fetch('https://asia-northeast1-sales-management-cc116.cloudfunctions.net/'+name,
            {method:'POST',headers:{'Content-Type':'application/json'},body:'{"data":{}}'});
           if(![401,403].includes(r.status))throw Error('STOP_ANON_ACCESS_'+name+'_'+r.status);
          }
          console.log('PASS_FOUR_FUNCTIONS_ANON_DENIAL');
          NODE
          test "$(gh api repos/Keikei-p/-/branches/main --jq '.commit.sha')" = "$GITHUB_SHA"
          curl -fsSL --retry 3 --max-time 35 'https://nico-factory.web.app/?invitation_backend_resume_after=1' > "$RUNNER_TEMP/partner-resume-live-after.html"
          cmp -s "$RUNNER_TEMP/partner-resume-live-after.html" index.html ||
            { echo 'STOP_LIVE_UI_CHANGED_AFTER_BACKEND_RELEASE'; exit 1; }
          echo 'PASS_INVITATION_BACKEND_ONLY_PRODUCTION: verified two Functions + same live UI; no Hosting, Rules, data or LINE writes'
      - name: Remove protected identity, logs and temporary flags
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/partner-resume-service-account.json" "$RUNNER_TEMP/partner-resume-live-index.html" "$RUNNER_TEMP/partner-resume-live-after.html" "$RUNNER_TEMP/partner-resume-fns-before.json" "$RUNNER_TEMP/partner-resume-fns-after.json" "$RUNNER_TEMP/partner-resume-start.txt" "$RUNNER_TEMP/partner-resume-deploy.log" functions-partner-workspace/.env.sales-management-cc116
