name: NICO inline quick-count approval owner-tab one-shot Hosting release
on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/nico-owner-inline-quick-approve-once.yml]
  push:
    branches: [main]
    paths: [.github/workflows/nico-owner-inline-quick-approve-once.yml]
permissions:
  contents: read
concurrency:
  group: nico-inline-partner-quick-approve-20261101
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify exact owner-only count grant code and original finance
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object index.html)" = "c05f32d8b64b7df640f331ecf18b5171488b0258" || { echo 'STOP: unreviewed index'; exit 1; }
          git show 13bb65ff6b7bae72419db08b31b38e76369d29cd:index.html > "$RUNNER_TEMP/reviewed-index.html"
          cmp -s index.html "$RUNNER_TEMP/reviewed-index.html"
          node --test tests/simple-partner-company-tab.test.mjs
          node --test tests/partner-quick-counts.test.cjs
          node --test tests/sales-regressions.cjs
          node --test tests/internal-owner-finance-visibility.test.cjs
          node --check tools/hosting/surgical-existing-index.mjs
          node <<'NODE'
          const fs=require('node:fs'),s=fs.readFileSync('index.html','utf8');
          for(const x of ['function showLegacyFinanceEntryBlocked(mode)',
              'currentCatalogRevenuePerUnit','checkedEntry.mode!=="internal"',
              'httpsCallable(partnerCountFunctions,"approvePartnerQuickCounts")',
              'quickApproval?.quickOnly===true','approved.financeAccess!==false',
              'id="partnerCompanyManagement"'])
            if(!s.includes(x))throw Error('STOP: finance or scoped count-only UI missing '+x);
          const src=[...s.matchAll(/<script\b[^>]*type=["']module["'][^>]*>([\s\S]*?)<\/script>/g)];
          if(!src.length)throw Error('STOP: no app browser JS');
          for(let i=0;i<src.length;i++)fs.writeFileSync('/tmp/nico-inline-script-'+i+'.mjs',src[i][1]);
          NODE
          for src in /tmp/nico-inline-script-*.mjs; do node --check "$src"; done
  release:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.validate.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
      NICO_PARTNER_RELEASE_CONFIRMATION: CONFIRM_ADD_PARTNER_RANKING_INDEX_ONLY
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify main and exact approved previous live index before any writes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api repos/Keikei-p/-/branches/main --jq '.commit.sha')" = "$GITHUB_SHA" || { echo 'STOP: main changed'; exit 1; }
          git show 765b097e27e5d3eec84385bef192890c3b42015b:index.html > "$RUNNER_TEMP/approved-base.html"
          curl -fsSL --retry 3 --max-time 30 -H 'Cache-Control: no-cache' \
            "https://nico-factory.web.app/?inline_quick_baseline=$GITHUB_SHA" > "$RUNNER_TEMP/live.html"
          if cmp -s "$RUNNER_TEMP/live.html" index.html; then
            echo 'ALREADY_LIVE=true' >> "$GITHUB_ENV"
            echo 'PASS: exact new index already public'
          elif cmp -s "$RUNNER_TEMP/live.html" "$RUNNER_TEMP/approved-base.html"; then
            echo 'ALREADY_LIVE=false' >> "$GITHUB_ENV"
            echo 'PASS: exact prior index confirmed'
          else
            echo 'STOP: live index changed unexpectedly, do not overwrite'
            exit 1
          fi
      - name: Load Hosting REST-only identity
        if: env.ALREADY_LIVE == 'false'
        shell: bash
        run: |
          set -euo pipefail
          test -n "$FIREBASE_SERVICE_ACCOUNT_JSON" || exit 1
          node -e "if(JSON.parse(require('fs').readFileSync('.firebaserc','utf8')).projects.default!=='sales-management-cc116')process.exit(1)"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/nico-inline-count-hosting.json"
          chmod 600 "$RUNNER_TEMP/nico-inline-count-hosting.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/nico-inline-count-hosting.json" >> "$GITHUB_ENV"
      - name: Install Hosting REST dependency
        if: env.ALREADY_LIVE == 'false'
        run: npm install --prefix functions --ignore-scripts --package-lock=false --no-audit --no-fund
      - name: Read-only check of all live Hosting file hashes
        if: env.ALREADY_LIVE == 'false'
        run: node tools/hosting/surgical-existing-index.mjs --dry-run
      - name: Release only index.html while keeping existing full manifest
        if: env.ALREADY_LIVE == 'false'
        run: node tools/hosting/surgical-existing-index.mjs --release
      - name: Verify live index bytes, approval and all existing partner pages
        shell: bash
        run: |
          set -euo pipefail
          ok=false
          for attempt in $(seq 1 12); do
            curl -fsSL --max-time 30 "https://nico-factory.web.app/?inline_quick_verify=$GITHUB_SHA-$attempt" > "$RUNNER_TEMP/published-index.html"
            if cmp -s "$RUNNER_TEMP/published-index.html" index.html; then ok=true; break; fi
            sleep 5
          done
          test "$ok" = true || { echo 'STOP: expected index not live'; exit 1; }
          for marker in 'id="partnerCompanyManagement"' \
            'approvePartnerQuickCounts' 'quickApproval?.quickOnly===true' \
            'function showLegacyFinanceEntryBlocked(mode)' 'currentCatalogRevenuePerUnit'; do
            grep -Fq "$marker" "$RUNNER_TEMP/published-index.html"
          done
          for route in /partner-invite.html /partner-counts.html /partner-workspace.html; do
            code=$(curl -sSL -o /dev/null -w '%{http_code}' --max-time 30 "https://nico-factory.web.app$route")
            test "$code" = 200 || { echo "STOP: $route HTTP $code"; exit 1; }
          done
          echo 'PASS: inline quick approval published; original owner finance and other 10 files preserved'
