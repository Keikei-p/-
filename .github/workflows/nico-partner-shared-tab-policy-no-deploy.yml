name: NICO Partner Shared Tab Publication Policy - NO DEPLOY

on:
  pull_request:
    paths:
      - 'ranking/partner-tab-visibility-policy.mjs'
      - 'functions-partner-tabs/index.js'
      - 'functions-partner-tabs/package.json'
      - 'functions-partner-tabs/trusted-token-reader.mjs'
      - 'functions-partner-tabs/controller.cjs'
      - 'functions-partner-tabs/partner-tab-publication-store.mjs'
      - 'tests/partner-tab-visibility-policy.test.mjs'
      - 'tests/partner-tab-publication-firestore.test.mjs'
      - 'tests/partner-tab-publication-callables.test.mjs'
      - 'tests/partner-tab-publication-token.test.mjs'
      - '.github/workflows/nico-partner-shared-tab-policy-no-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  protect-count-history:
    name: Shared partner tab contract, Owner Auth and ledger no-write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax check
        run: |
          node --check ranking/partner-tab-visibility-policy.mjs
          node --check functions-partner-tabs/index.js
          node --check functions-partner-tabs/trusted-token-reader.mjs
          node --check functions-partner-tabs/controller.cjs
          node --check functions-partner-tabs/partner-tab-publication-store.mjs
          node --check tests/partner-tab-visibility-policy.test.mjs
          node --check tests/partner-tab-publication-firestore.test.mjs
          node --check tests/partner-tab-publication-callables.test.mjs
          node --check tests/partner-tab-publication-token.test.mjs
      - name: Eight count-only tabs, Owner permission, partner read and historical preservation
        run: |
          node --test tests/partner-tab-visibility-policy.test.mjs \
            tests/partner-tab-publication-firestore.test.mjs \
            tests/partner-tab-publication-callables.test.mjs \
            tests/partner-tab-publication-token.test.mjs
      - name: Protected original ranking entrypoint is byte-identical to main
        run: |
          git fetch --no-tags --depth=1 origin main
          test "$(git hash-object functions-ranking-approvals/index.js)" = "$(git show FETCH_HEAD:functions-ranking-approvals/index.js | git hash-object --stdin)"
      - name: No live deployment, unchanged original ledgers and finance Rules
        shell: bash
        run: |
          if grep -En 'firebase deploy|httpsCallable\\(' ranking/partner-tab-visibility-policy.mjs tests/partner-tab-visibility-policy.test.mjs; then
            echo 'UNSAFE_LIVE_DEPLOY_REFERENCE'
            exit 1
          fi
          if grep -En 'collection\\("(products|records|recordCorrections|revenueGoals|partnerWorkEntries|partnerWorkCountDays)"\\)|\.delete\\(' functions-partner-tabs/partner-tab-publication-store.mjs; then
            echo 'RECORD_OR_FINANCE_MUTATION_REFERENCE'
            exit 1
          fi
          echo 'NO_DEPLOY_NO_RECORD_WRITE_IN_POLICY'
