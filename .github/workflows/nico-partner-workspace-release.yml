name: NICO partner staffing and count-only workspace release
on:
  pull_request:
    branches: [main]
    paths:
      - 'functions-partner-workspace/**'
      - 'tests/partner-company-code-auth.test.cjs'
      - 'firebase.partner-workspace.json'
      - 'partner-workspace.html'
      - 'tests/partner-workspace.test.cjs'
      - 'tools/hosting/additive-partner-workspace.mjs'
      - '.github/workflows/nico-partner-workspace-release.yml'
  push:
    branches: [main]
    paths:
      - 'functions-partner-workspace/**'
      - 'tests/partner-company-code-auth.test.cjs'
      - 'firebase.partner-workspace.json'
      - 'partner-workspace.html'
      - 'tests/partner-workspace.test.cjs'
      - 'tools/hosting/additive-partner-workspace.mjs'
      - '.github/workflows/nico-partner-workspace-release.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nico-partner-workspace-production
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify new Functions scope, access tests and safe Hosting script
        shell: bash
        run: |
          set -euo pipefail
          node --check functions-partner-workspace/index.js
          node --check functions-partner-workspace/service.cjs
          node --check functions-partner-workspace/company-code-auth.cjs
          node --test tests/partner-company-code-auth.test.cjs
          node --check tools/hosting/additive-partner-workspace.mjs
          node --test tests/partner-workspace.test.cjs
          node --test tests/partner-quick-counts.test.cjs
          node --test tests/partner-company-invitations.test.cjs
          node - <<'NODE'
          const fs=require('node:fs');
          const cfg=JSON.parse(fs.readFileSync('firebase.partner-workspace.json','utf8'));
          if(Object.keys(cfg).join(',')!=='functions'||
             cfg.functions.source!=='functions-partner-workspace'||
             cfg.functions.codebase!=='partner-workspace')throw Error('unsafe_scope');
          const html=fs.readFileSync('partner-workspace.html','utf8');
          if(!html.includes('getPartnerWorkspace')||
             !html.includes('submitPartnerWorkspaceCounts')||
             !html.includes('acceptPartnerWorkspaceInvite')||
             /firebase-firestore\.js|\bgetFirestore\(|\bcollection\(/.test(html))
            throw Error('unapproved browser Firestore access');
          const x=html.match(/<script type="module">([\s\S]*?)<\/script>/)?.[1];
          if(!x)throw Error('module_not_found');
          fs.writeFileSync('/tmp/partner-workspace-module.mjs',x);
          NODE
          node --check /tmp/partner-workspace-module.mjs
          test "$(git hash-object functions/index.js)" = dfb4c48ada6fa89a24c898cd4a2f911bcede822f
          test "$(git hash-object functions-partner-quick/quick-counts.cjs)" = 70b3159aa7a469a69f37dea1288aeb855c982b71
  release:
    needs: validate
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && needs.validate.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FIREBASE_PROJECT_ID: sales-management-cc116
      NICO_PARTNER_RELEASE_CONFIRMATION: CONFIRM_ADD_PARTNER_WORKSPACE_ONLY
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Load protected Firebase identity (never echo credentials)
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${FIREBASE_SERVICE_ACCOUNT_JSON:-}"
          node -e "const fs=require('node:fs');if(JSON.parse(fs.readFileSync('.firebaserc','utf8')).projects.default!=='sales-management-cc116')process.exit(1)"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/partner-workspace-credential.json"
          chmod 600 "$RUNNER_TEMP/partner-workspace-credential.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/partner-workspace-credential.json" >> "$GITHUB_ENV"
      - name: Install isolated dependencies and Firebase CLI
        run: |
          set -euo pipefail
          npm install --prefix functions-partner-workspace --ignore-scripts --package-lock=false
          npm install --prefix functions --ignore-scripts --package-lock=false
          npm install -g firebase-tools@15.34.1
      - name: Wait for verified original invitation and quick-count APIs before any workspace change
        shell: bash
        run: |
          set -euo pipefail
          ready=false
          for attempt in $(seq 1 60); do
            if firebase functions:list --project "$FIREBASE_PROJECT_ID" --json > "$RUNNER_TEMP/partner-workspace-prereq.json"; then
              if FILE="$RUNNER_TEMP/partner-workspace-prereq.json" node <<'NODE'
          const obj=JSON.parse(require('node:fs').readFileSync(process.env.FILE,'utf8'));
          const ids=(Array.isArray(obj.result)?obj.result:[]).map(x=>x.id||x.name||x.function||'');
          for(const n of ['sendMissingReportReminders',
             'createPartnerCompanyInvitation','previewPartnerCompanyInvitation',
             'acceptPartnerCompanyInvitation','submitPartnerQuickCounts','getPartnerQuickCounts'])
            if(!ids.some(x=>x===n||x.endsWith('/'+n)))process.exit(1);
          NODE
              then
                ready=true; break
              fi
            fi
            sleep 10
          done
          if [ "$ready" != true ]; then
            echo 'STOP: existing partner invite/quick count APIs absent; no workspace deployment'
            exit 1
          fi
      - name: Snapshot existing deployed Functions and current Hosting version
        id: workspace_page
        shell: bash
        run: |
          set -euo pipefail
          firebase functions:list --project "$FIREBASE_PROJECT_ID" --json > "$RUNNER_TEMP/partner-workspace-before.json"
          FILE="$RUNNER_TEMP/partner-workspace-before.json" node <<'NODE'
          const a=JSON.parse(require('node:fs').readFileSync(process.env.FILE,'utf8')).result||[];
          const ids=a.map(x=>x.id||x.name||'');
          for(const key of ['createPartnerCompanyInvitation','previewPartnerCompanyInvitation',
            'acceptPartnerCompanyInvitation','getPartnerQuickCounts','submitPartnerQuickCounts']){
            if(!ids.some(s=>s===key||s.endsWith('/'+key)))throw Error('existing_function_missing '+key);
          }
          console.log('Protected existing 5 Functions confirmed.');
          NODE
          status=$(curl --silent --location --output "$RUNNER_TEMP/current-workspace-readonly.html" --write-out '%{http_code}' --max-time 25 https://nico-factory.web.app/partner-workspace.html || true)
          if [ "$status" = 200 ] && cmp -s "$RUNNER_TEMP/current-workspace-readonly.html" partner-workspace.html; then
            echo 'already_live=true' >> "$GITHUB_OUTPUT"
            echo 'PASS: existing workspace page identical to source'
          elif [ "$status" = 200 ] && grep -Fq 'submitPartnerWorkspaceCounts' "$RUNNER_TEMP/current-workspace-readonly.html"; then
            echo 'STOP: unknown workspace page already exists; do not overwrite'
            exit 1
          else
            echo 'already_live=false' >> "$GITHUB_OUTPUT"
            node tools/hosting/additive-partner-workspace.mjs --dry-run
          fi
      - name: Set explicit isolated count-only feature flag
        run: |
          set -euo pipefail
          test ! -e functions-partner-workspace/.env.sales-management-cc116
          printf 'PARTNER_WORKSPACE_ENABLED=enabled\n' > functions-partner-workspace/.env.sales-management-cc116
      - name: Check whether all four partner workspace functions are already live
        id: existing_workspace
        shell: bash
        run: |
          set -euo pipefail
          firebase functions:list --project "$FIREBASE_PROJECT_ID" --json > "$RUNNER_TEMP/existing-partner-workspace.json"
          FILE="$RUNNER_TEMP/existing-partner-workspace.json" node <<'NODE'
          const fs=require('node:fs');
          const j=JSON.parse(fs.readFileSync(process.env.FILE,'utf8'));
          const ids=(j.result||[]).map(x=>x.id||x.name||'');
          const wanted=['getPartnerWorkspace','managePartnerWorkspace',
            'acceptPartnerWorkspaceInvite','submitPartnerWorkspaceCounts'];
          const found=wanted.filter(n=>ids.some(id=>id===n||id.endsWith('/'+n)));
          if(found.length>0 && found.length!==wanted.length)throw Error('PARTIAL_WORKSPACE_DEPLOY_STOP');
          fs.appendFileSync(process.env.GITHUB_OUTPUT,
            'all_live='+(found.length===wanted.length?'true':'false')+'\n');
          console.log(found.length===wanted.length?'REUSE_EXISTING_FOUR_NO_BUILD':'NEW_WORKSPACE_BUILD_REQUIRED');
          NODE
      - name: Deploy only new workspace codebase if missing (no repeated builds)
        if: ${{ steps.existing_workspace.outputs.all_live != 'true' }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          firebase deploy --non-interactive --project "$FIREBASE_PROJECT_ID" \
            --config firebase.partner-workspace.json --only functions:partner-workspace
      # If Firebase CLI returns failure solely on Artifact Registry cleanup,
      # the Functions may still be live. Never infer success from CLI exit status:
      # require all four actual deployments and anonymous auth-denial checks below.
      - name: Reconfirm original and all workspace Functions
        shell: bash
        run: |
          set -euo pipefail
          firebase functions:list --project "$FIREBASE_PROJECT_ID" --json > "$RUNNER_TEMP/partner-workspace-after.json"
          FILE="$RUNNER_TEMP/partner-workspace-after.json" node <<'NODE'
          const a=JSON.parse(require('node:fs').readFileSync(process.env.FILE,'utf8')).result||[];
          const ids=a.map(x=>x.id||x.name||'');
          for(const key of ['createPartnerCompanyInvitation','previewPartnerCompanyInvitation',
            'acceptPartnerCompanyInvitation','getPartnerQuickCounts','submitPartnerQuickCounts',
            'getPartnerWorkspace','managePartnerWorkspace',
            'acceptPartnerWorkspaceInvite','submitPartnerWorkspaceCounts']){
            if(!ids.some(s=>s===key||s.endsWith('/'+key)))throw Error('function_missing '+key);
          }
          console.log('Original and workspace Functions preserved.');
          NODE
      - name: Verify anonymous requests rejected by every new API
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          (async()=>{
            const base='https://asia-northeast1-sales-management-cc116.cloudfunctions.net/';
            for(const key of ['getPartnerWorkspace','managePartnerWorkspace',
              'acceptPartnerWorkspaceInvite','submitPartnerWorkspaceCounts']){
              const r=await fetch(base+key,{method:'POST',
                headers:{'Content-Type':'application/json'},body:JSON.stringify({data:{}})});
              if(![401,403].includes(r.status))throw Error('auth_refusal_missing '+key+' '+r.status);
              console.log('PASS '+key+' '+r.status);
            }
          })().catch(e=>{console.error(e.message);process.exitCode=1});
          NODE
      - name: Add ONLY partner-workspace.html, or reuse exact existing page
        if: ${{ steps.workspace_page.outputs.already_live != 'true' }}
        run: node tools/hosting/additive-partner-workspace.mjs --release
      - name: Verify the exact workspace HTML bytes after release
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --max-time 25 https://nico-factory.web.app/partner-workspace.html > "$RUNNER_TEMP/published-workspace.html"
          cmp -s "$RUNNER_TEMP/published-workspace.html" partner-workspace.html
      - name: Verify actual public page, original app, counts and invite unchanged
        run: |
          set -euo pipefail
          for route in / /partner-invite.html /partner-counts.html /partner-workspace.html; do
            code=$(curl --silent --location --output /dev/null --write-out '%{http_code}' --max-time 25 "https://nico-factory.web.app$route")
            test "$code" = 200
            echo "PASS https://nico-factory.web.app$route HTTP $code"
          done
