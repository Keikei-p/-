name: NICO managed READY backup restore preflight (GET ONLY / NO RESTORE)
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'tools/production/audit-managed-backup-restore-preflight-readonly.mjs'
      - 'tests/managed-backup-restore-preflight-readonly.test.mjs'
      - 'tools/production/inspect-live-firestore-rules-release.mjs'
      - 'tests/inspect-live-firestore-rules-release.test.mjs'
      - '.github/workflows/nico-managed-backup-restore-preflight-readonly.yml'
  push:
    branches: [main]
    paths:
      - 'tools/production/audit-managed-backup-restore-preflight-readonly.mjs'
      - 'tests/managed-backup-restore-preflight-readonly.test.mjs'
      - 'tools/production/inspect-live-firestore-rules-release.mjs'
      - 'tests/inspect-live-firestore-rules-release.test.mjs'
      - '.github/workflows/nico-managed-backup-restore-preflight-readonly.yml'
permissions:
  contents: read
concurrency:
  group: nico-managed-backup-restore-metadata-get-only
  cancel-in-progress: false
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Lock existing production and restore-code sources, run all preflight tests
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object firestore.rules)" = d9f4df6a2ac0f8b5720534a2461ec66b94379190
          test "$(git hash-object tools/production/inspect-firestore-backups-readonly.mjs)" = 8016a0501a309ff52a002f34bed53832658d2ffb
          test "$(git hash-object tools/readonly-backup/restore-emulator.mjs)" = 638bd79ed31ad28e7298d8ed2e6927730ec129b1
          node --check tools/production/audit-managed-backup-restore-preflight-readonly.mjs
          node --check tools/production/inspect-live-firestore-rules-release.mjs
          node --test tests/managed-backup-restore-preflight-readonly.test.mjs tests/inspect-live-firestore-rules-release.test.mjs
          git diff --exit-code -- firestore.rules firebase.json index.html functions functions-partner-workspace
  live-get-only:
    needs: offline
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' &&
      github.repository == 'Keikei-p/-' && needs.offline.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 13
    env:
      FIREBASE_PROJECT_ID: sales-management-cc116
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Pin exact main and deny any production restore mutation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_SHA" = "$(git rev-parse HEAD)"
          test "$GITHUB_SHA" = "$(gh api repos/Keikei-p/-/branches/main --jq '.commit.sha')"
          test "$FIREBASE_PROJECT_ID" = sales-management-cc116
          test "$(git hash-object firestore.rules)" = d9f4df6a2ac0f8b5720534a2461ec66b94379190
          test "$(git hash-object tools/readonly-backup/restore-emulator.mjs)" = 638bd79ed31ad28e7298d8ed2e6927730ec129b1
          node --test tests/managed-backup-restore-preflight-readonly.test.mjs tests/inspect-live-firestore-rules-release.test.mjs
      - name: Install only existing Firebase Admin identity dependency
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix functions --ignore-scripts --package-lock=false --no-audit --no-fund
      - name: Bind existing read identity in temporary file
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          test -n "$FIREBASE_SERVICE_ACCOUNT_JSON"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/nico-backup-preflight-identity.private.json"
          chmod 600 "$RUNNER_TEMP/nico-backup-preflight-identity.private.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/nico-backup-preflight-identity.private.json" >> "$GITHUB_ENV"
      - name: GET verified live Rules release before backup inspection (NO APPLY)
        shell: bash
        run: |
          set -euo pipefail
          node tools/production/inspect-live-firestore-rules-release.mjs
          echo 'PRODUCTION_RULES_WRITES=0'
          echo 'REAL_PARTNER_ACCOUNT_FINANCE_GET_LIST_UNPROVEN=YES'
      - name: GET current default DB UID and READY backup metadata only, NO RESTORE
        shell: bash
        run: |
          set -euo pipefail
          node tools/production/audit-managed-backup-restore-preflight-readonly.mjs
      - name: Destroy temporary identity; do not upload backup identities or documents
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/nico-backup-preflight-identity.private.json"
