name: NICO Owner correction API collision and release inventory (READ-ONLY / NO DEPLOY)
on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/production/inspect-owner-correction-function-inventory.mjs'
      - 'tests/owner-correction-release-inventory.test.mjs'
      - 'functions-partner-workspace/index.js'
      - 'functions-partner-workspace/service.cjs'
      - 'firebase.*.json'
      - '.github/workflows/nico-owner-correction-release-inventory-no-deploy.yml'
permissions:
  contents: read
jobs:
  source-scope-and-collisions:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GOOGLE_APPLICATION_CREDENTIALS: ''
      FIREBASE_SERVICE_ACCOUNT_JSON: ''
      FIREBASE_TOKEN: ''
      GCLOUD_PROJECT: demo-nico-owner-inventory
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Reject production identity; syntax-only API inventory and offline fixture tests
        shell: bash
        run: |
          set -euo pipefail
          test -z "$GOOGLE_APPLICATION_CREDENTIALS"
          test -z "$FIREBASE_SERVICE_ACCOUNT_JSON"
          test -z "$FIREBASE_TOKEN"
          node --check tools/production/inspect-owner-correction-function-inventory.mjs
          node --check tests/owner-correction-release-inventory.test.mjs
          node --test tests/owner-correction-release-inventory.test.mjs
      - name: Print ONLY source names, owner collision status, finance cutover blockers
        shell: bash
        run: |
          set -euo pipefail
          node tools/production/inspect-owner-correction-function-inventory.mjs
          echo 'RELEASE_INVENTORY_SOURCE_ONLY_PASS_NO_FIREBASE_CREDENTIALS'
