name: NICO four-collection finance diagnostic candidate (STAGING ONLY / NO DEPLOY)
on:
  pull_request:
    branches: [main]
    paths:
      - 'staging/finance-diagnostic-v2/build-candidate.mjs'
      - 'tests/finance-diagnostic-four-collections-staging.test.mjs'
      - '.github/workflows/nico-finance-diagnostic-v2-staging.yml'
  push:
    branches: [main]
    paths:
      - 'staging/finance-diagnostic-v2/build-candidate.mjs'
      - 'tests/finance-diagnostic-four-collections-staging.test.mjs'
      - '.github/workflows/nico-finance-diagnostic-v2-staging.yml'
permissions:
  contents: read
jobs:
  offline-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Freeze all original production app and Rules assets
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object finance-boundary-check.html)" = "7fa664efb17f6d3337e9403498aa8c0857b35be5"
          test "$(git hash-object firestore.rules)" = "d9f4df6a2ac0f8b5720534a2461ec66b94379190"
          test "$(git hash-object index.html)" = "88ef5636bfe9254e71f2109d452b6d3049f99861"
          test "$(git hash-object functions/index.js)" = "dfb4c48ada6fa89a24c898cd4a2f911bcede822f"
          test "$(git hash-object functions-partner-workspace/index.js)" = "38da7e9174ffea7c406c92292dccfc651b565eb0"
      - name: Verify the read-only candidate and historical direct-partner diagnostic
        shell: bash
        run: |
          set -euo pipefail
          node --check staging/finance-diagnostic-v2/build-candidate.mjs
          node --test tests/finance-diagnostic-four-collections-staging.test.mjs
          node --test tests/finance-boundary-ondevice.test.mjs
          node staging/finance-diagnostic-v2/build-candidate.mjs --check
          echo 'PASS: staging only, no production deploy, no accounts or sales modified'
