name: NICO one-shot sequenced partner production activation
# Recovery attempt C: only exact already-published HTML is reused; never overwrites an unknown live file.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/nico-partner-full-sequenced-once.yml
permissions:
  contents: read
  actions: write
concurrency:
  group: nico-partner-full-sequenced-once
  cancel-in-progress: false
jobs:
  activate:
    if: >-
      ${{ github.repository == 'Keikei-p/-' &&
          github.actor == 'Keikei-p' &&
          startsWith(github.event.head_commit.message,
           'release: start reviewed isolated partner workflows once') }}
    runs-on: ubuntu-latest
    timeout-minutes: 105
    steps:
      - name: Confirm canonical original page, public invite and exact commit
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$EXPECTED_SHA" != ""
          test "$(gh api repos/Keikei-p/-/branches/main --jq '.commit.sha')" = "$EXPECTED_SHA"
          curl -fsSL --max-time 30 https://nico-factory.web.app/ > "$RUNNER_TEMP/original.html"
          grep -Fq '営業実績管理' "$RUNNER_TEMP/original.html"
          curl -fsSL --max-time 30 https://nico-factory.web.app/partner-invite.html > "$RUNNER_TEMP/partner-invite.html"
          grep -Fq 'createPartnerCompanyInvitation' "$RUNNER_TEMP/partner-invite.html"
          echo "Verified existing app and independently deployed invitation route."
      - name: Launch original isolated workflows strictly in dependency order
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          repo='Keikei-p/-'
          function launch_and_wait() {
            local workflow="$1"
            local prev run i
            prev=$(gh api "repos/$repo/actions/workflows/$workflow/runs?event=workflow_dispatch&branch=main&per_page=10" \
              --jq '[.workflow_runs[].id] | max // 0')
            gh workflow run "$workflow" --repo "$repo" --ref main
            run=""
            for i in $(seq 1 50); do
              run=$(gh api "repos/$repo/actions/workflows/$workflow/runs?event=workflow_dispatch&branch=main&per_page=20" \
                --jq ".workflow_runs | map(select(.id > $prev and .head_sha == \"$EXPECTED_SHA\")) | sort_by(.id) | last | .id // empty")
              test -n "$run" && break
              sleep 8
            done
            if [ -z "$run" ]; then echo "STOP: dispatch not observed for $workflow"; exit 1; fi
            echo "RUN $workflow $run"
            gh run watch "$run" --repo "$repo" --exit-status
            test "$(gh run view "$run" --repo "$repo" --json conclusion --jq .conclusion)" = "success" || exit 1
            echo "SUCCESS $workflow $run"
          }
          launch_and_wait 'nico-partner-quick-release.yml'
          curl -fsSL --retry 3 --max-time 30 https://nico-factory.web.app/partner-counts.html > "$RUNNER_TEMP/partner-counts.html"
          grep -Fq 'submitPartnerQuickCounts' "$RUNNER_TEMP/partner-counts.html"
          grep -Fq 'getPartnerQuickCounts' "$RUNNER_TEMP/partner-counts.html"
          launch_and_wait 'nico-partner-workspace-release.yml'
          curl -fsSL --retry 3 --max-time 30 https://nico-factory.web.app/partner-workspace.html > "$RUNNER_TEMP/partner-workspace.html"
          grep -Fq 'submitPartnerWorkspaceCounts' "$RUNNER_TEMP/partner-workspace.html"
          grep -Fq 'managePartnerWorkspace' "$RUNNER_TEMP/partner-workspace.html"
          launch_and_wait 'nico-ranking-index-only-release.yml'
          curl -fsSL --retry 3 --max-time 30 https://nico-factory.web.app/ > "$RUNNER_TEMP/released-index.html"
          grep -Fq '営業実績管理' "$RUNNER_TEMP/released-index.html"
          grep -Fq 'partnerInviteInline' "$RUNNER_TEMP/released-index.html"
          grep -Fq 'mergedPartnerRankingDay' "$RUNNER_TEMP/released-index.html"
          echo 'PASS: all 3 gated workflows completed; original dashboard plus partner routes verified'
      - name: Independently verify all four public pages and denied anonymous partner API
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          (async()=>{
            const origin='https://nico-factory.web.app';
            const pages={'/':'営業実績管理',
              '/partner-invite.html':'createPartnerCompanyInvitation',
              '/partner-counts.html':'getPartnerQuickCounts',
              '/partner-workspace.html':'submitPartnerWorkspaceCounts'};
            for(const [page,marker] of Object.entries(pages)){
              const r=await fetch(origin+page,{cache:'no-store'});
              if(r.status!==200||!(await r.text()).includes(marker))
                throw Error('Missing confirmed page '+page);
              console.log('PAGE_PASS '+page);
            }
            for(const name of ['getPartnerQuickCounts','submitPartnerQuickCounts',
              'getPartnerWorkspace','managePartnerWorkspace',
              'acceptPartnerWorkspaceInvite','submitPartnerWorkspaceCounts']){
              const response=await fetch('https://asia-northeast1-sales-management-cc116.cloudfunctions.net/'+name,
               {method:'POST',headers:{'Content-Type':'application/json'},body:'{"data":{}}'});
              if(![401,403].includes(response.status))throw Error('Anonymous API exposure '+name);
              console.log('API_DENY_PASS '+name);
            }
          })().catch(e=>{console.error(e);process.exitCode=1});
          NODE
