name: NICO Owner ON-only shared count rankings, zero-setup regressions (NO DEPLOY)
on:
  pull_request:
    branches: [main]
    paths:
      - 'ranking/zero-setup-count-linker.mjs'
      - 'ranking/canonical-joint-count-sku-reader.mjs'
      - 'ranking/canonical-owner-count-server-factory.mjs'
      - 'ranking/owner-product-visibility-in-atomic-tx.mjs'
      - 'ranking/owner-visible-count-atomic-loader.mjs'
      - 'ranking/owner-visible-count-server-handler.mjs'
      - 'functions-ranking-approvals/index.js'
      - 'functions-ranking-approvals/ranking/zero-setup-count-linker.mjs'
      - 'functions-ranking-approvals/ranking/canonical-joint-count-sku-reader.mjs'
      - 'functions-ranking-approvals/ranking/canonical-owner-count-server-factory.mjs'
      - 'functions-ranking-approvals/ranking/owner-product-visibility-in-atomic-tx.mjs'
      - 'functions-ranking-approvals/ranking/owner-visible-count-atomic-loader.mjs'
      - 'functions-ranking-approvals/ranking/owner-visible-count-server-handler.mjs'
      - 'tests/zero-setup-count-linker.test.mjs'
      - 'tests/zero-setup-count-publication-read-gate.test.mjs'
      - 'tests/canonical-joint-count-sku-reader.test.mjs'
      - 'tests/owner-visible-count-server-handler.test.mjs'
      - '.github/workflows/nico-zero-setup-shared-count-rankings.yml'
  push:
    branches: [main]
    paths:
      - 'ranking/zero-setup-count-linker.mjs'
      - 'ranking/canonical-joint-count-sku-reader.mjs'
      - 'ranking/canonical-owner-count-server-factory.mjs'
      - 'ranking/owner-product-visibility-in-atomic-tx.mjs'
      - 'ranking/owner-visible-count-atomic-loader.mjs'
      - 'ranking/owner-visible-count-server-handler.mjs'
      - 'functions-ranking-approvals/index.js'
      - 'functions-ranking-approvals/ranking/**'
      - 'tests/zero-setup-count-linker.test.mjs'
      - 'tests/zero-setup-count-publication-read-gate.test.mjs'
      - 'tests/canonical-joint-count-sku-reader.test.mjs'
      - 'tests/owner-visible-count-server-handler.test.mjs'
      - '.github/workflows/nico-zero-setup-shared-count-rankings.yml'
permissions:
  contents: read
jobs:
  no-new-setup-and-no-production-writes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOOGLE_APPLICATION_CREDENTIALS: ''
      FIREBASE_SERVICE_ACCOUNT_JSON: ''
      FIREBASE_TOKEN: ''
      NICO_JOINT_COUNT_RANKING_ENABLED: disabled
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Owner ON-only canonical Function routing stays finance-gated and original zero-setup helpers are mirrored
        shell: bash
        run: |
          set -euo pipefail
          test -z "$GOOGLE_APPLICATION_CREDENTIALS"
          test -z "$FIREBASE_SERVICE_ACCOUNT_JSON"
          test -z "$FIREBASE_TOKEN"
          test "$NICO_JOINT_COUNT_RANKING_ENABLED" = disabled
          grep -Fq 'process.env.NICO_JOINT_COUNT_RANKING_ENABLED==="enabled"' functions-ranking-approvals/index.js
          # The integrated route is OFF unless all three server-owned gates are enabled.
          # Auto-SKU matching does not grant an unrestricted publication shortcut:
          # the atomic Owner ON/OFF selection and published partner tab must both pass.
          grep -Fq 'process.env.NICO_JOINT_ZERO_SETUP_COUNT_LINK_ENABLED==="enabled"' functions-ranking-approvals/index.js
          grep -Fq 'process.env.NICO_PARTNER_TAB_SERVER_GUARD_VERIFIED==="enabled"' functions-ranking-approvals/index.js
          grep -Fq 'zeroSetupLink:process.env.NICO_JOINT_ZERO_SETUP_COUNT_LINK_ENABLED==="enabled"' functions-ranking-approvals/index.js
          grep -Fq 'publishedOnly:true' functions-ranking-approvals/index.js
          grep -Fq 'enforcePartnerTabPublication:true' functions-ranking-approvals/index.js
          grep -Fq 'const enforceOwnerSelection=zeroSetupLink===true&&' ranking/canonical-owner-count-server-factory.mjs
          grep -Fq 'enforcePartnerTabPublication===true;' ranking/canonical-owner-count-server-factory.mjs
          grep -Fq 'createAtomicOwnerPublicationReader({db,FieldValue,verifyCountViewer,includeHistoricalGroups:enforceOwnerSelection})' ranking/canonical-owner-count-server-factory.mjs
          grep -Fq 'buildOwnerVisibleCountRanking({input:rankingInput,publication})' ranking/owner-visible-count-server-handler.mjs
          if grep -Fq 'zeroSetupLink:true' functions-ranking-approvals/index.js; then
            echo 'STOP_RANKING_MUST_OBEY_OWNER_ON_OFF'; exit 1
          fi
          for f in zero-setup-count-linker canonical-joint-count-sku-reader canonical-owner-count-server-factory owner-visible-count-server-handler owner-visible-count-atomic-loader owner-product-visibility-in-atomic-tx historical-count-publication-groups; do
            cmp "ranking/$f.mjs" "functions-ranking-approvals/ranking/$f.mjs"
            node --check "ranking/$f.mjs"
            node --check "functions-ranking-approvals/ranking/$f.mjs"
          done
          node --check functions-ranking-approvals/index.js
          echo 'SAME_COUNT_SOURCE_USED_IN_OWNER_AND_PARTNER_NO_DEPLOY'
      - name: Optional historical zero-setup helper regression plus reviewed Owner ON-only mapping and finance controls
        run: |
          set -euo pipefail
          node --test tests/zero-setup-count-linker.test.mjs \
            tests/zero-setup-count-publication-read-gate.test.mjs \
            tests/owner-visible-count-atomic-loader.test.mjs \
            tests/canonical-owner-count-server-factory.test.mjs \
            tests/canonical-joint-count-sku-reader.test.mjs \
            tests/owner-visible-count-server-handler.test.mjs \
            tests/verified-dual-count-dashboards.test.mjs \
            tests/verified-inline-joint-ranking-cards.test.mjs \
            tests/owner-product-visibility-rankings.test.mjs \
            tests/partner-workspace-count-source.test.mjs
          echo 'OWNER_ON_ONLY_COUNT_RANKINGS_PASS_ZERO_SETUP_HELPER_STILL_TESTED_NO_PRODUCTION_DEPLOY'
