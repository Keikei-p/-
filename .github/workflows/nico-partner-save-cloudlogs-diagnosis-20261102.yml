name: NICO partner count-save Cloud Run diagnosis (READ ONLY)
on:
  push:
    branches: [diagnose/partner-count-save-cloudlogs-20261102]
    paths: [.github/workflows/nico-partner-save-cloudlogs-diagnosis-20261102.yml]
permissions:
  contents: read
jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Load protected diagnostic service credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          test -n "$FIREBASE_SERVICE_ACCOUNT_JSON" || { echo STOP_CREDENTIALS_UNAVAILABLE; exit 1; }
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/nico-diagnostic.json"
          chmod 600 "$RUNNER_TEMP/nico-diagnostic.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/nico-diagnostic.json" >> "$GITHUB_ENV"
      - name: Classify recent count-save errors without user fields
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix functions --ignore-scripts --package-lock=false --no-audit --no-fund
          node --input-type=module <<'NODE'
          import {createRequire} from 'node:module';
          const require=createRequire(process.cwd()+'/functions/package.json');
          const token=(await require('firebase-admin/app').applicationDefault().getAccessToken()).access_token;
          const url='https://logging.googleapis.com/v2/entries:list';
          const payload={resourceNames:['projects/sales-management-cc116'],
            filter:'resource.type="cloud_run_revision" AND resource.labels.service_name="submitpartnerworkspacecounts" AND timestamp>="2026-11-02T11:25:00Z" AND timestamp<="2026-11-02T12:30:00Z"',
            orderBy:'timestamp desc',pageSize:250};
          let total=0,page='',calls=0;
          const severity={},httpStatus={},minute={},classCounts={};
          const patterns=[
            ['auth','unauthenticated|authentication|invalid token|id token|email verification'],
            ['permission','permission.denied|insufficient permissions|missing or insufficient permissions'],
            ['precondition','failed.precondition|precondition|source|summary'],
            ['invalid_argument','invalid.argument|invalid data|validation'],
            ['aborted','aborted|transaction contention|transaction retry'],
            ['server_internal','internal|unhandled error|function execution failed'],
            ['db_transaction','firestore|transaction|reads before writes'],
            ['resource_exhausted','resource.exhausted|quota'],
            ['unavailable','unavailable|deadline.exceeded|timeout'],
            ['type_error','typeerror|cannot read properties|is not a function']
          ];
          do{
            const response=await fetch(url,{method:'POST',
              headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},
              body:JSON.stringify(Object.assign({},payload,page?{pageToken:page}:{}))});
            if(!response.ok){console.log('READ_ONLY_LOG_HTTP_STATUS',response.status);process.exit(0);}
            const data=await response.json();
            for(const entry of data.entries||[]){
              total++;
              severity[entry.severity||'DEFAULT']=(severity[entry.severity||'DEFAULT']||0)+1;
              const status=entry.httpRequest?.status||'none';
              httpStatus[status]=(httpStatus[status]||0)+1;
              const m=typeof entry.timestamp==='string'?entry.timestamp.slice(0,16):'unknown';
              minute[m]=(minute[m]||0)+1;
              const raw=JSON.stringify({text:entry.textPayload,structured:entry.jsonPayload}).toLowerCase();
              let key='unknown';for(const [label,re] of patterns)if(new RegExp(re,'i').test(raw)){key=label;break;}
              classCounts[key]=(classCounts[key]||0)+1;
            }
            page=data.nextPageToken||'';calls++;
          }while(page&&calls<4);
          console.log('LOG_DIAGNOSTIC_COUNT',total,'PAGES',calls,'PAGINATION_INCOMPLETE',!!page);
          console.log('LOG_SEVERITIES',JSON.stringify(severity));
          console.log('HTTP_STATUS_COUNTS',JSON.stringify(httpStatus));
          console.log('ERROR_CLASS_COUNTS',JSON.stringify(classCounts));
          console.log('REQUEST_MINUTE_COUNTS',JSON.stringify(minute));
          console.log('NO_RAW_LOGS_NO_IP_NO_EMAIL_NO_UID_NO_COUNT_DATA_EXPOSED');
          NODE
      - name: Remove temporary key
        if: always()
        run: rm -f "$RUNNER_TEMP/nico-diagnostic.json"
