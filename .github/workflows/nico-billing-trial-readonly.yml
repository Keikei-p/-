name: NICO sales project billing and trial guard (READ ONLY / NO DEPLOY)
on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/production/inspect-project-billing-readonly.mjs'
      - 'tests/inspect-project-billing-readonly.test.mjs'
      - '.github/workflows/nico-billing-trial-readonly.yml'
  push:
    branches: [main]
    paths:
      - 'tools/production/inspect-project-billing-readonly.mjs'
      - 'tests/inspect-project-billing-readonly.test.mjs'
      - '.github/workflows/nico-billing-trial-readonly.yml'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: nico-billing-trial-get-only
  cancel-in-progress: false
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Validate strict GET-only billing check and frozen production data
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/production/inspect-project-billing-readonly.mjs
          node --test tests/inspect-project-billing-readonly.test.mjs
          test "$(git hash-object firestore.rules)" = 'd9f4df6a2ac0f8b5720534a2461ec66b94379190'
          test "$(git hash-object functions/index.js)" = 'dfb4c48ada6fa89a24c898cd4a2f911bcede822f'
          test "$(git hash-object functions-partner-workspace/index.js)" = '38da7e9174ffea7c406c92292dccfc651b565eb0'
          test "$(git hash-object index.html)" = '88ef5636bfe9254e71f2109d452b6d3049f99861'
  live-get-only:
    needs: offline
    if: >-
      ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
        github.ref == 'refs/heads/main' &&
        github.repository == 'Keikei-p/-' &&
        needs.offline.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      FIREBASE_PROJECT_ID: sales-management-cc116
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Freeze source and correct project before obtaining audit credential
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_SHA" = "$(git rev-parse HEAD)"
          test "$(git hash-object firestore.rules)" = 'd9f4df6a2ac0f8b5720534a2461ec66b94379190'
          test "$(git hash-object functions/index.js)" = 'dfb4c48ada6fa89a24c898cd4a2f911bcede822f'
          node --test tests/inspect-project-billing-readonly.test.mjs
      - name: Install existing Firebase OAuth dependency only
        run: npm install --prefix functions --ignore-scripts --package-lock=false --no-audit --no-fund
      - name: Supply existing audit identity, never print or save as artifact
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          test -n "$FIREBASE_SERVICE_ACCOUNT_JSON"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/nico-billing-metadata.private.json"
          chmod 600 "$RUNNER_TEMP/nico-billing-metadata.private.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/nico-billing-metadata.private.json" >> "$GITHUB_ENV"
      - name: GET exactly one project billing metadata record; NEVER authorize deploy
        shell: bash
        run: |
          set -euo pipefail
          result=0
          node tools/production/inspect-project-billing-readonly.mjs > "$RUNNER_TEMP/nico-billing-status.private.log" 2>&1 || result=$?
          grep -E '^(NICO_BILLING_METADATA_SAFE |BLOCK_RECURRING_CHARGES_NOT_GUARANTEED$|STOP_NICO_BILLING_READONLY_[A-Z0-9_]+$)' "$RUNNER_TEMP/nico-billing-status.private.log" || true
          test "$result" -eq 0
          grep -q '^NICO_BILLING_METADATA_SAFE ' "$RUNNER_TEMP/nico-billing-status.private.log"
          grep '^NICO_BILLING_METADATA_SAFE ' "$RUNNER_TEMP/nico-billing-status.private.log" | grep -q '"releaseCostGatePassed":false'
          echo 'NICO_BILLING_INFO_READ_ONLY_TRIAL_BALANCE_UNVERIFIED'
      - name: Erase all private credentials and metadata, never publish artifacts
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/nico-billing-metadata.private.json" "$RUNNER_TEMP/nico-billing-status.private.log"
