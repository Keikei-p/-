name: NICO one-shot production inventory isolated restore (READ ONLY)
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/nico-one-shot-isolated-restore-verify-20261107.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/nico-one-shot-isolated-restore-verify-20261107.yml'

permissions:
  contents: read

concurrency:
  group: nico-sales-full-inventory-readonly-verify-20261107
  cancel-in-progress: false

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify fixed project, frozen live apply and read-only restore contract
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/production/release-partner-boundary.mjs
          node --check tools/readonly-backup/restore-emulator.mjs
          node --test tests/legacy-rules-apply-frozen.test.mjs tests/partner-boundary-release.test.mjs
          node --test tools/readonly-backup/backup.test.mjs tests/nico-one-shot-hashpin-20261107.test.mjs
          # Freeze the exact audited READ-ONLY inventory/restore implementation.
          # Any production-writer or even innocuous source revision stops live reads
          # until independently reviewed and the frozen blob IDs are updated.
          test "$(git hash-object tools/production/release-partner-boundary.mjs)" = 038c4c0f6732232f1e751b6011cc5cb2cc4fd142
          test "$(git hash-object tools/readonly-backup/backup.mjs)" = a7f21e94857a0e515655b99a725382974646dad7
          test "$(git hash-object tools/readonly-backup/restore-emulator.mjs)" = 638bd79ed31ad28e7298d8ed2e6927730ec129b1
          test "$(git hash-object tools/production/inspect-firestore-backups-readonly.mjs)" = 8016a0501a309ff52a002f34bed53832658d2ffb
          node -e "const f=require('fs');if(JSON.parse(f.readFileSync('.firebaserc','utf8')).projects.default!=='sales-management-cc116') process.exit(1)"

  live-isolated-restore:
    needs: offline
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.offline.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      FIREBASE_PROJECT_ID: sales-management-cc116
      NICO_USAGE_APPROVAL: EXISTING_FUNCTIONS_AND_FULL_INVENTORY_APPROVED
      NICO_RULES_APPROVAL: VERIFY_ONLY
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - name: Reject unknown checkout or an unfrozen Rules writer
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "${{ github.repository }}" = 'Keikei-p/-'
          test "${{ github.ref }}" = 'refs/heads/main'
          test "${{ github.sha }}" = "$(git rev-parse HEAD)"
          # Do not scan while another commit is replacing the reviewed code.
          test "$GITHUB_SHA" = "$(gh api repos/Keikei-p/-/branches/main --jq .commit.sha)"
          test "$(git hash-object tools/production/release-partner-boundary.mjs)" = 038c4c0f6732232f1e751b6011cc5cb2cc4fd142
          test "$(git hash-object tools/readonly-backup/backup.mjs)" = a7f21e94857a0e515655b99a725382974646dad7
          test "$(git hash-object tools/readonly-backup/restore-emulator.mjs)" = 638bd79ed31ad28e7298d8ed2e6927730ec129b1
          test "$(git hash-object tools/production/inspect-firestore-backups-readonly.mjs)" = 8016a0501a309ff52a002f34bed53832658d2ffb
          node --test tests/legacy-rules-apply-frozen.test.mjs
          node -e "const f=require('fs');if(JSON.parse(f.readFileSync('.firebaserc','utf8')).projects.default!=='sales-management-cc116') process.exit(1)"
      - name: Install existing local emulator and admin dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix functions --ignore-scripts --package-lock=false --no-audit --no-fund
          npm install --global firebase-tools@15.34.1 --no-audit --no-fund
      - name: Configure existing read-only inventory identity
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          test -n "${FIREBASE_SERVICE_ACCOUNT_JSON:-}"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/nico-one-shot-readonly.json"
          chmod 600 "$RUNNER_TEMP/nico-one-shot-readonly.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/nico-one-shot-readonly.json" >> "$GITHUB_ENV"
      - name: Verify recent READY metadata, capped live inventory, local emulator restore and stable original
        shell: bash
        run: |
          set -euo pipefail
          # Only the EXISTING verify mode is executable. Live Firestore requests
          # are GET-only. Local emulator writes never touch production.
          # Production data and credentials remain in ephemeral private files.
          # NOTE: this restores a fresh live read-only inventory to localhost,
          # NOT the actual managed READY backup payload, and NOT Auth/Storage.
          # The immutable collector caps the scan at 10,000 documents and
          # refuses incomplete snapshots rather than silently skipping records.
          result=0
          firebase emulators:exec --project demo-sales-restore --only firestore \
            "node tools/production/release-partner-boundary.mjs verify" \
            > "$RUNNER_TEMP/nico-one-shot-private.log" 2>&1 || result=$?
          grep -E '^(STOP_[A-Z0-9_]+$|PARTNER_BOUNDARY_(CHECK|RESULT) )' \
            "$RUNNER_TEMP/nico-one-shot-private.log" || true
          test "$result" = 0
          # A success must explicitly confirm verification, never deployment.
          grep -q 'PARTNER_BOUNDARY_RESULT ' "$RUNNER_TEMP/nico-one-shot-private.log"
          grep '^PARTNER_BOUNDARY_RESULT ' "$RUNNER_TEMP/nico-one-shot-private.log" \
            | grep -q '"applied":false'
      - name: Delete service identity and local records, do not upload artifacts
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/nico-one-shot-readonly.json" "$RUNNER_TEMP/nico-one-shot-private.log"
          rm -f firestore-debug.log firebase-debug.log ui-debug.log
