name: NICO reviewed one-time four count Functions dispatcher (no direct deploy)
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/nico-four-count-one-shot-dispatch-20261108.yml'
      - 'tests/nico-four-count-one-shot-dispatch.test.mjs'
  push:
    branches: [main]
    paths:
      - '.github/workflows/nico-four-count-one-shot-dispatch-20261108.yml'
permissions:
  contents: read
concurrency:
  group: nico-four-count-one-shot-20261108
  cancel-in-progress: false
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Run dispatch and protected count Function scope tests
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/nico-four-count-one-shot-dispatch.test.mjs
          node --test tests/partner-four-function-release-scope.test.mjs tests/protect-original-functions-versions.test.mjs tests/partner-workspace.test.cjs
          node tools/production/partner-four-function-release-scope.mjs
          test "$(git hash-object firestore.rules)" = 'd9f4df6a2ac0f8b5720534a2461ec66b94379190'
          test "$(git hash-object functions/index.js)" = 'dfb4c48ada6fa89a24c898cd4a2f911bcede822f'
          test "$(git hash-object functions-partner-workspace/index.js)" = '38da7e9174ffea7c406c92292dccfc651b565eb0'
          test "$(git hash-object functions-partner-workspace/service.cjs)" = 'b94a6aba231dc2569009580a178297a5b6194bda'
          test "$(git hash-object firebase.partner-workspace.json)" = 'a6ceedec5fab4e22e0a8efe19c685716a2db9750'
  dispatch-once:
    needs: offline
    if: >-
      ${{ github.event_name == 'push' &&
          github.repository == 'Keikei-p/-' &&
          github.ref == 'refs/heads/main' &&
          startsWith(github.event.head_commit.message, 'release: dispatch four guarded count Functions once 20261108') &&
          needs.offline.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 65
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Require exact latest main and unchanged original finance and count code
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_SHA" = "$(git rev-parse HEAD)"
          test "$GITHUB_SHA" = "$(gh api repos/Keikei-p/-/branches/main --jq '.commit.sha')"
          test "$(git hash-object firestore.rules)" = 'd9f4df6a2ac0f8b5720534a2461ec66b94379190'
          test "$(git hash-object functions/index.js)" = 'dfb4c48ada6fa89a24c898cd4a2f911bcede822f'
          test "$(git hash-object functions-partner-workspace/index.js)" = '38da7e9174ffea7c406c92292dccfc651b565eb0'
          test "$(git hash-object functions-partner-workspace/service.cjs)" = 'b94a6aba231dc2569009580a178297a5b6194bda'
          test "$(git hash-object firebase.partner-workspace.json)" = 'a6ceedec5fab4e22e0a8efe19c685716a2db9750'
          node tools/production/partner-four-function-release-scope.mjs
      - name: Dispatch only the existing four-Functions manual-approval release and verify it
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo='Keikei-p/-'
          workflow='nico-partner-four-count-functions-manual.yml'
          path="repos/$repo/actions/workflows/$workflow/runs?event=workflow_dispatch&branch=main&per_page=30"
          before="$(gh api "$path" --jq '[.workflow_runs[].id] | max // 0')"
          test "$GITHUB_SHA" = "$(gh api repos/$repo/branches/main --jq '.commit.sha')"
          gh workflow run "$workflow" --repo "$repo" --ref main \
            -f reviewed_main_sha="$GITHUB_SHA" \
            -f deployment_approval=CONFIRM_FOUR_COUNT_FUNCTIONS_ONLY \
            -f usage_approval=FUNCTION_BUILDS_AND_POSSIBLE_CHARGES_EXPLICITLY_APPROVED \
            -f rules_approval=NO_FIRESTORE_RULES_CHANGES
          observed=''
          for i in $(seq 1 40); do
            observed="$(gh api "$path" --jq ".workflow_runs | map(select(.id > $before and .head_sha == \"$GITHUB_SHA\")) | sort_by(.id) | last | .id // empty")"
            if [ -n "$observed" ]; then break; fi
            sleep 5
          done
          if [ -z "$observed" ]; then echo 'BLOCK_SCOPED_DISPATCH_NOT_OBSERVED'; exit 1; fi
          echo "GUARDED_FOUR_DEPLOY_RUN=$observed"
          gh run watch "$observed" --repo "$repo" --exit-status
          test "$(gh run view "$observed" --repo "$repo" --json conclusion --jq .conclusion)" = 'success' || \
            { echo 'BLOCK_GUARDED_FOUR_DEPLOY_NOT_VERIFIED'; exit 1; }
          echo 'GUARDED_FOUR_DEPLOY_AND_ORIGINAL_FUNCTION_PRESERVATION_VERIFIED'
          echo 'REAL_PARTNER_COUNT_INPUT_AND_FINANCE_DENIAL_NOT_YET_VERIFIED'
