name: NICO original partner invite and quick-count Function prerequisites (GET ONLY)
on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/production/inspect-original-partner-functions-readonly.mjs'
      - 'tests/inspect-original-partner-functions-readonly.test.mjs'
      - 'tools/production/protect-original-functions-versions.mjs'
      - 'tests/protect-original-functions-versions.test.mjs'
      - '.github/workflows/nico-original-partner-functions-audit.yml'
  push:
    branches: [main]
    paths:
      - 'tools/production/inspect-original-partner-functions-readonly.mjs'
      - 'tests/inspect-original-partner-functions-readonly.test.mjs'
      - 'tools/production/protect-original-functions-versions.mjs'
      - 'tests/protect-original-functions-versions.test.mjs'
      - '.github/workflows/nico-original-partner-functions-audit.yml'
  # Safe manual recheck from GitHub Actions (mobile friendly): GET only, no deploy.
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: nico-original-partner-functions-readonly
  cancel-in-progress: false
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Test original invite / quick count / LINE metadata inventory
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/production/inspect-original-partner-functions-readonly.mjs
          node --test tests/inspect-original-partner-functions-readonly.test.mjs tests/protect-original-functions-versions.test.mjs
          node --test tests/partner-four-function-release-scope.test.mjs tests/partner-workspace.test.cjs
          test "$(git hash-object firestore.rules)" = 'd9f4df6a2ac0f8b5720534a2461ec66b94379190'
          test "$(git hash-object functions/index.js)" = 'dfb4c48ada6fa89a24c898cd4a2f911bcede822f'
          test "$(git hash-object functions-partner-workspace/index.js)" = '38da7e9174ffea7c406c92292dccfc651b565eb0'

  read-only-live:
    needs: offline
    if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
       github.ref == 'refs/heads/main' &&
       github.repository == 'Keikei-p/-' &&
       needs.offline.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      FIREBASE_PROJECT_ID: sales-management-cc116
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify read-only API and immutable live sources
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_SHA" = "$(git rev-parse HEAD)"
          test "$(git hash-object firestore.rules)" = 'd9f4df6a2ac0f8b5720534a2461ec66b94379190'
          test "$(git hash-object functions/index.js)" = 'dfb4c48ada6fa89a24c898cd4a2f911bcede822f'
          node --test tests/inspect-original-partner-functions-readonly.test.mjs tests/protect-original-functions-versions.test.mjs
      - name: Install existing OAuth dependency only
        run: npm install --prefix functions --ignore-scripts --package-lock=false --no-audit --no-fund
      - name: Supply existing audit credential privately
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          test -n "$FIREBASE_SERVICE_ACCOUNT_JSON"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/nico-original-six-identity.json"
          chmod 600 "$RUNNER_TEMP/nico-original-six-identity.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/nico-original-six-identity.json" >> "$GITHUB_ENV"
      - name: GET exact 6 original functions in both generations, never invoke
        shell: bash
        run: |
          set -euo pipefail
          result=0
          node tools/production/inspect-original-partner-functions-readonly.mjs \
            > "$RUNNER_TEMP/nico-original-six-private.log" 2>&1 || result=$?
          grep -E '^(ORIGINAL_PARTNER_FUNCTIONS |BLOCK_ORIGINAL_[A-Z0-9_]+$|STOP_ORIGINAL_PARTNER_FUNCTIONS_[A-Z0-9_]+$)' \
            "$RUNNER_TEMP/nico-original-six-private.log" || true
          test "$result" = 0
          grep -q '^ORIGINAL_PARTNER_FUNCTIONS ' "$RUNNER_TEMP/nico-original-six-private.log"
          grep '^ORIGINAL_PARTNER_FUNCTIONS ' "$RUNNER_TEMP/nico-original-six-private.log" \
            | grep -q '"safeToDeployNewFour":false'
      - name: Live read-only six-original revision stability dry run (no deploy)
        shell: bash
        run: |
          set -euo pipefail
          node tools/production/protect-original-functions-versions.mjs before
          node tools/production/protect-original-functions-versions.mjs after
      - name: Destroy private credential and metadata logs
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/nico-original-six-identity.json" "$RUNNER_TEMP/nico-original-six-private.log" "$RUNNER_TEMP/nico-original-six-immutable-versions.private.json"
