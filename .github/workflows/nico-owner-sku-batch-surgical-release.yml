name: NICO Owner exact SKU batch map safely (NO FINANCE CHANGES)
on:
  pull_request:
    branches: [main]
    paths:
      - 'ranking/owner-reviewed-sku-mapping-panel.mjs'
      - 'tests/owner-reviewed-sku-mapping-panel.test.mjs'
      - 'tools/hosting/release-owner-sku-panel-surgical.mjs'
      - 'tests/release-owner-sku-panel-surgical.test.mjs'
      - '.github/workflows/nico-owner-sku-batch-surgical-release.yml'
  push:
    branches: [main]
    paths:
      - 'ranking/owner-reviewed-sku-mapping-panel.mjs'
      - 'tests/owner-reviewed-sku-mapping-panel.test.mjs'
      - 'tools/hosting/release-owner-sku-panel-surgical.mjs'
      - 'tests/release-owner-sku-panel-surgical.test.mjs'
      - '.github/workflows/nico-owner-sku-batch-surgical-release.yml'
permissions:
  contents: read
concurrency:
  group: nico-owner-sku-panel-surgical-release
  cancel-in-progress: false
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      GOOGLE_APPLICATION_CREDENTIALS: ''
      FIREBASE_SERVICE_ACCOUNT_JSON: ''
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Protect canonical sales rules, totals, finance, Owner Functions and Hosting index
        shell: bash
        run: |
          set -euo pipefail
          test -z "$GOOGLE_APPLICATION_CREDENTIALS"
          test -z "$FIREBASE_SERVICE_ACCOUNT_JSON"
          test "$(git hash-object firestore.rules)" = d9f4df6a2ac0f8b5720534a2461ec66b94379190
          test "$(git hash-object index.html)" = f6d4815ecb09d4db0ba34144e6705926bdc7503c
          test "$(git hash-object functions-partner-workspace/service.cjs)" = 712bf523ac83942c02767c25321bfed7059055be
          test "$(git hash-object functions-ranking-approvals/index.js)" = 54855609e372ee1056b5206e445f20c0a251b1ef
          test "$(git hash-object functions-ranking-approvals/ranking/owner-reviewed-sku-mapping-store.mjs)" = 6652af761e44da1c33e75d1b7a15eeee4f504036
          test "$(git hash-object ranking/owner-reviewed-sku-mapping-panel.mjs)" = 1ee2861ce2dd4144d900097b67037ef252717060
          node --check ranking/owner-reviewed-sku-mapping-panel.mjs
          node --check tools/hosting/release-owner-sku-panel-surgical.mjs
          node --test tests/owner-reviewed-sku-mapping-panel.test.mjs tests/owner-partner-setup-mount.test.mjs tests/owner-reviewed-sku-mapping-store.test.mjs tests/owner-sku-mapping-controller.test.cjs
          node --test tests/release-owner-sku-panel-surgical.test.mjs
          echo 'OWNER_SKU_BATCH_UNIT_SECURITY_REGRESSION_PASS_NO_FIRESTORE_CHANGES'
  release:
    needs: offline
    if: >-
      ${{ github.event_name == 'push' &&
          github.ref == 'refs/heads/main' && github.repository == 'Keikei-p/-' &&
          needs.offline.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      FIREBASE_PROJECT_ID: sales-management-cc116
      NICO_OWNER_SKU_PANEL_RELEASE: CONFIRM_SINGLE_REVIEWED_OWNER_PANEL_ONLY
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Restrict to exact main, exactly one Owner panel and reviewed HTML
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api repos/Keikei-p/-/branches/main --jq .commit.sha)" = "$GITHUB_SHA"
          test "$(git hash-object ranking/owner-reviewed-sku-mapping-panel.mjs)" = 1ee2861ce2dd4144d900097b67037ef252717060
          test "$(git hash-object index.html)" = f6d4815ecb09d4db0ba34144e6705926bdc7503c
          test "$(git hash-object firestore.rules)" = d9f4df6a2ac0f8b5720534a2461ec66b94379190
          node --test tests/owner-reviewed-sku-mapping-panel.test.mjs tests/release-owner-sku-panel-surgical.test.mjs
      - name: Install existing Admin SDK for Hosting REST only
        run: npm install --prefix functions --ignore-scripts --package-lock=false --no-audit --no-fund
      - name: Read existing Firebase Hosting identity privately
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          test -n "$FIREBASE_SERVICE_ACCOUNT_JSON"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/nico-owner-sku-panel.private.json"
          chmod 600 "$RUNNER_TEMP/nico-owner-sku-panel.private.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/nico-owner-sku-panel.private.json" >> "$GITHUB_ENV"
      - name: GET-only full previous Hosting manifest and exact old module hash
        run: node tools/hosting/release-owner-sku-panel-surgical.mjs --dry-run
      - name: Publish ONLY Owner mapping panel when full manifest and previous hash match
        run: node tools/hosting/release-owner-sku-panel-surgical.mjs --release
      - name: HTTP check exact new module and existing Owner/partner routes
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const src=readFileSync('ranking/owner-reviewed-sku-mapping-panel.mjs');
          let ok=false;
          for(let n=0;n<10;n++){
           const res=await fetch('https://nico-factory.web.app/ranking/owner-reviewed-sku-mapping-panel.mjs?sku_batch_verify='+process.env.GITHUB_SHA+'-'+n,
             {redirect:'error',cache:'no-store'});
           if(res.status===200&&Buffer.from(await res.arrayBuffer()).equals(src)){ok=true;break;}
           await new Promise(r=>setTimeout(r,2000));
          }
          if(!ok)throw Error('STOP_OWNER_SKU_PANEL_PUBLIC_BYTES_UNVERIFIED');
          const targets=[
            ['https://nico-factory.web.app/owner-partner-setup.html','mountOwnerPartnerSetup'],
            ['https://nico-factory.web.app/partner-workspace.html','partner'],
            ['https://nico-factory.web.app/','ownerProductShareInline']
          ];
          for(const [url,marker] of targets){
           const r=await fetch(url,{redirect:'error',cache:'no-store'});
           if(r.status!==200||!(await r.text()).includes(marker))
            throw Error('STOP_EXISTING_OWNER_PARTNER_PAGE_DRIFT');
          }
          console.log('OWNER_SKU_BATCH_HOSTING_LIVE_EXACT_VERIFIED');
          NODE
      - name: Erase temporary Hosting identity
        if: always()
        run: rm -f "$RUNNER_TEMP/nico-owner-sku-panel.private.json"
