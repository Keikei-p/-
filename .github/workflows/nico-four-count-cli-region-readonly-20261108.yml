name: NICO Firebase CLI count Function region reconciliation (GET ONLY / NO DEPLOY)
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/nico-four-count-cli-region-readonly-20261108.yml'
      - 'tools/production/inspect-four-count-cli-region-readonly.mjs'
      - 'tests/inspect-four-count-cli-region-readonly.test.mjs'
      - 'tools/production/inspect-ranking-function-cli-readonly.mjs'
      - 'tests/inspect-ranking-function-cli-readonly.test.mjs'
  push:
    branches: [main]
    paths:
      - '.github/workflows/nico-four-count-cli-region-readonly-20261108.yml'
      - 'tools/production/inspect-four-count-cli-region-readonly.mjs'
      - 'tests/inspect-four-count-cli-region-readonly.test.mjs'
      - 'tools/production/inspect-ranking-function-cli-readonly.mjs'
      - 'tests/inspect-ranking-function-cli-readonly.test.mjs'
permissions:
  contents: read
concurrency:
  group: nico-cli-count-region-get-only
  cancel-in-progress: false
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Prove sanitized read-only CLI inventory and frozen financial sources
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/production/inspect-four-count-cli-region-readonly.mjs
          node --check tools/production/inspect-ranking-function-cli-readonly.mjs
          node --test tests/inspect-four-count-cli-region-readonly.test.mjs tests/inspect-ranking-function-cli-readonly.test.mjs tests/inspect-ranking-function-cli-readonly.test.mjs
          test "$(git hash-object firestore.rules)" = 'd9f4df6a2ac0f8b5720534a2461ec66b94379190'
          test "$(git hash-object functions/index.js)" = 'dfb4c48ada6fa89a24c898cd4a2f911bcede822f'
          test "$(git hash-object functions-partner-workspace/index.js)" = '38da7e9174ffea7c406c92292dccfc651b565eb0'
  live-get-only:
    needs: offline
    if: >-
      ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          github.repository == 'Keikei-p/-' &&
          github.ref == 'refs/heads/main' &&
          needs.offline.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      FIREBASE_PROJECT_ID: sales-management-cc116
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Check reviewed project and unchanged production money sources
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_SHA" = "$(git rev-parse HEAD)"
          test "$(git hash-object firestore.rules)" = 'd9f4df6a2ac0f8b5720534a2461ec66b94379190'
          test "$(git hash-object functions/index.js)" = 'dfb4c48ada6fa89a24c898cd4a2f911bcede822f'
          test "$(git hash-object functions-partner-workspace/index.js)" = '38da7e9174ffea7c406c92292dccfc651b565eb0'
          node --test tests/inspect-four-count-cli-region-readonly.test.mjs
      - name: Install pinned Firebase CLI for metadata READ only
        shell: bash
        run: npm install --global firebase-tools@15.34.1 --no-audit --no-fund
      - name: Supply existing audit identity privately without printing secret
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          test -n "$FIREBASE_SERVICE_ACCOUNT_JSON"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/nico-cli-region-auth.private.json"
          chmod 600 "$RUNNER_TEMP/nico-cli-region-auth.private.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/nico-cli-region-auth.private.json" >> "$GITHUB_ENV"
      - name: Fetch metadata only and report boolean region/generation distinctions
        shell: bash
        run: |
          set -euo pipefail
          firebase functions:list --project "$FIREBASE_PROJECT_ID" --json \
            > "$RUNNER_TEMP/nico-cli-region-private.json" \
            2> "$RUNNER_TEMP/nico-cli-region-stderr.private.log" || \
            { echo 'STOP_FOUR_COUNT_CLI_INVENTORY_REMOTE_LIST_FAILED'; exit 1; }
          node tools/production/inspect-four-count-cli-region-readonly.mjs \
            "$RUNNER_TEMP/nico-cli-region-private.json"
          node tools/production/inspect-ranking-function-cli-readonly.mjs \
            "$RUNNER_TEMP/nico-cli-region-private.json"
          echo 'PRODUCTION_FUNCTION_DEPLOYS=0'
          echo 'PRODUCTION_DOCUMENT_WRITES=0'
          echo 'PRODUCTION_RULES_WRITES=0'
      - name: Destroy private identity and metadata outputs
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/nico-cli-region-auth.private.json" \
            "$RUNNER_TEMP/nico-cli-region-private.json" \
            "$RUNNER_TEMP/nico-cli-region-stderr.private.log"
