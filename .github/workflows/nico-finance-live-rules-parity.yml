name: NICO live Firestore finance Rules parity (READ ONLY / NO DEPLOY)
on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/production/audit-live-firestore-rules-readonly.mjs'
      - 'tests/audit-live-firestore-rules-readonly.test.mjs'
      - 'tests/finance-live-production-rules-get-list.test.cjs'
      - '.github/workflows/nico-finance-live-rules-parity.yml'
  push:
    branches: [main]
    paths:
      - 'tools/production/audit-live-firestore-rules-readonly.mjs'
      - 'tests/audit-live-firestore-rules-readonly.test.mjs'
      - 'tests/finance-live-production-rules-get-list.test.cjs'
      - '.github/workflows/nico-finance-live-rules-parity.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nico-live-finance-rules-parity
  cancel-in-progress: false
jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify original rules and GET-only audit are immutable
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object firestore.rules)" = 'd9f4df6a2ac0f8b5720534a2461ec66b94379190'
          test "$(git hash-object functions/index.js)" = 'dfb4c48ada6fa89a24c898cd4a2f911bcede822f'
          test "$(git hash-object functions-partner-workspace/index.js)" = '38da7e9174ffea7c406c92292dccfc651b565eb0'
          test "$(git hash-object index.html)" = '88ef5636bfe9254e71f2109d452b6d3049f99861'
          node --check tools/production/audit-live-firestore-rules-readonly.mjs
          node --check tests/audit-live-firestore-rules-readonly.test.mjs
          node --check tests/finance-live-production-rules-get-list.test.cjs
          node --test tests/audit-live-firestore-rules-readonly.test.mjs
  emulator:
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FIREBASE_PROJECT_ID: demo-nico-live-finance-priv
      GOOGLE_CLOUD_PROJECT: demo-nico-live-finance-priv
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install emulator-only libraries
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix tests --ignore-scripts --no-audit --no-fund --package-lock=false
      - name: GET and scoped LIST financial denial for six partner actor profiles
        shell: bash
        run: |
          set -euo pipefail
          test "$FIREBASE_PROJECT_ID" = 'demo-nico-live-finance-priv'
          npx --yes firebase-tools@15.34.1 emulators:exec --only firestore \
            --project demo-nico-live-finance-priv \
            "node --test tests/finance-live-production-rules-get-list.test.cjs"
  live-get-only:
    needs: [static,emulator]
    if: >-
      ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          github.ref == 'refs/heads/main' &&
          github.repository == 'Keikei-p/-' &&
          needs.static.result == 'success' &&
          needs.emulator.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      FIREBASE_PROJECT_ID: sales-management-cc116
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirm reviewed source and project BEFORE loading credential
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_SHA" = "$(git rev-parse HEAD)"
          test "$(git hash-object firestore.rules)" = 'd9f4df6a2ac0f8b5720534a2461ec66b94379190'
          test "$(git hash-object functions/index.js)" = 'dfb4c48ada6fa89a24c898cd4a2f911bcede822f'
          test "$(git hash-object functions-partner-workspace/index.js)" = '38da7e9174ffea7c406c92292dccfc651b565eb0'
          node --test tests/audit-live-firestore-rules-readonly.test.mjs
      - name: Install existing OAuth dependency only
        run: npm install --prefix functions --ignore-scripts --package-lock=false --no-audit --no-fund
      - name: Use already-configured service account identity
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          test -n "$FIREBASE_SERVICE_ACCOUNT_JSON"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/nico-live-rules.private.json"
          chmod 600 "$RUNNER_TEMP/nico-live-rules.private.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/nico-live-rules.private.json" >> "$GITHUB_ENV"
      - name: Read Rules RELEASE and RULESET via two metadata GETs; NO USER DATA
        shell: bash
        run: |
          set -euo pipefail
          result=0
          node tools/production/audit-live-firestore-rules-readonly.mjs > "$RUNNER_TEMP/nico-live-rules-audit.private.log" 2>&1 || result=$?
          grep -E '^(NICO_LIVE_RULES_SOURCE_AUDIT |NICO_LIVE_RULES_MATCH_EMULATOR_SOURCE_REAL_ACCOUNT_STILL_UNVERIFIED$|STOP_NICO_LIVE_RULES_READONLY_[A-Z0-9_]+$)' "$RUNNER_TEMP/nico-live-rules-audit.private.log" || true
          test "$result" -eq 0
          grep -q '^NICO_LIVE_RULES_MATCH_EMULATOR_SOURCE_REAL_ACCOUNT_STILL_UNVERIFIED$' "$RUNNER_TEMP/nico-live-rules-audit.private.log"
      - name: Always erase private credential and audit log, NEVER upload artifact
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/nico-live-rules.private.json" "$RUNNER_TEMP/nico-live-rules-audit.private.log"
