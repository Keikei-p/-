name: NICO login presentation regression (NO DEPLOY)
on:
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'tests/login-presentation-contract.test.cjs'
      - '.github/workflows/nico-login-presentation-no-deploy.yml'
permissions:
  contents: read
jobs:
  login-visual-only:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      FIREBASE_SERVICE_ACCOUNT_JSON: ''
      GOOGLE_APPLICATION_CREDENTIALS: ''
      FIREBASE_TOKEN: ''
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prove no production credentials are available
        shell: bash
        run: |
          set -euo pipefail
          test -z "$FIREBASE_SERVICE_ACCOUNT_JSON"
          test -z "$GOOGLE_APPLICATION_CREDENTIALS"
          test -z "$FIREBASE_TOKEN"
      - name: Verify login DOM, mobile/reduced-motion and passive FX with regressions
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/login-presentation-contract.test.cjs tests/partner-invite-mobile-layout.test.cjs tests/internal-owner-finance-visibility.test.cjs tests/sales-regressions.cjs
          node - <<'NODE'
          const fs = require('node:fs');
          const s = fs.readFileSync('index.html', 'utf8');
          const from = s.indexOf('<script id="nfLoginFXController">');
          const to = s.indexOf('</script>', from);
          if (from < 0 || to < 0) throw new Error('Missing login FX script');
          const source = s.slice(s.indexOf('>', from) + 1, to);
          fs.writeFileSync('/tmp/nico-login-fx.js', source);
          NODE
          node --check /tmp/nico-login-fx.js
          echo 'NICO_LOGIN_VISUAL_REGRESSION_PASS_NO_DEPLOY'
