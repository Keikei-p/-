name: NICO login presentation regression (NO DEPLOY)
on:
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'tests/login-presentation-contract.test.cjs'
      - '.github/workflows/nico-login-presentation-no-deploy.yml'
permissions:
  contents: read
jobs:
  login-visual-only:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      FIREBASE_SERVICE_ACCOUNT_JSON: ''
      GOOGLE_APPLICATION_CREDENTIALS: ''
      FIREBASE_TOKEN: ''
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prove no production credentials are available
        shell: bash
        run: |
          set -euo pipefail
          test -z "$FIREBASE_SERVICE_ACCOUNT_JSON"
          test -z "$GOOGLE_APPLICATION_CREDENTIALS"
          test -z "$FIREBASE_TOKEN"
      - name: Verify login DOM, mobile/reduced-motion and passive FX with regressions
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/login-presentation-contract.test.cjs tests/partner-invite-mobile-layout.test.cjs tests/internal-owner-finance-visibility.test.cjs tests/sales-regressions.cjs
          node - <<'NODE'
          const fs = require('node:fs');
          const s = fs.readFileSync('index.html', 'utf8');
          const from = s.indexOf('<script id="nfLoginFXController">');
          const to = s.indexOf('</script>', from);
          if (from < 0 || to < 0) throw new Error('Missing login FX script');
          const source = s.slice(s.indexOf('>', from) + 1, to);
          fs.writeFileSync('/tmp/nico-login-fx.js', source);
          NODE
          node --check /tmp/nico-login-fx.js
          echo 'NICO_LOGIN_VISUAL_REGRESSION_PASS_NO_DEPLOY'

      - name: Compare public index bytes with current main (GET only, no deploy)
        shell: bash
        run: |
          set -euo pipefail
          git show origin/main:index.html > "$RUNNER_TEMP/current-main-index.html"
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          const response = await fetch('https://nico-factory.web.app/?login_appearance_readonly=1', {
            method: 'GET', redirect: 'error', cache: 'no-store',
            signal: AbortSignal.timeout(20000)
          });
          if (response.status !== 200) throw Error('STOP_PUBLIC_INDEX_HTTP_' + response.status);
          const live = Buffer.from(await response.arrayBuffer());
          const main = readFileSync(process.env.RUNNER_TEMP + '/current-main-index.html');
          const liveString = live.toString('utf8');
          if (!liveString.includes('id="authScreen"') || !liveString.includes('id="authButton"'))
            throw Error('STOP_PUBLIC_LOGIN_FORM_MISSING');
          const sha = b => createHash('sha256').update(b).digest('hex');
          const normalize = b => b.toString('utf8').replaceAll(String.fromCharCode(13, 10), String.fromCharCode(10));
          console.log('PUBLIC_INDEX_SIZE=' + live.length);
          console.log('PUBLIC_INDEX_SHA256=' + sha(live));
          console.log('CURRENT_MAIN_INDEX_SHA256=' + sha(main));
          console.log('LIVE_BYTE_PARITY_MAIN=' + (live.equals(main) ? 'YES' : 'NO'));
          console.log('LIVE_EOL_NORMALIZED_PARITY_MAIN=' + (normalize(live) === normalize(main) ? 'YES' : 'NO'));
          console.log('PRODUCTION_WRITES=0; DEPLOYED=NO');
          NODE
