name: NICO four joint count rankings (STAGING ONLY / NO DEPLOY)
on:
  pull_request:
    branches: [main]
    paths:
      - 'ranking/verified-dual-count-dashboards.mjs'
      - 'functions-ranking-approvals/ranking/verified-dual-count-dashboards.mjs'
      - 'ranking/verified-joint-ranking-panel.mjs'
      - 'functions-ranking-approvals/joint-count-http-adapter.cjs'
      - 'tests/joint-count-http-adapter.test.cjs'
      - 'tests/verified-dual-count-dashboards.test.mjs'
      - 'tests/owner-product-visibility-rankings.test.mjs'
      - 'tests/verified-joint-ranking-panel.test.mjs'
      - 'tests/isolated-joint-count-function-package.test.mjs'
      - '.github/workflows/nico-joint-four-rankings-staging.yml'
  push:
    branches: [main]
    paths:
      - 'ranking/verified-dual-count-dashboards.mjs'
      - 'functions-ranking-approvals/ranking/verified-dual-count-dashboards.mjs'
      - 'ranking/verified-joint-ranking-panel.mjs'
      - 'functions-ranking-approvals/joint-count-http-adapter.cjs'
      - 'tests/joint-count-http-adapter.test.cjs'
      - 'tests/verified-dual-count-dashboards.test.mjs'
      - 'tests/owner-product-visibility-rankings.test.mjs'
      - 'tests/verified-joint-ranking-panel.test.mjs'
      - '.github/workflows/nico-joint-four-rankings-staging.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FIREBASE_SERVICE_ACCOUNT_JSON: ''
      GOOGLE_APPLICATION_CREDENTIALS: ''
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Confirm no Firebase credentials, no finance or production source changes
        shell: bash
        run: |
          set -euo pipefail
          test -z "$FIREBASE_SERVICE_ACCOUNT_JSON"
          test -z "$GOOGLE_APPLICATION_CREDENTIALS"
          test "$(git hash-object firestore.rules)" = 'd9f4df6a2ac0f8b5720534a2461ec66b94379190'
          test "$(git hash-object functions/index.js)" = 'dfb4c48ada6fa89a24c898cd4a2f911bcede822f'
          test "$(git hash-object functions-partner-workspace/index.js)" = '90d51246477cf5cfa6966f3e822326ef06cccd0f'
          node --check ranking/verified-dual-count-dashboards.mjs
          node --check functions-ranking-approvals/ranking/verified-dual-count-dashboards.mjs
          node --check ranking/verified-joint-ranking-panel.mjs
          node --check functions-ranking-approvals/joint-count-http-adapter.cjs
      - name: E2E count reconciliation, source-vendor identity, role isolation
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/verified-dual-count-dashboards.test.mjs \
            tests/owner-product-visibility-rankings.test.mjs \
            tests/verified-joint-ranking-panel.test.mjs \
            tests/isolated-joint-count-function-package.test.mjs \
            tests/joint-count-http-adapter.test.cjs
          echo 'FOUR_JOINT_COUNT_RANKINGS_STAGING_PASS_NO_FIREBASE_DEPLOY'
