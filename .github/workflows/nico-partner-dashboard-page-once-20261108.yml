name: NICO one-time partner dashboard PAGE ONLY (protected release)
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/nico-partner-dashboard-page-once-20261108.yml'
      - 'tests/partner-dashboard-page-once-release.test.mjs'
  push:
    branches: [main]
    paths:
      - '.github/workflows/nico-partner-dashboard-page-once-20261108.yml'
permissions:
  contents: read
concurrency:
  group: nico-surgical-index-release
  cancel-in-progress: false
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Check exact single-file scope, immutable finance/count sources and dashboard regressions
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object partner-workspace.html)" = '145fd8a1f3aaa9239c029d82ce97f602154cd819'
          test "$(git hash-object index.html)" = '88ef5636bfe9254e71f2109d452b6d3049f99861'
          test "$(git hash-object firestore.rules)" = 'd9f4df6a2ac0f8b5720534a2461ec66b94379190'
          test "$(git hash-object functions/index.js)" = 'dfb4c48ada6fa89a24c898cd4a2f911bcede822f'
          test "$(git hash-object functions-partner-workspace/index.js)" = '38da7e9174ffea7c406c92292dccfc651b565eb0'
          test "$(git hash-object functions-partner-workspace/service.cjs)" = 'b94a6aba231dc2569009580a178297a5b6194bda'
          test "$(git hash-object firebase.partner-workspace.json)" = 'a6ceedec5fab4e22e0a8efe19c685716a2db9750'
          node --test tests/partner-dashboard-page-once-release.test.mjs
          node --test tests/partner-dashboard-self-app-count-parity.test.mjs
          node --test tests/surgical-existing-partner-workspace.test.mjs
          node --test tests/partner-count-dashboard.test.cjs tests/partner-workspace.test.cjs
          node --test tests/partner-company-code-auth.test.cjs tests/internal-owner-finance-visibility.test.cjs
  publish-once:
    needs: offline
    if: >-
      ${{ github.event_name == 'push' &&
         github.repository == 'Keikei-p/-' &&
         github.ref == 'refs/heads/main' &&
         startsWith(github.event.head_commit.message, 'release: partner dashboard count-only page 20261108') &&
         needs.offline.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    env:
      FIREBASE_PROJECT_ID: sales-management-cc116
      NICO_PARTNER_RELEASE_CONFIRMATION: CONFIRM_REPLACE_PARTNER_WORKSPACE_ONLY
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Reject changed main SHA and any modified finance, count or original HTML source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_SHA" = "$(git rev-parse HEAD)"
          test "$GITHUB_SHA" = "$(gh api repos/Keikei-p/-/branches/main --jq '.commit.sha')"
          test "$(git hash-object partner-workspace.html)" = '145fd8a1f3aaa9239c029d82ce97f602154cd819'
          test "$(git hash-object index.html)" = '88ef5636bfe9254e71f2109d452b6d3049f99861'
          test "$(git hash-object firestore.rules)" = 'd9f4df6a2ac0f8b5720534a2461ec66b94379190'
          test "$(git hash-object functions/index.js)" = 'dfb4c48ada6fa89a24c898cd4a2f911bcede822f'
          test "$(git hash-object functions-partner-workspace/index.js)" = '38da7e9174ffea7c406c92292dccfc651b565eb0'
          test "$(git hash-object functions-partner-workspace/service.cjs)" = 'b94a6aba231dc2569009580a178297a5b6194bda'
          node --test tests/partner-dashboard-page-once-release.test.mjs
          node --test tests/partner-dashboard-self-app-count-parity.test.mjs
      - name: Require original live routes are reachable before any Hosting writes
        shell: bash
        run: |
          set -euo pipefail
          for route in / /partner-workspace.html /partner-counts.html /partner-invite.html; do
            test "$(curl -fsSL --max-time 30 -o /dev/null -w '%{http_code}' "https://nico-factory.web.app$route")" = 200
          done
          echo 'LIVE_ORIGINAL_ROUTES_HTTP_200_NO_WRITES'
      - name: Install PINNED metadata CLI and previously reviewed Firebase REST OAuth dependency
        shell: bash
        run: |
          set -euo pipefail
          npm install --global firebase-tools@15.34.1 --no-audit --no-fund
          npm install --prefix functions --ignore-scripts --package-lock=false --no-audit --no-fund
      - name: Configure existing protected audit identity privately
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          test -n "$FIREBASE_SERVICE_ACCOUNT_JSON"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/nico-dashboard-release.private.json"
          chmod 600 "$RUNNER_TEMP/nico-dashboard-release.private.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/nico-dashboard-release.private.json" >> "$GITHUB_ENV"
      - name: Verify FOUR original count-only callables are ACTIVE and enabled without replacement
        shell: bash
        run: |
          set -euo pipefail
          firebase functions:list --project "$FIREBASE_PROJECT_ID" --json > "$RUNNER_TEMP/nico-dashboard-functions.private.json" \
            2> "$RUNNER_TEMP/nico-dashboard-functions-error.private.log" || { echo 'BLOCK_COUNTS_INVENTORY_READ'; exit 1; }
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          import {classifyInventory,TARGETS} from './tools/production/inspect-four-count-cli-region-readonly.mjs';
          const raw=JSON.parse(readFileSync(process.env.RUNNER_TEMP+'/nico-dashboard-functions.private.json','utf8'));
          const inventory=classifyInventory(raw);
          for(const name of TARGETS){
            const x=inventory.functions[name];
            if(x.entries!==1||x.inTargetRegion!==1||x.gen2Listed!==1||
               x.activeState!==1||x.expectedCodebase!==1||x.workspaceFlagEnabled!==1||
               x.projectUnknown!==0||x.otherProject!==0)
              throw Error('BLOCK_REQUIRED_COUNT_FUNCTION_NOT_READY');
          }
          console.log('FOUR_COUNT_FUNCTION_METADATA_PRESENT_ACTIVE_ENABLED_NO_BUILD');
          NODE
      - name: Confirm live Hosting source version, all 13 paths, config and 12 preserved file hashes
        shell: bash
        run: |
          set -euo pipefail
          node tools/hosting/surgical-existing-partner-workspace.mjs --dry-run \
            > "$RUNNER_TEMP/nico-dashboard-hosting-probe.private.log" || \
            { echo 'BLOCK_HOSTING_ONE_FILE_PREVIEW'; exit 1; }
          grep -Fq 'sites/nico-factory/versions/9dfdf2000344c040 / 13' \
            "$RUNNER_TEMP/nico-dashboard-hosting-probe.private.log" || \
            { echo 'BLOCK_LIVE_HOSTING_SOURCE_CHANGED'; exit 1; }
          grep -Fq '"outcome":"DRY_RUN_OK"' "$RUNNER_TEMP/nico-dashboard-hosting-probe.private.log" || \
            { echo 'BLOCK_HOSTING_DRYRUN_INCOMPLETE'; exit 1; }
          echo 'LIVE_THIRTEEN_FILE_SNAPSHOT_VERIFIED_TWELVE_PRESERVED'
      - name: Confirm anonymous user cannot use any of the four count APIs
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const names=['getPartnerWorkspace','submitPartnerWorkspaceCounts',
            'managePartnerWorkspace','acceptPartnerWorkspaceInvite'];
          for(const name of names){
            const res=await fetch('https://asia-northeast1-sales-management-cc116.cloudfunctions.net/'+name,{
              method:'POST',redirect:'error',headers:{'Content-Type':'application/json'},
              body:JSON.stringify({data:{}})
            });
            if(![401,403].includes(res.status))
              throw Error('BLOCK_ANONYMOUS_COUNT_CALLABLE_NOT_VERIFIED');
          }
          console.log('ANONYMOUS_COUNT_CALLABLES_DENIED_ALL_FOUR');
          NODE
      - name: Publish EXACT one reviewed partner HTML only using validated existing Hosting tool
        shell: bash
        run: |
          set -euo pipefail
          node tools/hosting/surgical-existing-partner-workspace.mjs --release \
            > "$RUNNER_TEMP/nico-dashboard-hosting-release.private.log" || \
            { echo 'BLOCK_SINGLE_FILE_PUBLISH_FAILED_REVIEW_PRIVATE_LOG'; exit 1; }
          grep -Fq '"outcome":"RELEASED"' "$RUNNER_TEMP/nico-dashboard-hosting-release.private.log" || \
            { echo 'BLOCK_SINGLE_FILE_RELEASE_UNVERIFIED'; exit 1; }
          echo 'PARTNER_DASHBOARD_SINGLE_HTML_RELEASED_OTHER_ASSETS_PRESERVED'
      - name: Verify exact deployed HTML and existing sales/LINE pages remain reachable
        shell: bash
        run: |
          set -euo pipefail
          ready=false
          for n in $(seq 1 12); do
            if curl -fsSL --max-time 30 \
              "https://nico-factory.web.app/partner-workspace.html?dashboard_verify=$GITHUB_SHA-$n" \
              > "$RUNNER_TEMP/nico-live-partner-dashboard.private.html" &&
              cmp -s "$RUNNER_TEMP/nico-live-partner-dashboard.private.html" partner-workspace.html; then
              ready=true;break
            fi
            sleep 5
          done
          test "$ready" = true || { echo 'BLOCK_PUBLISHED_HTML_NOT_EXACT'; exit 1; }
          for route in / /partner-invite.html /partner-counts.html; do
            test "$(curl -fsSL --max-time 30 -o /dev/null -w '%{http_code}' "https://nico-factory.web.app$route")" = 200
          done
          echo 'LIVE_PARTNER_DASHBOARD_HTML_EXACT_OTHER_ORIGINAL_PAGES_HTTP_200'
          echo 'REAL_MEMBER_COUNT_SAVE_AND_FINANCE_DENIAL_STILL_REQUIRE_PROOF'
      - name: Destroy private identity, inventory, metadata, and readback files
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/nico-dashboard-release.private.json" \
            "$RUNNER_TEMP/nico-dashboard-functions.private.json" \
            "$RUNNER_TEMP/nico-dashboard-functions-error.private.log" \
            "$RUNNER_TEMP/nico-dashboard-hosting-probe.private.log" \
            "$RUNNER_TEMP/nico-dashboard-hosting-release.private.log" \
            "$RUNNER_TEMP/nico-live-partner-dashboard.private.html" \
            firebase-debug.log firestore-debug.log
