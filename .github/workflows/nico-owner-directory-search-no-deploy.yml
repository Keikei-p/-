name: NICO Owner 100+ partner search expansion (NO DEPLOY)
on:
  push:
    branches: [feature/owner-directory-search-expand-20261107]
  pull_request:
    branches: [release/partner-nov9-integrated-draft-20261107]
permissions:
  contents: read
jobs:
  owner-search:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FIREBASE_PROJECT_ID: demo-sales-support
      GCLOUD_PROJECT: demo-sales-support
      GOOGLE_APPLICATION_CREDENTIALS: ""
      FIREBASE_SERVICE_ACCOUNT_JSON: ""
      NICO_USAGE_APPROVAL: ""
      NICO_PHASE1_INDEPENDENT_SIGNOFF: ""
      NICO_PARTNER_RELEASE_CONFIRMATION: ""
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify exact parent and three non-deploy changes
        shell: bash
        run: |
          set -euo pipefail
          test "$FIREBASE_PROJECT_ID" = demo-sales-support
          test "$GCLOUD_PROJECT" = demo-sales-support
          test -z "$GOOGLE_APPLICATION_CREDENTIALS"
          test -z "$FIREBASE_SERVICE_ACCOUNT_JSON"
          test -z "$NICO_USAGE_APPROVAL"
          test -z "$NICO_PHASE1_INDEPENDENT_SIGNOFF"
          test -z "$NICO_PARTNER_RELEASE_CONFIRMATION"
          git fetch --no-tags origin release/partner-nov9-integrated-draft-20261107 main
          parent="$(git rev-parse origin/release/partner-nov9-integrated-draft-20261107)"
          test "$parent" = "b3cc39a464868ed14df01af1845966e50b195667"
          test "$(git merge-base HEAD "$parent")" = "$parent"
          git diff --name-only "$parent"...HEAD >/tmp/owner-search-files
          cat /tmp/owner-search-files
          test "$(wc -l </tmp/owner-search-files)" -eq 3
          if grep -Ev '^(index[.]html|tests/owner-directory-search-expand[.]test[.]cjs|[.]github/workflows/nico-owner-directory-search-no-deploy[.]yml)$' /tmp/owner-search-files; then
            echo STOP_UNREVIEWED_FILE; exit 1
          fi
          git diff --exit-code "$parent" HEAD -- firestore.rules firebase.json firestore.indexes.json functions functions-partner-workspace functions-partner-quick scripts
      - name: Run Owner search, 123-company pagination, finance and ranking regressions
        shell: bash
        run: |
          set -euo pipefail
          node --check tests/owner-directory-search-expand.test.cjs
          node --test \
            tests/owner-directory-search-expand.test.cjs \
            tests/owner-partner-directory-pagination.test.cjs \
            tests/owner-partner-count-console.test.cjs \
            tests/partner-integrated-release-boundaries.test.cjs \
            tests/partner-combined-month-ranking-main.test.cjs \
            tests/partner-money-free-workspace.test.cjs \
            tests/internal-owner-finance-visibility.test.cjs \
            tests/sales-regressions.cjs
      - name: Confirm NO DEPLOY and no production writes
        run: |
          echo PRODUCTION_DEPLOYED=false
          echo PRODUCTION_DOCUMENT_WRITES=0
          echo PRODUCTION_RULES_CHANGED=false
          echo RELEASE_APPROVED=false
