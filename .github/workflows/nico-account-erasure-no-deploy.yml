name: NICO manager account erasure - offline only (NO DEPLOY)
on:
  push:
    branches:
      - feature/nico-managed-account-erasure-20261104
    paths:
      - 'functions-account-erasure/**'
      - 'firebase.account-erasure.json'
      - 'tests/nico-account-erasure.test.cjs'
      - 'tests/nico-account-erasure-ui.test.cjs'
      - 'tools/ci/check-account-erasure-ui-syntax.mjs'
      - 'index.html'
      - '.github/workflows/nico-account-erasure-no-deploy.yml'
  pull_request:
    paths:
      - 'functions-account-erasure/**'
      - 'firebase.account-erasure.json'
      - 'tests/nico-account-erasure.test.cjs'
      - 'tests/nico-account-erasure-ui.test.cjs'
      - 'tools/ci/check-account-erasure-ui-syntax.mjs'
      - 'index.html'
      - '.github/workflows/nico-account-erasure-no-deploy.yml'
permissions:
  contents: read
jobs:
  offline-erasure:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      FIREBASE_PROJECT_ID: demo-sales-account-erasure
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Refuse production identity, deployment, and automatic erasure
        run: |
          set -euo pipefail
          test "${FIREBASE_PROJECT_ID}" = demo-sales-account-erasure
          test -z "${GOOGLE_APPLICATION_CREDENTIALS:-}"
          test -z "${FIREBASE_SERVICE_ACCOUNT_JSON:-}"
          test -z "${NICO_ACCOUNT_ERASURE_ENABLED:-}"
          node - <<'NODE'
          const fs=require('node:fs');
          const c=JSON.parse(fs.readFileSync('firebase.account-erasure.json','utf8'));
          if(Object.keys(c).join(',')!=='functions'||c.functions.codebase!=='account-erasure'||
            c.functions.source!=='functions-account-erasure')throw Error('unsafe_codebase');
          const x=fs.readFileSync('functions-account-erasure/index.js','utf8');
          if(!x.includes('NICO_ACCOUNT_ERASURE_ENABLED==="enabled"')||
             !x.includes('previewManagedAccountErasure')||!x.includes('confirmManagedAccountErasure'))
            throw Error('missing_disable_by_default');
          NODE
      - name: Validate backend syntax and isolated synthetic erasure + history retention
        run: |
          node --check functions-account-erasure/index.js
          node --check functions-account-erasure/service.cjs
          node --test tests/nico-account-erasure.test.cjs tests/nico-account-erasure-ui.test.cjs
          node tools/ci/check-account-erasure-ui-syntax.mjs
      - name: Verify old suspend-only function and historical sales regression
        run: |
          node --test tests/sales-regressions.cjs
