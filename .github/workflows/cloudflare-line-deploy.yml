name: Deploy Zero-Cost LINE Worker

on:
  workflow_dispatch:
  push:
    branches:
      - ops/deploy-final-worker-20261003
    paths:
      - .github/workflows/cloudflare-line-deploy.yml

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: cloudflare-line

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      LINE_CHANNEL_SECRET: ${{ secrets.LINE_CHANNEL_SECRET }}
      LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify required secrets
        shell: bash
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID LINE_CHANNEL_SECRET LINE_CHANNEL_ACCESS_TOKEN FIREBASE_SERVICE_ACCOUNT_JSON; do
            if [ -z "${!name:-}" ]; then
              echo "::error::GitHub Secret ${name} が未設定です。"
              exit 1
            fi
          done

      - name: Install dependencies
        run: npm install --ignore-scripts --package-lock=false

      - name: Syntax check
        run: npm run check

      - name: Bootstrap Worker safely
        run: npm run deploy

      - name: Put LINE channel secret
        shell: bash
        run: printf '%s' "$LINE_CHANNEL_SECRET" | npx wrangler secret put LINE_CHANNEL_SECRET

      - name: Put LINE access token
        shell: bash
        run: printf '%s' "$LINE_CHANNEL_ACCESS_TOKEN" | npx wrangler secret put LINE_CHANNEL_ACCESS_TOKEN

      - name: Put Firebase service account
        shell: bash
        run: printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" | npx wrangler secret put FIREBASE_SERVICE_ACCOUNT_JSON

      - name: Deploy Worker with secrets
        run: npm run deploy

      - name: Smoke test Worker health
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 5 --retry-delay 2 \
            "https://sales-line-worker.jyhokei0124.workers.dev/health"

      - name: Smoke test LINE webhook method
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
            "https://sales-line-worker.jyhokei0124.workers.dev/line-webhook")"
          test "$status" = "405"
