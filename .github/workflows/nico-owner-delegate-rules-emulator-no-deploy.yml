name: NICO Owner delegate grants Firestore Rules emulator (NO DEPLOY)
on:
  pull_request:
    branches: [main]
    paths:
      - 'tests/owner-delegate-grant-rules-emulator.test.cjs'
      - '.github/workflows/nico-owner-delegate-rules-emulator-no-deploy.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FIREBASE_PROJECT_ID: demo-sales-support
      GCLOUD_PROJECT: demo-sales-support
      GOOGLE_APPLICATION_CREDENTIALS: ''
      FIREBASE_SERVICE_ACCOUNT_JSON: ''
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Check production Rules remain unchanged; no real credentials
        shell: bash
        run: |
          set -euo pipefail
          test -z "$GOOGLE_APPLICATION_CREDENTIALS"
          test -z "$FIREBASE_SERVICE_ACCOUNT_JSON"
          test "$FIREBASE_PROJECT_ID" = demo-sales-support
          test "$(git hash-object firestore.rules)" = d9f4df6a2ac0f8b5720534a2461ec66b94379190
          test "$(git hash-object tests/owner-delegate-grant-rules-emulator.test.cjs)" = 395de9d2c7e8ab5715cfa369979304831f1ae209
          test "$(git hash-object staging/owner-delegation-v1/owner-approval-service.cjs)" = 5784dcd2a591fcf33013ef28dcd3b6e3cca0336d
          node --check tests/owner-delegate-grant-rules-emulator.test.cjs
      - name: Install local emulator dependencies (no Firebase admin project credentials)
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix tests --ignore-scripts --no-audit --no-fund --package-lock=false
          npm install -g firebase-tools@15.34.1 --no-audit --no-fund
      - name: Prove client grant-edit and audit-write DENIED while original Owner flows survive
        shell: bash
        run: |
          set -euo pipefail
          firebase emulators:exec --project demo-sales-support --only firestore \
            "node --test tests/owner-delegate-grant-rules-emulator.test.cjs"
          echo 'OWNER_GRANT_RULES_CLIENT_WRITE_DENIED_EXISTING_OWNER_RENAME_AND_TRANSFER_PASS'
          echo 'ONLY_DEMO_EMULATOR_PRODUCTION_DATA_UNCHANGED_NO_DEPLOY'
