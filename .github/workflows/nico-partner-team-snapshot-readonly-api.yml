name: NICO partner saved-team snapshot read-only API release
on:
  pull_request:
    branches: [main]
    paths:
      - 'functions-partner-workspace/service.cjs'
      - 'tests/partner-workspace.test.cjs'
      - '.github/workflows/nico-partner-team-snapshot-readonly-api.yml'
  push:
    branches: [main]
    paths:
      - 'functions-partner-workspace/service.cjs'
      - 'tests/partner-workspace.test.cjs'
      - '.github/workflows/nico-partner-team-snapshot-readonly-api.yml'
permissions:
  contents: read
concurrency:
  group: nico-partner-workspace-production
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify isolated existing read-only API and original history
        shell: bash
        run: |
          set -euo pipefail
          node --check functions-partner-workspace/service.cjs
          node --check functions-partner-workspace/index.js
          node --test tests/partner-workspace.test.cjs
          node --test tests/partner-count-dashboard.test.cjs
          node --test tests/partner-money-free-workspace.test.cjs
          node --test tests/partner-existing-ranking.test.cjs
          node --test tests/internal-owner-finance-visibility.test.cjs
          test "$(git hash-object functions-partner-workspace/index.js)" = a2bffd167b8804a0372c7a00465c04a63d96e919
          test "$(git hash-object functions-partner-workspace/package.json)" = 6572599ecac0b8e2b05c166f9e921dc07c0b39f1
          test "$(git hash-object firebase.partner-workspace.json)" = a6ceedec5fab4e22e0a8efe19c685716a2db9750
          test "$(git hash-object functions-partner-workspace/service.cjs)" = 42b44a0a1fb25e174d9de942e0d79ca191a0ce32
          node <<'NODE'
          const fs=require('node:fs');
          const code=fs.readFileSync('functions-partner-workspace/service.cjs','utf8');
          if(!code.includes('teamIdSnapshot=ID.test(x.teamIdSnapshot||"")?x.teamIdSnapshot:null')||
             !code.includes('rows.push({staffId:x.staffId,counts,totalCount:total,version:x.version,')||
             /\.collection\(["'](?:records|products|recordCorrections|revenueGoals)["']\)/.test(code))
            throw Error('NOT_ONLY_EXISTING_COUNT_READ_BOUNDARY');
          NODE
  release:
    needs: validate
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.validate.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FIREBASE_PROJECT_ID: sales-management-cc116
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify production identity without printing secrets
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          test -n "${FIREBASE_SERVICE_ACCOUNT_JSON:-}"
          node -e "const fs=require('fs');if(JSON.parse(fs.readFileSync('.firebaserc','utf8')).projects.default!=='sales-management-cc116')process.exit(1)"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/partner-readonly-api-credentials.json"
          chmod 600 "$RUNNER_TEMP/partner-readonly-api-credentials.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/partner-readonly-api-credentials.json" >> "$GITHUB_ENV"
      - name: Install existing isolated Functions package and pinned CLI
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix functions-partner-workspace --ignore-scripts --package-lock=false
          npm install -g firebase-tools@15.34.1
      - name: Require all original workspace APIs remain available
        shell: bash
        run: |
          set -euo pipefail
          firebase functions:list --project "$FIREBASE_PROJECT_ID" --json > "$RUNNER_TEMP/partner-preexisting-functions.json"
          FILE="$RUNNER_TEMP/partner-preexisting-functions.json" node <<'NODE'
          const fs=require('node:fs');
          const result=JSON.parse(fs.readFileSync(process.env.FILE,'utf8')).result||[];
          const names=result.map(x=>x.id||x.name||'');
          for(const name of ['getPartnerWorkspace','managePartnerWorkspace',
           'acceptPartnerWorkspaceInvite','submitPartnerWorkspaceCounts',
           'createPartnerCompanyInvitation','previewPartnerCompanyInvitation',
           'acceptPartnerCompanyInvitation','sendMissingReportReminders']){
            if(!names.some(s=>s===name||s.endsWith('/'+name)))throw Error('STOP_ORIGINAL_FUNCTION_MISSING_'+name);
          }
          console.log('PASS original financial app and isolated workspace Functions all exist');
          NODE
      - name: Preserve explicit enabled flag for the EXISTING workspace callable
        shell: bash
        run: |
          set -euo pipefail
          test ! -e functions-partner-workspace/.env.sales-management-cc116
          printf 'PARTNER_WORKSPACE_ENABLED=enabled\n' > functions-partner-workspace/.env.sales-management-cc116
          chmod 600 functions-partner-workspace/.env.sales-management-cc116
      - name: Deploy ONLY existing count-read callable, no other Functions or database
        shell: bash
        run: |
          set -euo pipefail
          firebase deploy --non-interactive --project "$FIREBASE_PROJECT_ID" \
            --config firebase.partner-workspace.json \
            --only functions:partner-workspace:getPartnerWorkspace
      - name: Confirm existing callable and anonymous denial, all other Functions preserved
        shell: bash
        run: |
          set -euo pipefail
          firebase functions:list --project "$FIREBASE_PROJECT_ID" --json > "$RUNNER_TEMP/partner-after-functions.json"
          FILE="$RUNNER_TEMP/partner-after-functions.json" node <<'NODE'
          const fs=require('node:fs');
          const result=JSON.parse(fs.readFileSync(process.env.FILE,'utf8')).result||[];
          const names=result.map(x=>x.id||x.name||'');
          for(const name of ['getPartnerWorkspace','managePartnerWorkspace','acceptPartnerWorkspaceInvite',
           'submitPartnerWorkspaceCounts','createPartnerCompanyInvitation','sendMissingReportReminders']){
           if(!names.some(s=>s===name||s.endsWith('/'+name)))throw Error('STOP_FUNCTION_MISSING_AFTER_'+name);
          }
          console.log('PASS existing Functions retained');
          NODE
          node <<'NODE'
          (async()=>{
           const url='https://asia-northeast1-sales-management-cc116.cloudfunctions.net/getPartnerWorkspace';
           const r=await fetch(url,{method:'POST',
             headers:{'Content-Type':'application/json'},body:JSON.stringify({data:{date:'2026-10-31'}})});
           if(![401,403].includes(r.status))throw Error('UNAUTHENTICATED_READ_MUST_FAIL_'+r.status);
           console.log('PASS anonymous count API rejected '+r.status);
          })().catch(e=>{console.error(e.message);process.exitCode=1});
          NODE
