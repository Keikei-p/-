name: Partner money-free and original navigation regression (no deploy)
on:
  push:
    branches:
      - test/partner-finance-and-native-menu-regressions-20261102
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test partner money isolation and native dashboard details
        run: node --test tests/partner-money-free-workspace.test.cjs tests/partner-one-login-same-app.test.cjs tests/partner-repeat-login-cb-parity.test.mjs tests/sales-regressions.cjs
