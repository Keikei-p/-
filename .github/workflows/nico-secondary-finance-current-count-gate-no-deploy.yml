name: NICO finance fence + current count save compatibility (DEMO ONLY / NO DEPLOY)
on:
  pull_request:
    branches: [main]
    paths:
      - 'security/secondary-finance-read-fence.mjs'
      - 'functions-partner-workspace/service.cjs'
      - 'functions-partner-workspace/index.js'
      - 'functions-partner-workspace/submission-publication-guard.cjs'
      - 'tests/secondary-finance-read-fence-emulator.test.mjs'
      - 'tests/secondary-finance-counts-integration-emulator.test.mjs'
      - '.github/workflows/nico-secondary-finance-current-count-gate-no-deploy.yml'
  push:
    branches: [main]
    paths:
      - 'security/secondary-finance-read-fence.mjs'
      - 'functions-partner-workspace/service.cjs'
      - 'functions-partner-workspace/index.js'
      - 'functions-partner-workspace/submission-publication-guard.cjs'
      - 'tests/secondary-finance-read-fence-emulator.test.mjs'
      - 'tests/secondary-finance-counts-integration-emulator.test.mjs'
      - '.github/workflows/nico-secondary-finance-current-count-gate-no-deploy.yml'
permissions:
  contents: read
jobs:
  finance-and-count-synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      FIREBASE_PROJECT_ID: demo-nico-secondary-finance-fence
      GCLOUD_PROJECT: demo-nico-secondary-finance-fence
      GOOGLE_CLOUD_PROJECT: demo-nico-secondary-finance-fence
      FIREBASE_SERVICE_ACCOUNT_JSON: ''
      GOOGLE_APPLICATION_CREDENTIALS: ''
      NICO_RULES_APPROVAL: ''
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Lock exact existing finance and partner source files with zero production credentials
        shell: bash
        run: |
          set -euo pipefail
          test "$FIREBASE_PROJECT_ID" = 'demo-nico-secondary-finance-fence'
          test "$GCLOUD_PROJECT" = 'demo-nico-secondary-finance-fence'
          test "$GOOGLE_CLOUD_PROJECT" = 'demo-nico-secondary-finance-fence'
          test -z "$GOOGLE_APPLICATION_CREDENTIALS"
          test -z "$FIREBASE_SERVICE_ACCOUNT_JSON"
          test -z "$NICO_RULES_APPROVAL"
          test "$(git hash-object firestore.rules)" = d9f4df6a2ac0f8b5720534a2461ec66b94379190
          test "$(git hash-object index.html)" = 88ef5636bfe9254e71f2109d452b6d3049f99861
          test "$(git hash-object functions/index.js)" = dfb4c48ada6fa89a24c898cd4a2f911bcede822f
          test "$(git hash-object functions-partner-workspace/service.cjs)" = 614f3216e008642ddf5eda6b93c35cc0469557c3
          test "$(git hash-object functions-partner-workspace/index.js)" = 90d51246477cf5cfa6966f3e822326ef06cccd0f
          test "$(git hash-object functions-partner-workspace/submission-publication-guard.cjs)" = c9335a3c56083c9ed48530f593db5bbb0f176736
          node --check security/secondary-finance-read-fence.mjs
          node --check tests/secondary-finance-counts-integration-emulator.test.mjs
          node --check tests/secondary-finance-read-fence-emulator.test.mjs
          node security/secondary-finance-read-fence.mjs --check
          node --test tests/secondary-finance-read-fence-emulator.test.mjs
          node --test tests/partner-submission-publication-guard.test.mjs tests/partner-workspace.test.cjs
      - name: Install only dependencies for a localhost Firestore emulator
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix tests --ignore-scripts --no-audit --no-fund
          npm install --prefix functions-partner-workspace --ignore-scripts --no-audit --no-fund --package-lock=false
          npm install --global firebase-tools@15.34.1 --no-audit --no-fund
      - name: Prove partner finance GET and LIST denied while count submit/correction works
        shell: bash
        run: |
          set -euo pipefail
          firebase emulators:exec --project demo-nico-secondary-finance-fence --only firestore \
            'node --test --test-concurrency=1 tests/secondary-finance-read-fence-emulator.test.mjs tests/secondary-finance-counts-integration-emulator.test.mjs'
          echo 'PASS_DEMO_FINANCE_DENY_AND_REAL_SERVICE_COUNT_SAVE_CORRECT'
          echo 'NO_PRODUCTION_FIRESTORE_WRITES_NO_RULES_DEPLOY_NO_FUNCTIONS_DEPLOY'
