name: Staged finance locked Rules emulator (never production)
on:
  pull_request:
    branches: [main]
    paths:
      - 'cloudflare-finance/finance-locked.rules'
      - 'cloudflare-finance/tests/finance-locked-rules.test.cjs'
      - 'cloudflare-finance/tests/finance-locked-partner-markers.test.mjs'
      - 'security/finance-phase2-read-boundary.mjs'
      - 'tests/finance-rule-generation.test.mjs'
      - '.github/workflows/finance-locked-safety-emulator.yml'
permissions:
  contents: read
jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Explicitly DENY accidental credentials or live Firebase use.
      FIREBASE_PROJECT_ID: demo-finance-staging
      GOOGLE_CLOUD_PROJECT: demo-finance-staging
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify synthetic source-only finance guards
        run: |
          node --test tests/finance-rule-generation.test.mjs
          node --test cloudflare-finance/tests/finance-locked-partner-markers.test.mjs
      - name: Install isolated Firebase emulator packages
        run: |
          npm install --prefix cloudflare-finance/tests --ignore-scripts --no-save --package-lock=false --no-audit --no-fund firebase@12.19.0 @firebase/rules-unit-testing@5.0.1
          npm install --global firebase-tools@15.34.1 --ignore-scripts --no-audit --no-fund
      - name: Run staged finance Rules with synthetic owner/partner/other-company accounts
        run: |
          test "$FIREBASE_PROJECT_ID" = "demo-finance-staging"
          firebase emulators:exec --project demo-finance-staging --only firestore "node --test cloudflare-finance/tests/finance-locked-rules.test.cjs"
