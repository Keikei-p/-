name: NICO primary handoff actual service + Rules emulator (NO DEPLOY)
on:
  push:
    branches: [test/partner-handoff-real-service-rules-20261107]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  exact-handoff-no-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FIREBASE_PROJECT_ID: demo-nico-secondary-handoff
      GCLOUD_PROJECT: demo-nico-secondary-handoff
      FIREBASE_SERVICE_ACCOUNT_JSON: ""
      GOOGLE_APPLICATION_CREDENTIALS: ""
      NICO_USAGE_APPROVAL: ""
      NICO_PHASE1_INDEPENDENT_SIGNOFF: ""
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Pin main source and fail on any unreviewed source modification
        shell: bash
        run: |
          set -euo pipefail
          test "$FIREBASE_PROJECT_ID" = demo-nico-secondary-handoff
          test "$GCLOUD_PROJECT" = demo-nico-secondary-handoff
          test -z "$FIREBASE_SERVICE_ACCOUNT_JSON"
          test -z "$GOOGLE_APPLICATION_CREDENTIALS"
          test -z "$NICO_USAGE_APPROVAL"
          test -z "$NICO_PHASE1_INDEPENDENT_SIGNOFF"
          git fetch --no-tags origin main
          git cat-file -e 9632ea4bc063f165e0197a65f068e6d4529c4410^{commit}
          test "$(git merge-base HEAD 9632ea4bc063f165e0197a65f068e6d4529c4410)" = 9632ea4bc063f165e0197a65f068e6d4529c4410
          git diff --name-only 9632ea4bc063f165e0197a65f068e6d4529c4410...HEAD >/tmp/handoff-changes
          while IFS= read -r p; do
            case "$p" in
              tests/partner-secondary-primary-handoff-staging.test.cjs|.github/workflows/nico-real-handoff-emulator-only.yml|docs/PARTNER_PRIMARY_HANDOFF_EXACT_EMULATOR_20261107.md) ;;
              *) echo "HANDOFF_UNREVIEWED_SOURCE: $p"; exit 1 ;;
            esac
          done < /tmp/handoff-changes
          test "$(wc -l </tmp/handoff-changes)" -eq 3
          git diff --exit-code 9632ea4bc063f165e0197a65f068e6d4529c4410 HEAD -- firestore.rules index.html functions functions-partner-workspace functions-partner-quick staging partner-workspace.html
      - name: JS syntax and synthetic identity, member and count tests
        run: |
          set -euo pipefail
          node --check tests/partner-secondary-primary-handoff-staging.test.cjs
          node --test \
            tests/partner-secondary-primary-handoff-staging.test.cjs \
            tests/partner-primary-handoff-mobile-preview-staging.test.cjs \
            tests/partner-workspace.test.cjs \
            tests/partner-money-free-workspace.test.cjs \
            tests/internal-owner-finance-visibility.test.cjs \
            tests/sales-regressions.cjs
      - name: Install only emulator dependencies on demo project
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix tests --ignore-scripts --no-audit --no-fund
          npm install --global firebase-tools@15.34.1 --no-audit --no-fund
      - name: Execute real STAGED handoff service and finance GET LIST under current Firestore emulator Rules
        shell: bash
        run: |
          set -euo pipefail
          firebase emulators:exec --project demo-nico-secondary-handoff --only firestore 'node --test --test-concurrency=1 tests/partner-secondary-primary-handoff-staging.test.cjs tests/finance-secondary-handoff-raw-access-emulator.test.cjs'
      - name: Final certification limited to local demo fixtures
        run: |
          echo 'REAL_STAGED_SERVICE_COMMIT_EMULATOR_VERIFIED=true'
          echo 'LIVE_PARTNER_USER_FINANCE_GET_LIST_PROVED=false'
          echo 'PARTNER_PRIMARY_HANDOFF_DEPLOYED=false'
          echo 'PRODUCTION_DOCUMENT_WRITES=0'
          echo 'PRODUCTION_DEPLOYED=false'
