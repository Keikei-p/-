name: Finance Boundary Preflight
on:
  pull_request:
    branches: [main]
    paths:
      - 'security/**'
      - 'cloudflare-finance/client/finance-browser-contract.mjs'
      - 'cloudflare-finance/tests/finance-browser-contract.test.mjs'
      - 'cloudflare-finance/tests/sales-integration.test.mjs'
      - 'cloudflare-finance/tests/protected-view-runtime.test.mjs'
      - 'scripts/check-finance-read-boundary-before-deploy.mjs'
      - 'tests/finance-release-gate.test.mjs'
      - '.github/workflows/firebase-production-deploy.yml'
      - 'tests/historical-price-audit.test.mjs'
      - 'tests/public-*.test.mjs'
      - 'tests/finance-*.test.mjs'
      - 'tests/firebase-id-token-verifier.test.mjs'
      - 'tests/staged-count-gateway.test.mjs'
      - 'tests/trusted-*.test.mjs'
      - 'tests/reconcile-projections.test.mjs'
      - '.github/workflows/finance-boundary-preflight.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test finance-free projections and rank-only results
        run: node --test tests/public-projection.test.mjs tests/reconcile-projections.test.mjs tests/trusted-finance-view.test.mjs tests/public-count-api.test.mjs tests/public-count-firestore-reader.test.mjs tests/firebase-id-token-verifier.test.mjs tests/trusted-membership-loader.test.mjs tests/staged-count-gateway.test.mjs tests/trusted-partner-write-context.test.mjs tests/finance-rule-generation.test.mjs
      - name: Test safe browser finance projection without exposing arbitrary fields
        run: |
          node --check cloudflare-finance/client/finance-browser-contract.mjs
          node --test cloudflare-finance/tests/finance-browser-contract.test.mjs cloudflare-finance/tests/sales-integration.test.mjs cloudflare-finance/tests/protected-view-runtime.test.mjs
      - name: Check historic CB and saved tariff drift without touching Firebase
        run: node --test tests/historical-price-audit.test.mjs
      - name: Confirm unsafe current money Rules remain blocked from deployment
        run: |
          node --check scripts/check-finance-read-boundary-before-deploy.mjs
          node --test tests/finance-release-gate.test.mjs
      - name: Parse staged source
        run: |
          node --check security/public-projection.mjs
          node --check security/prepare-projection.mjs
          node --check security/reconcile-projections.mjs
          node --check security/trusted-finance-view.mjs
          node --check security/public-count-api.mjs
          node --check security/public-count-firestore-reader.mjs
          node --check security/firebase-id-token-verifier.mjs
          node --check security/trusted-membership-loader.mjs
          node --check security/staged-count-gateway.mjs
          node --check security/trusted-partner-write-context.mjs
          node --check security/finance-phase2-read-boundary.mjs
          node --check security/historical-price-audit.mjs

  finance-phase2-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install isolated Firestore emulator test packages
        run: npm install --prefix tests --ignore-scripts --no-audit --no-fund --package-lock=false
      - name: Verify candidate Rules deny every partner and unknown marker
        run: npx --yes firebase-tools emulators:exec --only firestore --project demo-sales-public-boundary "node --test tests/finance-phase2-read-boundary.test.mjs"
      - name: Confirm production Rules path was not changed by staging tests
        run: node -e "if(require('./firebase.json').firestore.rules!=='firestore.rules')process.exit(1)"
