name: Finance Boundary Preflight
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test finance-free projections and rank-only results
        run: node --test tests/public-projection.test.mjs tests/reconcile-projections.test.mjs tests/trusted-finance-view.test.mjs tests/public-count-api.test.mjs
      - name: Parse staged source
        run: |
          node --check security/public-projection.mjs
          node --check security/prepare-projection.mjs
          node --check security/reconcile-projections.mjs
          node --check security/trusted-finance-view.mjs
          node --check security/public-count-api.mjs
