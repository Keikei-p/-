name: NICO active secondary partner finance read fence (EMULATOR ONLY)
on:
  push:
    branches: [security/secondary-partner-finance-read-fence-candidate-20261107]
  pull_request:
    branches: [main]
    paths:
      - 'security/secondary-finance-read-fence.mjs'
      - 'tests/secondary-finance-read-fence-emulator.test.mjs'
      - 'tests/secondary-finance-counts-integration-emulator.test.mjs'
      - '.github/workflows/nico-secondary-finance-read-fence-no-deploy.yml'
      - 'docs/SECONDARY_FINANCE_FENCE_READINESS_20261107.md'
permissions:
  contents: read
jobs:
  isolated-finance:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    env:
      FIREBASE_PROJECT_ID: demo-nico-secondary-finance-fence
      GCLOUD_PROJECT: demo-nico-secondary-finance-fence
      FIREBASE_SERVICE_ACCOUNT_JSON: ""
      GOOGLE_APPLICATION_CREDENTIALS: ""
      NICO_RULES_APPROVAL: ""
      NICO_PHASE1_INDEPENDENT_SIGNOFF: ""
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Prove exact reviewed main ancestry and four-file-only source changes
        shell: bash
        run: |
          set -euo pipefail
          test "$FIREBASE_PROJECT_ID" = demo-nico-secondary-finance-fence
          test "$GCLOUD_PROJECT" = demo-nico-secondary-finance-fence
          test -z "$FIREBASE_SERVICE_ACCOUNT_JSON"
          test -z "$GOOGLE_APPLICATION_CREDENTIALS"
          test -z "$NICO_RULES_APPROVAL"
          test -z "$NICO_PHASE1_INDEPENDENT_SIGNOFF"
          git fetch --no-tags origin main
          # The previous fixed SHA becomes stale after unrelated approved merges.
          # Review only this PR against the actual current main merge base.
          test "$(git merge-base HEAD origin/main)" = "$(git rev-parse origin/main)"
          git diff --name-only origin/main...HEAD >/tmp/fin-changes
          cat /tmp/fin-changes
          while IFS= read -r path; do
            case "$path" in
              security/secondary-finance-read-fence.mjs|tests/secondary-finance-read-fence-emulator.test.mjs|tests/secondary-finance-counts-integration-emulator.test.mjs|.github/workflows/nico-secondary-finance-read-fence-no-deploy.yml|docs/SECONDARY_FINANCE_FENCE_READINESS_20261107.md) ;;
              *) echo "UNREVIEWED_FINANCE_CHANGE: $path"; exit 1 ;;
            esac
          done < /tmp/fin-changes
          test -s /tmp/fin-changes
          test "$(wc -l </tmp/fin-changes)" -le 4
          git diff --exit-code origin/main HEAD -- firestore.rules firebase.json index.html functions functions-partner-workspace functions-partner-quick finance-boundary-check.html
      - name: Source syntax, original Rules fingerprint and preflight
        run: |
          set -euo pipefail
          node --check security/secondary-finance-read-fence.mjs
          node --check tests/secondary-finance-read-fence-emulator.test.mjs
          node --check tests/secondary-finance-counts-integration-emulator.test.mjs
          node security/secondary-finance-read-fence.mjs --check
          node --test tests/secondary-finance-read-fence-emulator.test.mjs
          # The existing Callable is the count-only path: freeze its save,
          # correction, ranking and no-money regressions before any Rules cutover.
          node --test tests/partner-workspace.test.cjs tests/partner-money-free-workspace.test.cjs
      - name: Install offline demo emulator dependencies only
        run: |
          set -euo pipefail
          npm install --prefix tests --ignore-scripts --no-audit --no-fund
          npm install --prefix functions-partner-workspace --ignore-scripts --no-audit --no-fund
          npm install --global firebase-tools@15.34.1 --no-audit --no-fund
      - name: Real Firestore Rules financial read AND raw-write denial on local demo emulator
        run: |
          set -euo pipefail
          firebase emulators:exec --project demo-nico-secondary-finance-fence --only firestore 'node --test --test-concurrency=1 tests/secondary-finance-read-fence-emulator.test.mjs tests/secondary-finance-counts-integration-emulator.test.mjs'
      - name: Synthetic tests only, NO production release approval
        run: |
          echo 'OLD_INTERNAL_FINANCE_PATH_FENCED_IN_STAGING_ONLY=true'
          echo 'LEGACY_INTERNAL_COUNT_UI_CONTINUITY_PROVED=false'
          echo 'COUNT_ONLY_CALLABLE_SYNTHETIC_SAVE_CORRECTION_TESTED=true'
          echo 'RULES_AND_SERVER_COUNT_INTEGRATION_EMULATOR_ONLY=true'
          echo 'PRODUCTION_DOCUMENT_WRITES=0'
          echo 'PRODUCTION_RULES_WRITES=0'
          echo 'ACTIVE_SECONDARY_RAW_FINANCE_WRITE_DENIED_IN_EMULATOR=true'
          echo 'PRODUCTION_DEPLOYED=false'
          echo 'REAL_UID_FINANCE_GET_LIST_PROVED=false'
