name: NICO partner dashboard company-team parity (NO DEPLOY)
on:
  pull_request:
    branches: [integration/nico-sales-count-publication-rank-ready-20261113]
    paths:
      - index.html
      - partner-workspace.html
      - tests/partner-original-team-card-parity.test.mjs
      - tests/partner-money-free-workspace.test.cjs
      - .github/workflows/nico-partner-dashboard-parity-20261115-no-deploy.yml
permissions:
  contents: read
concurrency:
  group: partner-dashboard-parity-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true
jobs:
  count-only-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regress company-team-member-product parity and finance-free reads
        shell: bash
        run: |
          set -euo pipefail
          test -z "${GOOGLE_APPLICATION_CREDENTIALS:-}"
          test -z "${FIREBASE_SERVICE_ACCOUNT_JSON:-}"
          node --test tests/partner-original-team-card-parity.test.mjs tests/partner-money-free-workspace.test.cjs
          echo PARTNER_DASHBOARD_COUNT_ONLY_PARITY_PASS
