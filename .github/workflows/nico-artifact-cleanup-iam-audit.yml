name: NICO Artifact Registry permissions and cleanup proof (read only)
on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/production/audit-artifact-cleanup-iam.mjs'
      - 'tests/audit-artifact-cleanup-iam.test.mjs'
      - '.github/workflows/nico-artifact-cleanup-iam-audit.yml'
  push:
    branches: [main]
    paths:
      - 'tools/production/audit-artifact-cleanup-iam.mjs'
      - 'tests/audit-artifact-cleanup-iam.test.mjs'
      - '.github/workflows/nico-artifact-cleanup-iam-audit.yml'
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify no-write audit and policy JSON contract
        run: |
          node --check tools/production/audit-artifact-cleanup-iam.mjs
          node --test tests/audit-artifact-cleanup-iam.test.mjs
      - name: No live credentials in unmerged PR
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          test -z "${FIREBASE_SERVICE_ACCOUNT_JSON:-}"
          test -z "${GOOGLE_APPLICATION_CREDENTIALS:-}"
  live:
    needs: offline
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify Firebase project and immutable read-only scope
        run: |
          node -e "if(JSON.parse(require('fs').readFileSync('.firebaserc','utf8')).projects.default!=='sales-management-cc116')process.exit(1)"
          node --test tests/audit-artifact-cleanup-iam.test.mjs
      - name: Install existing Firebase Admin SDK offline-safe (runner only)
        run: npm install --prefix functions --ignore-scripts --package-lock=false --no-audit --no-fund
      - name: Provide existing authorized service identity to runner only
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          test -n "$FIREBASE_SERVICE_ACCOUNT_JSON"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/nico-artifact-audit-sa.json"
          chmod 600 "$RUNNER_TEMP/nico-artifact-audit-sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/nico-artifact-audit-sa.json" >> "$GITHUB_ENV"
      - name: READ ONLY - repository GET and IAM permission query, print booleans only
        run: node tools/production/audit-artifact-cleanup-iam.mjs
      - name: Remove temporary service key
        if: always()
        run: rm -f "$RUNNER_TEMP/nico-artifact-audit-sa.json"
