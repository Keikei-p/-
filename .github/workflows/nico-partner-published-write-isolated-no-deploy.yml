name: NICO partner published input and historical counts isolated (STAGING / NO DEPLOY)
on:
  pull_request:
    branches: [main]
    paths:
      - functions-partner-workspace/submission-publication-guard.cjs
      - functions-partner-workspace/shared-count-standings.cjs
      - tests/partner-publication-write-ranking-consistency.test.cjs
      - tests/partner-off-only-zero-rank-protection.test.cjs
      - .github/workflows/nico-partner-published-write-isolated-no-deploy.yml
      - tests/approved-partner-count-standings.test.cjs
      - ranking/approved-published-categories.mjs
      - ranking/partner-submission-publication-guard.mjs
      - scripts/ci/review-partner-published-write-isolated.cjs
      - .github/workflows/nico-partner-company-code-release.yml
      - .github/workflows/nico-partner-publication-write-integration-no-deploy.yml
      - .github/workflows/nico-secondary-finance-current-count-gate-no-deploy.yml
      - .github/workflows/nico-verified-partner-count-standings-no-deploy.yml
permissions:
  contents: read
jobs:
  partner-published-scope:
    name: verify-off-deny-and-historical-counts-no-deploy
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GOOGLE_APPLICATION_CREDENTIALS: ''
      FIREBASE_SERVICE_ACCOUNT_JSON: ''
      FIREBASE_TOKEN: ''
      NICO_PARTNER_COUNT_PUBLICATION_WRITE_ENABLED: ''
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact source and CI repair scope, no credentials or release flags
        shell: bash
        run: |
          set -euo pipefail
          test -z "$GOOGLE_APPLICATION_CREDENTIALS"
          test -z "$FIREBASE_SERVICE_ACCOUNT_JSON"
          test -z "$FIREBASE_TOKEN"
          test -z "$NICO_PARTNER_COUNT_PUBLICATION_WRITE_ENABLED"
          if [ "${GITHUB_EVENT_NAME:-}:${GITHUB_HEAD_REF:-}" = "pull_request:integration/nico-sales-count-publication-rank-ready-20261113" ]; then
            node scripts/ci/review-integrated-count-candidate.cjs
            grep -Fq 'submissionPublicationEnabled=()=>false' functions-partner-workspace/service.cjs
            grep -Fq 'enabled=()=>false' functions-partner-workspace/service.cjs
            for file in functions-partner-workspace/submission-publication-guard.cjs functions-partner-workspace/shared-count-standings.cjs tests/partner-publication-write-ranking-consistency.test.cjs tests/partner-off-only-zero-rank-protection.test.cjs; do
              node --check "$file"
            done
            exit 0
          fi
          git fetch --no-tags origin main
          # PR-only review for the exact, disabled partner four-rank host.
          # Production, historical Owner and manual release conditions stay
          # under their original strict checks below.
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ] &&
             [ "${GITHUB_HEAD_REF:-}" = "review/partner-inline-four-rank-original-screen-off-20261115" ]; then
            test "$(git hash-object scripts/ci/review-partner-original-joint-four-rank-no-deploy.cjs)" = 5655eb5b332574909077bef1acdd04af9cf54822
            node scripts/ci/review-partner-original-joint-four-rank-no-deploy.cjs
            node --test tests/partner-inline-joint-staging-wiring.test.mjs tests/partner-inline-joint-original-preservation.test.mjs tests/verified-joint-count-host-wiring.test.mjs
            echo 'EXACT_PARTNER_EXISTING_RANK_CARDS_WITH_UNMODIFIED_FINANCE_COUNT_SOURCE_NO_DEPLOY'
            exit 0
          fi
          while IFS= read -r path; do
            case "$path" in
              functions-partner-workspace/submission-publication-guard.cjs|functions-partner-workspace/shared-count-standings.cjs|tests/partner-publication-write-ranking-consistency.test.cjs|tests/partner-off-only-zero-rank-protection.test.cjs|.github/workflows/nico-partner-published-write-isolated-no-deploy.yml|tests/approved-partner-count-standings.test.cjs|ranking/approved-published-categories.mjs|ranking/partner-submission-publication-guard.mjs|scripts/ci/review-partner-published-write-isolated.cjs|.github/workflows/nico-partner-company-code-release.yml|.github/workflows/nico-partner-publication-write-integration-no-deploy.yml|.github/workflows/nico-secondary-finance-current-count-gate-no-deploy.yml|.github/workflows/nico-verified-partner-count-standings-no-deploy.yml) ;;
              *) echo "STOP_UNREVIEWED_SCOPE: $path"; exit 1 ;;
            esac
          done < <(git diff --name-only origin/main...HEAD)
          node scripts/ci/review-partner-published-write-isolated.cjs --sources-only
          grep -Fq 'submissionPublicationEnabled=()=>false' functions-partner-workspace/service.cjs
          # The current main has not registered the V3 Owner correction writer.
          # Keep the existing workspace and publication paths disabled.
          grep -Fq 'enabled=()=>false' functions-partner-workspace/service.cjs
          for file in functions-partner-workspace/submission-publication-guard.cjs functions-partner-workspace/shared-count-standings.cjs tests/partner-publication-write-ranking-consistency.test.cjs tests/partner-off-only-zero-rank-protection.test.cjs; do
            node --check "$file"
          done
      - name: Test approved ON OFF and historical ledger preservation
        run: |
          node --test tests/partner-publication-write-ranking-consistency.test.cjs tests/partner-off-only-zero-rank-protection.test.cjs
          echo 'PARTNER_ON_OFF_COUNT_WRITE_GUARD_ISOLATED_PASS_NO_DEPLOY'
      - name: Keep original partner flows and source records intact
        run: |
          node --test tests/partner-existing-ranking.test.cjs
          echo 'NO_FIREBASE_DATA_WRITES_OR_DEPLOY'
