name: NICO company-code partner controlled complete release
on:
  pull_request:
    branches: [main]
    paths:
      - 'functions-partner-workspace/**'
      - 'partner-workspace.html'
      - 'tests/partner-company-code-auth.test.cjs'
      - '.github/workflows/nico-partner-company-code-release.yml'
  workflow_dispatch:
    inputs:
      project_id:
        description: 'sales-management-cc116'
        required: true
        type: string
      confirm_backup_restore:
        description: 'FIRESTORE_BACKUP_RESTORE_VERIFIED'
        required: true
        type: string
      confirm_owner_finance:
        description: 'OWNER_REVENUE_PRICES_LOGIN_VERIFIED'
        required: true
        type: string
      confirm_billing:
        description: 'EXISTING_FUNCTIONS_COST_APPROVED'
        required: true
        type: string
      confirm_release:
        description: 'CONFIRM_COMPANY_CODE_PARTNER_COUNT_ONLY'
        required: true
        type: string
permissions:
  contents: read
# PR checks must never block or be cancelled by an unrelated legacy
# production workspace workflow. The release job itself shares the production
# lock so that no partial workspace backend update can run concurrently.
concurrency:
  group: nico-company-code-review-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify reviewed source, financial guard and all count regression suites
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object functions-partner-workspace/service.cjs)" = 'a23a950ba905ca7f73a8a160fb861c611ed45304'
          test "$(git hash-object functions-partner-workspace/index.js)" = '38da7e9174ffea7c406c92292dccfc651b565eb0'
          test "$(git hash-object functions-partner-workspace/company-code-auth.cjs)" = 'f7e5899cdb9e36da610846d787955b13c1e16e4b'
          test "$(git hash-object partner-workspace.html)" = '0930abb188165afea19ef427308ea22fddf636e7'
          test "$(git hash-object functions/index.js)" = 'dfb4c48ada6fa89a24c898cd4a2f911bcede822f'
          test "$(git hash-object firebase.partner-workspace.json)" = 'a6ceedec5fab4e22e0a8efe19c685716a2db9750'
          node --check functions-partner-workspace/index.js
          node --check functions-partner-workspace/service.cjs
          node --check functions-partner-workspace/company-code-auth.cjs
          node --test tests/partner-company-code-auth.test.cjs
          node --test tests/partner-workspace.test.cjs
          node --test tests/partner-money-free-workspace.test.cjs
          node --test tests/partner-count-dashboard.test.cjs
          node --test tests/internal-owner-finance-visibility.test.cjs
          node --test tests/partner-existing-ranking.test.cjs
          node --test tests/surgical-existing-partner-workspace.test.mjs
          node --test tests/audit-artifact-cleanup-iam.test.mjs
          node - <<'NODE'
          const fs=require('node:fs');
          const cfg=JSON.parse(fs.readFileSync('firebase.partner-workspace.json','utf8'));
          const project=JSON.parse(fs.readFileSync('.firebaserc','utf8')).projects.default;
          if(project!=='sales-management-cc116'||cfg.functions.source!=='functions-partner-workspace'||
             cfg.functions.codebase!=='partner-workspace')throw Error('STOP_WRONG_SCOPE');
          const html=fs.readFileSync('partner-workspace.html','utf8'),
                backend=fs.readFileSync('functions-partner-workspace/service.cjs','utf8'),
                auth=fs.readFileSync('functions-partner-workspace/company-code-auth.cjs','utf8');
          if(/firebase-firestore\.js|\bgetFirestore\s*\(/.test(html)||
             /\.collection\s*\(\s*["'](?:records|products|recordCorrections|revenueGoals)["']\s*\)/.test(backend)||
             /\btx\.delete\s*\(|recursiveDelete/.test(backend+auth))
           throw Error('STOP_FINANCE_OR_DESTRUCTIVE_CHANGE');
          const x=html.match(/<script type="module">([\s\S]*?)<\/script>/)?.[1];
          if(!x)throw Error('STOP_HTML_MODULE_MISSING');
          fs.writeFileSync('/tmp/nico-partner-code-login-ui.mjs',x);
          NODE
          node --check /tmp/nico-partner-code-login-ui.mjs
  release:
    concurrency:
      group: nico-partner-workspace-production
      cancel-in-progress: false
    needs: validate
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && needs.validate.result == 'success' && inputs.project_id == 'sales-management-cc116' && inputs.confirm_backup_restore == 'FIRESTORE_BACKUP_RESTORE_VERIFIED' && inputs.confirm_owner_finance == 'OWNER_REVENUE_PRICES_LOGIN_VERIFIED' && inputs.confirm_billing == 'EXISTING_FUNCTIONS_COST_APPROVED' && inputs.confirm_release == 'CONFIRM_COMPANY_CODE_PARTNER_COUNT_ONLY' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FIREBASE_PROJECT_ID: sales-management-cc116
      NICO_PARTNER_RELEASE_CONFIRMATION: CONFIRM_REPLACE_PARTNER_WORKSPACE_ONLY
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Require finance audit and original sales owner protection BEFORE credentials
        shell: bash
        run: |
          set -euo pipefail
          node scripts/check-finance-read-boundary-before-deploy.mjs
          node scripts/nico-production-cutover-preflight.mjs
          node --test tests/internal-owner-finance-visibility.test.cjs
          node --test tests/partner-company-code-auth.test.cjs
      - name: Load existing secured Firebase service identity
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          test -n "$FIREBASE_SERVICE_ACCOUNT_JSON"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/nico-code-sa.json"
          chmod 600 "$RUNNER_TEMP/nico-code-sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/nico-code-sa.json" >> "$GITHUB_ENV"
      - name: Install pinned Firebase CLI and existing Admin SDKs
        shell: bash
        run: |
          set -euo pipefail
          npm install -g firebase-tools@15.34.1 --no-audit --no-fund
          npm install --prefix functions-partner-workspace --ignore-scripts --package-lock=false --no-audit --no-fund
          npm install --prefix functions --ignore-scripts --package-lock=false --no-audit --no-fund
      - name: Verify owner-approved Artifact Registry automatic cleanup; never change IAM
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {runAudit} from './tools/production/audit-artifact-cleanup-iam.mjs';
          const status=await runAudit();
          if(!status.eligibleDeletionPolicy)throw Error('STOP_ARTIFACT_POLICY_NOT_YET_APPROVED');
          console.log('PASS: existing active cleanup policy confirmed read-only');
          NODE
      - name: Snapshot all existing Functions and Firestore rules, read-only
        shell: bash
        run: |
          set -euo pipefail
          firebase functions:list --project "$FIREBASE_PROJECT_ID" --json > "$RUNNER_TEMP/functions-before.json"
          FILE="$RUNNER_TEMP/functions-before.json" node - <<'NODE'
          const items=JSON.parse(require('fs').readFileSync(process.env.FILE,'utf8')).result||[];
          const names=items.map(x=>x.id||x.name||'');
          for(const n of ['getPartnerWorkspace','managePartnerWorkspace','acceptPartnerWorkspaceInvite',
           'submitPartnerWorkspaceCounts','sendMissingReportReminders']){
            if(!names.some(x=>x===n||x.endsWith('/'+n)))throw Error('STOP_OLD_FUNCTION_MISSING_'+n);
          }
          NODE
          node - <<'NODE'
          const fs=require('fs');
          const {createRequire}=require('module');
          const req=createRequire(process.cwd()+'/functions/package.json');
          const {applicationDefault}=req('firebase-admin/app');
          (async()=>{
           const t=(await applicationDefault().getAccessToken()).access_token;
           const u='https://firebaserules.googleapis.com/v1/projects/sales-management-cc116/releases/cloud.firestore';
           const r=await fetch(u,{headers:{Authorization:'Bearer '+t},redirect:'error'});
           if(!r.ok)throw Error('STOP_RULES_PRE_READ_FAILED');
           fs.writeFileSync(process.env.RUNNER_TEMP+'/rules-original.txt',(await r.json()).rulesetName);
          })().catch(e=>{console.error(e.message);process.exitCode=1});
          NODE
          node tools/hosting/surgical-existing-partner-workspace.mjs --dry-run
      - name: Deploy ONLY isolated partner workspace 8 API Functions (four original and four code-auth)
        shell: bash
        run: |
          set -euo pipefail
          test ! -e functions-partner-workspace/.env.sales-management-cc116
          printf 'PARTNER_WORKSPACE_ENABLED=enabled\nPARTNER_COMPANY_CODE_AUTH_ENABLED=enabled\n' > functions-partner-workspace/.env.sales-management-cc116
          chmod 600 functions-partner-workspace/.env.sales-management-cc116
          firebase deploy --project "$FIREBASE_PROJECT_ID" --non-interactive \
            --config firebase.partner-workspace.json \
            --only functions:partner-workspace:getPartnerWorkspace,functions:partner-workspace:managePartnerWorkspace,functions:partner-workspace:acceptPartnerWorkspaceInvite,functions:partner-workspace:submitPartnerWorkspaceCounts,functions:partner-workspace:issuePartnerCompanyCode,functions:partner-workspace:activatePartnerCompanyCode,functions:partner-workspace:loginPartnerCompanyCode,functions:partner-workspace:logoutPartnerCompanyCode
      - name: Verify all old Functions remain and anonymous calls fail
        shell: bash
        run: |
          set -euo pipefail
          firebase functions:list --project "$FIREBASE_PROJECT_ID" --json > "$RUNNER_TEMP/functions-after.json"
          BEFORE="$RUNNER_TEMP/functions-before.json" AFTER="$RUNNER_TEMP/functions-after.json" node - <<'NODE'
          const fs=require('fs');
          const ids=p=>(JSON.parse(fs.readFileSync(p,'utf8')).result||[]).map(x=>x.id||x.name||'');
          const before=ids(process.env.BEFORE),after=ids(process.env.AFTER);
          for(const f of before)if(!after.includes(f))throw Error('STOP_PREEXISTING_FUNCTION_REMOVED');
          for(const f of ['getPartnerWorkspace','managePartnerWorkspace','acceptPartnerWorkspaceInvite',
           'submitPartnerWorkspaceCounts','sendMissingReportReminders','issuePartnerCompanyCode',
           'activatePartnerCompanyCode','loginPartnerCompanyCode','logoutPartnerCompanyCode'])
           if(!after.some(x=>x===f||x.endsWith('/'+f)))throw Error('STOP_FUNCTION_NOT_PRESENT_'+f);
          console.log('PASS: all preexisting Functions retained and eight workspace Functions present');
          NODE
          node - <<'NODE'
          (async()=>{
            for(const name of ['issuePartnerCompanyCode','activatePartnerCompanyCode',
              'loginPartnerCompanyCode','logoutPartnerCompanyCode']){
              const r=await fetch('https://asia-northeast1-sales-management-cc116.cloudfunctions.net/'+name,{
                method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({data:{}})});
              if(![400,401,403].includes(r.status))throw Error('STOP_PUBLIC_AUTH_ENDPOINT_'+name+'_'+r.status);
            }
          })().catch(e=>{console.error(e.message);process.exitCode=1});
          NODE
      - name: Verify financial rules never changed before publishing page
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs'),{createRequire}=require('module');
          const req=createRequire(process.cwd()+'/functions/package.json');
          const {applicationDefault}=req('firebase-admin/app');
          (async()=>{
           const t=(await applicationDefault().getAccessToken()).access_token;
           const u='https://firebaserules.googleapis.com/v1/projects/sales-management-cc116/releases/cloud.firestore';
           const r=await fetch(u,{headers:{Authorization:'Bearer '+t},redirect:'error'});
           if(!r.ok||fs.readFileSync(process.env.RUNNER_TEMP+'/rules-original.txt','utf8')!==(await r.json()).rulesetName)
             throw Error('STOP_FIRESTORE_RULES_CHANGED');
          })().catch(e=>{console.error(e.message);process.exitCode=1});
          NODE
      - name: Publish ONLY partner-workspace.html, preserve all other existing Hosting assets
        run: node tools/hosting/surgical-existing-partner-workspace.mjs --release
      - name: Verify exact live page parity, never claim authenticated E2E without real user
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --max-time 35 "https://nico-factory.web.app/partner-workspace.html?verified_release=$GITHUB_SHA" > "$RUNNER_TEMP/live-partner.html"
          cmp -s "$RUNNER_TEMP/live-partner.html" partner-workspace.html
          for p in / /partner-invite.html /partner-counts.html; do
            test "$(curl -Ls -o /dev/null -w '%{http_code}' --max-time 30 "https://nico-factory.web.app$p")" = 200
          done
          echo 'PASS: only partner workspace page published, existing sales app retained'
      - name: Remove temporary service identity and functions runtime flag
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/nico-code-sa.json" "$RUNNER_TEMP/functions-before.json" "$RUNNER_TEMP/functions-after.json" "$RUNNER_TEMP/rules-original.txt" functions-partner-workspace/.env.sales-management-cc116
