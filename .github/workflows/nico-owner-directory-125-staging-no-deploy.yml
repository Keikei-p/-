name: NICO HQ Owner directory 125+ paging (NO DEPLOY)
on:
  push:
    branches: [feature/partner-owner-directory-125-staging-20261107]
  pull_request:
    branches: [feature/partner-rank-125-staging-20261107]
permissions:
  contents: read
jobs:
  owner-directory-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FIREBASE_PROJECT_ID: demo-sales-support
      FIREBASE_SERVICE_ACCOUNT_JSON: ""
      GOOGLE_APPLICATION_CREDENTIALS: ""
      PARTNER_WORKSPACE_ENABLED: ""
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Freeze ancestor and prevent any app, backend or Rules edits
        shell: bash
        run: |
          set -euo pipefail
          test "$FIREBASE_PROJECT_ID" = demo-sales-support
          test -z "$FIREBASE_SERVICE_ACCOUNT_JSON"
          test -z "$GOOGLE_APPLICATION_CREDENTIALS"
          test -z "$PARTNER_WORKSPACE_ENABLED"
          git fetch --no-tags origin feature/partner-rank-125-staging-20261107
          test "$(git rev-parse origin/feature/partner-rank-125-staging-20261107)" = 324b902ff852ba7a1951376fea5edc89d80b58ae
          git diff --name-only 324b902ff852ba7a1951376fea5edc89d80b58ae...HEAD >/tmp/dir-changes
          cat /tmp/dir-changes
          while IFS= read -r p; do
            case "$p" in
              staging/partner-owner-directory-125/directory.cjs|tests/partner-owner-directory-125-staging.test.cjs|.github/workflows/nico-owner-directory-125-staging-no-deploy.yml|docs/PARTNER_OWNER_DIRECTORY_125_STAGING_20261107.md) ;;
              *) echo "OWNER_DIRECTORY_UNREVIEWED_CHANGE: $p"; exit 1 ;;
            esac
          done < /tmp/dir-changes
          test "$(wc -l </tmp/dir-changes)" -eq 4
          git diff --exit-code 324b902ff852ba7a1951376fea5edc89d80b58ae HEAD -- index.html firestore.rules firestore.indexes.json functions functions-partner-quick functions-partner-workspace ranking partner-workspace.html
      - name: Syntax and regression tests
        run: |
          set -euo pipefail
          node --check staging/partner-owner-directory-125/directory.cjs
          node --check tests/partner-owner-directory-125-staging.test.cjs
          node --test \
            tests/partner-owner-directory-125-staging.test.cjs \
            tests/combined-count-leaderboard.test.mjs \
            tests/combined-rank-only-publication.test.mjs \
            tests/partner-existing-ranking.test.cjs \
            tests/partner-money-free-workspace.test.cjs \
            tests/partner-workspace.test.cjs \
            tests/sales-regressions.cjs
      - name: Confirm staging only
        run: |
          echo 'NO_NEW_CALLABLE_EXPORT=true'
          echo 'PRODUCTION_DOCUMENT_WRITES=0'
          echo 'PRODUCTION_DEPLOYED=false'
          echo 'ACTUAL_150_PARTNER_ACCOUNTS_TESTED=false'
