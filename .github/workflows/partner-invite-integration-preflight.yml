name: Partner invite/currency-free catalog staged integration
on:
  pull_request:
    branches: [main]
    paths:
      - "functions/index.js"
      - "index.html"
      - "tests/partner-company-functions.test.cjs"
      - "security/partner-company-finance-lock.mjs"
      - "tests/partner-finance-lock-emulator.test.mjs"
      - ".github/workflows/partner-invite-integration-preflight.yml"
      - "docs/PARTNER_INVITE_STAGING_STATUS.md"
permissions:
  contents: read
jobs:
  synthetic-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate Firebase Functions syntax without cloud calls
        run: node --check functions/index.js
      - name: Exercise actual callable functions in isolated synthetic Firestore (no Firebase credentials)
        run: node --test tests/partner-company-functions.test.cjs

  finance-rules-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install synthetic-only Firestore rules testing dependencies
        run: npm install --prefix tests --ignore-scripts --no-audit --no-fund
      - name: Verify staging finance rule syntax without deployment
        run: node --check security/partner-company-finance-lock.mjs
      - name: Deny partner finance in localhost Firestore emulator
        run: npx --yes firebase-tools emulators:exec --only firestore --project demo-partner-finance-lock "node --test tests/partner-finance-lock-emulator.test.mjs"
