name: NICO live Owner settings profile & product prerequisites (GET ONLY)
on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/production/audit-owner-setting-identities-readonly.mjs'
      - 'tests/audit-owner-setting-identities-readonly.test.mjs'
      - '.github/workflows/nico-owner-setting-identity-live-readonly.yml'
  push:
    branches: [main]
    paths:
      - 'tools/production/audit-owner-setting-identities-readonly.mjs'
      - 'tests/audit-owner-setting-identities-readonly.test.mjs'
      - '.github/workflows/nico-owner-setting-identity-live-readonly.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nico-owner-identity-live-readonly-${{ github.ref }}
  cancel-in-progress: false
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GOOGLE_APPLICATION_CREDENTIALS: ''
      FIREBASE_SERVICE_ACCOUNT_JSON: ''
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Protect original Firebase project, Rules, count source and Owner code
        shell: bash
        run: |
          set -euo pipefail
          test -z "$GOOGLE_APPLICATION_CREDENTIALS"
          test -z "$FIREBASE_SERVICE_ACCOUNT_JSON"
          test "$(git hash-object firestore.rules)" = d9f4df6a2ac0f8b5720534a2461ec66b94379190
          test "$(git hash-object functions-partner-workspace/service.cjs)" = 614f3216e008642ddf5eda6b93c35cc0469557c3
          test "$(git hash-object functions-ranking-approvals/index.js)" = 54855609e372ee1056b5206e445f20c0a251b1ef
          node --check tools/production/audit-owner-setting-identities-readonly.mjs
          node --test tests/audit-owner-setting-identities-readonly.test.mjs
          node -e "const f=require('fs');if(JSON.parse(f.readFileSync('.firebaserc','utf8')).projects.default!=='sales-management-cc116')process.exit(1)"
          echo OWNER_IDENTITY_PREFLIGHT_ANONYMOUS_PASS
  live-get-only:
    needs: offline
    if: >-
      ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          github.ref == 'refs/heads/main' &&
          github.repository == 'Keikei-p/-' &&
          needs.offline.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      FIREBASE_PROJECT_ID: sales-management-cc116
      NICO_PARTNER_AUDIT_MODE: READ_ONLY
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Check production source and no finance edits
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_SHA" = "$(git rev-parse HEAD)"
          test "$(git hash-object firestore.rules)" = d9f4df6a2ac0f8b5720534a2461ec66b94379190
          node --test tests/audit-owner-setting-identities-readonly.test.mjs
      - name: Install official read-only Firebase SDK without deploy
        run: npm install --prefix functions --ignore-scripts --package-lock=false --no-audit --no-fund
      - name: Existing service identity in temporary private runner, no IAM change
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          test -n "$FIREBASE_SERVICE_ACCOUNT_JSON"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/nico-owner-identity-readonly.private.json"
          chmod 600 "$RUNNER_TEMP/nico-owner-identity-readonly.private.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/nico-owner-identity-readonly.private.json" >> "$GITHUB_ENV"
      - name: LIVE GET-only Owner and partner identity schema, safe product catalog
        shell: bash
        run: |
          set -euo pipefail
          node tools/production/audit-owner-setting-identities-readonly.mjs > "$RUNNER_TEMP/nico-owner-identity-readonly.private.log" 2>&1 || {
            grep -E '^STOP_OWNER_SETTING_IDENTITY_READONLY_[A-Z0-9_]+$' "$RUNNER_TEMP/nico-owner-identity-readonly.private.log" || true
            exit 1
          }
          grep -E '^NICO_OWNER_SETTING_IDENTITY_READINESS ' "$RUNNER_TEMP/nico-owner-identity-readonly.private.log"
          grep -q '"productionDocumentWrites":0' "$RUNNER_TEMP/nico-owner-identity-readonly.private.log"
          grep -q '"safeToEnableJointRanking":false' "$RUNNER_TEMP/nico-owner-identity-readonly.private.log"
          echo NICO_OWNER_IDENTITY_LIVE_GET_ONLY_COMPLETE
      - name: Erase sensitive credential and private audit log
        if: always()
        run: rm -f "$RUNNER_TEMP/nico-owner-identity-readonly.private.json" "$RUNNER_TEMP/nico-owner-identity-readonly.private.log"
