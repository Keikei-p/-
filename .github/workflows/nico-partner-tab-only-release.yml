name: NICO partner tab one-shot reviewed Hosting release
on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/nico-partner-tab-only-release.yml]
  push:
    branches: [main]
    paths: [.github/workflows/nico-partner-tab-only-release.yml]
permissions:
  contents: read
concurrency:
  group: nico-surgical-index-release
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify reviewed index source and additive-only content
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object index.html)" = "c14d87a63a40101c8848f6885e644cf0a0919896" || { echo "STOP: reviewed sales HTML changed"; exit 1; }
          git show 6c6770f6e8692e59568e9b4906e33ed7c9be6773:index.html > "$RUNNER_TEMP/reviewed.html"
          cmp index.html "$RUNNER_TEMP/reviewed.html"
          node <<'NODE'
          const cp=require('node:child_process'),fs=require('node:fs');
          const stats=cp.execFileSync('git',['diff','--numstat',
            'e90a26d777238892c018f323f4e7e0d0724866c3',
            '6c6770f6e8692e59568e9b4906e33ed7c9be6773','--','index.html'],{encoding:'utf8'}).trim();
          if(stats!=='172\t0\tindex.html')throw Error('STOP: unreviewed UI modifications: '+stats);
          const html=fs.readFileSync('index.html','utf8');
          for(const fragment of ['id="quickPartnerButton"','id="partnerCompanyManagement"',
            'function showLegacyFinanceEntryBlocked(mode)','currentCatalogRevenuePerUnit',
            'checkedEntry.mode!=="internal"','mergedPartnerRankingDay'])
            if(!html.includes(fragment))throw Error('STOP: required UI/financial boundary missing');
          console.log('PASS: exact reviewed 172-line addition; zero original lines removed');
          NODE
          node --test tests/simple-partner-company-tab.test.mjs
          node --test tests/sales-regressions.cjs
  release:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.validate.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
      NICO_PARTNER_RELEASE_CONFIRMATION: CONFIRM_ADD_PARTNER_RANKING_INDEX_ONLY
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify current main and exact approved prior live HTML before any write
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api repos/Keikei-p/-/branches/main --jq '.commit.sha')" = "$GITHUB_SHA" || { echo 'STOP: main changed'; exit 1; }
          git show e90a26d777238892c018f323f4e7e0d0724866c3:index.html > "$RUNNER_TEMP/approved-base.html"
          curl -fsSL --retry 3 --max-time 30 -H 'Cache-Control: no-cache' \
            "https://nico-factory.web.app/?partner_tab_baseline=$GITHUB_SHA" -o "$RUNNER_TEMP/live.html"
          if cmp -s "$RUNNER_TEMP/live.html" index.html; then
            echo 'ALREADY_LIVE=true' >> "$GITHUB_ENV"
            echo 'PASS: target index already live'
          elif cmp -s "$RUNNER_TEMP/live.html" "$RUNNER_TEMP/approved-base.html"; then
            echo 'ALREADY_LIVE=false' >> "$GITHUB_ENV"
            echo 'PASS: live site is byte-for-byte verified approved baseline'
          else
            echo 'STOP: production differs from approved source; do not overwrite'
            exit 1
          fi
      - name: Load protected Firebase Hosting credential only
        if: env.ALREADY_LIVE == 'false'
        shell: bash
        run: |
          set -euo pipefail
          test -n "$FIREBASE_SERVICE_ACCOUNT_JSON" || { echo 'STOP: missing credential'; exit 1; }
          node -e "if(JSON.parse(require('fs').readFileSync('.firebaserc','utf8')).projects.default!=='sales-management-cc116')process.exit(1)"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/nico-partner-tab-hosting.json"
          chmod 600 "$RUNNER_TEMP/nico-partner-tab-hosting.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/nico-partner-tab-hosting.json" >> "$GITHUB_ENV"
      - name: Install Hosting REST credential dependency
        if: env.ALREADY_LIVE == 'false'
        run: npm install --prefix functions --ignore-scripts --package-lock=false --no-audit --no-fund
      - name: Read-only dry-run preserves exact previous Hosting manifest
        if: env.ALREADY_LIVE == 'false'
        run: node tools/hosting/surgical-existing-index.mjs --dry-run
      - name: Publish ONLY index.html preserving every other existing Hosting asset
        if: env.ALREADY_LIVE == 'false'
        run: node tools/hosting/surgical-existing-index.mjs --release
      - name: Verify actual Firebase Hosting HTML and pre-existing partner paths
        shell: bash
        run: |
          set -euo pipefail
          ok=false
          for attempt in $(seq 1 12); do
            curl -fsSL --max-time 30 \
              "https://nico-factory.web.app/?partner_tab_verify=$GITHUB_SHA-$attempt" \
              -o "$RUNNER_TEMP/confirmed-index.html"
            if cmp -s "$RUNNER_TEMP/confirmed-index.html" index.html; then ok=true; break; fi
            sleep 5
          done
          test "$ok" = true || { echo 'STOP: published version did not match approved HTML'; exit 1; }
          for marker in 'id="quickPartnerButton"' 'id="partnerCompanyManagement"' \
            'id="partnerInviteInline"' 'currentCatalogRevenuePerUnit' \
            'checkedEntry.mode!=="internal"' 'mergedPartnerRankingDay'; do
            grep -Fq "$marker" "$RUNNER_TEMP/confirmed-index.html" || { echo "STOP: missing $marker"; exit 1; }
          done
          for route in /partner-invite.html /partner-counts.html /partner-workspace.html; do
            code=$(curl -sSL -o /dev/null -w '%{http_code}' --max-time 30 "https://nico-factory.web.app$route")
            test "$code" = 200 || { echo "STOP: $route HTTP $code"; exit 1; }
          done
          echo 'PASS: only reviewed partner tab released, owner finance and other partner paths preserved'
