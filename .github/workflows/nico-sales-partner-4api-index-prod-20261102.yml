name: NICO same-app partner 4-function and index production release 2026-11-02
on:
  push:
    branches: [release/nico-sales-partner-4api-index-prod-20261102]
    paths: [.github/workflows/nico-sales-partner-unified-prod-20261102.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: nico-partner-workspace-production
  cancel-in-progress: false
jobs:
  validate:
    if: ${{ github.repository == 'Keikei-p/-' && github.ref == 'refs/heads/release/nico-sales-partner-4api-index-prod-20261102' }}
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact reviewed source boundary and unchanged finance/Rules
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object index.html)" = '4835ccce2d2d8ddf9cc5ad0924dcad113d23eee0'
          test "$(git hash-object functions-partner-workspace/service.cjs)" = '55b16051c09810778f79256097446aa0dec1b36e'
          test "$(git hash-object functions-partner-workspace/shared-direct-counts.cjs)" = '6f66771256f5790dbe18bed6b9e50d01cb3adcad'
          test "$(git hash-object functions-partner-workspace/index.js)" = '38da7e9174ffea7c406c92292dccfc651b565eb0'
          test "$(git hash-object functions/index.js)" = 'dfb4c48ada6fa89a24c898cd4a2f911bcede822f'
          test "$(git hash-object firestore.rules)" = 'd9f4df6a2ac0f8b5720534a2461ec66b94379190'
          test "$(git hash-object firebase.partner-workspace.json)" = 'a6ceedec5fab4e22e0a8efe19c685716a2db9750'
          test "$(git hash-object tools/hosting/surgical-existing-index.mjs)" = '1c6923e06135dc480e11f342e44f5e74f8c5bbc7'
          node -e "const f=require('fs');const x=JSON.parse(f.readFileSync('.firebaserc'));if(x.projects.default!=='sales-management-cc116')process.exit(1)"
          node --check functions-partner-workspace/service.cjs
          node --check functions-partner-workspace/shared-direct-counts.cjs
          node --check functions-partner-workspace/index.js
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const html=fs.readFileSync('index.html','utf8');
          const module=html.match(/<script type="module">([\s\S]*?)<\/script>/)?.[1];
          if(!module||!html.includes('sharedRankings:true')||!html.includes('partnerSameAppNavigation')||
            !html.includes('monthlyRevenue')||!html.includes('signInWithEmailAndPassword'))
            throw Error('STOP_MISSING_CORE_SALES_OR_PARTNER_UI');
          fs.writeFileSync('/tmp/nico-same-app-module.mjs',module);
          NODE
          node --check /tmp/nico-same-app-module.mjs
      - name: Full partner shared-count, owner finance and login regressions
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/partner-shared-direct-redaction.test.cjs
          node --test tests/partner-workspace.test.cjs
          node --test tests/partner-money-free-workspace.test.cjs
          node --test tests/internal-owner-finance-visibility.test.cjs
          node --test tests/partner-one-login-same-app.test.cjs
          node --test tests/partner-company-parity-release.test.mjs
          node --test tests/partner-existing-ranking.test.cjs
          node --test tests/partner-email-resend-and-join.test.mjs
          node --test tests/partner-invite-mobile-layout.test.cjs
          node --test tests/dashboard-inline-original-partner-parity.test.mjs
          node --test tests/partner-repeat-login-cb-parity.test.mjs
          node --test tests/partner-management-tabs-parity.test.mjs
          node --test tests/surgical-existing-index.test.mjs
          echo PASS_OFFLINE_REVIEWED_RELEASE_SCOPE
  release:
    needs: validate
    if: ${{ github.repository == 'Keikei-p/-' && github.ref == 'refs/heads/release/nico-sales-partner-4api-index-prod-20261102' && needs.validate.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      FIREBASE_PROJECT_ID: sales-management-cc116
      NICO_PARTNER_RELEASE_CONFIRMATION: CONFIRM_ADD_PARTNER_RANKING_INDEX_ONLY
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirm main is unchanged and past verified Rules, Auth and full inventory
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api repos/Keikei-p/-/branches/main --jq '.commit.sha')" = 283bc749c97756fc3de03671ae7bac4eccdc46c3 || { echo STOP_MAIN_CHANGED; exit 1; }
          test "$(gh api repos/Keikei-p/-/actions/runs/41388293487 --jq '.conclusion')" = success || { echo STOP_BACKUP_RULES_AUDIT; exit 1; }
          test "$(gh api repos/Keikei-p/-/actions/runs/41388920232 --jq '.conclusion')" = success || { echo STOP_EMAIL_LINK_AUTH; exit 1; }
          test "$(git hash-object index.html)" = 4835ccce2d2d8ddf9cc5ad0924dcad113d23eee0
          echo PASS_MAIN_RULES_AND_AUTH_REVIEW_EVIDENCE
      - name: Load protected existing Firebase identity without logging it
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${FIREBASE_SERVICE_ACCOUNT_JSON:-}" || { echo STOP_NO_PRODUCTION_IDENTITY; exit 1; }
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/same-app-prod.json"
          chmod 600 "$RUNNER_TEMP/same-app-prod.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/same-app-prod.json" >> "$GITHUB_ENV"
      - name: Install ONLY existing Firebase package and CLI
        run: |
          set -euo pipefail
          npm install --prefix functions --ignore-scripts --package-lock=false --no-audit --no-fund
          npm install --prefix functions-partner-workspace --ignore-scripts --package-lock=false --no-audit --no-fund
          npm install --global firebase-tools@15.34.1 --no-audit --no-fund
      - name: Verify live finance Rules, recent ready backup and protected original APIs READ ONLY
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {createRequire} from 'node:module';
          import {createHash} from 'node:crypto';
          import {inspect} from './tools/production/inspect-firestore-backups-readonly.mjs';
          const require=createRequire(process.cwd()+'/functions/package.json');
          const cred=require('firebase-admin/app').applicationDefault();
          const token=(await cred.getAccessToken()).access_token;
          async function get(url){
           const response=await fetch(url,{headers:{Authorization:'Bearer '+token},redirect:'error'});
           if(!response.ok)throw Error('STOP_READ_ONLY_HTTP_'+response.status);
           return response.json();
          }
          const rel=await get('https://firebaserules.googleapis.com/v1/projects/sales-management-cc116/releases/cloud.firestore');
          const rule=await get('https://firebaserules.googleapis.com/v1/'+rel.rulesetName);
          if(rule.source?.files?.length!==1)throw Error('STOP_RULES_UNVERIFIED');
          const digest=createHash('sha256').update(rule.source.files[0].content.replace(/\r\n/g,'\n').trim()).digest('hex');
          if(digest!=='d1d9998d874a1a31c81ddf6996e08cd9de3a3d13bd684e245140bf03cab32179')
           throw Error('STOP_LIVE_RULES_CHANGED');
          const backups=await inspect();
          const age=Date.now()-Date.parse(backups.latestReadySnapshot||'');
          if(!backups.readyBackups||!Number.isFinite(age)||age<0||age>48*3600000)
           throw Error('STOP_BACKUPS_NOT_RECENT');
          for(const name of ['getPartnerWorkspace','managePartnerWorkspace','acceptPartnerWorkspaceInvite',
            'submitPartnerWorkspaceCounts','createPartnerCompanyInvitation','sendMissingReportReminders']){
           const fn=await get('https://cloudfunctions.googleapis.com/v2/projects/sales-management-cc116/locations/asia-northeast1/functions/'+name);
           if(fn.state!=='ACTIVE'||fn.environment!=='GEN_2')throw Error('STOP_ORIGINAL_FUNCTION_NOT_ACTIVE_'+name);
          }
          console.log('PASS_RULES_BACKUPS_AND_ORIGINAL_FUNCTIONS');
          NODE
          curl --fail --silent --show-error --retry 2 --max-time 25 https://nico-factory.web.app/ > "$RUNNER_TEMP/owner-before.html"
          grep -Fq '営業実績管理' "$RUNNER_TEMP/owner-before.html"
          firebase functions:list --project "$FIREBASE_PROJECT_ID" --json > "$RUNNER_TEMP/functions-before.json"
      - name: Verify Hosting preserves every live asset BEFORE backend mutation
        shell: bash
        run: |
          set -euo pipefail
          node tools/hosting/surgical-existing-index.mjs --dry-run > "$RUNNER_TEMP/hosting-before-dry-run.log"
          grep -Fq 'sites/nico-factory/versions/1b1ae98d3d7ca818' "$RUNNER_TEMP/hosting-before-dry-run.log" || { echo STOP_LIVE_HOSTING_VERSION_CHANGED; exit 1; }
          echo PASS_LIVE_HOSTING_MANIFEST_READ_ONLY
      - name: Update exactly four EXISTING partner APIs, never deploy other functions or Rules
        shell: bash
        run: |
          set -euo pipefail
          test ! -e functions-partner-workspace/.env.sales-management-cc116
          printf 'PARTNER_WORKSPACE_ENABLED=enabled\nPARTNER_COMPANY_CODE_AUTH_ENABLED=enabled\n' > functions-partner-workspace/.env.sales-management-cc116
          date -u +%Y-%m-%dT%H:%M:%SZ > "$RUNNER_TEMP/functions-deploy-start.txt"
          # Do not add, delete, migrate, or deploy any other Firebase resources.
          set +e
          firebase deploy --non-interactive --project "$FIREBASE_PROJECT_ID" \
            --config firebase.partner-workspace.json \
            --only functions:partner-workspace:getPartnerWorkspace,functions:partner-workspace:managePartnerWorkspace,functions:partner-workspace:acceptPartnerWorkspaceInvite,functions:partner-workspace:submitPartnerWorkspaceCounts \
            > "$RUNNER_TEMP/targeted-deploy.log" 2>&1
          result=$?
          set -e
          for name in getPartnerWorkspace managePartnerWorkspace acceptPartnerWorkspaceInvite submitPartnerWorkspaceCounts; do
            grep -F "functions[partner-workspace:$name(asia-northeast1)]" "$RUNNER_TEMP/targeted-deploy.log" |
              grep -Fq 'Successful update operation' || { echo "STOP_FUNCTION_DEPLOY_NOT_CONFIRMED_$name"; exit 1; }
          done
          if [ "$result" -ne 0 ]; then
            grep -Fq 'Functions successfully deployed but could not set up cleanup policy' "$RUNNER_TEMP/targeted-deploy.log" ||
              { echo STOP_UNEXPECTED_FUNCTION_DEPLOY_ERROR; exit 1; }
          fi
          echo PASS_EXACTLY_FOUR_EXISTING_PARTNER_FUNCTION_UPDATES
      - name: Confirm each updated function is ACTIVE and denies anonymous users, all originals retained
        shell: bash
        run: |
          set -euo pipefail
          firebase functions:list --project "$FIREBASE_PROJECT_ID" --json > "$RUNNER_TEMP/functions-after.json"
          node <<'NODE'
          const fs=require('node:fs');
          const read=n=>(JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/'+n,'utf8')).result||[]).map(x=>x.id||x.name||'');
          const before=read('functions-before.json'),after=read('functions-after.json');
          if(!before.length||before.some(name=>!after.includes(name)))throw Error('STOP_EXISTING_FUNCTION_MISSING');
          console.log('PASS_ALL_ORIGINAL_FUNCTION_NAMES_PRESERVED');
          NODE
          node --input-type=module <<'NODE'
          import {createRequire} from 'node:module';
          import {readFileSync} from 'node:fs';
          const require=createRequire(process.cwd()+'/functions/package.json');
          const token=(await require('firebase-admin/app').applicationDefault().getAccessToken()).access_token;
          const started=Date.parse(readFileSync(process.env.RUNNER_TEMP+'/functions-deploy-start.txt','utf8'));
          for(const name of ['getPartnerWorkspace','managePartnerWorkspace',
            'acceptPartnerWorkspaceInvite','submitPartnerWorkspaceCounts']){
            const resp=await fetch('https://cloudfunctions.googleapis.com/v2/projects/sales-management-cc116/locations/asia-northeast1/functions/'+name,
             {headers:{Authorization:'Bearer '+token},redirect:'error'});
            if(!resp.ok)throw Error('STOP_FUNCTION_DETAIL_READBACK_'+name);
            const fn=await resp.json();
            if(fn.state!=='ACTIVE'||Date.parse(fn.updateTime)<started)
              throw Error('STOP_UPDATED_FUNCTION_NOT_ACTIVE_'+name);
            const anon=await fetch('https://asia-northeast1-sales-management-cc116.cloudfunctions.net/'+name,{
              method:'POST',headers:{'Content-Type':'application/json'},body:'{"data":{}}'});
            if(![401,403].includes(anon.status))
              throw Error('STOP_ANONYMOUS_PARTNER_FUNCTION_ACCESS_'+name+'_'+anon.status);
          }
          console.log('PASS_FOUR_ACTIVE_PARTNER_APIS_AND_ANONYMOUS_DENIAL');
          NODE
      - name: Publish ONLY existing index, with complete live manifest preserved AFTER four API updates
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object index.html)" = 4835ccce2d2d8ddf9cc5ad0924dcad113d23eee0
          node tools/hosting/surgical-existing-index.mjs --dry-run > "$RUNNER_TEMP/hosting-pre-release-dry-run.log"
          grep -Fq 'sites/nico-factory/versions/1b1ae98d3d7ca818' "$RUNNER_TEMP/hosting-pre-release-dry-run.log" || { echo STOP_LIVE_VERSION_MOVED; exit 1; }
          node tools/hosting/surgical-existing-index.mjs --release
          echo PASS_ORIGINAL_SALES_INDEX_ONLY_RELEASED
      - name: Confirm exact published HTML and preserved partner routes
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --max-time 30 'https://nico-factory.web.app/?same_app_release_verify=20261102' > "$RUNNER_TEMP/owner-after.html"
          cmp -s index.html "$RUNNER_TEMP/owner-after.html" || { echo STOP_LIVE_HTML_NOT_EXACT; exit 1; }
          for route in partner-invite.html partner-counts.html partner-workspace.html; do
            curl -fsSL --retry 3 --max-time 30 "https://nico-factory.web.app/$route" > "$RUNNER_TEMP/$route"
          done
          grep -Fq 'submitPartnerWorkspaceCounts' "$RUNNER_TEMP/partner-workspace.html"
          grep -Fq 'getPartnerQuickCounts' "$RUNNER_TEMP/partner-counts.html"
          grep -Fq 'createPartnerCompanyInvitation' "$RUNNER_TEMP/partner-invite.html"
          grep -Fq 'monthlyRevenue' "$RUNNER_TEMP/owner-after.html"
          grep -Fq 'partnerSameAppNavigation' "$RUNNER_TEMP/owner-after.html"
          echo PASS_PUBLIC_HOSTING_BYTES_AND_EXISTING_PAGES
      - name: Remove protected credentials and function deploy log from runner
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/same-app-prod.json" "$RUNNER_TEMP/targeted-deploy.log" functions-partner-workspace/.env.sales-management-cc116
