name: NICO live partner count Functions deployment audit (READ ONLY)

on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/production/inspect-live-partner-callables-readonly.mjs'
      - 'tests/inspect-live-partner-callables-readonly.test.mjs'
      - 'tests/partner-readonly-audit-dispatch.test.mjs'
      - '.github/workflows/nico-live-partner-count-functions-audit.yml'
  push:
    branches: [main]
    paths:
      - 'tools/production/inspect-live-partner-callables-readonly.mjs'
      - 'tests/inspect-live-partner-callables-readonly.test.mjs'
      - 'tests/partner-readonly-audit-dispatch.test.mjs'
      - '.github/workflows/nico-live-partner-count-functions-audit.yml'

  # Safe manual recheck from GitHub Actions (mobile friendly): GET only, no deploy.
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: nico-partner-count-functions-deployed-get-only
  cancel-in-progress: false

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Classify allowlisted functions and prove metadata GET-only scope
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/production/inspect-live-partner-callables-readonly.mjs
          node --test tests/inspect-live-partner-callables-readonly.test.mjs
          node --test tests/partner-readonly-audit-dispatch.test.mjs
          node --test tests/partner-workspace.test.cjs
          node --test tests/legacy-rules-apply-frozen.test.mjs
          test "$(git hash-object firestore.rules)" = 'd9f4df6a2ac0f8b5720534a2461ec66b94379190'
          test "$(git hash-object functions-partner-workspace/index.js)" = 'ab551981ce12b4d291a20c0b51cbd461be60df54'
          test "$(git hash-object functions-partner-workspace/service.cjs)" = '5334aa48d7f4eb64274a6d7a8bbb4e76d4a2fb65'
          node -e "const fs=require('fs');if(JSON.parse(fs.readFileSync('.firebaserc','utf8')).projects.default!=='sales-management-cc116')process.exit(1)"

  live-metadata-only:
    needs: offline
    if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
        github.ref == 'refs/heads/main' &&
        github.repository == 'Keikei-p/-' &&
        needs.offline.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      FIREBASE_PROJECT_ID: sales-management-cc116
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify unchanged production function definitions and live Rules
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_SHA" = "$(git rev-parse HEAD)"
          test "$(git hash-object firestore.rules)" = 'd9f4df6a2ac0f8b5720534a2461ec66b94379190'
          test "$(git hash-object functions-partner-workspace/index.js)" = 'ab551981ce12b4d291a20c0b51cbd461be60df54'
          test "$(git hash-object functions-partner-workspace/service.cjs)" = '5334aa48d7f4eb64274a6d7a8bbb4e76d4a2fb65'
          node --test tests/inspect-live-partner-callables-readonly.test.mjs
      - name: Install existing Firebase Admin OAuth identity only
        shell: bash
        run: npm install --prefix functions --ignore-scripts --package-lock=false --no-audit --no-fund
      - name: Configure existing Firebase audit identity without logging private fields
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          test -n "$FIREBASE_SERVICE_ACCOUNT_JSON"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/nico-function-inventory-identity.json"
          chmod 600 "$RUNNER_TEMP/nico-function-inventory-identity.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/nico-function-inventory-identity.json" >> "$GITHUB_ENV"
      - name: GET only four count Functions plus the optional joint-ranking Function metadata
        shell: bash
        run: |
          set -euo pipefail
          result=0
          node tools/production/inspect-live-partner-callables-readonly.mjs \
            > "$RUNNER_TEMP/nico-function-metadata-private.log" 2>&1 || result=$?
          # Print only the reviewed safe boolean-only summary or a STOP code.
          grep -E '^(PARTNER_COUNT_FUNCTION_METADATA |BLOCK_[A-Z0-9_]+$|STOP_PARTNER_CALLABLES_[A-Z0-9_]+$)' \
            "$RUNNER_TEMP/nico-function-metadata-private.log" || true
          test "$result" = 0
          grep -q '^PARTNER_COUNT_FUNCTION_METADATA ' \
            "$RUNNER_TEMP/nico-function-metadata-private.log"
          grep '^PARTNER_COUNT_FUNCTION_METADATA ' "$RUNNER_TEMP/nico-function-metadata-private.log" \
            | grep -q '"safeToCutOverRules":false'
      - name: Remove any private identity and metadata logs; never upload artifacts
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/nico-function-inventory-identity.json" \
            "$RUNNER_TEMP/nico-function-metadata-private.log"
