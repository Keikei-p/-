name: NICO existing sale count integrity (release base, NO DEPLOY)

on:
  pull_request:
    branches:
      - release/nico-partner-compact-two-column-index-20261102
    paths:
      - index.html
      - tests/sales-regressions.cjs
      - tests/rules.test.cjs
      - .github/workflows/nico-sales-count-integrity-release-no-deploy.yml

permissions:
  contents: read

jobs:
  count-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check only the reviewed read-only historical quantity guard is installed
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const assert = require('node:assert/strict');
          const html = fs.readFileSync('index.html', 'utf8');
          const helper = html.indexOf('function isPersistedRecordCountConsistent(record) {');
          const save = html.indexOf('async function persistDailyRecord(');
          const check = html.indexOf('if (current && !isPersistedRecordCountConsistent(current))', save);
          const write = html.indexOf('transaction.set(recordRef, data', save);
          assert(helper >= 0 && helper < save, 'missing quantity validator');
          assert(check > save && check < write, 'quantity validation must precede writes');
          assert(html.includes('既存実績の総件数と商材別件数が一致しません'), 'missing fail-closed message');
          const moduleScript = html.match(/<script type="module">([\s\S]*?)<\/script>/)?.[1];
          assert(moduleScript, 'existing app module script must remain present');
          fs.writeFileSync('/tmp/nico-existing-sale-count.mjs', moduleScript);
          NODE
          node --check /tmp/nico-existing-sale-count.mjs
      - name: Run existing sale, finance, correction and history regression tests
        run: node --test tests/sales-regressions.cjs

  rules-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install disposable test dependencies
        run: |
          npm install --prefix tests --ignore-scripts --no-audit --no-fund
          npm install --global firebase-tools@15.34.1 --no-audit --no-fund
      - name: Run local-only Firestore emulator checks
        run: firebase emulators:exec --project demo-sales-support --only firestore 'node --test tests/rules.test.cjs'
