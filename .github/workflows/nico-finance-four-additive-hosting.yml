name: NICO four-collection finance boundary proof (ONE NEW HOSTING FILE)
on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/hosting/additive-finance-four-proof.mjs'
      - 'tests/additive-finance-four-proof.test.mjs'
      - '.github/workflows/nico-finance-four-additive-hosting.yml'
  push:
    branches: [main]
    paths:
      - 'tools/hosting/additive-finance-four-proof.mjs'
      - 'tests/additive-finance-four-proof.test.mjs'
      - '.github/workflows/nico-finance-four-additive-hosting.yml'
permissions:
  contents: read
concurrency:
  group: nico-finance-four-additive-hosting-preserve
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Freeze current sales, partner, Rules, original diagnostics and Functions
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object firestore.rules)" = d9f4df6a2ac0f8b5720534a2461ec66b94379190
          test "$(git hash-object index.html)" = 88ef5636bfe9254e71f2109d452b6d3049f99861
          test "$(git hash-object partner-workspace.html)" = 0930abb188165afea19ef427308ea22fddf636e7
          test "$(git hash-object finance-boundary-check.html)" = 7fa664efb17f6d3337e9403498aa8c0857b35be5
          test "$(git hash-object functions/index.js)" = dfb4c48ada6fa89a24c898cd4a2f911bcede822f
          test "$(git hash-object functions-partner-workspace/index.js)" = 38da7e9174ffea7c406c92292dccfc651b565eb0
          node -e "const f=require('fs');if(JSON.parse(f.readFileSync('.firebaserc','utf8')).projects.default!=='sales-management-cc116')process.exit(1)"
          node --check tools/hosting/additive-finance-four-proof.mjs
      - name: Verify all 4 masked financial GET/LIST probes and immutable full Hosting inventory
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/additive-finance-four-proof.test.mjs
          node --test tests/finance-diagnostic-four-collections-staging.test.mjs
          node --test tests/finance-boundary-ondevice.test.mjs
          node --test tests/finance-boundary-additive-hosting.test.mjs
          test -z "$(printenv FIREBASE_SERVICE_ACCOUNT_JSON || true)"
          test -z "$(printenv GOOGLE_APPLICATION_CREDENTIALS || true)"
          echo 'FINANCE_FOUR_ONLY_STATIC_SAFE_NO_DEPLOY'

  release-one-new-file:
    needs: validate
    if: >-
      ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'Keikei-p/-' && startsWith(github.event.head_commit.message, 'release: add four-collection finance diagnostic (one new Hosting file only)') && needs.validate.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NICO_FINANCE_FOUR_RELEASE_CONFIRMATION: CONFIRM_ADD_FINANCE_FOUR_ONLY
      FIREBASE_PROJECT_ID: sales-management-cc116
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require latest protected main and exact frozen assets BEFORE credentials
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_SHA" = "$(git rev-parse HEAD)"
          test "$GITHUB_SHA" = "$(gh api repos/Keikei-p/-/branches/main --jq .commit.sha)"
          test "$(git hash-object firestore.rules)" = d9f4df6a2ac0f8b5720534a2461ec66b94379190
          test "$(git hash-object index.html)" = 88ef5636bfe9254e71f2109d452b6d3049f99861
          test "$(git hash-object partner-workspace.html)" = 0930abb188165afea19ef427308ea22fddf636e7
          test "$(git hash-object finance-boundary-check.html)" = 7fa664efb17f6d3337e9403498aa8c0857b35be5
          test "$(git hash-object functions/index.js)" = dfb4c48ada6fa89a24c898cd4a2f911bcede822f
          node --test tests/additive-finance-four-proof.test.mjs tests/finance-diagnostic-four-collections-staging.test.mjs
      - name: Load previously configured Hosting-only identity without echoing values
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          test -n "$FIREBASE_SERVICE_ACCOUNT_JSON"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/nico-four-proof-hosting-id.private.json"
          chmod 600 "$RUNNER_TEMP/nico-four-proof-hosting-id.private.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/nico-four-proof-hosting-id.private.json" >> "$GITHUB_ENV"
      - name: Install existing Firebase Admin authentication library only
        shell: bash
        run: npm install --prefix functions --ignore-scripts --package-lock=false --no-audit --no-fund
      - name: Confirm current live Hosting asset manifest and verify ONLY NEW route
        shell: bash
        run: node tools/hosting/additive-finance-four-proof.mjs --dry-run
      - name: Add ONLY /finance-boundary-four.html preserving EVERY old asset
        shell: bash
        run: node tools/hosting/additive-finance-four-proof.mjs --release
      - name: Verify exact published HTML bytes and 5 original public routes
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module -e "import {writeFileSync} from 'node:fs';import {makeCandidate,originalSource} from './staging/finance-diagnostic-v2/build-candidate.mjs';writeFileSync(process.env.RUNNER_TEMP+'/nico-finance-four-generated.html',makeCandidate(originalSource()))"
          matched=false
          for n in $(seq 1 12); do
            curl -fsSL --max-time 30 \
              "https://nico-factory.web.app/finance-boundary-four.html?verified=$GITHUB_SHA-$n" \
              > "$RUNNER_TEMP/nico-finance-four-live.html" || true
            if cmp -s "$RUNNER_TEMP/nico-finance-four-live.html" "$RUNNER_TEMP/nico-finance-four-generated.html"; then
              matched=true;break
            fi
            sleep 5
          done
          test "$matched" = true || { echo 'STOP_FOUR_DIAGNOSTIC_LIVE_BYTES_UNVERIFIED';exit 1; }
          for route in / /partner-invite.html /partner-counts.html /partner-workspace.html /finance-boundary-check.html; do
            test "$(curl -sSL -o /dev/null -w '%{http_code}' --max-time 25 "https://nico-factory.web.app$route")" = 200
          done
          echo 'SUCCESS: finance four-source proof live; all original Hosting assets identical; zero database writes'
      - name: Destroy private identity and temporary verification files
        shell: bash
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/nico-four-proof-hosting-id.private.json"
          rm -f "$RUNNER_TEMP/nico-finance-four-generated.html" "$RUNNER_TEMP/nico-finance-four-live.html"
