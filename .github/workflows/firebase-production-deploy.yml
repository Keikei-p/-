name: Firebase Rules Deploy (Zero-Cost)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['firestore.rules']

permissions:
  contents: read

concurrency:
  group: firebase-rules-production
  cancel-in-progress: false

jobs:
  deploy-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      FIREBASE_PROJECT_ID: sales-management-cc116
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Verify Firebase credential
        shell: bash
        run: |
          set -euo pipefail
          test -n "${FIREBASE_SERVICE_ACCOUNT_JSON:-}"

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Setup Java for Firestore tests
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Firestore test dependencies
        run: npm install --prefix tests --ignore-scripts --package-lock=false

      - name: Verify Firestore permissions before deploy
        run: RULES_ONLY=1 firebase emulators:exec --project demo-sales-support --only firestore "node --test tests/rules.test.cjs"

      - name: Configure Firebase credentials
        shell: bash
        run: |
          set -euo pipefail
          CREDENTIALS_FILE="$RUNNER_TEMP/firebase-service-account.json"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$CREDENTIALS_FILE"
          chmod 600 "$CREDENTIALS_FILE"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$CREDENTIALS_FILE" >> "$GITHUB_ENV"

      - name: Verify Firebase access
        run: firebase projects:list --non-interactive

      - name: Deploy Firestore Rules only
        run: firebase deploy --only firestore:rules --project "$FIREBASE_PROJECT_ID" --non-interactive
