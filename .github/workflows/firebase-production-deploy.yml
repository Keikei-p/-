name: Firebase Production Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - ops/run-firebase-deploy-20261003
    paths:
      - .github/workflows/firebase-production-deploy.yml

permissions:
  contents: read

concurrency:
  group: firebase-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      FIREBASE_PROJECT_ID: sales-management-cc116
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
      LINE_CHANNEL_SECRET: ${{ secrets.LINE_CHANNEL_SECRET }}
      LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Verify required secrets
        shell: bash
        run: |
          set -euo pipefail
          for name in FIREBASE_SERVICE_ACCOUNT_JSON LINE_CHANNEL_SECRET LINE_CHANNEL_ACCESS_TOKEN; do
            if [ -z "${!name:-}" ]; then
              echo "::error::GitHub Secret ${name} が未設定です。"
              exit 1
            fi
          done

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check Functions syntax
        run: node --check functions/index.js

      - name: Install Functions dependencies
        working-directory: functions
        run: npm install --ignore-scripts --package-lock=false

      - name: Load Functions module
        working-directory: functions
        run: node -e "require('./index.js'); console.log('functions module loaded')"

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Configure Firebase credentials
        shell: bash
        run: |
          set -euo pipefail
          CREDENTIALS_FILE="$RUNNER_TEMP/firebase-service-account.json"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$CREDENTIALS_FILE"
          chmod 600 "$CREDENTIALS_FILE"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$CREDENTIALS_FILE" >> "$GITHUB_ENV"

      - name: Verify Firebase access
        run: firebase projects:list --non-interactive

      - name: Set LINE Channel Secret
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$LINE_CHANNEL_SECRET" | firebase functions:secrets:set LINE_CHANNEL_SECRET --project "$FIREBASE_PROJECT_ID"

      - name: Set LINE Channel Access Token
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$LINE_CHANNEL_ACCESS_TOKEN" | firebase functions:secrets:set LINE_CHANNEL_ACCESS_TOKEN --project "$FIREBASE_PROJECT_ID"

      - name: Deploy Firestore Rules
        run: firebase deploy --only firestore:rules --project "$FIREBASE_PROJECT_ID" --non-interactive

      - name: Deploy LINE Functions
        run: firebase deploy --only functions:lineWebhook,functions:sendMissingReportReminders --project "$FIREBASE_PROJECT_ID" --non-interactive

      - name: Smoke test LINE webhook endpoint
        shell: bash
        run: |
          set -euo pipefail
          WEBHOOK_URL="https://asia-northeast1-${FIREBASE_PROJECT_ID}.cloudfunctions.net/lineWebhook"
          STATUS="$(curl -sS -o /tmp/line-webhook-response.txt -w '%{http_code}' "$WEBHOOK_URL")"
          cat /tmp/line-webhook-response.txt || true
          if [ "$STATUS" != "405" ]; then
            echo "::error::lineWebhook smoke test expected HTTP 405 for GET, got $STATUS"
            exit 1
          fi
          echo "lineWebhook smoke test passed: HTTP $STATUS"
