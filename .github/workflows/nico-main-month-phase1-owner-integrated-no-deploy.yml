name: NICO joint rankings + Phase1 Rules + Owner integrity combined (NO DEPLOY)
on:
  push:
    branches: [integration/main-month-phase1-owner-review-20261106]
  pull_request:
    branches: [integration/main-month-phase1-rules-20261106]
permissions:
  contents: read
concurrency:
  group: nico-joint-owner-phase1-${{ github.ref }}
  cancel-in-progress: true
jobs:
  joint-owner-finance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FIREBASE_PROJECT_ID: demo-sales-support
      GCLOUD_PROJECT: demo-sales-support
      GOOGLE_APPLICATION_CREDENTIALS: ""
      FIREBASE_SERVICE_ACCOUNT_JSON: ""
      NICO_RULES_APPROVAL: ""
      NICO_PARTNER_RELEASE_CONFIRMATION: ""
      PARTNER_WORKSPACE_ENABLED: ""
      PARTNER_COMPANY_CODE_AUTH_ENABLED: ""
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Verify exact reviewed source and no-deploy difference
        shell: bash
        run: |
          set -euo pipefail
          test "$FIREBASE_PROJECT_ID" = demo-sales-support
          test "$GCLOUD_PROJECT" = demo-sales-support
          test -z "$GOOGLE_APPLICATION_CREDENTIALS"
          test -z "$FIREBASE_SERVICE_ACCOUNT_JSON"
          test -z "$NICO_RULES_APPROVAL"
          test -z "$NICO_PARTNER_RELEASE_CONFIRMATION"
          test -z "$PARTNER_WORKSPACE_ENABLED"
          test -z "$PARTNER_COMPANY_CODE_AUTH_ENABLED"
          git fetch --no-tags origin integration/main-month-phase1-rules-20261106 feature/main-partner-month-readonly-20261106 main
          parent="$(git rev-parse origin/integration/main-month-phase1-rules-20261106)"
          test "$parent" = b50e84a9c00c165544c4cdb8672f9a4efdd856a8
          test "$(git rev-parse origin/feature/main-partner-month-readonly-20261106)" = 3372630b67c2a94346ae1ae76a7fe03739e86774
          test "$(git rev-parse origin/main)" = 17681e69d3ebd7271cc9a58e138fd0e202db7294
          test "$(git merge-base HEAD "$parent")" = "$parent"
          git diff --name-only "$parent"...HEAD > /tmp/nico-joint-owner-allow.txt
          if grep -Ev '^(index[.]html|tests/owner-record-count-review-main[.]test[.]cjs|[.]github/workflows/nico-main-month-phase1-owner-integrated-no-deploy[.]yml)$' /tmp/nico-joint-owner-allow.txt; then
            echo STOP_UNREVIEWED_JOINT_OWNER_FILES
            exit 1
          fi
          test "$(wc -l < /tmp/nico-joint-owner-allow.txt)" -eq 3
          test "$(git hash-object firestore.rules)" = 6d6ac7fd3544b0326823e419a3acd7e1d060b714
          test "$(git hash-object tests/rules.test.cjs)" = 0292ea176ad67e6486cd9fd1a0d08dc18a3317cd
          git diff --exit-code "$parent" HEAD -- firestore.rules firestore.indexes.json functions functions-partner-workspace functions-partner-quick
      - name: Check integration source and test syntax
        run: |
          node --check functions-partner-workspace/service.cjs
          node --check functions-partner-workspace/partner-combined-extra-projection.cjs
          node --check tests/owner-record-count-review-main.test.cjs
          node --check tests/rules.test.cjs
      - name: Verify shared saved counts, Owner only history, permissions, sales and login
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/owner-record-count-review-main.test.cjs tests/partner-saved-month-main.test.cjs tests/partner-saved-month-ui-main.test.cjs tests/partner-combined-month-ranking-main.test.cjs tests/partner-catalog-publish-main.test.cjs tests/partner-additional-product-main.test.cjs tests/partner-additional-ledger-main.test.cjs tests/partner-workspace.test.cjs tests/sales-regressions.cjs tests/partner-one-login-same-app.test.cjs tests/partner-money-free-workspace.test.cjs tests/internal-owner-finance-visibility.test.cjs tests/partner-company-code-auth.test.cjs
      - name: Install isolated emulator dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix tests --ignore-scripts --no-audit --no-fund
          npm install --global firebase-tools@15.34.1 --no-audit --no-fund
      - name: Verify financial read permissions in local Firestore emulator
        shell: bash
        run: |
          set -euo pipefail
          firebase emulators:exec --project demo-sales-support --only firestore 'node --test tests/rules.test.cjs'
      - name: Prevent production release
        run: |
          echo "SYNTHETIC_JOINT_OWNER_RULES_PASS"
          echo "LIVE_PARTNER_FINANCE_GET_LIST_VERIFIED=false"
          echo "LIVE_OWNER_FINANCE_VERIFIED=false"
          echo "PRODUCTION_DOCUMENT_WRITES=0"
          echo "PRODUCTION_DEPLOYED=false"
          echo "RELEASE_APPROVED=false"
