name: NICO 11-09 release readiness PC helper (NO DEPLOY)
on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/local/NICO_NOV09_LIVE_READONLY.ps1'
      - 'tests/nov09-readonly-oneclick-pc.test.mjs'
      - '.github/workflows/nico-four-count-cli-region-readonly-20261108.yml'
      - '.github/workflows/nico-partner-live-readonly-audit.yml'
      - '.github/workflows/nico-managed-backup-restore-preflight-readonly.yml'
      - '.github/workflows/nico-nov09-readonly-pc-helper.yml'
  push:
    branches: [main]
    paths:
      - 'tools/local/NICO_NOV09_LIVE_READONLY.ps1'
      - 'tests/nov09-readonly-oneclick-pc.test.mjs'
      - '.github/workflows/nico-four-count-cli-region-readonly-20261108.yml'
      - '.github/workflows/nico-partner-live-readonly-audit.yml'
      - '.github/workflows/nico-managed-backup-restore-preflight-readonly.yml'
      - '.github/workflows/nico-nov09-readonly-pc-helper.yml'
permissions:
  contents: read
jobs:
  non-destructive:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Protect original financial Rules and the four count Functions
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object firestore.rules)" = d9f4df6a2ac0f8b5720534a2461ec66b94379190
          test "$(git hash-object functions/index.js)" = dfb4c48ada6fa89a24c898cd4a2f911bcede822f
          test "$(git hash-object functions-partner-workspace/service.cjs)" = 614f3216e008642ddf5eda6b93c35cc0469557c3
          test "$(git hash-object functions-partner-workspace/index.js)" = 90d51246477cf5cfa6966f3e822326ef06cccd0f
          git diff --exit-code -- firestore.rules index.html partner-workspace.html firebase.json functions functions-partner-workspace
      - name: Confirm exact read-only workflow dispatch, PC safety and live read access guards
        run: |
          node --test tests/nov09-readonly-oneclick-pc.test.mjs
          echo 'NICO_READONLY_ONECLICK_HELPER_PASS_NO_DEPLOY'
