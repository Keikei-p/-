name: NICO partner counts deployment status (read-only)
on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/nico-partner-quick-deploy-diagnostic.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Print latest main production release run metadata (NO SECRETS)
        uses: actions/github-script@v7
        with:
          script: |
            const {owner,repo}=context.repo;
            const response=await github.rest.actions.listWorkflowRuns({
              owner,repo,workflow_id:"nico-partner-quick-release.yml",
              branch:"main",event:"push",per_page:10
            });
            console.log("DEPLOY_RUN_COUNT",response.data.workflow_runs?.length||0);
            for(const run of (response.data.workflow_runs||[]).slice(0,4)){
              console.log(JSON.stringify({run_id:run.id,status:run.status,
                conclusion:run.conclusion,created_at:run.created_at,
                html_url:run.html_url,head_sha:run.head_sha}));
              const jobs=await github.rest.actions.listJobsForWorkflowRun({
                owner,repo,run_id:run.id,per_page:25
              });
              for(const job of jobs.data.jobs||[])console.log(JSON.stringify({
                job_id:job.id,name:job.name,status:job.status,
                conclusion:job.conclusion,
                steps:job.steps?.map(s=>({name:s.name,conclusion:s.conclusion,status:s.status}))
              }));
            }
