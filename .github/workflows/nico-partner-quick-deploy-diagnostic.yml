# Recheck after successful codebase reuse release fix #168
name: NICO partner counts deployment status (read-only)
on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/nico-partner-quick-deploy-diagnostic.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Print latest main production release run metadata (NO SECRETS)
        uses: actions/github-script@v7
        with:
          script: |
            const {owner,repo}=context.repo;
            const response=await github.rest.actions.listWorkflowRuns({
              owner,repo,workflow_id:"nico-partner-quick-release.yml",
              branch:"main",event:"push",per_page:10
            });
            console.log("DEPLOY_RUN_COUNT",response.data.workflow_runs?.length||0);
            for(const run of (response.data.workflow_runs||[]).slice(0,4)){
              console.log(JSON.stringify({run_id:run.id,status:run.status,
                conclusion:run.conclusion,created_at:run.created_at,
                html_url:run.html_url,head_sha:run.head_sha}));
              const jobs=await github.rest.actions.listJobsForWorkflowRun({
                owner,repo,run_id:run.id,per_page:25
              });
              for(const job of jobs.data.jobs||[])console.log(JSON.stringify({
                job_id:job.id,name:job.name,status:job.status,
                conclusion:job.conclusion,
                steps:job.steps?.map(s=>({name:s.name,conclusion:s.conclusion,status:s.status}))
              }));
            }
      - name: Inspect recent failed publish job log (redacted error codes only)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --max-time 30 \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/Keikei-p/-/actions/jobs/124204631035/logs" \
            --output "$RUNNER_TEMP/partner-count-publish-failure.log"
          python3 - "$RUNNER_TEMP/partner-count-publish-failure.log" <<'PY'
          import re,sys
          data=open(sys.argv[1],encoding='utf-8',errors='replace').read().splitlines()
          found=[]
          for line in data:
              match=re.search(r'(STOP [A-Z_0-9 :/+.-]+|HOSTING_API_FAILURE[^\\s]*|FINAL_[A-Z_]+[^\\n]*|FILE_[A-Z_]+[^\\n]*|Error: [A-Za-z_ -]{1,90})',line)
              if match:found.append(match.group(0)[:140])
          print("REDACTED_PUBLISH_ERRORS",found[-15:])
          PY
