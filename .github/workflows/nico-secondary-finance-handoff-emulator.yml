name: NICO secondary finance handoff emulator regression (NO DEPLOY)
on:
  pull_request:
    branches: [main]
    paths:
      - 'tests/finance-secondary-handoff-raw-access-emulator.test.cjs'
      - '.github/workflows/nico-secondary-finance-handoff-emulator.yml'
  push:
    branches: [main]
    paths:
      - 'tests/finance-secondary-handoff-raw-access-emulator.test.cjs'
      - '.github/workflows/nico-secondary-finance-handoff-emulator.yml'
permissions:
  contents: read
jobs:
  synthetic-secondary-and-owner:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    env:
      FIREBASE_PROJECT_ID: demo-nico-secondary-handoff
      GOOGLE_CLOUD_PROJECT: demo-nico-secondary-handoff
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Freeze original financial sources and prove the test never connects to live Firebase
        shell: bash
        run: |
          set -euo pipefail
          test "$FIREBASE_PROJECT_ID" = 'demo-nico-secondary-handoff'
          test "$(git hash-object firestore.rules)" = 'd9f4df6a2ac0f8b5720534a2461ec66b94379190'
          test "$(git hash-object index.html)" = '88ef5636bfe9254e71f2109d452b6d3049f99861'
          test "$(git hash-object functions/index.js)" = 'dfb4c48ada6fa89a24c898cd4a2f911bcede822f'
          test "$(git hash-object functions-partner-workspace/index.js)" = '38da7e9174ffea7c406c92292dccfc651b565eb0'
          node --check tests/finance-secondary-handoff-raw-access-emulator.test.cjs
          test -z "$(printenv GOOGLE_APPLICATION_CREDENTIALS || true)"
          test -z "$(printenv FIREBASE_SERVICE_ACCOUNT_JSON || true)"
      - name: Install test-only Firestore emulator dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix tests --ignore-scripts --no-audit --no-fund --package-lock=false
      - name: Prove legacy secondary money access, staged closure and archive retention on LOCALHOST ONLY
        shell: bash
        run: |
          set -euo pipefail
          npx --yes firebase-tools@15.34.1 emulators:exec \
            --only firestore --project demo-nico-secondary-handoff \
            'node --test tests/finance-secondary-handoff-raw-access-emulator.test.cjs'
      - name: Confirm existing count-only workspace and migration eligibility logic remain operational
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/nico-secondary-readonly-inventory.test.mjs
          node --test tests/partner-workspace.test.cjs
          echo 'STAGED_HOLD: current dual-membership financial exposure proven; no production transfer, Rules, Functions or Hosting writes'
