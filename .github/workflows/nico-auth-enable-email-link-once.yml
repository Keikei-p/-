name: NICO enable Firebase email-link only (guarded one-time Auth config)
on:
  push:
    branches:
      - fix/partner-email-link-first-password-20261102
    paths:
      - '.github/workflows/nico-auth-enable-email-link-once.yml'
permissions:
  contents: read
concurrency:
  group: nico-auth-production-provider
  cancel-in-progress: false
jobs:
  enable-one-field:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NICO_AUTH_CHANGE: ENABLE_EMAIL_LINK_ONLY_KEEP_PASSWORD
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Refuse unexpected project or different reviewed base
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$NICO_AUTH_CHANGE" = ENABLE_EMAIL_LINK_ONLY_KEEP_PASSWORD
          test "$GITHUB_REF" = refs/heads/fix/partner-email-link-first-password-20261102
          test "$(gh api repos/Keikei-p/-/branches/main --jq '.commit.sha')" = 283bc749c97756fc3de03671ae7bac4eccdc46c3 || { echo STOP_REVIEWED_MAIN_CHANGED; exit 1; }
          test -f .github/workflows/nico-auth-email-link-readonly.yml
      - name: Install isolated credential client
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/nico-auth-enable" google-auth-library@9.15.1 --ignore-scripts --no-audit --no-fund --silent
      - name: Enable ONLY email link, preserving email-password, accounts and domains
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const {GoogleAuth}=require(process.env.RUNNER_TEMP+'/nico-auth-enable/node_modules/google-auth-library');
          (async()=>{
            const raw=process.env.FIREBASE_SERVICE_ACCOUNT_JSON;
            if(!raw){console.log('STOP_MISSING_EXISTING_IDENTITY');process.exitCode=1;return;}
            const credentials=JSON.parse(raw);
            if(credentials.project_id!=='sales-management-cc116'){
              console.log('STOP_WRONG_FIREBASE_PROJECT');process.exitCode=1;return;
            }
            const auth=new GoogleAuth({credentials,scopes:['https://www.googleapis.com/auth/cloud-platform']});
            const client=await auth.getClient();
            const url='https://identitytoolkit.googleapis.com/admin/v2/projects/sales-management-cc116/config';
            const get=async()=>(await client.request({method:'GET',url})).data;
            const before=await get();
            if(before?.name!=null&&!['projects/sales-management-cc116/config','projects/904932511564/config'].includes(before.name)){
              console.log('STOP_WRONG_AUTH_RESOURCE');process.exitCode=1;return;
            }
            if(before.signIn?.email?.enabled!==true||!Array.isArray(before.authorizedDomains)||
               !before.authorizedDomains.includes('nico-factory.web.app')){
              console.log('STOP_PASSWORD_OR_HOSTING_DOMAIN_NOT_READY');process.exitCode=1;return;
            }
            const state=before.signIn.email.passwordRequired;
            if(state!==true&&state!==false){
              console.log('STOP_AMBIGUOUS_AUTH_EMAIL_LINK_CONFIG');process.exitCode=1;return;
            }
            if(state===true){
              await client.request({
                method:'PATCH',
                url:url+'?updateMask=signIn.email.passwordRequired',
                data:{signIn:{email:{passwordRequired:false}}}
              });
            }
            const after=await get();
            const same=(a,b)=>JSON.stringify(a)===JSON.stringify(b);
            if(after?.signIn?.email?.enabled!==true||
               after.signIn.email.passwordRequired!==false||
               !same(before.authorizedDomains,after.authorizedDomains)||
               !same(before.signIn?.phoneNumber,after.signIn?.phoneNumber)||
               !same(before.signIn?.anonymous,after.signIn?.anonymous)||
               !same(before.mfa,after.mfa)){
              console.log('STOP_AUTH_POSTCHANGE_REVIEW_REQUIRED');
              process.exitCode=1;return;
            }
            console.log('PASS_NICO_EMAIL_LINK_ENABLED_AND_PASSWORD_PRESERVED production_db_writes=0 existing_users_unchanged=true action='+(state===false?'already_enabled':'single_field_patch'));
          })().catch(e=>{
            console.log('STOP_AUTH_SINGLE_FIELD_UPDATE_HTTP_'+(Number(e?.response?.status)||'UNKNOWN'));
            process.exitCode=1;
          });
          NODE
