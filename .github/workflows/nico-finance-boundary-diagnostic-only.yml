name: NICO on-device finance boundary diagnostic (surgical Hosting)
on:
  pull_request:
    branches: [main]
    paths:
      - 'finance-boundary-check.html'
      - 'tools/hosting/additive-finance-boundary-diagnostic.mjs'
      - 'tests/finance-boundary-*.test.mjs'
      - '.github/workflows/nico-finance-boundary-diagnostic-only.yml'
  push:
    branches: [main]
    paths:
      - 'finance-boundary-check.html'
      - 'tools/hosting/additive-finance-boundary-diagnostic.mjs'
      - 'tests/finance-boundary-*.test.mjs'
      - '.github/workflows/nico-finance-boundary-diagnostic-only.yml'

permissions:
  contents: read
concurrency:
  group: nico-finance-boundary-diagnostic-hosting-only
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Browser privacy and non-overwriting Hosting contracts
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/hosting/additive-finance-boundary-diagnostic.mjs
          node --test tests/finance-boundary-ondevice.test.mjs tests/finance-boundary-additive-hosting.test.mjs
          node --test tests/legacy-rules-apply-frozen.test.mjs tests/internal-owner-finance-visibility.test.cjs
          node --test tests/sales-regressions.cjs
          node -e "const fs=require('fs');if(JSON.parse(fs.readFileSync('.firebaserc','utf8')).projects.default!=='sales-management-cc116')process.exit(1)"
          test "$(git hash-object firestore.rules)" = "d9f4df6a2ac0f8b5720534a2461ec66b94379190"
          test "$(git hash-object index.html)" = "88ef5636bfe9254e71f2109d452b6d3049f99861"
          node <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('finance-boundary-check.html','utf8');
          const code=html.match(/<script type="module">([\s\S]*?)<\/script>/)?.[1];
          if(!code||/localStorage|sessionStorage|console\.log|writeBatch|setDoc\(/.test(code))
            throw Error('UNSAFE_BROWSER_DIAGNOSTIC');
          fs.writeFileSync('/tmp/nico-diagnostic-module.mjs',code);
          NODE
          node --check /tmp/nico-diagnostic-module.mjs

  publish-additive-only:
    needs: validate
    if: ${{ github.event_name == 'push' &&
           github.ref == 'refs/heads/main' &&
           github.repository == 'Keikei-p/-' &&
           startsWith(github.event.head_commit.message, 'release: add read-only finance boundary diagnostic (preserve Hosting)') &&
           needs.validate.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      NICO_FINANCE_DIAGNOSTIC_RELEASE_CONFIRMATION: CONFIRM_ADD_FINANCE_DIAGNOSTIC_ONLY
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Reject stale source before credentials
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api repos/Keikei-p/-/branches/main --jq '.commit.sha')" = "$GITHUB_SHA"
          test "$GITHUB_SHA" = "$(git rev-parse HEAD)"
          test "$(git hash-object firestore.rules)" = "d9f4df6a2ac0f8b5720534a2461ec66b94379190"
          test "$(git hash-object index.html)" = "88ef5636bfe9254e71f2109d452b6d3049f99861"
          node --test tests/finance-boundary-ondevice.test.mjs tests/finance-boundary-additive-hosting.test.mjs
      - name: Supply existing approved Hosting identity privately
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          test -n "$FIREBASE_SERVICE_ACCOUNT_JSON"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/nico-finance-diagnostic-hosting.json"
          chmod 600 "$RUNNER_TEMP/nico-finance-diagnostic-hosting.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/nico-finance-diagnostic-hosting.json" >> "$GITHUB_ENV"
      - name: Install existing Firebase Admin auth dependency only
        run: npm install --prefix functions --ignore-scripts --package-lock=false --no-audit --no-fund
      - name: Verify every live asset hash and config before publishing
        run: node tools/hosting/additive-finance-boundary-diagnostic.mjs --dry-run
      - name: Publish ONE new HTML path preserving all live files
        run: node tools/hosting/additive-finance-boundary-diagnostic.mjs --release
      - name: Confirm actual published bytes and pre-existing pages
        shell: bash
        run: |
          set -euo pipefail
          matched=false
          for n in $(seq 1 12); do
            curl -fsSL --max-time 25 --retry 1 \
              "https://nico-factory.web.app/finance-boundary-check.html?verify=$GITHUB_SHA-$n" \
              > "$RUNNER_TEMP/nico-diagnostic-live.html" || true
            if cmp -s "$RUNNER_TEMP/nico-diagnostic-live.html" finance-boundary-check.html; then
              matched=true;break
            fi
            sleep 5
          done
          test "$matched" = true || { echo "STOP_DIAGNOSTIC_CDN_PARITY"; exit 1; }
          for route in / /partner-invite.html /partner-counts.html /partner-workspace.html; do
            test "$(curl -sSL -o /dev/null -w '%{http_code}' --max-time 25 "https://nico-factory.web.app$route")" = 200
          done
          echo "PASS: read-only finance diagnostic added without replacing existing pages"
      - name: Erase service identity and temporary HTML
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/nico-finance-diagnostic-hosting.json" "$RUNNER_TEMP/nico-diagnostic-live.html"
