name: NICO Owner quick-count correction isolated (NO DEPLOY)
on:
  push:
    branches: [feature/partner-owner-quick-correction-20261107]
  pull_request:
    branches: [feature/partner-owner-directory-paging-20261107]
permissions:
  contents: read
jobs:
  owner-quick-safe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      FIREBASE_PROJECT_ID: demo-sales-support
      GOOGLE_APPLICATION_CREDENTIALS: ""
      FIREBASE_SERVICE_ACCOUNT_JSON: ""
      NICO_USAGE_APPROVAL: ""
      NICO_PHASE1_INDEPENDENT_SIGNOFF: ""
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check no production keys and exact file allowlist
        shell: bash
        run: |
          set -euo pipefail
          test "$FIREBASE_PROJECT_ID" = demo-sales-support
          test -z "$GOOGLE_APPLICATION_CREDENTIALS"
          test -z "$FIREBASE_SERVICE_ACCOUNT_JSON"
          test -z "$NICO_USAGE_APPROVAL"
          test -z "$NICO_PHASE1_INDEPENDENT_SIGNOFF"
          git fetch --no-tags origin feature/partner-owner-directory-paging-20261107
          git diff --name-only origin/feature/partner-owner-directory-paging-20261107...HEAD >/tmp/owner-quick-changed.txt
          cat /tmp/owner-quick-changed.txt
          while IFS= read -r file; do
            case "$file" in
              index.html|functions-partner-quick/index.js|functions-partner-quick/quick-counts.cjs|tests/partner-quick-counts.test.cjs|.github/workflows/nico-owner-partner-quick-no-deploy.yml) ;;
              *) echo "BLOCK_UNREVIEWED_SOURCE: $file"; exit 1 ;;
            esac
          done < /tmp/owner-quick-changed.txt
          test "$(wc -l < /tmp/owner-quick-changed.txt)" -eq 5
      - name: Parse JS and test isolated quick ledger with original auth, sales, partner regressions
        run: |
          set -euo pipefail
          node --check functions-partner-quick/quick-counts.cjs
          node --check functions-partner-quick/index.js
          node --test \
            tests/partner-quick-counts.test.cjs \
            tests/owner-partner-directory-pagination.test.cjs \
            tests/owner-partner-count-console.test.cjs \
            tests/partner-internet-split-safe.test.cjs \
            tests/partner-legacy-nine-optin-safe.test.cjs \
            tests/partner-ui-safe-increment.test.cjs \
            tests/partner-saved-month-ui-main.test.cjs \
            tests/partner-workspace.test.cjs \
            tests/partner-additional-ledger-main.test.cjs \
            tests/partner-combined-month-ranking-main.test.cjs \
            tests/partner-catalog-publish-main.test.cjs \
            tests/partner-saved-month-main.test.cjs \
            tests/partner-company-code-auth.test.cjs \
            tests/partner-company-invitations.test.cjs \
            tests/partner-one-login-same-app.test.cjs \
            tests/partner-invite-resend-and-accept.test.cjs \
            tests/partner-money-free-workspace.test.cjs \
            tests/partner-existing-ranking.test.cjs \
            tests/internal-owner-finance-visibility.test.cjs \
            tests/sales-regressions.cjs
      - name: Confirm no production deployment or writes
        run: |
          echo "PRODUCTION_DOCUMENT_WRITES=0"
          echo "PRODUCTION_RULES_PATCHES=0"
          echo "PRODUCTION_DEPLOYED=false"
