name: NICO Gen1 partner count callable metadata audit (READ ONLY)

on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/production/inspect-live-partner-functions-gen1-readonly.mjs'
      - 'tests/inspect-live-partner-functions-gen1-readonly.test.mjs'
      - '.github/workflows/nico-gen1-partner-count-functions-audit.yml'
  push:
    branches: [main]
    paths:
      - 'tools/production/inspect-live-partner-functions-gen1-readonly.mjs'
      - 'tests/inspect-live-partner-functions-gen1-readonly.test.mjs'
      - '.github/workflows/nico-gen1-partner-count-functions-audit.yml'

permissions:
  contents: read
concurrency:
  group: nico-gen1-partner-count-functions-metadata-get-only
  cancel-in-progress: false

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Validate allowlisted metadata GET, existing count save and frozen Rules
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/production/inspect-live-partner-functions-gen1-readonly.mjs
          node --test tests/inspect-live-partner-functions-gen1-readonly.test.mjs
          node --test tests/inspect-live-partner-callables-readonly.test.mjs
          node --test tests/partner-workspace.test.cjs
          test "$(git hash-object firestore.rules)" = 'd9f4df6a2ac0f8b5720534a2461ec66b94379190'
          test "$(git hash-object functions-partner-workspace/index.js)" = '38da7e9174ffea7c406c92292dccfc651b565eb0'

  gen1-readonly:
    needs: offline
    if: ${{ github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.repository == 'Keikei-p/-' &&
      needs.offline.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      FIREBASE_PROJECT_ID: sales-management-cc116
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify review branch, project, frozen finance and server sources
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_SHA" = "$(git rev-parse HEAD)"
          test "$(git hash-object firestore.rules)" = 'd9f4df6a2ac0f8b5720534a2461ec66b94379190'
          test "$(git hash-object functions-partner-workspace/index.js)" = '38da7e9174ffea7c406c92292dccfc651b565eb0'
          node --test tests/inspect-live-partner-functions-gen1-readonly.test.mjs
      - name: Install reviewed existing OAuth library
        run: npm install --prefix functions --ignore-scripts --package-lock=false --no-audit --no-fund
      - name: Use the existing protected audit identity privately
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          test -n "$FIREBASE_SERVICE_ACCOUNT_JSON"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/nico-gen1-read-identity.json"
          chmod 600 "$RUNNER_TEMP/nico-gen1-read-identity.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/nico-gen1-read-identity.json" >> "$GITHUB_ENV"
      - name: GET only four exact Gen1 regional Function metadata endpoints
        shell: bash
        run: |
          set -euo pipefail
          code=0
          node tools/production/inspect-live-partner-functions-gen1-readonly.mjs \
            > "$RUNNER_TEMP/nico-gen1-read-private.log" 2>&1 || code=$?
          grep -E '^(PARTNER_COUNT_GEN1_METADATA |BLOCK_GEN1_[A-Z0-9_]+$|STOP_LEGACY_COUNT_FUNCTION_[A-Z0-9_]+$)' \
            "$RUNNER_TEMP/nico-gen1-read-private.log" || true
          test "$code" = 0
          grep -q '^PARTNER_COUNT_GEN1_METADATA ' "$RUNNER_TEMP/nico-gen1-read-private.log"
          grep '^PARTNER_COUNT_GEN1_METADATA ' "$RUNNER_TEMP/nico-gen1-read-private.log" \
            | grep -q '"safeToCutOverRules":false'
      - name: Destroy temporary identity and logs (never attach artifacts)
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/nico-gen1-read-identity.json" \
            "$RUNNER_TEMP/nico-gen1-read-private.log"
