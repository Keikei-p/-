name: NICO deleted partner staff keeps saved daily counts (NO DEPLOY)
on:
  push:
    branches: [fix/partner-deleted-staff-daily-count-20261106]
  pull_request:
    branches: [release/partner-month-phase1-candidate-20261106]
permissions:
  contents: read
concurrency:
  group: nico-orphan-daily-${{ github.ref }}
  cancel-in-progress: true
jobs:
  historic-daily-counts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FIREBASE_PROJECT_ID: demo-sales-support
      GCLOUD_PROJECT: demo-sales-support
      GOOGLE_APPLICATION_CREDENTIALS: ""
      FIREBASE_SERVICE_ACCOUNT_JSON: ""
      NICO_RULES_APPROVAL: ""
      NICO_PARTNER_RELEASE_CONFIRMATION: ""
      NICO_PHASE1_INDEPENDENT_SIGNOFF: ""
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify exact 11/9 source and forbid unreviewed finance, UI or write changes
        shell: bash
        run: |
          set -euo pipefail
          test "$FIREBASE_PROJECT_ID" = demo-sales-support
          test "$GCLOUD_PROJECT" = demo-sales-support
          test -z "$GOOGLE_APPLICATION_CREDENTIALS"
          test -z "$FIREBASE_SERVICE_ACCOUNT_JSON"
          test -z "$NICO_RULES_APPROVAL"
          test -z "$NICO_PARTNER_RELEASE_CONFIRMATION"
          test -z "$NICO_PHASE1_INDEPENDENT_SIGNOFF"
          git fetch --no-tags origin release/partner-month-phase1-candidate-20261106
          base="$(git rev-parse origin/release/partner-month-phase1-candidate-20261106)"
          test "$base" = 895043175374865223dd98f6de4f96ae861fdf13
          test "$(git merge-base HEAD "$base")" = "$base"
          git diff --name-only "$base"...HEAD > /tmp/nico-orphan-count-files.txt
          test "$(wc -l < /tmp/nico-orphan-count-files.txt)" -eq 5
          if grep -Ev '^(functions-partner-workspace/service[.]cjs|tests/partner-workspace[.]test[.]cjs|[.]github/workflows/(nico-deleted-staff-historical-count-no-deploy|nico-nov9-release-candidate-no-deploy|nico-partner-daily-historic-ranking-no-deploy)[.]yml)$' /tmp/nico-orphan-count-files.txt; then
            echo STOP_UNREVIEWED_DELETED_STAFF_CHANGE
            exit 1
          fi
          test "$(git hash-object functions-partner-workspace/service.cjs)" = d6ad6aa8f0f26910515aad8cd70962cbcd9ed6c7
          test "$(git hash-object index.html)" = 1b0d7e22d55d3b37f6767d716583ccd5df0c0b15
          test "$(git hash-object firestore.rules)" = 6d6ac7fd3544b0326823e419a3acd7e1d060b714
          git diff --exit-code "$base" HEAD -- index.html firestore.rules firestore.indexes.json functions functions-partner-quick
          node --check functions-partner-workspace/service.cjs
      - name: Verify actual partner service functions preserve historical counts and finance
        run: |
          node --test tests/partner-workspace.test.cjs tests/partner-daily-history-active-input.test.cjs tests/partner-saved-month-main.test.cjs tests/partner-combined-month-ranking-main.test.cjs tests/internal-owner-finance-visibility.test.cjs tests/partner-company-code-auth.test.cjs tests/partner-one-login-same-app.test.cjs tests/sales-regressions.cjs
      - name: Release remains private draft
        run: |
          echo 'NICO_ORPHAN_DAILY_COUNTS_SYNTHETIC_PASS'
          echo 'PRODUCTION_RULES_CHANGED=false'
          echo 'PRODUCTION_FIRESTORE_WRITES=0'
          echo 'PRODUCTION_DEPLOYED=false'
          echo 'PRODUCTION_APPROVED=false'
