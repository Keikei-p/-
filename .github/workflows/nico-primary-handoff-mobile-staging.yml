name: NICO partner primary handoff mobile opt-in (STAGING / NO DEPLOY)
on:
  pull_request:
    branches: [main]
    paths:
      - 'staging/partner-primary-handoff/mobile-preview.html'
      - 'tests/partner-primary-handoff-mobile-preview-staging.test.cjs'
      - '.github/workflows/nico-primary-handoff-mobile-staging.yml'
  push:
    branches: [main]
    paths:
      - 'staging/partner-primary-handoff/mobile-preview.html'
      - 'tests/partner-primary-handoff-mobile-preview-staging.test.cjs'
      - '.github/workflows/nico-primary-handoff-mobile-staging.yml'
permissions:
  contents: read
jobs:
  offline-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirm only staged mobile UI; no live auth or count flow changes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object firestore.rules)" = d9f4df6a2ac0f8b5720534a2461ec66b94379190
          test "$(git hash-object index.html)" = 88ef5636bfe9254e71f2109d452b6d3049f99861
          test "$(git hash-object partner-workspace.html)" = 0930abb188165afea19ef427308ea22fddf636e7
          test "$(git hash-object functions/index.js)" = dfb4c48ada6fa89a24c898cd4a2f911bcede822f
          test "$(git hash-object functions-partner-workspace/index.js)" = 38da7e9174ffea7c406c92292dccfc651b565eb0
          test -z "$(printenv FIREBASE_SERVICE_ACCOUNT_JSON || true)"
          test -z "$(printenv GOOGLE_APPLICATION_CREDENTIALS || true)"
          node --check tests/partner-primary-handoff-mobile-preview-staging.test.cjs
      - name: Simulate mobile sign-in, consent, company change and missing backend without network
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/partner-primary-handoff-mobile-preview-staging.test.cjs
          node --test tests/partner-secondary-primary-handoff-staging.test.cjs
          node --test tests/nico-secondary-readonly-inventory.test.mjs
          echo 'MOBILE_ONLY_STAGING_PASS_NO_PRODUCTION_DEPLOY'
