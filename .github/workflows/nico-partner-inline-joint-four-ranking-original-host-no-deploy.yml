name: NICO partner original four joint rankings host (NO DEPLOY)
on:
  pull_request:
    branches: [main]
    paths:
      - 'partner-workspace.html'
      - 'tests/partner-inline-joint-staging-wiring.test.mjs'
      - 'tests/partner-inline-joint-original-preservation.test.mjs'
      - '.github/workflows/nico-partner-inline-joint-four-ranking-original-host-no-deploy.yml'
      - 'scripts/ci/review-partner-original-joint-four-rank-no-deploy.cjs'
      - '.github/workflows/nico-verified-partner-count-standings-no-deploy.yml'
      - '.github/workflows/nico-partner-dashboard-original-parity-no-deploy.yml'
      - '.github/workflows/nico-partner-company-code-release.yml'
      - '.github/workflows/nico-joint-count-host-wiring-no-deploy.yml'
permissions:
  contents: read
jobs:
  verify-partner-current-host:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOOGLE_APPLICATION_CREDENTIALS: ''
      FIREBASE_SERVICE_ACCOUNT_JSON: ''
      FIREBASE_TOKEN: ''
      NICO_JOINT_COUNT_RANKING_ENABLED: ''
      NICO_PARTNER_COUNT_PUBLICATION_WRITE_ENABLED: ''
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Exact original company login and count-source invariants
        shell: bash
        run: |
          set -euo pipefail
          test -z "$GOOGLE_APPLICATION_CREDENTIALS"
          test -z "$FIREBASE_SERVICE_ACCOUNT_JSON"
          test -z "$FIREBASE_TOKEN"
          test -z "$NICO_JOINT_COUNT_RANKING_ENABLED"
          test -z "$NICO_PARTNER_COUNT_PUBLICATION_WRITE_ENABLED"
          git fetch --no-tags origin main
          while IFS= read -r path; do
            case "$path" in
              partner-workspace.html|tests/partner-inline-joint-staging-wiring.test.mjs|tests/partner-inline-joint-original-preservation.test.mjs|.github/workflows/nico-partner-inline-joint-four-ranking-original-host-no-deploy.yml|scripts/ci/review-partner-original-joint-four-rank-no-deploy.cjs|.github/workflows/nico-verified-partner-count-standings-no-deploy.yml|.github/workflows/nico-partner-dashboard-original-parity-no-deploy.yml|.github/workflows/nico-partner-company-code-release.yml|.github/workflows/nico-joint-count-host-wiring-no-deploy.yml) ;;
              *) echo "STOP_UNREVIEWED_PARTNER_PRODUCTION_CHANGE: $path"; exit 1 ;;
            esac
          done < <(git diff --name-only origin/main...HEAD)
          test "$(git hash-object partner-workspace.html)" = 1ea7e1a26702681294ec999c7b36a8f10b880aa2
          test "$(git hash-object scripts/ci/review-partner-original-joint-four-rank-no-deploy.cjs)" = 5655eb5b332574909077bef1acdd04af9cf54822
          node scripts/ci/review-partner-original-joint-four-rank-no-deploy.cjs
          test "$(git hash-object index.html)" = 5edde6d5e5459ba283d12d157c021d4eee03d587
          test "$(git hash-object sales-archive.js)" = 480640ebea66a7cc2aa820cbc1fa9b982d835875
          test "$(git hash-object firestore.rules)" = d9f4df6a2ac0f8b5720534a2461ec66b94379190
          test "$(git hash-object functions-partner-workspace/index.js)" = 90d51246477cf5cfa6966f3e822326ef06cccd0f
          test "$(git hash-object functions-partner-workspace/service.cjs)" = 614f3216e008642ddf5eda6b93c35cc0469557c3
          grep -Fq 'const NICO_PARTNER_JOINT_INLINE_CARDS_RELEASED=false;' partner-workspace.html
          grep -Fq 'const NICO_PARTNER_JOINT_COUNT_MONTH_RELEASED=false;' partner-workspace.html
          grep -Fq 'const NICO_APPROVED_PARTNER_RANKING_RELEASED=false;' partner-workspace.html
      - name: Retain old sign-in, count editing, history and finance protection
        run: |
          node --test tests/partner-inline-joint-original-preservation.test.mjs tests/partner-inline-joint-staging-wiring.test.mjs tests/partner-money-free-workspace.test.cjs tests/partner-workspace.test.cjs tests/verified-inline-joint-ranking-cards.test.mjs tests/verified-joint-month-http-bridge.test.mjs
          echo 'PARTNER_ORIGINAL_FOUR_RANK_HOST_SAFE_OFF_NO_DEPLOY'
      - name: Explicitly preserve production state
        run: |
          echo 'PARTNER_REVENUE_AND_COUNT_ORIGINAL=UNCHANGED'
          echo 'FIRESTORE_WRITES=0 RULES_DEPLOYED=NO FUNCTIONS_DEPLOYED=NO HOSTING_DEPLOYED=NO'
          echo 'PRODUCTION_RELEASE_APPROVED=NO'
