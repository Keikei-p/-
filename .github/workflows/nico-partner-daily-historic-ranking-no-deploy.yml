name: NICO partner retired history and active input (NO DEPLOY)
on:
  push:
    branches: [fix/partner-daily-history-rank-active-input-20261106]
  pull_request:
    branches: [release/partner-month-phase1-candidate-20261106]
permissions:
  contents: read
concurrency:
  group: nico-history-input-${{ github.ref }}
  cancel-in-progress: true
jobs:
  counts-only:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FIREBASE_PROJECT_ID: demo-sales-support
      GCLOUD_PROJECT: demo-sales-support
      GOOGLE_APPLICATION_CREDENTIALS: ""
      FIREBASE_SERVICE_ACCOUNT_JSON: ""
      NICO_RULES_APPROVAL: ""
      NICO_PARTNER_RELEASE_CONFIRMATION: ""
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Freeze vetted release ancestor and exact minimal UI delta
        shell: bash
        run: |
          set -euo pipefail
          test "$FIREBASE_PROJECT_ID" = demo-sales-support
          test "$GCLOUD_PROJECT" = demo-sales-support
          test -z "$GOOGLE_APPLICATION_CREDENTIALS"
          test -z "$FIREBASE_SERVICE_ACCOUNT_JSON"
          test -z "$NICO_RULES_APPROVAL"
          test -z "$NICO_PARTNER_RELEASE_CONFIRMATION"
          git fetch --no-tags origin release/partner-month-phase1-candidate-20261106
          base="$(git rev-parse origin/release/partner-month-phase1-candidate-20261106)"
          test "$base" = 8b170ca7ae7309dfd5f148afebcf2f0e9dd5c4e9
          test "$(git merge-base HEAD "$base")" = "$base"
          git diff --name-only "$base"...HEAD > /tmp/nico-history-input-files.txt
          cat /tmp/nico-history-input-files.txt
          test "$(wc -l < /tmp/nico-history-input-files.txt)" -eq 3
          if grep -Ev '^(index[.]html|tests/partner-daily-history-active-input[.]test[.]cjs|[.]github/workflows/nico-partner-daily-historic-ranking-no-deploy[.]yml)$' /tmp/nico-history-input-files.txt; then
            echo STOP_UNREVIEWED_HISTORY_INPUT_FILES
            exit 1
          fi
          test "$(git hash-object index.html)" = 1b0d7e22d55d3b37f6767d716583ccd5df0c0b15
          test "$(git hash-object firestore.rules)" = 6d6ac7fd3544b0326823e419a3acd7e1d060b714
          git diff --exit-code "$base" HEAD -- firestore.rules firestore.indexes.json functions functions-partner-workspace functions-partner-quick
      - name: Existing rankings, monthly, authentication, sales and newly added historical case
        run: |
          node --test tests/partner-daily-history-active-input.test.cjs tests/partner-saved-month-ui-main.test.cjs tests/partner-saved-month-main.test.cjs tests/partner-existing-ranking.test.cjs tests/sales-regressions.cjs tests/internal-owner-finance-visibility.test.cjs tests/partner-one-login-same-app.test.cjs
      - name: Prove no production mutation or publication
        run: |
          echo 'NICO_PARTNER_HISTORIC_INPUT_SYNTHETIC_PASS'
          echo 'FIRESTORE_DOCUMENT_WRITES=0'
          echo 'PRODUCTION_DEPLOYED=false'
          echo 'RULES_RELEASED=false'
          echo 'PRODUCTION_APPROVED=false'
