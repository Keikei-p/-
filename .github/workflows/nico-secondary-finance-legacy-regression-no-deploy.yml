name: NICO secondary finance fence legacy sales regression (EMULATOR ONLY)
on:
  pull_request:
    branches: [main]
    paths:
      - 'tests/rules.test.cjs'
      - 'security/secondary-finance-read-fence.mjs'
      - '.github/workflows/nico-secondary-finance-legacy-regression-no-deploy.yml'
  push:
    branches: [main]
    paths:
      - 'tests/rules.test.cjs'
      - 'security/secondary-finance-read-fence.mjs'
      - '.github/workflows/nico-secondary-finance-legacy-regression-no-deploy.yml'
permissions:
  contents: read
jobs:
  legacy-internal-sales:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      FIREBASE_PROJECT_ID: demo-sales-support
      GCLOUD_PROJECT: demo-sales-support
      GOOGLE_APPLICATION_CREDENTIALS: ""
      FIREBASE_SERVICE_ACCOUNT_JSON: ""
      NICO_EMULATOR_REVIEW_SECONDARY_FENCE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Fail closed unless the exact existing production Rules and localhost-only demo are used
        shell: bash
        run: |
          set -euo pipefail
          test "$FIREBASE_PROJECT_ID" = demo-sales-support
          test "$GCLOUD_PROJECT" = demo-sales-support
          test "$NICO_EMULATOR_REVIEW_SECONDARY_FENCE" = 1
          test -z "$GOOGLE_APPLICATION_CREDENTIALS"
          test -z "$FIREBASE_SERVICE_ACCOUNT_JSON"
          test "$(git hash-object firestore.rules)" = d9f4df6a2ac0f8b5720534a2461ec66b94379190
          node --check tests/rules.test.cjs
          node --check security/secondary-finance-read-fence.mjs
          node security/secondary-finance-read-fence.mjs --check
          git diff --exit-code -- firestore.rules firebase.json index.html functions functions-partner-workspace
      - name: Install pinned demo-only Firebase CLI and Rules SDK
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix tests --ignore-scripts --no-audit --no-fund --package-lock=false
          npm install --global firebase-tools@15.34.1 --no-audit --no-fund
      - name: Run ALL original internal sales app Rules tests against actual secondary finance fence candidate
        shell: bash
        run: |
          set -euo pipefail
          firebase emulators:exec --project demo-sales-support --only firestore \
            'node --test --test-concurrency=1 tests/rules.test.cjs'
          test "$(git hash-object firestore.rules)" = d9f4df6a2ac0f8b5720534a2461ec66b94379190
          git diff --exit-code -- firestore.rules firebase.json index.html
          echo 'NICO_SECONDARY_FINANCE_CANDIDATE_LEGACY_SALES_CONTINUITY_EMULATOR_PASS'
          echo 'PRODUCTION_RULES_WRITES=0 PRODUCTION_DATA_WRITES=0 PRODUCTION_DEPLOY=NO'
