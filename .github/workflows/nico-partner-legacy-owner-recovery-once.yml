name: NICO restore original Owner partner company list - backend only
on:
  pull_request:
    branches: [main]
    paths:
      - functions-partner-workspace/service.cjs
      - tests/partner-workspace.test.cjs
      - .github/workflows/nico-partner-legacy-owner-recovery-once.yml
  push:
    branches: [main]
    paths:
      - .github/workflows/nico-partner-legacy-owner-recovery-once.yml
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Source and backward compatibility tests - no credentials
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object functions-partner-workspace/service.cjs)" = 'daaf3ed7a7e96196c469f8c93e46f6a6fb44600a'
          test "$(git hash-object functions-partner-workspace/index.js)" = '38da7e9174ffea7c406c92292dccfc651b565eb0'
          test "$(git hash-object functions/index.js)" = 'dfb4c48ada6fa89a24c898cd4a2f911bcede822f'
          test "$(git hash-object index.html)" = 'd68e0be91d5933c03ed0657a73751573fb5c7344'
          test "$(git hash-object firebase.partner-workspace.json)" = 'a6ceedec5fab4e22e0a8efe19c685716a2db9750'
          node --check functions-partner-workspace/service.cjs
          node --check functions-partner-workspace/index.js
          node --test tests/partner-workspace.test.cjs
          node --test tests/partner-money-free-workspace.test.cjs tests/partner-company-code-auth.test.cjs tests/internal-owner-finance-visibility.test.cjs
          node --test tests/partner-one-login-same-app.test.cjs tests/partner-existing-ranking.test.cjs tests/sales-regressions.cjs
          node <<'NODE'
          const fs=require('fs');
          const src=fs.readFileSync('functions-partner-workspace/service.cjs','utf8');
          if(!src.includes('(m.companyId!=null&&m.companyId!==cid)')||
             !src.includes('(c.companyKind==="partner"&&m.companyId!==cid)')||
             !src.includes('c.ownerUid!==uid||u.companyRole!=="owner"||m.companyRole!=="owner"'))
            throw Error('STOP_LEGACY_COMPAT_SECURITY_GUARD_MISSING');
          const tests=fs.readFileSync('tests/partner-workspace.test.cjs','utf8');
          if(!tests.includes('live legacy internal owner can list partner companies')||
             !tests.includes('legacy companyId compatibility never promotes wrong hub'))
            throw Error('STOP_LEGACY_OWNER_TESTS_MISSING');
          if(JSON.parse(fs.readFileSync('.firebaserc','utf8')).projects.default!=='sales-management-cc116')
            throw Error('STOP_WRONG_PROJECT');
          console.log('PASS_LEGACY_OWNER_BACKEND_ONLY');
          NODE
  release:
    needs: validate
    concurrency:
      group: nico-partner-workspace-production
      cancel-in-progress: false
    if: >-
      ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.actor == 'Keikei-p' && startsWith(github.event.head_commit.message, 'release: repair legacy owner partner list') && needs.validate.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 42
    env:
      FIREBASE_PROJECT_ID: sales-management-cc116
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify unchanged main, approved code and preserved original sales UI
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api repos/Keikei-p/-/branches/main --jq '.commit.sha')" = "$GITHUB_SHA"
          test "$(git hash-object functions-partner-workspace/service.cjs)" = 'daaf3ed7a7e96196c469f8c93e46f6a6fb44600a'
          test "$(git hash-object functions-partner-workspace/index.js)" = '38da7e9174ffea7c406c92292dccfc651b565eb0'
          test "$(git hash-object functions/index.js)" = 'dfb4c48ada6fa89a24c898cd4a2f911bcede822f'
          test "$(git hash-object firebase.partner-workspace.json)" = 'a6ceedec5fab4e22e0a8efe19c685716a2db9750'
          test "$(git hash-object index.html)" = 'd68e0be91d5933c03ed0657a73751573fb5c7344'
          node --test tests/partner-workspace.test.cjs tests/internal-owner-finance-visibility.test.cjs
          curl -fsSL --retry 2 --max-time 30 'https://nico-factory.web.app/?legacy_owner_recovery=preflight' > "$RUNNER_TEMP/legacy-live-index.html"
          cmp -s "$RUNNER_TEMP/legacy-live-index.html" index.html || { echo 'STOP_HOSTING_NOT_APPROVED'; exit 1; }
          echo 'PASS_EXISTING_HOSTING_UNCHANGED'
      - name: Read protected existing identity
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          test -n "${FIREBASE_SERVICE_ACCOUNT_JSON:-}"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/nico-legacy-recovery-identity.json"
          chmod 600 "$RUNNER_TEMP/nico-legacy-recovery-identity.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/nico-legacy-recovery-identity.json" >> "$GITHUB_ENV"
      - name: Install pinned Firebase CLI and original Admin SDK
        shell: bash
        run: |
          set -euo pipefail
          npm install -g firebase-tools@15.34.1 --no-audit --no-fund
          npm install --prefix functions --ignore-scripts --package-lock=false --no-audit --no-fund
          npm install --prefix functions-partner-workspace --ignore-scripts --package-lock=false --no-audit --no-fund
      - name: Read only - verify current finance boundary, backup, and original Functions
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {createRequire} from 'node:module';
          import {createHash} from 'node:crypto';
          import {inspect} from './tools/production/inspect-firestore-backups-readonly.mjs';
          const require=createRequire(process.cwd()+'/functions/package.json');
          const {applicationDefault} = require('firebase-admin/app');
          const token=(await applicationDefault().getAccessToken()).access_token;
          async function read(url){
            const res=await fetch(url,{headers:{Authorization:'Bearer '+token},redirect:'error'});
            if(!res.ok)throw Error('STOP_PRODUCTION_READ_'+res.status);
            return res.json();
          }
          const root='https://firebaserules.googleapis.com/v1/';
          const rel=await read(root+'projects/sales-management-cc116/releases/cloud.firestore');
          const rules=await read(root+rel.rulesetName);
          if(rules.source?.files?.length!==1)throw Error('STOP_RULES_UNREADABLE');
          const h=createHash('sha256').update(rules.source.files[0].content.replace(/\r\n/g,'\n').trim()).digest('hex');
          if(h!=='d1d9998d874a1a31c81ddf6996e08cd9de3a3d13bd684e245140bf03cab32179')
            throw Error('STOP_FINANCE_RULES_NOT_APPROVED');
          const backup=await inspect(),age=Date.now()-Date.parse(backup.latestReadySnapshot||'');
          if(backup.readyBackups<1||!Number.isFinite(age)||age<0||age>48*60*60*1000)
            throw Error('STOP_BACKUP_NOT_RECENT');
          for(const name of ['getPartnerWorkspace','managePartnerWorkspace','acceptPartnerWorkspaceInvite','submitPartnerWorkspaceCounts']){
            const f=await read('https://cloudfunctions.googleapis.com/v2/projects/sales-management-cc116/locations/asia-northeast1/functions/'+name);
            if(f.state!=='ACTIVE'||f.environment!=='GEN_2'||f.buildConfig?.runtime!=='nodejs22'||
               f.serviceConfig?.environmentVariables?.PARTNER_WORKSPACE_ENABLED!=='enabled')
              throw Error('STOP_ORIGINAL_PARTNER_FUNCTION_UNHEALTHY_'+name);
          }
          console.log('PASS rules, backup, 4 original Functions verified read-only');
          NODE
          firebase functions:list --project "$FIREBASE_PROJECT_ID" --json > "$RUNNER_TEMP/legacy-functions-before.json"
      - name: Deploy only repaired list and invite Functions - never set Artifact cleanup policy
        shell: bash
        run: |
          set -euo pipefail
          test ! -e functions-partner-workspace/.env.sales-management-cc116
          printf 'PARTNER_WORKSPACE_ENABLED=enabled\nPARTNER_COMPANY_CODE_AUTH_ENABLED=enabled\n' > functions-partner-workspace/.env.sales-management-cc116
          chmod 600 functions-partner-workspace/.env.sales-management-cc116
          date -u +'%Y-%m-%dT%H:%M:%SZ' > "$RUNNER_TEMP/legacy-deploy-start.txt"
          set +e
          firebase deploy --non-interactive --project "$FIREBASE_PROJECT_ID" \
            --config firebase.partner-workspace.json \
            --only functions:partner-workspace:getPartnerWorkspace,functions:partner-workspace:managePartnerWorkspace \
            2>&1 | tee "$RUNNER_TEMP/legacy-deploy-output.txt"
          deploy_result=${PIPESTATUS[0]}
          set -e
          if [ "$deploy_result" -ne 0 ]; then
            grep -Fq 'Functions successfully deployed but could not set up cleanup policy in location asia-northeast1' "$RUNNER_TEMP/legacy-deploy-output.txt" ||
              { echo 'STOP_UNEXPECTED_FUNCTIONS_DEPLOY_FAILURE'; exit 1; }
            echo 'KNOWN_ARTIFACT_CLEANUP_POST_DEPLOY_WARNING; verifying real Functions state before claiming success'
          fi
          # CLI messages alone are not a success condition. The following
          # separate steps re-read the actual Cloud Functions v2 resources.
          echo 'FUNCTION_DEPLOY_LOG_REVIEWED'
      - name: Read-only confirm repaired Functions became ACTIVE and existing Functions were preserved
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {createRequire} from 'node:module';
          import {readFileSync} from 'node:fs';
          const require=createRequire(process.cwd()+'/functions/package.json');
          const {applicationDefault}=require('firebase-admin/app');
          const token=(await applicationDefault().getAccessToken()).access_token;
          const afterStart=Date.parse(readFileSync(process.env.RUNNER_TEMP+'/legacy-deploy-start.txt','utf8').trim());
          for(const name of ['getPartnerWorkspace','managePartnerWorkspace']){
            const res=await fetch('https://cloudfunctions.googleapis.com/v2/projects/sales-management-cc116/locations/asia-northeast1/functions/'+name,{
              headers:{Authorization:'Bearer '+token},redirect:'error'
            });
            if(!res.ok)throw Error('STOP_FUNCTION_METADATA_HTTP_'+res.status);
            const f=await res.json();
            if(f.state!=='ACTIVE'||f.environment!=='GEN_2'||f.buildConfig?.runtime!=='nodejs22'||
               f.buildConfig?.entryPoint!==name||
               f.serviceConfig?.environmentVariables?.PARTNER_WORKSPACE_ENABLED!=='enabled'||
               !f.buildConfig?.source?.storageSource?.object||
               !Number.isFinite(Date.parse(f.updateTime))||
               Date.parse(f.updateTime)<afterStart)
              throw Error('STOP_REPAIRED_FUNCTION_NOT_CONFIRMED_'+name);
            console.log('PASS_LIVE_UPDATED_LEGACY_COMPAT '+name);
          }
          NODE
          firebase functions:list --project "$FIREBASE_PROJECT_ID" --json > "$RUNNER_TEMP/legacy-functions-after.json"
          node <<'NODE'
          const fs=require('fs');
          const names=p=>(JSON.parse(fs.readFileSync(p,'utf8')).result||[]).map(x=>x.id||x.name||'');
          const before=names(process.env.RUNNER_TEMP+'/legacy-functions-before.json');
          const after=names(process.env.RUNNER_TEMP+'/legacy-functions-after.json');
          if(!before.length||before.some(x=>!after.includes(x)))throw Error('STOP_OLD_FUNCTION_MISSING');
          console.log('PASS_ALL_PREEXISTING_FUNCTIONS_RETAINED');
          NODE
          node <<'NODE'
          (async()=>{
            for(const name of ['getPartnerWorkspace','managePartnerWorkspace','acceptPartnerWorkspaceInvite','submitPartnerWorkspaceCounts']){
              const r=await fetch('https://asia-northeast1-sales-management-cc116.cloudfunctions.net/'+name,{
                method:'POST',headers:{'Content-Type':'application/json'},body:'{"data":{}}'});
              if(![401,403].includes(r.status))throw Error('STOP_ANONYMOUS_ACCESS_'+name+'_'+r.status);
            }
            console.log('PASS_ALL_FOUR_ANONYMOUS_ACCESS_DENIED');
          })().catch(e=>{console.error(e.message);process.exitCode=1});
          NODE
          curl -fsSL --max-time 30 'https://nico-factory.web.app/?legacy_owner_recovery=post' > "$RUNNER_TEMP/legacy-index-after.html"
          cmp -s "$RUNNER_TEMP/legacy-index-after.html" index.html || { echo 'STOP_ORIGINAL_INDEX_CHANGED'; exit 1; }
          echo 'PASS_LEGACY_OWNER_BACKEND_RECOVERY: only two Functions updated; no database, Rules, Hosting, LINE changes'
      - name: Remove temporary credentials, flags and logs
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/nico-legacy-recovery-identity.json" "$RUNNER_TEMP/legacy-deploy-start.txt" "$RUNNER_TEMP/legacy-deploy-output.txt" "$RUNNER_TEMP/legacy-functions-before.json" "$RUNNER_TEMP/legacy-functions-after.json" "$RUNNER_TEMP/legacy-live-index.html" "$RUNNER_TEMP/legacy-index-after.html" functions-partner-workspace/.env.sales-management-cc116
