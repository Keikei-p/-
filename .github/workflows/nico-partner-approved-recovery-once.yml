# One-off retry of a previously manually confirmed production release.
# The original workflow_dispatch run 41080213061 passed all read-only tests,
# verified explicit confirmation via job condition, and failed before deployment
# at STOP UNKNOWN_ARGUMENT. Its old SHA must not be rerun as a deployment.
# This bridge requires rerunning that exact prior failed job once; it may
# dispatch the existing official manual-gated workflow at current main exactly
# once (run_attempt==2), then cannot fire from any other event or commit.
name: One-off recovery of previously approved partner invite release
on:
  workflow_run:
    workflows:
      - NICO partner invite only — controlled live release
    types: [completed]
permissions:
  contents: read
  actions: write
jobs:
  retry-approved:
    if: >-
      ${{ github.event.workflow_run.id == 41080213061
          && github.event.workflow_run.event == 'workflow_dispatch'
          && github.event.workflow_run.head_branch == 'main'
          && github.event.workflow_run.head_sha == 'a135ee56375248b88ee6d02ecdac160a2de83b37'
          && github.event.workflow_run.actor.login == 'Keikei-p'
          && github.event.workflow_run.conclusion == 'failure'
          && github.event.workflow_run.run_attempt == 2 }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Verify fixed parser and original gated release workflow
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/hosting/additive-partner-invite.mjs
          node --test tests/additive-partner-invite-hosting.test.mjs
          node <<'NODE'
          const fs=require('node:fs');
          const code=fs.readFileSync('tools/hosting/additive-partner-invite.mjs','utf8');
          const release=fs.readFileSync('.github/workflows/nico-partner-invite-only-release.yml','utf8');
          if(!code.includes('process.argv.slice(2)'))throw Error('Live parser fix missing');
          if(!release.includes('workflow_dispatch:')||
             release.includes('  push:')||
             !release.includes("github.ref == 'refs/heads/main'")||
             !release.includes('CONFIRM_PARTNER_INVITE_ONLY'))
            throw Error('Original manual release gate altered');
          NODE
      - name: Re-dispatch the original manually authorized, scope-limited workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run nico-partner-invite-only-release.yml \
            --repo Keikei-p/- \
            --ref main \
            -f release_confirmation=CONFIRM_PARTNER_INVITE_ONLY
          echo "Original controlled release re-dispatched using validated current main."
