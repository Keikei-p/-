name: Combined partner count leaderboard (offline)
on:
  pull_request:
    branches: [main]
    paths:
      - "ranking/combined-count-leaderboard.mjs"
      - "ranking/partner-workspace-count-source.mjs"
      - "ranking/partner-submission-publication-guard.mjs"
      - "tests/partner-submission-publication-guard.test.mjs"
      - "ranking/partner-month-readonly-loader.mjs"
      - "ranking/rank-only-publication.mjs"
      - "ranking/combined-rank-only-handler.mjs"
      - "ranking/trusted-combined-ranking-context.mjs"
      - "tests/trusted-combined-ranking-context.test.mjs"
      - "ranking/ranking-owner-consent-service.mjs"
      - "ranking/owner-ranking-consent-panel.mjs"
      - "ranking/ranking-owner-consent-status.mjs"
      - "functions-ranking-approvals/**"
      - "tests/ranking-owner-callable-controller.test.cjs"
      - "ranking/owner-ranking-consent-panel.css"
      - "tests/owner-ranking-consent-panel.test.mjs"
      - "tests/ranking-owner-consent-service.test.mjs"
      - "tests/ranking-owner-consent-emulator.test.mjs"
      - "tests/trusted-combined-ranking-context-emulator.test.mjs"
      - "ranking/rank-only-view.mjs"
      - "ranking/rank-only-view.css"
      - "tests/combined-count-leaderboard.test.mjs"
      - "tests/partner-workspace-count-source.test.mjs"
      - "tests/partner-month-readonly-loader.test.mjs"
      - "tests/partner-month-readonly-loader-emulator.test.mjs"
      - "tests/combined-rank-only-publication.test.mjs"
      - "docs/COMBINED_PARTNER_RANKING_PLAN.md"
      - ".github/workflows/combined-partner-ranking.yml"
  push:
    branches: [main]
    paths:
      - "ranking/combined-count-leaderboard.mjs"
      - "ranking/partner-workspace-count-source.mjs"
      - "ranking/partner-submission-publication-guard.mjs"
      - "tests/partner-submission-publication-guard.test.mjs"
      - "ranking/partner-month-readonly-loader.mjs"
      - "ranking/trusted-combined-ranking-context.mjs"
      - "tests/trusted-combined-ranking-context.test.mjs"
      - "ranking/ranking-owner-consent-service.mjs"
      - "ranking/owner-ranking-consent-panel.mjs"
      - "ranking/ranking-owner-consent-status.mjs"
      - "functions-ranking-approvals/**"
      - "tests/ranking-owner-callable-controller.test.cjs"
      - "ranking/owner-ranking-consent-panel.css"
      - "tests/owner-ranking-consent-panel.test.mjs"
      - "tests/ranking-owner-consent-service.test.mjs"
      - "tests/ranking-owner-consent-emulator.test.mjs"
      - "tests/trusted-combined-ranking-context-emulator.test.mjs"
      - "tests/combined-count-leaderboard.test.mjs"
      - "tests/partner-workspace-count-source.test.mjs"
      - "tests/partner-month-readonly-loader.test.mjs"
      - "docs/COMBINED_PARTNER_RANKING_PLAN.md"
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax check - no Firebase credentials or network
        run: |
          node --check ranking/combined-count-leaderboard.mjs
          node --check ranking/partner-workspace-count-source.mjs
          node --check ranking/partner-submission-publication-guard.mjs
          node --check ranking/partner-month-readonly-loader.mjs
          node --check ranking/rank-only-publication.mjs
          node --check ranking/combined-rank-only-handler.mjs
          node --check ranking/trusted-combined-ranking-context.mjs
          node --check ranking/ranking-owner-consent-service.mjs
          node --check ranking/owner-ranking-consent-panel.mjs
          node --check ranking/ranking-owner-consent-status.mjs
          node --check ranking/rank-only-view.mjs
      - name: Combined count and privacy synthetic test
        run: node --test tests/partner-submission-publication-guard.test.mjs tests/combined-count-leaderboard.test.mjs tests/combined-rank-only-publication.test.mjs tests/partner-workspace-count-source.test.mjs tests/partner-month-readonly-loader.test.mjs tests/trusted-combined-ranking-context.test.mjs tests/ranking-owner-consent-service.test.mjs tests/owner-ranking-consent-panel.test.mjs

  emulator-count-read:
    needs: offline
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FIREBASE_PROJECT_ID: demo-nico-partner-ranking
      GCLOUD_PROJECT: demo-nico-partner-ranking
      FIREBASE_SERVICE_ACCOUNT_JSON: ""
      GOOGLE_APPLICATION_CREDENTIALS: ""
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Reject production credentials and sources before emulator
        shell: bash
        run: |
          set -euo pipefail
          test "$FIREBASE_PROJECT_ID" = demo-nico-partner-ranking
          test "$GCLOUD_PROJECT" = demo-nico-partner-ranking
          test -z "$FIREBASE_SERVICE_ACCOUNT_JSON"
          test -z "$GOOGLE_APPLICATION_CREDENTIALS"
          test "$(git hash-object firestore.rules)" = d9f4df6a2ac0f8b5720534a2461ec66b94379190
          # New write policy is strictly OFF in production. Verify the
          # EXACT reviewed source before running the real isolated emulator.
          if { [ "$GITHUB_EVENT_NAME" = "pull_request" ] &&
               [ "${GITHUB_HEAD_REF:-}" = "feat/partner-sku-onoff-count-save-safe-20261110" ]; } ||
             { [ "$GITHUB_EVENT_NAME" = "push" ] &&
               [ "$GITHUB_REF" = "refs/heads/main" ]; }; then
            test "$(git hash-object scripts/ci/review-partner-sku-publication-write.cjs)" = 'ff1d22be89a18712178dd2a64164510af51b38b8'
            node scripts/ci/review-partner-sku-publication-write.cjs
          elif { [ "$GITHUB_EVENT_NAME" = "pull_request" ] &&
                 [ "${GITHUB_HEAD_REF:-}" = "feat/verified-partner-daily-month-count-ranking-main-20261110" ]; } ||
               { [ "$GITHUB_EVENT_NAME" = "push" ] &&
                 [ "$GITHUB_REF" = "refs/heads/main" ]; }; then
            test "$(git hash-object scripts/ci/review-approved-partner-count-rank.cjs)" = '3f1447f9f45fcfa34da6c25dc10165da54b2f833'
            node scripts/ci/review-approved-partner-count-rank.cjs
          else
            test "$(git hash-object functions-partner-workspace/service.cjs)" = b94a6aba231dc2569009580a178297a5b6194bda
          fi
          node --check tests/partner-month-readonly-loader-emulator.test.mjs
          node --check tests/trusted-combined-ranking-context-emulator.test.mjs
          node --check tests/ranking-owner-consent-emulator.test.mjs
      - name: Install pinned demo-only Firebase CLI and Admin SDK
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix functions-partner-workspace --ignore-scripts --no-audit --no-fund --package-lock=false
          npm install --prefix tests --ignore-scripts --no-audit --no-fund --package-lock=false
          npm install --global firebase-tools@15.34.1 --no-audit --no-fund
      - name: Verify real Firestore read-only transaction and owner approval revoke
        shell: bash
        run: |
          set -euo pipefail
          firebase emulators:exec --project demo-nico-partner-ranking --only firestore \
            'node --test tests/partner-month-readonly-loader-emulator.test.mjs tests/trusted-combined-ranking-context-emulator.test.mjs tests/ranking-owner-consent-emulator.test.mjs'
          echo 'STAGING_ONLY_PARTNER_MONTH_EMULATOR_PASS_PRODUCTION_WRITES=0'
