name: Finance Boundary Firestore Emulator
# Run expensive Firebase emulators only on an explicit human-triggered review.
# Offline no-credential synthetic checks run automatically in finance-boundary-preflight.yml.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install test dependencies
        run: npm install --prefix tests --ignore-scripts --no-audit --no-fund
      - name: Check financial read and write guard generation before emulator
        run: node --test tests/finance-rule-generation.test.mjs
      - name: Run Firestore security model in isolated emulator
        run: |
          npx --yes firebase-tools emulators:exec --only firestore --project demo-sales-public-boundary "node --test tests/public-rules.test.mjs && node --test tests/finance-phase2-read-boundary.test.mjs"
