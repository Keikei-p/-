name: NICO partner invite only — controlled live release
on:
  push:
    branches: [main]
    paths: ['.github/workflows/nico-partner-invite-only-release.yml']
  workflow_dispatch:
    inputs:
      release_confirmation:
        description: 'Type CONFIRM_PARTNER_INVITE_ONLY to release only 3 new Functions and 1 HTML file'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: nico-partner-invite-production
  cancel-in-progress: false
jobs:
  invite-only:
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.release_confirmation == 'CONFIRM_PARTNER_INVITE_ONLY') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      FIREBASE_PROJECT_ID: sales-management-cc116
      NICO_PARTNER_RELEASE_CONFIRMATION: CONFIRM_ADD_INVITE_ONLY
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate non-destructive deployment scope
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/hosting/additive-partner-invite.mjs
          node --test tests/additive-partner-invite-hosting.test.mjs
          node --test tests/partner-company-invitations.test.cjs
          node --test tests/sales-regressions.cjs
          node --check functions/index.js
          node -e "let c=require('./firebase.partner-invites.json');if(Object.keys(c).length!==1||c.functions.source!=='functions')throw Error('unsafe config')"
      - name: Install Functions and CLI
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix functions --ignore-scripts --package-lock=false
          npm install -g firebase-tools@15.34.1
          node -e "require('./functions/index.js')"
      - name: Prepare temporary service identity
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$FIREBASE_SERVICE_ACCOUNT_JSON"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/nico-partner-credential.json"
          chmod 600 "$RUNNER_TEMP/nico-partner-credential.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/nico-partner-credential.json" >> "$GITHUB_ENV"
      - name: READ ONLY live site parity check
        run: node tools/hosting/additive-partner-invite.mjs --dry-run
      - name: Enable only new invitation Functions in temporary checkout
        shell: bash
        run: |
          set -euo pipefail
          test ! -e functions/.env.sales-management-cc116
          printf 'PARTNER_INVITES_ENABLED=enabled\n' > functions/.env.sales-management-cc116
          chmod 600 functions/.env.sales-management-cc116
      - name: Configure one-day Artifact Registry image cleanup (never Firestore data)
        id: artifact_cleanup
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          firebase functions:artifacts:setpolicy --days 1 --location asia-northeast1 \
            --project "$FIREBASE_PROJECT_ID" --non-interactive
      - name: Check whether the three already-created Functions can be reused without rebuilding
        id: existing
        shell: bash
        run: |
          set -euo pipefail
          # This is the precise Git blob SHA of the code already created by
          # approved live run 41081599252, not a guessed version or date.
          test "$(git hash-object functions/index.js)" = "dfb4c48ada6fa89a24c898cd4a2f911bcede822f"
          test "$(git hash-object functions/partner-company-invitations.cjs)" = "4da83f98cd6f033d8ce8bda532aef39859db9c09"
          firebase functions:list --project "$FIREBASE_PROJECT_ID" --json > "$RUNNER_TEMP/previous-functions.json"
          FUNCTION_LIST="$RUNNER_TEMP/previous-functions.json" node <<'NODE'
          const data=JSON.parse(require('fs').readFileSync(process.env.FUNCTION_LIST,'utf8'));
          const names=(Array.isArray(data.result)?data.result:[]).map(x=>x.id||x.name||x.function||'');
          if(!names.some(s=>s==='sendMissingReportReminders'||s.endsWith('/sendMissingReportReminders')))
            throw Error('Original scheduled LINE function missing: abort');
          const newNames=['createPartnerCompanyInvitation','previewPartnerCompanyInvitation','acceptPartnerCompanyInvitation'];
          const present=newNames.filter(n=>names.some(s=>s===n||s.endsWith('/'+n)));
          if(present.length>0&&present.length<3)
            throw Error('Partially created invitation Functions: stop for manual audit');
          require('fs').appendFileSync(process.env.GITHUB_OUTPUT,
            'already_deployed='+(present.length===3?'true':'false')+'\n');
          console.log(present.length===3?
            'PASS: three unchanged partner Functions already created; skip extra rebuild':
            'No partner Functions created; deploy exactly three');
          NODE
      - name: Never create a new build while Artifact Registry cleanup remains unresolved
        if: ${{ steps.artifact_cleanup.outcome == 'failure' && steps.existing.outputs.already_deployed != 'true' }}
        shell: bash
        run: |
          echo "STOP: missing 3 Functions and artifact cleanup policy failed; no new builds allowed"
          exit 1
      - name: Record pending low-cost image cleanup separately from existing app release
        if: ${{ steps.artifact_cleanup.outcome == 'failure' && steps.existing.outputs.already_deployed == 'true' }}
        shell: bash
        run: |
          echo "::warning::Artifact Registry cleanup policy could not be installed. Three Functions are already deployed unchanged; skipping all new builds. IAM cleanup remains a separate operator task."
      - name: Deploy only 3 new callables (never scheduled LINE)
        if: ${{ steps.existing.outputs.already_deployed != 'true' && steps.artifact_cleanup.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          firebase deploy --non-interactive --project "$FIREBASE_PROJECT_ID" \
            --config firebase.partner-invites.json \
            --only functions:createPartnerCompanyInvitation,functions:previewPartnerCompanyInvitation,functions:acceptPartnerCompanyInvitation
      - name: Verify all four Functions remain deployed
        shell: bash
        run: |
          set -euo pipefail
          firebase functions:list --project "$FIREBASE_PROJECT_ID" --json > "$RUNNER_TEMP/functions.json"
          FUNCTION_LIST="$RUNNER_TEMP/functions.json" node <<'NODE'
          const a=JSON.parse(require('fs').readFileSync(process.env.FUNCTION_LIST,'utf8'));
          const names=(Array.isArray(a.result)?a.result:[]).map(x=>x.id||x.name||x.function||'');
          for(const n of ['sendMissingReportReminders','createPartnerCompanyInvitation','previewPartnerCompanyInvitation','acceptPartnerCompanyInvitation'])
            if(!names.some(s=>s===n||s.endsWith('/'+n)))throw Error('Function missing: '+n);
          NODE
      - name: Public endpoint must reject unauthenticated caller
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const url="https://asia-northeast1-sales-management-cc116.cloudfunctions.net/createPartnerCompanyInvitation";
          (async()=>{
            const res=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({data:{companyName:"TEST",email:"nobody@example.invalid"}})});
            const result=await res.json();
            if(res.status!==401||result?.error?.status!=="UNAUTHENTICATED")
              throw Error("Unauthenticated invite endpoint not rejected as expected; abort public HTML release");
            console.log("PASS: anonymous caller rejected by deployed invite Function");
          })().catch(e=>{console.error(e.message);process.exitCode=1});
          NODE
      - name: Publish ONLY invite page (live contents and config unchanged)
        run: node tools/hosting/additive-partner-invite.mjs --release
      - name: Verify official HTML and existing homepage
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --max-time 30 https://nico-factory.web.app/partner-invite.html > "$RUNNER_TEMP/invite.html"
          grep -Fq 'NICO FACTORY | 協力店招待' "$RUNNER_TEMP/invite.html"
          curl -fsSL --retry 3 --max-time 30 https://nico-factory.web.app/ > "$RUNNER_TEMP/index.html"
          grep -Fq '営業実績管理' "$RUNNER_TEMP/index.html"
      - name: Remove temporary credential and opt-in flag
        if: always()
        shell: bash
        run: |
          rm -f functions/.env.sales-management-cc116 "$RUNNER_TEMP/nico-partner-credential.json"
