name: Finance audit regression (isolated, NO deployment)
on:
  pull_request:
    branches: [feature/partner-count-scope-20261027, safety/finance-audit-20261027]
  push:
    branches: [safety/finance-audit-20261027, safety/partner-missing-features-20261027]
permissions:
  contents: read
jobs:
  isolated-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Existing sales regressions
        run: node --test tests/sales-regressions.cjs
      - name: Unit regressions without production services
        run: |
          files=$(find cloudflare-finance/tests -maxdepth 1 -name '*.test.mjs' ! -name 'firestore-writer-emulator.test.mjs')
          node --test $files
      - name: Install emulator and isolated browser dependencies without lifecycle scripts
        run: |
          npm install --prefix cloudflare-finance/tests --ignore-scripts --no-save --package-lock=false firebase@12.19.0 @firebase/rules-unit-testing@5.0.1 playwright@1.62.1
          npm install --prefix tests --ignore-scripts --package-lock=false
          npm install --global firebase-tools@15.34.1
      - name: Demo-only Firestore tests
        run: firebase emulators:exec --project demo-finance-staging --only firestore "node --test cloudflare-finance/tests/finance-locked-rules.test.cjs && node --test cloudflare-finance/tests/firestore-writer-emulator.test.mjs"
      - name: Install Chromium for isolated fixtures
        run: cloudflare-finance/tests/node_modules/.bin/playwright install --with-deps chromium
      - name: Browser checks with all requests intercepted
        run: node cloudflare-finance/tests/partner-isolated-e2e.cjs
