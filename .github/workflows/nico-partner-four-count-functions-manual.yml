name: NICO guarded four count-only Functions publish (manual approval)

on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/production/partner-four-function-release-scope.mjs'
      - 'tests/partner-four-function-release-scope.test.mjs'
      - '.github/workflows/nico-partner-four-count-functions-manual.yml'
  push:
    branches: [main]
    paths:
      - 'tools/production/partner-four-function-release-scope.mjs'
      - 'tests/partner-four-function-release-scope.test.mjs'
      - '.github/workflows/nico-partner-four-count-functions-manual.yml'
  workflow_dispatch:
    inputs:
      reviewed_main_sha:
        description: Exact fully reviewed main SHA
        type: string
        required: true
      deployment_approval:
        description: CONFIRM_FOUR_COUNT_FUNCTIONS_ONLY
        type: string
        required: true
      usage_approval:
        description: FUNCTION_BUILDS_AND_POSSIBLE_CHARGES_EXPLICITLY_APPROVED
        type: string
        required: true
      rules_approval:
        description: NO_FIRESTORE_RULES_CHANGES
        type: string
        required: true

permissions:
  contents: read
concurrency:
  group: nico-partner-workspace-production
  cancel-in-progress: false

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify exact 4-codebase scope; existing finance and count tests
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/production/partner-four-function-release-scope.mjs
          node --test tests/partner-four-function-release-scope.test.mjs
          node --test tests/partner-workspace.test.cjs
          node --test tests/partner-company-code-auth.test.cjs
          node --test tests/inspect-live-partner-callables-readonly.test.mjs tests/inspect-live-partner-functions-gen1-readonly.test.mjs
          test "$(git hash-object functions/index.js)" = 'dfb4c48ada6fa89a24c898cd4a2f911bcede822f'
          test "$(git hash-object firestore.rules)" = 'd9f4df6a2ac0f8b5720534a2461ec66b94379190'
          test "$(git hash-object functions-partner-workspace/index.js)" = '38da7e9174ffea7c406c92292dccfc651b565eb0'
          test "$(git hash-object functions-partner-workspace/service.cjs)" = 'b94a6aba231dc2569009580a178297a5b6194bda'
          test "$(git hash-object functions-partner-workspace/company-code-auth.cjs)" = 'f7e5899cdb9e36da610846d787955b13c1e16e4b'
          test "$(git hash-object firebase.partner-workspace.json)" = 'a6ceedec5fab4e22e0a8efe19c685716a2db9750'
          node tools/production/partner-four-function-release-scope.mjs

  gated-publish:
    needs: offline
    if: >-
      ${{ github.event_name == 'workflow_dispatch' &&
        github.repository == 'Keikei-p/-' &&
        github.ref == 'refs/heads/main' &&
        inputs.reviewed_main_sha == github.sha &&
        inputs.deployment_approval == 'CONFIRM_FOUR_COUNT_FUNCTIONS_ONLY' &&
        inputs.usage_approval == 'FUNCTION_BUILDS_AND_POSSIBLE_CHARGES_EXPLICITLY_APPROVED' &&
        inputs.rules_approval == 'NO_FIRESTORE_RULES_CHANGES' &&
        needs.offline.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FIREBASE_PROJECT_ID: sales-management-cc116
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Freeze exact main, reviewed sources and explicit four targets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_SHA" = "$(git rev-parse HEAD)"
          test "$GITHUB_SHA" = "$(gh api repos/Keikei-p/-/branches/main --jq '.commit.sha')"
          test "$(git hash-object firestore.rules)" = 'd9f4df6a2ac0f8b5720534a2461ec66b94379190'
          test "$(git hash-object functions/index.js)" = 'dfb4c48ada6fa89a24c898cd4a2f911bcede822f'
          test "$(git hash-object functions-partner-workspace/index.js)" = '38da7e9174ffea7c406c92292dccfc651b565eb0'
          test "$(git hash-object functions-partner-workspace/service.cjs)" = 'b94a6aba231dc2569009580a178297a5b6194bda'
          test "$(git hash-object functions-partner-workspace/company-code-auth.cjs)" = 'f7e5899cdb9e36da610846d787955b13c1e16e4b'
          test "$(git hash-object firebase.partner-workspace.json)" = 'a6ceedec5fab4e22e0a8efe19c685716a2db9750'
          node --test tests/partner-four-function-release-scope.test.mjs tests/partner-workspace.test.cjs
          node tools/production/partner-four-function-release-scope.mjs
      - name: Install only existing scoped backend dependencies and pinned CLI
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix functions --ignore-scripts --package-lock=false --no-audit --no-fund
          npm install --prefix functions-partner-workspace --ignore-scripts --package-lock=false --no-audit --no-fund
          npm install --global firebase-tools@15.34.1 --no-audit --no-fund
      - name: Supply protected existing Firebase identity privately
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          test -n "$FIREBASE_SERVICE_ACCOUNT_JSON"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/nico-four-count-private-identity.json"
          chmod 600 "$RUNNER_TEMP/nico-four-count-private-identity.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/nico-four-count-private-identity.json" >> "$GITHUB_ENV"
      - name: Read-only deployed Function snapshot; require old invite/quick-count providers
        shell: bash
        run: |
          set -euo pipefail
          firebase functions:list --project "$FIREBASE_PROJECT_ID" --json \
            > "$RUNNER_TEMP/nico-four-count-before.json" 2> "$RUNNER_TEMP/nico-four-count-cli-private.log"
          node <<'NODE'
          const fs=require('node:fs');
          const before=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/nico-four-count-before.json','utf8'));
          const a=before.result;
          if(!Array.isArray(a))throw Error('STOP_ORIGINAL_FUNCTIONS_UNVERIFIED');
          const ids=a.map(x=>(x.id||x.name||'').split('/').at(-1));
          for(const n of ['createPartnerCompanyInvitation','previewPartnerCompanyInvitation',
             'acceptPartnerCompanyInvitation','getPartnerQuickCounts','submitPartnerQuickCounts',
             'sendMissingReportReminders'])
           if(!ids.includes(n))throw Error('STOP_ORIGINAL_PARTNER_OR_LINE_FUNCTION_MISSING');
          const wanted=['getPartnerWorkspace','submitPartnerWorkspaceCounts','managePartnerWorkspace','acceptPartnerWorkspaceInvite'];
          if(wanted.some(n=>ids.includes(n)))throw Error('STOP_EXISTING_OR_PARTIAL_WORKSPACE_DEPLOY');
          console.log('ORIGINAL_FUNCTION_INVENTORY_VERIFIED_NO_DATA_WRITES');
          NODE
      - name: Create isolated feature flag only in disposable runner
        shell: bash
        run: |
          set -euo pipefail
          test ! -e functions-partner-workspace/.env.sales-management-cc116
          printf 'PARTNER_WORKSPACE_ENABLED=enabled\n' > functions-partner-workspace/.env.sales-management-cc116
          chmod 600 functions-partner-workspace/.env.sales-management-cc116
      - name: Deploy EXACT four new count-only Functions; no --force, no Rules or Hosting
        shell: bash
        run: |
          set -euo pipefail
          TARGETS="$(node -e "import('./tools/production/partner-four-function-release-scope.mjs').then(m=>process.stdout.write(m.TARGETS.join(',')))")"
          TARGETS="$TARGETS" node --input-type=module -e \
            "import {ensureExactOnly} from './tools/production/partner-four-function-release-scope.mjs';ensureExactOnly(process.env.TARGETS)"
          result=0
          firebase deploy --non-interactive --project "$FIREBASE_PROJECT_ID" \
            --config firebase.partner-workspace.json --only "$TARGETS" \
            > "$RUNNER_TEMP/nico-four-count-deploy-private.log" 2>&1 || result=$?
          if [ "$result" -ne 0 ]; then
            echo 'STOP_SCOPED_COUNT_FUNCTION_DEPLOY_FAILED_CHECK_PRIVATE_LOG_AND_STATE'
            exit 1
          fi
          echo 'FOUR_FUNCTIONS_SCOPED_DEPLOY_RETURNED_SUCCESS'
      - name: Check exact old Function IDs preserved and all four added
        shell: bash
        run: |
          set -euo pipefail
          firebase functions:list --project "$FIREBASE_PROJECT_ID" --json \
            > "$RUNNER_TEMP/nico-four-count-after.json" 2>> "$RUNNER_TEMP/nico-four-count-cli-private.log"
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          import {compareBeforeAfter} from './tools/production/partner-four-function-release-scope.mjs';
          const dir=process.env.RUNNER_TEMP;
          const old=JSON.parse(readFileSync(dir+'/nico-four-count-before.json','utf8'));
          const now=JSON.parse(readFileSync(dir+'/nico-four-count-after.json','utf8'));
          const proof=compareBeforeAfter(old,now);
          console.log('FOUR_FUNCTIONS_PRESERVED '+JSON.stringify(proof));
          NODE
      - name: Read-only recheck four live v2 endpoints and enabled flag (no user calls)
        shell: bash
        run: |
          set -euo pipefail
          result=0
          node tools/production/inspect-live-partner-callables-readonly.mjs \
            > "$RUNNER_TEMP/nico-four-count-after-private.log" 2>&1 || result=$?
          if [ "$result" -ne 0 ]; then
            grep -E '^STOP_PARTNER_CALLABLES_[A-Z0-9_]+$' \
              "$RUNNER_TEMP/nico-four-count-after-private.log" || true
            exit 1
          fi
          grep '^PARTNER_COUNT_FUNCTION_METADATA ' "$RUNNER_TEMP/nico-four-count-after-private.log" \
            | grep -q '"countFunctionsConfiguredEnabled":true' ||
            { echo 'STOP_FOUR_CALLABLES_NOT_CONFIRMED_ENABLED'; exit 1; }
          echo 'FOUR_CALLABLE_METADATA_VERIFIED_REAL_USER_COUNTS_STILL_REQUIRE_PROOF'
      - name: Destroy private identity, feature flag and logs (no artifacts)
        if: always()
        shell: bash
        run: |
          rm -f functions-partner-workspace/.env.sales-management-cc116
          rm -f "$RUNNER_TEMP/nico-four-count-private-identity.json" \
            "$RUNNER_TEMP/nico-four-count-before.json" \
            "$RUNNER_TEMP/nico-four-count-after.json" \
            "$RUNNER_TEMP/nico-four-count-cli-private.log" \
            "$RUNNER_TEMP/nico-four-count-deploy-private.log" \
            "$RUNNER_TEMP/nico-four-count-after-private.log"
