name: NICO verified dual count rankings E2E (STAGING / NO DEPLOY)
on:
  pull_request:
    branches: [main]
    paths:
      - 'ranking/verified-dual-count-dashboards.mjs'
      - 'ranking/owner-product-visibility-rankings.mjs'
      - 'ranking/owner-visible-count-server-handler.mjs'
      - 'ranking/owner-visible-count-atomic-loader.mjs'
      - 'ranking/internal-month-count-tx-reader.mjs'
      - 'ranking/canonical-joint-count-sku-reader.mjs'
      - 'ranking/owner-reviewed-sku-mapping-store.mjs'
      - 'tests/owner-reviewed-sku-mapping-store.test.mjs'
      - 'ranking/canonical-owner-count-server-factory.mjs'
      - 'tests/canonical-owner-count-server-factory.test.mjs'
      - 'tests/canonical-joint-count-sku-reader.test.mjs'
      - 'tests/internal-month-count-tx-reader.test.mjs'
      - 'ranking/owner-product-visibility-in-atomic-tx.mjs'
      - 'tests/owner-visible-count-atomic-loader.test.mjs'
      - 'tests/owner-product-visibility-in-atomic-tx.test.mjs'
      - 'tests/owner-visible-count-server-handler.test.mjs'
      - 'ranking/owner-product-visibility-firestore.mjs'
      - 'ranking/owner-product-visibility-panel.mjs'
      - 'ranking/owner-product-visibility-dashboard-mount.mjs'
      - 'ranking/owner-product-visibility-panel.css'
      - 'functions-ranking-approvals/product-visibility-controller.cjs'
      - 'functions-ranking-approvals/index.js'
      - 'functions-ranking-approvals/vendor/owner-product-visibility-firestore.mjs'
      - 'tests/owner-product-visibility-callables.test.cjs'
      - 'ranking/owner-product-visibility-firebase-bridge.mjs'
      - 'tests/owner-product-visibility-firebase-bridge.test.mjs'
      - 'tests/owner-product-visibility-panel.test.mjs'
      - 'tests/owner-product-visibility-dashboard-mount.test.mjs'
      - 'tests/owner-product-visibility-firestore.test.mjs'
      - 'tests/owner-product-visibility-rankings.test.mjs'
      - 'tests/verified-dual-count-dashboards.test.mjs'
      - 'tests/verified-dual-count-live-ledger-emulator.test.mjs'
      - 'scripts/ci/review-approved-partner-count-rank.cjs'
      - '.github/workflows/nico-verified-dual-count-e2e.yml'
  push:
    branches: [main]
    paths:
      - 'ranking/verified-dual-count-dashboards.mjs'
      - 'ranking/owner-product-visibility-dashboard-mount.mjs'
      - 'tests/owner-product-visibility-dashboard-mount.test.mjs'
      - 'tests/verified-dual-count-dashboards.test.mjs'
      - 'tests/verified-dual-count-live-ledger-emulator.test.mjs'
      - 'scripts/ci/review-approved-partner-count-rank.cjs'
      - '.github/workflows/nico-verified-dual-count-e2e.yml'
permissions:
  contents: read
jobs:
  same-ledger-counts:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    env:
      FIREBASE_PROJECT_ID: demo-nico-secondary-finance-fence
      GCLOUD_PROJECT: demo-nico-secondary-finance-fence
      GOOGLE_APPLICATION_CREDENTIALS: ''
      FIREBASE_SERVICE_ACCOUNT_JSON: ''
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - name: Verify no production source or financial changes
        shell: bash
        run: |
          set -euo pipefail
          # Separate, precisely source-pinned PR/main NO-DEPLOY ranking review.
          # Historical production release and workflow_dispatch paths below
          # remain pinned to their prior reviewed artifacts.
          if { [ "$GITHUB_EVENT_NAME" = "pull_request" ] &&
               { [ "${GITHUB_HEAD_REF:-}" = "feat/verified-partner-daily-month-count-ranking-main-20261110" ] ||
                 [ "${GITHUB_HEAD_REF:-}" = "fix/dual-ranking-reviewed-script-pin-20261111" ]; }; } ||
             { [ "$GITHUB_EVENT_NAME" = "push" ] &&
               [ "$GITHUB_REF" = "refs/heads/main" ]; }; then
            test "$(git hash-object scripts/ci/review-approved-partner-count-rank.cjs)" = '92db40f1869ede9e361cc65e8737845cbd39a62b'
            node scripts/ci/review-approved-partner-count-rank.cjs
            echo 'REVIEWED_NO_DEPLOY_RANK_CANDIDATE_VALIDATED'
            exit 0
          fi
          test -z "$GOOGLE_APPLICATION_CREDENTIALS"
          test -z "$FIREBASE_SERVICE_ACCOUNT_JSON"
          test "$FIREBASE_PROJECT_ID" = demo-nico-secondary-finance-fence
          test "$GCLOUD_PROJECT" = demo-nico-secondary-finance-fence
          test "$(git hash-object firestore.rules)" = d9f4df6a2ac0f8b5720534a2461ec66b94379190
          test "$(git hash-object functions-partner-workspace/service.cjs)" = 614f3216e008642ddf5eda6b93c35cc0469557c3
          test "$(git hash-object functions-partner-workspace/index.js)" = 90d51246477cf5cfa6966f3e822326ef06cccd0f
          test "$(git hash-object functions/index.js)" = dfb4c48ada6fa89a24c898cd4a2f911bcede822f
          git diff --exit-code -- firestore.rules index.html partner-workspace.html functions functions-partner-workspace firebase.json
          node --check ranking/verified-dual-count-dashboards.mjs
          node --check ranking/owner-product-visibility-rankings.mjs
          node --check ranking/owner-visible-count-server-handler.mjs
          node --check ranking/owner-visible-count-atomic-loader.mjs
          node --check ranking/internal-month-count-tx-reader.mjs
          node --check ranking/canonical-joint-count-sku-reader.mjs
          node --check ranking/owner-reviewed-sku-mapping-store.mjs
          node --check ranking/canonical-owner-count-server-factory.mjs
          node --check tests/canonical-owner-count-server-factory.test.mjs
          node --check tests/canonical-joint-count-sku-reader.test.mjs
          node --check tests/internal-month-count-tx-reader.test.mjs
          node --check ranking/owner-product-visibility-in-atomic-tx.mjs
          node --check tests/owner-visible-count-atomic-loader.test.mjs
          node --check tests/owner-product-visibility-in-atomic-tx.test.mjs
          node --check tests/owner-visible-count-server-handler.test.mjs
          node --check ranking/owner-product-visibility-firestore.mjs
          node --check ranking/owner-product-visibility-panel.mjs
          node --check ranking/owner-product-visibility-dashboard-mount.mjs
          node --check ranking/owner-product-visibility-firebase-bridge.mjs
          node --check functions-ranking-approvals/index.js
          node --check functions-ranking-approvals/product-visibility-controller.cjs
          cmp ranking/owner-product-visibility-firestore.mjs functions-ranking-approvals/vendor/owner-product-visibility-firestore.mjs
          grep -Fq 'NICO_OWNER_PRODUCT_VISIBILITY_ENABLED===' functions-ranking-approvals/index.js
          node --check tests/verified-dual-count-dashboards.test.mjs
          node --check tests/verified-dual-count-live-ledger-emulator.test.mjs
      - name: Prove date/week/month tie, growth, unreported, private amounts and explicit SKU mappings
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/verified-dual-count-dashboards.test.mjs tests/owner-product-visibility-rankings.test.mjs tests/owner-visible-count-server-handler.test.mjs tests/owner-visible-count-atomic-loader.test.mjs tests/owner-product-visibility-in-atomic-tx.test.mjs tests/owner-product-visibility-firestore.test.mjs tests/owner-product-visibility-panel.test.mjs tests/owner-product-visibility-dashboard-mount.test.mjs tests/owner-product-visibility-firebase-bridge.test.mjs tests/owner-product-visibility-callables.test.cjs
          node --test tests/partner-month-readonly-loader.test.mjs tests/internal-month-count-tx-reader.test.mjs tests/canonical-joint-count-sku-reader.test.mjs tests/canonical-owner-count-server-factory.test.mjs
          node --test tests/owner-reviewed-sku-mapping-store.test.mjs
      - name: Install ONLY isolated emulator tooling and existing workspace dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix tests --ignore-scripts --no-audit --no-fund --package-lock=false
          npm install --prefix functions-partner-workspace --ignore-scripts --no-audit --no-fund --package-lock=false
          npm install --global firebase-tools@15.34.1 --no-audit --no-fund
      - name: REAL local Firestore count save → correction → company/person/SKU rankings + money-deny
        shell: bash
        run: |
          set -euo pipefail
          firebase emulators:exec --project demo-nico-secondary-finance-fence --only firestore \
            'node --test --test-concurrency=1 tests/verified-dual-count-live-ledger-emulator.test.mjs'
          echo 'CONFIRMED_LEDGER_SIMULATED_RANK_AND_CORRECTION_E2E_PASS_NO_PROD'
      - name: Assert original source and count data untouched
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object firestore.rules)" = d9f4df6a2ac0f8b5720534a2461ec66b94379190
          git diff --exit-code -- firestore.rules index.html partner-workspace.html functions functions-partner-workspace firebase.json
          echo 'FIREBASE_PRODUCTION_DEPLOYS=0 DOCUMENT_WRITES=0 RULES_WRITES=0'
