name: Partner UI layout parity (NO DEPLOY)
on:
  pull_request:
    paths:
      - index.html
      - tests/partner-ui-layout-parity.test.cjs
      - tests/partner-always-visible-success-ui-20261102.test.mjs
      - tests/partner-one-login-same-app.test.cjs
      - .github/workflows/partner-ui-layout-parity-no-deploy.yml
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify UI parity, unsaved input retention and existing finance boundary
        run: >-
          node --test tests/shared-count-management.test.cjs tests/partner-ui-layout-parity.test.cjs
          tests/sales-regressions.cjs tests/internal-owner-finance-visibility.test.cjs
          tests/partner-one-login-same-app.test.cjs tests/partner-money-free-workspace.test.cjs
          tests/partner-compact-two-column-team-ui-20261102.test.mjs
          tests/partner-always-visible-success-ui-20261102.test.mjs
          tests/dashboard-inline-original-partner-parity.test.mjs
          tests/partner-workspace.test.cjs tests/partner-save-readback-20261102.test.mjs
