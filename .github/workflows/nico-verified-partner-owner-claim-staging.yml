name: NICO verified partner Owner invitation (STAGING / NO DEPLOY)
on:
  pull_request:
    branches: [main]
    paths:
      - 'functions-partner-owner-claim/**'
      - 'firebase.partner-owner-claim.json'
      - 'tests/verified-partner-owner-claim.test.cjs'
      - 'tests/verified-partner-owner-claim-ui.test.mjs'
      - 'tests/verified-partner-owner-finance-rules-emulator.test.cjs'
      - 'staging/partner-owner-claim-v1/**'
      - '.github/workflows/nico-verified-partner-owner-claim-staging.yml'
  push:
    branches: [main]
    paths:
      - 'functions-partner-owner-claim/**'
      - 'firebase.partner-owner-claim.json'
      - 'tests/verified-partner-owner-claim.test.cjs'
      - 'staging/partner-owner-claim-v1/**'
      - '.github/workflows/nico-verified-partner-owner-claim-staging.yml'
permissions:
  contents: read
jobs:
  verify-no-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GOOGLE_APPLICATION_CREDENTIALS: ''
      FIREBASE_SERVICE_ACCOUNT_JSON: ''
      FIREBASE_PROJECT_ID: demo-partner-owner-claim
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Preserve old six Owner Functions, old count submit, Rules and financial sources
        shell: bash
        run: |
          set -euo pipefail
          test -z "$GOOGLE_APPLICATION_CREDENTIALS"
          test -z "$FIREBASE_SERVICE_ACCOUNT_JSON"
          test "$(git hash-object firestore.rules)" = d9f4df6a2ac0f8b5720534a2461ec66b94379190
          test "$(git hash-object functions-partner-workspace/service.cjs)" = 614f3216e008642ddf5eda6b93c35cc0469557c3
          test "$(git hash-object functions-partner-workspace/index.js)" = 90d51246477cf5cfa6966f3e822326ef06cccd0f
          test "$(git hash-object functions-ranking-approvals/index.js)" = 54855609e372ee1056b5206e445f20c0a251b1ef
          node --check functions-partner-owner-claim/index.js
          node --check functions-partner-owner-claim/partner-owner-claim.cjs
          node --test tests/verified-partner-owner-claim.test.cjs tests/verified-partner-owner-claim-ui.test.mjs
          node -e "const f=require('fs'),p=JSON.parse(f.readFileSync('firebase.partner-owner-claim.json'));if(p.functions.source!=='functions-partner-owner-claim'||p.functions.codebase!=='partner-owner-claim')process.exit(1)"
          cmp -s functions-partner-owner-claim/vendor/trusted-combined-ranking-context.mjs functions-ranking-approvals/vendor/trusted-combined-ranking-context.mjs
          echo PARTNER_OWNER_CLAIM_STAGING_PASS_NO_DEPLOY_NO_AUTH_CHANGES_NO_FINANCE_READS
  finance-emulator:
    needs: verify-no-deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FIREBASE_PROJECT_ID: demo-partner-owner-claim
      GCLOUD_PROJECT: demo-partner-owner-claim
      GOOGLE_APPLICATION_CREDENTIALS: ''
      FIREBASE_SERVICE_ACCOUNT_JSON: ''
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - name: Install only local emulator and test dependencies, no production cloud auth
        shell: bash
        run: |
          set -euo pipefail
          test "$FIREBASE_PROJECT_ID" = demo-partner-owner-claim
          test -z "$GOOGLE_APPLICATION_CREDENTIALS"
          test -z "$FIREBASE_SERVICE_ACCOUNT_JSON"
          npm install --global firebase-tools@15.34.1 --no-audit --no-fund
          npm install --prefix tests --ignore-scripts --package-lock=false --no-audit --no-fund
      - name: Test four financial original GET/LIST refusals with verified Partner Owner against untouched Rules
        shell: bash
        run: |
          set -euo pipefail
          firebase emulators:exec --project demo-partner-owner-claim --only firestore "node --test tests/verified-partner-owner-finance-rules-emulator.test.cjs"
          echo 'VERIFIED_PARTNER_OWNER_FINANCE_GET_LIST_DENIED_IN_EMULATOR_ONLY_NO_PRODUCTION_READ'
