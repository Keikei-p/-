name: NICO login visual one-index guarded release
on:
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'tests/login-presentation-contract.test.cjs'
      - '.github/workflows/nico-login-visual-index-release.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - '.github/workflows/nico-login-visual-index-release.yml'
permissions:
  contents: read
concurrency:
  group: nico-surgical-index-release
  cancel-in-progress: false
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      FIREBASE_SERVICE_ACCOUNT_JSON: ''
      GOOGLE_APPLICATION_CREDENTIALS: ''
      FIREBASE_TOKEN: ''
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Review exact already-approved source, without production credentials
        shell: bash
        run: |
          set -euo pipefail
          test -z "$FIREBASE_SERVICE_ACCOUNT_JSON"
          test -z "$GOOGLE_APPLICATION_CREDENTIALS"
          test -z "$FIREBASE_TOKEN"
          test "$(git hash-object index.html)" = '9bc74a866860f0210ae4cb2c9f67a2470d37d220'
          node --test tests/login-presentation-contract.test.cjs tests/internal-owner-finance-visibility.test.cjs tests/sales-regressions.cjs
          node --test tests/surgical-existing-index.test.mjs
          node --check tools/hosting/surgical-existing-index.mjs
          echo 'REVIEWED_LOGIN_INDEX_ONLY_OFFLINE_PASS_NO_DEPLOY'
  publish:
    needs: review
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'Keikei-p/-' && needs.review.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      FIREBASE_PROJECT_ID: sales-management-cc116
      NICO_PARTNER_RELEASE_CONFIRMATION: CONFIRM_ADD_PARTNER_RANKING_INDEX_ONLY
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Refuse every unreviewed main source or concurrent change
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api repos/Keikei-p/-/branches/main --jq .commit.sha)" = "$GITHUB_SHA"
          test "$(git hash-object index.html)" = '9bc74a866860f0210ae4cb2c9f67a2470d37d220'
          git show HEAD^1:index.html > "$RUNNER_TEMP/reviewed-previous-index.html"
          test "$(git hash-object "$RUNNER_TEMP/reviewed-previous-index.html")" = 'f6d4815ecb09d4db0ba34144e6705926bdc7503c'
          git diff --name-only HEAD^1 HEAD | sort > "$RUNNER_TEMP/changed-files.txt"
          cat > "$RUNNER_TEMP/allowed-files.txt" <<'FILES'
          .github/workflows/nico-login-presentation-no-deploy.yml
          .github/workflows/nico-login-visual-index-release.yml
          docs/SALES_RELEASE_SIGNOFF.md
          index.html
          tests/login-presentation-contract.test.cjs
          FILES
          diff -u "$RUNNER_TEMP/allowed-files.txt" "$RUNNER_TEMP/changed-files.txt"
          echo 'MAIN_COMMIT_SCOPE_VERIFIED_NO_OTHER_ASSETS_CHANGED'
      - name: Verify public login file is exactly the reviewed old main (GET only)
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --max-time 25 "https://nico-factory.web.app/?login_release_preflight=$GITHUB_SHA" > "$RUNNER_TEMP/live-login-before.html"
          if cmp -s index.html "$RUNNER_TEMP/live-login-before.html"; then
            echo 'ALREADY_LIVE=true' >> "$GITHUB_ENV"
            echo 'LOGIN_VISUAL_ALREADY_LIVE_SAME_REVIEWED_BYTES'
          elif cmp -s "$RUNNER_TEMP/reviewed-previous-index.html" "$RUNNER_TEMP/live-login-before.html"; then
            echo 'ALREADY_LIVE=false' >> "$GITHUB_ENV"
            echo 'PUBLIC_LOGIN_BYTES_EXACTLY_REVIEWED_MAIN_BEFORE_WRITE'
          else
            echo 'STOP_PRODUCTION_SOURCE_DRIFT_INDEX_NOT_RELEASED'
            exit 1
          fi
      - name: Install existing Firebase Hosting credential library only
        if: env.ALREADY_LIVE != 'true'
        run: npm install --prefix functions --ignore-scripts --package-lock=false --no-audit --no-fund
      - name: Configure protected Hosting credentials (no Firestore operations)
        if: env.ALREADY_LIVE != 'true'
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          test -n "$FIREBASE_SERVICE_ACCOUNT_JSON"
          node -e "const fs=require('node:fs');if(JSON.parse(fs.readFileSync('.firebaserc','utf8')).projects.default!=='sales-management-cc116')process.exit(1)"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/nico-login-hosting-private.json"
          chmod 600 "$RUNNER_TEMP/nico-login-hosting-private.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/nico-login-hosting-private.json" >> "$GITHUB_ENV"
      - name: Preserve every other live Hosting asset and run exact dry-run
        if: env.ALREADY_LIVE != 'true'
        run: node tools/hosting/surgical-existing-index.mjs --dry-run
      - name: Release only the reviewed login index HTML using existing guarded Hosting tool
        if: env.ALREADY_LIVE != 'true'
        run: node tools/hosting/surgical-existing-index.mjs --release
      - name: Verify public HTML equals the reviewed candidate and existing pages stay live
        shell: bash
        run: |
          set -euo pipefail
          published=false
          for attempt in $(seq 1 12); do
            curl -fsSL --max-time 25 "https://nico-factory.web.app/?login_release_verify=$GITHUB_SHA-$attempt" > "$RUNNER_TEMP/live-login-after.html"
            if cmp -s "$RUNNER_TEMP/live-login-after.html" index.html; then published=true; break; fi
            sleep 5
          done
          test "$published" = true || { echo 'STOP_PUBLIC_LOGIN_BYTES_UNVERIFIED'; exit 1; }
          grep -Fq 'id="nfLoginFX"' "$RUNNER_TEMP/live-login-after.html"
          grep -Fq 'id="nfLoginFXController"' "$RUNNER_TEMP/live-login-after.html"
          grep -Fq 'id="authButton"' "$RUNNER_TEMP/live-login-after.html"
          grep -Fq 'id="partnerInviteAtMain"' "$RUNNER_TEMP/live-login-after.html"
          for route in /partner-workspace.html /partner-invite.html /partner-counts.html; do
            test "$(curl -sSL --max-time 20 -o /dev/null -w '%{http_code}' "https://nico-factory.web.app$route")" = 200
          done
          echo 'LOGIN_VISUAL_INDEX_LIVE_BYTES_VERIFIED_OTHER_ROUTES_PRESERVED'
      - name: Remove runner credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/nico-login-hosting-private.json"
