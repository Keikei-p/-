name: NICO update existing four count Functions (MANUAL / NO RULES)
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/nico-existing-four-count-update-once.yml'
      - 'tests/nov09-existing-four-count-update-gate.test.mjs'
  workflow_dispatch:
    inputs:
      reviewed_main_sha:
        description: Exactly reviewed main HEAD
        required: true
        type: string
      deployment_approval:
        description: CONFIRM_UPDATE_EXISTING_FOUR_COUNT_FUNCTIONS_ONLY
        required: true
        type: string
      usage_approval:
        description: FUNCTION_BUILDS_AND_POSSIBLE_CHARGES_EXPLICITLY_APPROVED
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: nico-partner-workspace-production
  cancel-in-progress: false
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - name: Reject source drift, money changes, unreviewed Functions and wide scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object firestore.rules)" = d9f4df6a2ac0f8b5720534a2461ec66b94379190
          test "$(git hash-object functions/index.js)" = dfb4c48ada6fa89a24c898cd4a2f911bcede822f
          test "$(git hash-object functions-partner-workspace/index.js)" = 38da7e9174ffea7c406c92292dccfc651b565eb0
          test "$(git hash-object functions-partner-workspace/service.cjs)" = b94a6aba231dc2569009580a178297a5b6194bda
          test "$(git hash-object functions-partner-workspace/company-code-auth.cjs)" = f7e5899cdb9e36da610846d787955b13c1e16e4b
          test "$(git hash-object firebase.partner-workspace.json)" = a6ceedec5fab4e22e0a8efe19c685716a2db9750
          node tools/production/partner-four-function-release-scope.mjs
          node --test tests/nov09-existing-four-count-update-gate.test.mjs
          node --test tests/partner-four-function-release-scope.test.mjs tests/protect-original-functions-versions.test.mjs
          node --test tests/partner-workspace.test.cjs tests/partner-money-free-workspace.test.cjs tests/partner-count-dashboard.test.cjs
          git diff --exit-code -- firestore.rules index.html partner-workspace.html firebase.json functions functions-partner-workspace
      - name: Confirm dual-role partner cannot GET/LIST money while count create/correction survives
        shell: bash
        env:
          FIREBASE_PROJECT_ID: demo-nico-secondary-finance-fence
          GCLOUD_PROJECT: demo-nico-secondary-finance-fence
        run: |
          set -euo pipefail
          npm install --prefix tests --ignore-scripts --no-audit --no-fund --package-lock=false
          npm install --prefix functions-partner-workspace --ignore-scripts --no-audit --no-fund --package-lock=false
          npx --yes firebase-tools@15.34.1 emulators:exec --project demo-nico-secondary-finance-fence --only firestore 'node --test --test-concurrency=1 tests/secondary-finance-read-fence-emulator.test.mjs tests/secondary-finance-counts-integration-emulator.test.mjs'
  update-live:
    needs: offline
    if: ${{ github.event_name == 'workflow_dispatch' && github.repository == 'Keikei-p/-' && github.ref == 'refs/heads/main' && inputs.reviewed_main_sha == github.sha && inputs.deployment_approval == 'CONFIRM_UPDATE_EXISTING_FOUR_COUNT_FUNCTIONS_ONLY' && inputs.usage_approval == 'FUNCTION_BUILDS_AND_POSSIBLE_CHARGES_EXPLICITLY_APPROVED' && needs.offline.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FIREBASE_PROJECT_ID: sales-management-cc116
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Require current exact reviewed main and four targets only
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_SHA" = "$(git rev-parse HEAD)"
          test "$GITHUB_SHA" = "$(gh api repos/Keikei-p/-/branches/main --jq .commit.sha)"
          test "$(git hash-object firestore.rules)" = d9f4df6a2ac0f8b5720534a2461ec66b94379190
          test "$(git hash-object functions/index.js)" = dfb4c48ada6fa89a24c898cd4a2f911bcede822f
          test "$(git hash-object functions-partner-workspace/index.js)" = 38da7e9174ffea7c406c92292dccfc651b565eb0
          test "$(git hash-object functions-partner-workspace/service.cjs)" = b94a6aba231dc2569009580a178297a5b6194bda
          test "$(git hash-object functions-partner-workspace/company-code-auth.cjs)" = f7e5899cdb9e36da610846d787955b13c1e16e4b
          test "$(git hash-object firebase.partner-workspace.json)" = a6ceedec5fab4e22e0a8efe19c685716a2db9750
          node tools/production/partner-four-function-release-scope.mjs
      - name: Install only original Functions SDK, existing count codebase and pinned Firebase CLI
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix functions --ignore-scripts --no-audit --no-fund --package-lock=false
          npm install --prefix functions-partner-workspace --ignore-scripts --no-audit --no-fund --package-lock=false
          npm install --global firebase-tools@15.34.1 --no-audit --no-fund
      - name: Supply existing identity securely to disposable runner
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          test -n "$FIREBASE_SERVICE_ACCOUNT_JSON"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/nico-update-count.private.json"
          chmod 600 "$RUNNER_TEMP/nico-update-count.private.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/nico-update-count.private.json" >> "$GITHUB_ENV"
      - name: Confirm all four targets already ACTIVE and count-enabled (not a new or partial deploy)
        shell: bash
        run: |
          set -euo pipefail
          firebase functions:list --project "$FIREBASE_PROJECT_ID" --json > "$RUNNER_TEMP/count-four-before.private.json"
          FILE="$RUNNER_TEMP/count-four-before.private.json" node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          import {classifyInventory} from './tools/production/inspect-four-count-cli-region-readonly.mjs';
          const x=classifyInventory(JSON.parse(readFileSync(process.env.FILE,'utf8')));
          for(const [name,f] of Object.entries(x.functions)){
            if(f.entries!==1||f.inTargetRegion!==1||f.activeState!==1||
              f.expectedCodebase!==1||f.workspaceFlagEnabled!==1||
              f.otherProject!==0||f.gen1Listed!==0||f.gen2Listed!==1)
              throw Error('STOP_FOUR_ACTIVE_TARGET_UNVERIFIED_'+name);
          }
          console.log('EXACT_FOUR_ALREADY_ACTIVE_SCOPED_TO_COUNT_CODEBASE');
          NODE
      - name: Store immutable fingerprints of original six financial/LINE/invite Functions (GET only)
        shell: bash
        run: node tools/production/protect-original-functions-versions.mjs before
      - name: Enable existing count codebase only in disposable build
        shell: bash
        run: |
          set -euo pipefail
          test ! -e functions-partner-workspace/.env.sales-management-cc116
          printf 'PARTNER_WORKSPACE_ENABLED=enabled\n' > functions-partner-workspace/.env.sales-management-cc116
          chmod 600 functions-partner-workspace/.env.sales-management-cc116
      - name: Update EXACT existing four Functions, no force, no Rules, no Hosting
        shell: bash
        run: |
          set -euo pipefail
          TARGETS="$(node -e "import('./tools/production/partner-four-function-release-scope.mjs').then(m=>process.stdout.write(m.TARGETS.join(',')))")"
          TARGETS="$TARGETS" node --input-type=module -e "import {ensureExactOnly} from './tools/production/partner-four-function-release-scope.mjs';ensureExactOnly(process.env.TARGETS)"
          rc=0
          firebase deploy --non-interactive --project "$FIREBASE_PROJECT_ID" --config firebase.partner-workspace.json --only "$TARGETS" > "$RUNNER_TEMP/nico-existing-four-private.log" 2>&1 || rc=$?
          if [ "$rc" -ne 0 ]; then
            echo 'STOP_FOUR_UPDATE_CLI_NOT_CONFIRMED_CHECK_EXISTING_STATE_NO_AUTOMATIC_RETRY'
            exit 1
          fi
          echo 'FOUR_COUNT_FUNCTION_UPDATE_CLI_SUCCESS'
      - name: Recheck all four ACTIVE with enabled flag and original six immutable
        shell: bash
        run: |
          set -euo pipefail
          firebase functions:list --project "$FIREBASE_PROJECT_ID" --json > "$RUNNER_TEMP/count-four-after.private.json"
          FILE="$RUNNER_TEMP/count-four-after.private.json" node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          import {classifyInventory} from './tools/production/inspect-four-count-cli-region-readonly.mjs';
          const x=classifyInventory(JSON.parse(readFileSync(process.env.FILE,'utf8')));
          for(const [name,f] of Object.entries(x.functions)){
            if(f.entries!==1||f.inTargetRegion!==1||f.activeState!==1||
              f.expectedCodebase!==1||f.workspaceFlagEnabled!==1||
              f.otherProject!==0||f.gen1Listed!==0||f.gen2Listed!==1)
              throw Error('STOP_FOUR_AFTER_UPDATE_NOT_ACTIVE_'+name);
          }
          console.log('EXACT_FOUR_EXISTING_COUNT_FUNCTIONS_ACTIVE_AFTER_UPDATE');
          NODE
          node tools/production/protect-original-functions-versions.mjs after
      - name: Security note no real user credentials used
        run: |
          echo 'PRODUCTION_RULES_UPDATED=NO'
          echo 'PRODUCTION_HOSTING_UPDATED=NO'
          echo 'PRODUCTION_DATA_WRITES=0'
          echo 'REAL_ACCOUNT_COUNT_SAVE_AND_CORRECTION_STILL_REQUIRE_OWNER_VERIFICATION'
      - name: Remove ephemeral build flags, identities, metadata and logs
        if: always()
        shell: bash
        run: |
          rm -f functions-partner-workspace/.env.sales-management-cc116
          rm -f "$RUNNER_TEMP/nico-update-count.private.json" \
            "$RUNNER_TEMP/nico-existing-four-private.log" \
            "$RUNNER_TEMP/count-four-before.private.json" \
            "$RUNNER_TEMP/count-four-after.private.json" \
            "$RUNNER_TEMP/nico-original-six-immutable-versions.private.json"
