name: NICO Phase-1 finance candidate against live-shape emulator (NO DEPLOY)

on:
  pull_request:
    branches: [main]
    paths:
      - 'tests/phase1-live-snapshot-emulator.mjs'
      - 'tests/phase1-live-snapshot-emulator.test.mjs'
      - 'tests/fixtures/reviewed-phase1-finance-boundary.rules'
      - '.github/workflows/nico-phase1-live-shape-emulator.yml'
  push:
    branches: [main]
    paths:
      - 'tests/phase1-live-snapshot-emulator.mjs'
      - 'tests/phase1-live-snapshot-emulator.test.mjs'
      - 'tests/fixtures/reviewed-phase1-finance-boundary.rules'
      - '.github/workflows/nico-phase1-live-shape-emulator.yml'

permissions:
  contents: read
concurrency:
  group: nico-phase1-live-shaped-emulator-readonly
  cancel-in-progress: false

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify project / candidate blob / exact secondary binding before credentials
        shell: bash
        run: |
          set -euo pipefail
          node --check tests/phase1-live-snapshot-emulator.mjs
          node --test tests/phase1-live-snapshot-emulator.test.mjs
          test "$(git hash-object tests/fixtures/reviewed-phase1-finance-boundary.rules)" = '6d6ac7fd3544b0326823e419a3acd7e1d060b714'
          node -e "const fs=require('fs');if(JSON.parse(fs.readFileSync('.firebaserc','utf8')).projects.default!=='sales-management-cc116')process.exit(1)"
          # Production project's source and target remain completely unchanged.
          test "$(git hash-object firestore.rules)" = 'd9f4df6a2ac0f8b5720534a2461ec66b94379190'
          test "$(git hash-object firebase.json)" = "$(git rev-parse HEAD:firebase.json)"

  isolated-live-data:
    needs: offline
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.offline.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 38
    env:
      FIREBASE_PROJECT_ID: sales-management-cc116
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - name: Confirm exact reviewed main, no production deploy and emulator-only candidate
        shell: bash
        run: |
          set -euo pipefail
          test "${{ github.repository }}" = 'Keikei-p/-'
          test "${{ github.sha }}" = "$(git rev-parse HEAD)"
          node --test tests/phase1-live-snapshot-emulator.test.mjs
          test "$(git hash-object firestore.rules)" = 'd9f4df6a2ac0f8b5720534a2461ec66b94379190'
          test "$(git hash-object tests/fixtures/reviewed-phase1-finance-boundary.rules)" = '6d6ac7fd3544b0326823e419a3acd7e1d060b714'
      - name: Install existing tools and isolated emulator dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix functions --ignore-scripts --package-lock=false --no-audit --no-fund
          npm install --prefix tests --ignore-scripts --no-audit --no-fund
          npm install --global firebase-tools@15.34.1 --no-audit --no-fund
      - name: Provide existing reviewed audit identity privately
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          test -n "${FIREBASE_SERVICE_ACCOUNT_JSON:-}"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/nico-phase1-readonly-identity.json"
          chmod 600 "$RUNNER_TEMP/nico-phase1-readonly-identity.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/nico-phase1-readonly-identity.json" >> "$GITHUB_ENV"
      - name: GET live originals, clone to localhost, simulate actual dual-context Owner/Partner, reread originals
        shell: bash
        run: |
          set -euo pipefail
          result=0
          firebase emulators:exec --project demo-sales-restore --only firestore \
            'node tests/phase1-live-snapshot-emulator.mjs' \
            > "$RUNNER_TEMP/nico-phase1-emulator-private.log" 2>&1 || result=$?
          # Never print raw private logs: emulator SDK errors can include live IDs.
          if [ "$result" -ne 0 ]; then
            grep -E '^STOP_PHASE1_EMULATOR_[A-Z0-9_]+$' \
              "$RUNNER_TEMP/nico-phase1-emulator-private.log" || true
            echo 'STOP_PHASE1_EMULATOR_OFFLINE_PROOF_FAILED'
            exit 1
          fi
          grep '^PHASE1_LIVE_SHAPE_EMULATOR ' \
            "$RUNNER_TEMP/nico-phase1-emulator-private.log" \
            | grep -q '"safeToDeploy":false'
          grep '^PHASE1_LIVE_SHAPE_EMULATOR ' \
            "$RUNNER_TEMP/nico-phase1-emulator-private.log"
      - name: Destroy private service identity / inventory / emulator logs (no artifacts)
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/nico-phase1-readonly-identity.json"
          rm -f "$RUNNER_TEMP/nico-phase1-emulator-private.log"
          rm -f firestore-debug.log firebase-debug.log ui-debug.log
