name: Stage secondary partner financial rules
on:
  pull_request:
    paths:
      - '.github/workflows/stage-secondary-finance-rules.yml'
      - 'tools/production/stage-secondary-finance-rules.mjs'
      - 'tests/stage-secondary-finance-rules.test.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - run: node --test tests/stage-secondary-finance-rules.test.mjs
      - run: npm install --prefix tests --ignore-scripts --no-audit --no-fund
      - run: npm install --prefix functions-partner-workspace --ignore-scripts --no-audit --no-fund
      - run: npm install --global firebase-tools@15.34.1 --no-audit --no-fund
      - name: Check partner denial, owner access, count creation, correction and hub sharing
        env:
          FIREBASE_PROJECT_ID: demo-nico-secondary-finance-fence
          GCLOUD_PROJECT: demo-nico-secondary-finance-fence
        run: firebase emulators:exec --project demo-nico-secondary-finance-fence --only firestore 'node --test --test-concurrency=1 tests/secondary-finance-read-fence-emulator.test.mjs tests/secondary-finance-counts-integration-emulator.test.mjs'
  stage:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: firebase-rules-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --prefix functions-partner-workspace --ignore-scripts --no-audit --no-fund
      - name: Recheck main before registering the inactive ruleset
        env:
          GH_TOKEN: ${{ github.token }}
        run: test "$GITHUB_SHA" = "$(gh api repos/Keikei-p/-/branches/main --jq .commit.sha)"
      - name: Register the revision and verify that live rules still point to the original
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: node tools/production/stage-secondary-finance-rules.mjs
