name: NICO Owner SKU shortcut exact one-index Hosting release (ONE TIME)
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/nico-owner-sku-shortcut-hosting-once.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/nico-owner-sku-shortcut-hosting-once.yml'
permissions:
  contents: read
concurrency:
  group: nico-owner-sku-shortcut-hosting-once
  cancel-in-progress: false
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      FIREBASE_SERVICE_ACCOUNT_JSON: ''
      GOOGLE_APPLICATION_CREDENTIALS: ''
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Exact reviewed one-page source and regression test, no credentials
        shell: bash
        run: |
          set -euo pipefail
          test -z "$FIREBASE_SERVICE_ACCOUNT_JSON"
          test -z "$GOOGLE_APPLICATION_CREDENTIALS"
          test "$(git hash-object index.html)" = f6d4815ecb09d4db0ba34144e6705926bdc7503c
          test "$(git hash-object firestore.rules)" = d9f4df6a2ac0f8b5720534a2461ec66b94379190
          test "$(git hash-object functions/index.js)" = dfb4c48ada6fa89a24c898cd4a2f911bcede822f
          test "$(git hash-object functions-partner-workspace/service.cjs)" = 712bf523ac83942c02767c25321bfed7059055be
          test "$(git hash-object tools/hosting/surgical-existing-index.mjs)" = 1c6923e06135dc480e11f342e44f5e74f8c5bbc7
          node --check tools/hosting/surgical-existing-index.mjs
          node --test tests/owner-product-share-in-management.test.mjs tests/surgical-existing-index.test.mjs
          echo 'OWNER_SKU_SHORTCUT_EXACT_OFFLINE_READY_NO_DEPLOY'
  release:
    needs: offline
    if: >-
      ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' &&
          github.repository == 'Keikei-p/-' && needs.offline.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      FIREBASE_PROJECT_ID: sales-management-cc116
      NICO_PARTNER_RELEASE_CONFIRMATION: CONFIRM_ADD_PARTNER_RANKING_INDEX_ONLY
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify current main and exact previously published HTML before credentials
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api repos/Keikei-p/-/branches/main --jq .commit.sha)" = "$GITHUB_SHA"
          test "$(git hash-object index.html)" = f6d4815ecb09d4db0ba34144e6705926bdc7503c
          test "$(git hash-object firestore.rules)" = d9f4df6a2ac0f8b5720534a2461ec66b94379190
          test "$(git hash-object tools/hosting/surgical-existing-index.mjs)" = 1c6923e06135dc480e11f342e44f5e74f8c5bbc7
          curl -fsSL --max-time 30 --retry 2 "https://nico-factory.web.app/?before_owner_sku_shortcut=$GITHUB_SHA" > "$RUNNER_TEMP/live-before.html"
          LIVE_SHA="$(git hash-object "$RUNNER_TEMP/live-before.html")"
          if [ "$LIVE_SHA" = f6d4815ecb09d4db0ba34144e6705926bdc7503c ]; then
            echo 'ALREADY_LIVE=true' >> "$GITHUB_ENV"
            echo 'OWNER_SKU_SHORTCUT_ALREADY_PUBLISHED'
          elif [ "$LIVE_SHA" = 10de822d24a759b843b264d742d540a72553e67b ]; then
            echo 'ALREADY_LIVE=false' >> "$GITHUB_ENV"
            echo 'EXACT_PRIOR_HOSTING_HTML_MATCH_NO_OVERWRITE_OF_NEWER_VERSION'
          else
            echo 'STOP_UNREVIEWED_HOSTING_VERSION_REFUSE_OVERWRITE'
            exit 1
          fi
      - name: Attach existing Hosting credential only if exact old version still live
        if: env.ALREADY_LIVE == 'false'
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          test -n "$FIREBASE_SERVICE_ACCOUNT_JSON"
          test "$(node -p "require('./.firebaserc').projects.default")" = sales-management-cc116
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/nico-owner-sku-shortcut.json"
          chmod 600 "$RUNNER_TEMP/nico-owner-sku-shortcut.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/nico-owner-sku-shortcut.json" >> "$GITHUB_ENV"
      - name: Install existing Hosting REST auth library
        if: env.ALREADY_LIVE == 'false'
        run: npm install --prefix functions --ignore-scripts --package-lock=false --no-audit --no-fund
      - name: Dry-run exact live Firebase Hosting manifest, preserve all existing files
        if: env.ALREADY_LIVE == 'false'
        run: node tools/hosting/surgical-existing-index.mjs --dry-run
      - name: Release only approved index.html without modifying any other Hosting assets
        if: env.ALREADY_LIVE == 'false'
        run: node tools/hosting/surgical-existing-index.mjs --release
      - name: Verify HTTP returns exact reviewed index and original Owner routes
        shell: bash
        run: |
          set -euo pipefail
          ok=false
          for i in $(seq 1 12); do
            curl -fsSL --max-time 30 "https://nico-factory.web.app/?sku_shortcut_verify=$GITHUB_SHA-$i" > "$RUNNER_TEMP/live-after.html"
            if cmp -s "$RUNNER_TEMP/live-after.html" index.html; then ok=true; break; fi
            sleep 5
          done
          test "$ok" = true || { echo 'STOP_POST_DEPLOY_INDEX_NOT_IDENTICAL'; exit 1; }
          grep -Fq 'href="./owner-partner-setup.html"' "$RUNNER_TEMP/live-after.html"
          grep -Fq 'id="ownerProductShareInlineRoot"' "$RUNNER_TEMP/live-after.html"
          for route in /owner-partner-setup.html /partner-workspace.html /partner-counts.html; do
            code="$(curl -s -L -o /dev/null -w '%{http_code}' --max-time 20 "https://nico-factory.web.app$route")"
            test "$code" = 200
          done
          echo 'OWNER_SKU_SHORTCUT_FIREBASE_HOSTING_LIVE_VERIFIED'
      - name: Delete temporary credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/nico-owner-sku-shortcut.json"
