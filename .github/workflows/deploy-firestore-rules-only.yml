name: Deploy Firestore Rules Only

on:
  push:
    branches:
      - ops/deploy-firestore-rules-20261003
    paths:
      - .github/workflows/deploy-firestore-rules-only.yml

permissions:
  contents: read

jobs:
  deploy-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FIREBASE_PROJECT_ID: sales-management-cc116
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify secret
        shell: bash
        run: |
          set -euo pipefail
          test -n "${FIREBASE_SERVICE_ACCOUNT_JSON:-}"

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Authenticate
        shell: bash
        run: |
          set -euo pipefail
          tmp="${RUNNER_TEMP}/firebase-service-account.json"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$tmp"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$tmp" >> "$GITHUB_ENV"

      - name: Verify project access
        run: firebase projects:list --non-interactive

      - name: Deploy Firestore Rules
        run: firebase deploy --only firestore:rules --project "$FIREBASE_PROJECT_ID" --non-interactive
