name: NICO minimal raw finance Rules only (NO DEPLOY)
on:
  push:
    branches:
      - security/nico-live-finance-rules-only-20261104
    paths:
      - firestore.rules
      - tests/rules.test.cjs
      - .github/workflows/nico-live-finance-rules-only-no-deploy.yml
  pull_request:
    branches:
      - main
    paths:
      - firestore.rules
      - tests/rules.test.cjs
      - .github/workflows/nico-live-finance-rules-only-no-deploy.yml
permissions:
  contents: read
jobs:
  rules-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FIREBASE_PROJECT_ID: demo-sales-support
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify changes are limited strictly to rules and offline checks
        shell: bash
        run: |
          set -euo pipefail
          test "$FIREBASE_PROJECT_ID" = demo-sales-support
          test -z "${GOOGLE_APPLICATION_CREDENTIALS:-}"
          test -z "${FIREBASE_SERVICE_ACCOUNT_JSON:-}"
          test -z "${NICO_ACCOUNT_ERASURE_ENABLED:-}"
          git fetch --no-tags origin main
          git diff --name-only origin/main...HEAD > /tmp/nico-rules-changed.txt
          cat /tmp/nico-rules-changed.txt
          if grep -Ev '^(firestore\.rules|tests/rules\.test\.cjs|\.github/workflows/nico-live-finance-rules-only-no-deploy\.yml)$' /tmp/nico-rules-changed.txt; then
            echo "STOP_UNEXPECTED_CHANGES_OUTSIDE_FINANCE_RULES"
            exit 1
          fi
          node --check tests/rules.test.cjs
          node - <<'NODE'
          const fs=require('node:fs');
          const s=fs.readFileSync('firestore.rules','utf8');
          const gate=(s.match(/noSecondaryPartnerWorkspace\(\)/g)||[]).length;
          if(gate!==13||!s.includes('function noSecondaryPartnerWorkspace()'))
            throw Error('STOP_FINANCE_BOUNDARY_MISSING');
          console.log('PASS_FINANCE_RULES_GUARD_REFERENCES='+gate);
          NODE
      - name: Install emulator-only dependencies (no credentials)
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix tests --ignore-scripts --no-audit --no-fund
      - name: Verify all 50+ old sales and new owner/secondary security rules
        shell: bash
        run: |
          set -euo pipefail
          npx --yes firebase-tools@15.34.1 emulators:exec --project demo-sales-support --only firestore \
            "node --test tests/rules.test.cjs"
