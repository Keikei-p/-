name: NICO approved partner day-month count rankings (NO DEPLOY)
on:
  pull_request:
    branches: [main]
    paths:
      - 'functions-partner-workspace/**'
      - 'tests/approved-partner-count-standings.test.cjs'
      - 'tests/partner-workspace.test.cjs'
      - 'partner-workspace.html'
      - 'tests/approved-partner-ranking-ui.test.mjs'
      - 'ranking/owner-product-visibility-firestore.mjs'
      - 'tests/owner-product-visibility-firestore.test.mjs'
      - '.github/workflows/nico-verified-partner-count-standings-no-deploy.yml'
  push:
    branches: [feat/verified-partner-daily-month-count-ranking-main-20261110]
    paths:
      - 'functions-partner-workspace/**'
      - 'tests/approved-partner-count-standings.test.cjs'
      - 'tests/partner-workspace.test.cjs'
      - 'partner-workspace.html'
      - 'tests/approved-partner-ranking-ui.test.mjs'
      - 'ranking/owner-product-visibility-firestore.mjs'
      - 'tests/owner-product-visibility-firestore.test.mjs'
      - '.github/workflows/nico-verified-partner-count-standings-no-deploy.yml'
permissions:
  contents: read
jobs:
  rank-and-ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GOOGLE_APPLICATION_CREDENTIALS: ''
      FIREBASE_SERVICE_ACCOUNT_JSON: ''
      NICO_PARTNER_SHARED_RANKING_ENABLED: ''
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Protect original sales and Rules, no automatic release
        shell: bash
        run: |
          set -euo pipefail
          # Exact PR #704 replaces the historical source reviewer only.
          # The shared reviewer runs all 14 original legacy regression suites.
          if [ "${GITHUB_EVENT_NAME:-}:${GITHUB_HEAD_REF:-}" = "pull_request:integration/nico-sales-count-publication-rank-ready-20261113" ]; then
            node scripts/ci/review-integrated-count-candidate.cjs
            exit 0
          fi
          set -euo pipefail
          # PR #717 current partner existing four-rank host: strict source
          # hashes checked by a separately pinned read-only reviewer. Keep
          # all historical release and workflow_dispatch gates unchanged.
          if { [ "$GITHUB_EVENT_NAME" = "pull_request" ] &&
               [ "${GITHUB_HEAD_REF:-}" = "review/partner-inline-four-rank-original-screen-off-20261115" ]; }; then
            test "$(git hash-object scripts/ci/review-partner-original-joint-four-rank-no-deploy.cjs)" = 5655eb5b332574909077bef1acdd04af9cf54822
            node scripts/ci/review-partner-original-joint-four-rank-no-deploy.cjs
            node --test tests/partner-inline-joint-staging-wiring.test.mjs tests/partner-inline-joint-original-preservation.test.mjs
            echo 'PARTNER_EXISTING_FOUR_RANK_CANDIDATE_VERIFIED_NO_DEPLOY'
            exit 0
          fi
          # Exact PR #731: Owner-managed names; partner approval never gates
          # counts. Source pins retain the original finance/Hosting boundaries.
          if [ "${GITHUB_EVENT_NAME:-}:${GITHUB_HEAD_REF:-}" = "pull_request:fix/owner-only-name-publication-20261117" ] &&
             [ "${GITHUB_REPOSITORY:-}" = "Keikei-p/-" ] &&
             node -e "const e=require(process.env.GITHUB_EVENT_PATH);if(e.pull_request?.number!==731||e.pull_request.head.repo.full_name!=='Keikei-p/-'||e.pull_request.base.repo.full_name!=='Keikei-p/-')process.exit(1)"; then
            test "$(git hash-object index.html)" = 03e213565a2037c73913602701363476ae0db9fd
            test "$(git hash-object partner-workspace.html)" = d8262633f35cf0f015de44c9a223c4289f8d2a6b
            test "$(git hash-object functions-partner-workspace/index.js)" = 42eea81ab01449bedbbedabdc1a8fb6bfba1e284
            test "$(git hash-object functions-partner-workspace/service.cjs)" = f78b1fa16f71848b20579ad220f82b703fe7f209
            test "$(git hash-object functions-partner-workspace/shared-count-standings.cjs)" = d8ae8e2a8bfeec66bb82dee049d5f104db26414a
            test "$(git hash-object functions-partner-workspace/approved-published-categories.cjs)" = aa15d09ec443a0c44155f8288784341a9b60810e
            for file in ranking/trusted-combined-ranking-context.mjs functions-ranking-approvals/ranking/trusted-combined-ranking-context.mjs functions-ranking-approvals/vendor/trusted-combined-ranking-context.mjs; do
              test "$(git hash-object "$file")" = 3cfc9f6bc91b5dc315357e39fa7b64ee0e6417af
            done
            for file in ranking/partner-month-readonly-loader.mjs functions-ranking-approvals/ranking/partner-month-readonly-loader.mjs; do
              test "$(git hash-object "$file")" = 106dee944507fab31fe5f36ee314738e64d53597
            done
            # The input/write guard and the read-only ranking must apply
            # exactly the same reviewed combined-SKU restriction.
            test "$(git hash-object functions-partner-workspace/submission-publication-guard.cjs)" = 3784abc3c179fd5e2b1736351be82a35d3034ef1
            test "$(git hash-object ranking/approved-published-categories.mjs)" = 551b31c1ebce1e4203f808a936cec438889863bc
            test "$(git hash-object ranking/partner-submission-publication-guard.mjs)" = 5b46743e0245c0a03447b8f11a4e59970b983b67
            node --test tests/partner-submission-publication-guard.test.mjs tests/owner-reviewed-sku-mapping-store.test.mjs tests/owner-reviewed-sku-mapping-panel.test.mjs tests/approved-partner-count-standings.test.cjs
            node --test tests/trusted-combined-ranking-context.test.mjs tests/partner-month-readonly-loader.test.mjs
          # Exact #708 source review only; historical deployment gates remain unchanged.
          elif { [ "$GITHUB_EVENT_NAME" = "pull_request" ] &&
               [ "${GITHUB_HEAD_REF:-}" = "review/partner-onoff-count-write-guard-no-deploy-20261114" ]; } ||
             { [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF" = "refs/heads/main" ] &&
               [ "$(git hash-object functions-partner-workspace/submission-publication-guard.cjs)" = "a56ae6100ce70602ed90233af038549129941cd9" ]; }; then
            test "$(git hash-object scripts/ci/review-partner-published-write-isolated.cjs)" = 3e6be2df9bf6734ff651f46dfd5edbb044724a50
            node scripts/ci/review-partner-published-write-isolated.cjs --sources-only
          else
            test "$(git hash-object index.html)" = 88ef5636bfe9254e71f2109d452b6d3049f99861
          fi
          test "$(git hash-object firestore.rules)" = d9f4df6a2ac0f8b5720534a2461ec66b94379190
          test "$(git hash-object functions/index.js)" = dfb4c48ada6fa89a24c898cd4a2f911bcede822f
          test -z "$GOOGLE_APPLICATION_CREDENTIALS"
          test -z "$FIREBASE_SERVICE_ACCOUNT_JSON"
          test -z "$NICO_PARTNER_SHARED_RANKING_ENABLED"
          grep -Fq 'sharedRankingEnabled:()=>process.env.NICO_PARTNER_SHARED_RANKING_ENABLED==="enabled"' functions-partner-workspace/index.js
      - name: Check every new count-only module and service syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check functions-partner-workspace/service.cjs
          node --check functions-partner-workspace/index.js
          node --check functions-partner-workspace/shared-count-standings.cjs
          node --check functions-partner-workspace/approved-published-categories.cjs
          node --check tests/approved-partner-count-standings.test.cjs
          node --check tests/partner-workspace.test.cjs
          node --check tests/approved-partner-ranking-ui.test.mjs
          node <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('partner-workspace.html','utf8');
          const m=html.match(/<script type="module">([\s\S]*?)<\/script>/);
          if(!m)throw Error('PARTNER_MODULE_MISSING');
          fs.writeFileSync(process.env.RUNNER_TEMP+'/approved-partner-ranking.mjs',m[1]);
          NODE
          node --check "$RUNNER_TEMP/approved-partner-ranking.mjs"
      - name: Verify storage invariants, approved ON-only mappings and tied day-month ranks
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/approved-partner-count-standings.test.cjs tests/partner-workspace.test.cjs tests/owner-product-visibility-firestore.test.mjs tests/approved-partner-ranking-ui.test.mjs
          node --test tests/internal-owner-finance-visibility.test.cjs tests/partner-money-free-workspace.test.cjs tests/partner-company-code-auth.test.cjs tests/partner-count-dashboard.test.cjs
          echo 'NO_FIREBASE_DEPLOY=1 NO_RULES_WRITES=1 NO_PRODUCTION_COUNT_WRITES=1'
