name: NICO Owner readonly staff count HTML production EXACT ONE
on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/hosting/owner-staff-html-only-guard.mjs'
      - 'tools/hosting/release-owner-staff-html-only.mjs'
      - 'tests/owner-staff-html-only-release.test.mjs'
      - '.github/workflows/nico-owner-staff-html-one-production.yml'
  push:
    branches: [main]
    paths:
      - 'tools/hosting/owner-staff-html-only-guard.mjs'
      - 'tools/hosting/release-owner-staff-html-only.mjs'
      - 'tests/owner-staff-html-only-release.test.mjs'
      - '.github/workflows/nico-owner-staff-html-one-production.yml'
permissions:
  contents: read
concurrency:
  group: firebase-hosting-owner-staff-html-only
  cancel-in-progress: false
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify exact reviewed source and preserved finance/Owner controls
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object tools/hosting/owner-staff-html-only-guard.mjs)" = 836f688e2500d5c8479ef59031ca15876ff972a1
          test "$(git hash-object tools/hosting/release-owner-staff-html-only.mjs)" = 1f4b53ed4e6fba41e52677557f46ebd9ed97eaee
          test "$(git hash-object tests/owner-staff-html-only-release.test.mjs)" = 44d2568094751d662d7b6e777b2428c6bc34a58c
          test "$(git hash-object staging/owner-workspace-errors-v1/owner-partner-admin.html)" = 8ac03f833b27706b256d9218742c343bb3e040ff
          test "$(git hash-object staging/owner-workspace-errors-v1/mobile-bootstrap.mjs)" = 8533ac6b02f7768189444c9bfb8cc11cea7b28e7
          test "$(git hash-object staging/owner-staff-count-readonly-v1/owner-partner-admin.html)" = 3bcc5a267fd4d33def219ce5ac9799e5f9edf9f4
          test "$(git hash-object firestore.rules)" = d9f4df6a2ac0f8b5720534a2461ec66b94379190
          test "$(git hash-object functions-partner-workspace/service.cjs)" = b94a6aba231dc2569009580a178297a5b6194bda
      - name: Simulate exact one HTML release and reject drifts, without secrets
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/hosting/owner-staff-html-only-guard.mjs
          node --check tools/hosting/release-owner-staff-html-only.mjs
          node --test tests/owner-staff-html-only-release.test.mjs
          node --test tests/owner-staff-counts-readonly-view.test.mjs
          echo 'ONE_OWNER_STAFF_HTML_RELEASE_SIMULATED_NO_PRODUCTION_WRITES'
  publish-one:
    needs: offline
    if: >-
      ${{ github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          github.repository == 'Keikei-p/-' &&
          startsWith(github.event.head_commit.message, 'release(hosting): publish one Owner staff count HTML only') &&
          needs.offline.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 22
    env:
      FIREBASE_PROJECT_ID: sales-management-cc116
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Prevent out-of-date SHA or concurrent main head
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_SHA" = "$(git rev-parse HEAD)"
          test "$GITHUB_SHA" = "$(gh api repos/Keikei-p/-/branches/main --jq .commit.sha)"
      - name: Install official Firebase OAuth library only
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix functions --ignore-scripts --no-audit --no-fund --package-lock=false
      - name: Store production credentials runner-private and ephemeral
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$FIREBASE_SERVICE_ACCOUNT_JSON"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/nico-staff-html.private.json"
          chmod 600 "$RUNNER_TEMP/nico-staff-html.private.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/nico-staff-html.private.json" >> "$GITHUB_ENV"
      - name: Dry-run exact current 17-file live Hosting version and diff
        shell: bash
        run: |
          set -euo pipefail
          node tools/hosting/release-owner-staff-html-only.mjs --dry-run
      - name: Publish only one reviewed read-only Owner HTML, no business data writes
        env:
          NICO_OWNER_STAFF_HTML_RELEASE: APPROVE_ONE_REVIEWED_OWNER_STAFF_READONLY_HTML
        shell: bash
        run: |
          set -euo pipefail
          node tools/hosting/release-owner-staff-html-only.mjs --release
      - name: Independently GET public HTML and verify exact approved bytes
        shell: bash
        run: |
          set -euo pipefail
          match=no
          for attempt in 1 2 3 4 5 6 7 8; do
            if curl --fail --silent --show-error --max-time 15 \
              -H 'Cache-Control: no-cache' \
              "https://nico-factory.web.app/owner-partner-admin.html?review=$GITHUB_SHA" \
              --output "$RUNNER_TEMP/owner-staff-live.html" &&
               cmp --silent staging/owner-staff-count-readonly-v1/owner-partner-admin.html \
                 "$RUNNER_TEMP/owner-staff-live.html"; then
              match=yes
              break
            fi
            sleep 4
          done
          test "$match" = yes
          echo 'OWNER_STAFF_READONLY_HTML_PUBLIC_BYTES_VERIFIED_ONE_FILE_ONLY'
      - name: Destroy credentials and temporary HTML on every outcome
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/nico-staff-html.private.json" "$RUNNER_TEMP/owner-staff-live.html"
