name: NICO Owner workspace LIVE root and partner schema audit (GET ONLY)
on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/production/audit-owner-workspace-live-readonly.mjs'
      - 'tests/audit-owner-workspace-live-readonly.test.mjs'
      - '.github/workflows/nico-owner-workspace-live-schema-readonly.yml'
  push:
    branches: [main]
    paths:
      - 'tools/production/audit-owner-workspace-live-readonly.mjs'
      - 'tests/audit-owner-workspace-live-readonly.test.mjs'
      - '.github/workflows/nico-owner-workspace-live-schema-readonly.yml'
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Check immutable read-only source, original functions and Rules
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object tools/production/audit-owner-workspace-live-readonly.mjs)" = 642fe87d5e3026989d9619f3d0d0a02d19dee545
          test "$(git hash-object tests/audit-owner-workspace-live-readonly.test.mjs)" = 0cfddcd7ece38efc61d8d1a2b5e971222944ce21
          test "$(git hash-object functions-partner-workspace/service.cjs)" = b94a6aba231dc2569009580a178297a5b6194bda
          test "$(git hash-object firestore.rules)" = d9f4df6a2ac0f8b5720534a2461ec66b94379190
          node --check tools/production/audit-owner-workspace-live-readonly.mjs
          node --test tests/audit-owner-workspace-live-readonly.test.mjs
          echo "OWNER_METADATA_ONLY_OFFLINE_PASS"
  live-get-only:
    needs: offline
    if: >-
      ${{ github.event_name == 'push' &&
          github.repository == 'Keikei-p/-' &&
          github.ref == 'refs/heads/main' &&
          needs.offline.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FIREBASE_PROJECT_ID: sales-management-cc116
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify unchanged reviewed HEAD before LIVE read
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_SHA" = "$(git rev-parse HEAD)"
          test "$GITHUB_SHA" = "$(gh api repos/Keikei-p/-/branches/main --jq .commit.sha)"
      - name: Install existing official Firebase Admin SDK, no deploy tools
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix functions --ignore-scripts --no-audit --no-fund --package-lock=false
      - name: Load existing identity only inside private runner storage
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          test -n "$FIREBASE_SERVICE_ACCOUNT_JSON"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/nico-owner-schema.private.json"
          chmod 600 "$RUNNER_TEMP/nico-owner-schema.private.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/nico-owner-schema.private.json" >> "$GITHUB_ENV"
      - name: Audit only limited Owner, company member, relation and team metadata
        shell: bash
        run: |
          set -euo pipefail
          node tools/production/audit-owner-workspace-live-readonly.mjs --read-only
          echo "FIRESTORE_WRITES=0 AUTH_MUTATIONS=0 OWNER_IMPERSONATION=0 FINANCE_READS=0"
      - name: Remove private credentials
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/nico-owner-schema.private.json"
