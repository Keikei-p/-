name: NICO one shared count ranking on both original screens (NO DEPLOY)
on:
  pull_request:
    branches: [main]
    paths:
      - 'sales-archive.js'
      - 'partner-workspace.html'
      - 'ranking/verified-joint-month-http-bridge.mjs'
      - 'ranking/verified-dual-count-view.mjs'
      - 'ranking/verified-dual-count-view.css'
      - 'tests/verified-joint-count-host-wiring.test.mjs'
      - '.github/workflows/nico-joint-count-host-wiring-no-deploy.yml'
  push:
    branches: [main]
    paths:
      - 'sales-archive.js'
      - 'partner-workspace.html'
      - 'ranking/verified-joint-month-http-bridge.mjs'
      - 'ranking/verified-dual-count-view.mjs'
      - 'ranking/verified-dual-count-view.css'
      - 'tests/verified-joint-count-host-wiring.test.mjs'
      - '.github/workflows/nico-joint-count-host-wiring-no-deploy.yml'
permissions:
  contents: read
jobs:
  verify-no-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      FIREBASE_SERVICE_ACCOUNT_JSON: ''
      GOOGLE_APPLICATION_CREDENTIALS: ''
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Protect original money and production Functions
        shell: bash
        run: |
          set -euo pipefail
          test -z "$FIREBASE_SERVICE_ACCOUNT_JSON"
          test -z "$GOOGLE_APPLICATION_CREDENTIALS"
          # Additional exact REVIEW-only source for #706 current main and
          # the unified day/week/month UI; the historical release pins are
          # preserved in the else branch, never silently replaced.
          if { [ "$GITHUB_EVENT_NAME" = "pull_request" ] &&
               [ "${GITHUB_HEAD_REF:-}" = "review/owner-partner-four-rank-cards-ui-no-deploy-20261115" ]; } ||
             { [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF" = "refs/heads/main" ] &&
               [ "$(git hash-object ranking/verified-joint-month-http-bridge.mjs)" = 2d960d8762761022df98b01a50cc4e7dd43b4840 ]; }; then
            test "$(git hash-object ranking/verified-dual-count-view.mjs)" = a75ca72d851820d072c71c7ed04a3a3823dda4e9
            test "$(git hash-object ranking/verified-joint-month-http-bridge.mjs)" = 2d960d8762761022df98b01a50cc4e7dd43b4840
            test "$(git hash-object index.html)" = 5edde6d5e5459ba283d12d157c021d4eee03d587
            test "$(git hash-object firestore.rules)" = d9f4df6a2ac0f8b5720534a2461ec66b94379190
            test "$(git hash-object functions/index.js)" = dfb4c48ada6fa89a24c898cd4a2f911bcede822f
            test "$(git hash-object functions-partner-workspace/index.js)" = 90d51246477cf5cfa6966f3e822326ef06cccd0f
            test "$(git hash-object functions-partner-workspace/service.cjs)" = 614f3216e008642ddf5eda6b93c35cc0469557c3
            grep -Fq 'const NICO_INTERNAL_JOINT_COUNT_MONTH_RELEASED=false;' sales-archive.js
            grep -Fq 'const NICO_PARTNER_JOINT_COUNT_MONTH_RELEASED=false;' partner-workspace.html
          else
          test "$(git hash-object index.html)" = 88ef5636bfe9254e71f2109d452b6d3049f99861
          test "$(git hash-object firestore.rules)" = d9f4df6a2ac0f8b5720534a2461ec66b94379190
          test "$(git hash-object functions/index.js)" = dfb4c48ada6fa89a24c898cd4a2f911bcede822f
          test "$(git hash-object functions-partner-workspace/index.js)" = ab551981ce12b4d291a20c0b51cbd461be60df54
          test "$(git hash-object functions-partner-workspace/service.cjs)" = 5334aa48d7f4eb64274a6d7a8bbb4e76d4a2fb65
          fi
      - name: Check both original UI hosts and canonical month-only count authorization
        shell: bash
        run: |
          set -euo pipefail
          node --check sales-archive.js
          node --check ranking/verified-joint-month-http-bridge.mjs
          node --check tests/verified-joint-count-host-wiring.test.mjs
          node --test tests/verified-joint-count-host-wiring.test.mjs tests/verified-joint-month-http-bridge.test.mjs tests/verified-dual-count-view.test.mjs tests/verified-dual-count-dashboards.test.mjs
          echo 'BOTH_ORIGINAL_SCREENS_SAME_COUNT_ONLY_VIEW_OFF_UNTIL_LIVE_PROOF'
