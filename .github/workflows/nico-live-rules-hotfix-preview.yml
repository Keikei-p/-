name: NICO actual-live Firestore finance hotfix PREVIEW (no deployment)

on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/production/preview-live-finance-rules.mjs'
      - 'tests/live-rules-surgical-preview.test.mjs'
      - '.github/workflows/nico-live-rules-hotfix-preview.yml'
  push:
    branches: [main]
    paths:
      - 'tools/production/preview-live-finance-rules.mjs'
      - 'tests/live-rules-surgical-preview.test.mjs'
      - '.github/workflows/nico-live-rules-hotfix-preview.yml'

permissions:
  contents: read

concurrency:
  group: nico-surgical-live-finance-rules-preview
  cancel-in-progress: false

jobs:
  offline-patch-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Only test the strict surgical patch, no production access
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/production/preview-live-finance-rules.mjs
          node --test tests/live-rules-surgical-preview.test.mjs

  live-offline-emulator:
    needs: offline-patch-tests
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.offline-patch-tests.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 24
    env:
      FIREBASE_PROJECT_ID: sales-management-cc116
      NICO_PARTNER_AUDIT_MODE: READ_ONLY
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirm protected project and that the job cannot deploy
        shell: bash
        run: |
          set -euo pipefail
          node -e "const fs=require('node:fs'); if(JSON.parse(fs.readFileSync('.firebaserc')).projects.default!=='sales-management-cc116')process.exit(1)"
          node --test tests/live-rules-surgical-preview.test.mjs
          if grep -E 'firebase deploy|rulesets\.create|releases\.patch|releases\.create' tools/production/preview-live-finance-rules.mjs; then
            echo "STOP: deploy or write call unexpectedly found"
            exit 1
          fi
      - name: Configure existing audit credentials securely
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          test -n "${FIREBASE_SERVICE_ACCOUNT_JSON:-}"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/nico-live-rules-preview-credential.json"
          chmod 600 "$RUNNER_TEMP/nico-live-rules-preview-credential.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/nico-live-rules-preview-credential.json" >> "$GITHUB_ENV"
      - name: Install the existing Firebase Admin SDK (no production mutation)
        run: npm install --prefix functions --ignore-scripts --package-lock=false --no-audit --no-fund
      - name: GET current deployed Rules and prepare offline ONLY patch in ephemeral checkout
        run: node tools/production/preview-live-finance-rules.mjs
      - name: Keep the exact unmodified live Rules for rollback review (7 days)
        uses: actions/upload-artifact@v4
        with:
          name: nico-live-rules-readonly-original-and-offline-candidate
          path: |
            ${{ runner.temp }}/nico-original-live-firestore.rules
            ${{ runner.temp }}/nico-proposed-live-firestore.rules
          if-no-files-found: error
          retention-days: 7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install isolated Firestore test dependencies and CLI
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix tests --ignore-scripts --no-audit --no-fund
          npm install --global firebase-tools@15.34.1 --no-audit --no-fund
      - name: Test ACTUAL LIVE Rules plus only permitted changes against every owner/leader/partner/retention test
        shell: bash
        run: |
          set -euo pipefail
          firebase emulators:exec --project demo-sales-support --only firestore "node --test tests/rules.test.cjs"
          # Passing emulator tests is necessary but not sufficient:
          # reject partner money-source grants hidden behind additional rule branches.
          node --test tests/finance-release-gate.test.mjs
          node scripts/check-finance-read-boundary-before-deploy.mjs
          echo 'PASS: actual-live minimal patch and raw finance grant gate verified offline. NO PRODUCTION DEPLOYMENT.'
