name: NICO reviewed partner CB login and same-app production release 20261102
on:
  push:
    branches: [release/nico-sales-partner-cb-login-20261102]
    paths: [.github/workflows/nico-reviewed-cb-login-production-20261102.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: nico-partner-workspace-production
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Pin reviewed application, original finance boundary and exact one-file release commit
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = Keikei-p/-
          test "$GITHUB_REF" = refs/heads/release/nico-sales-partner-cb-login-20261102
          test "$(git rev-parse HEAD^)" = 929a348a284e82fa53e29db650d565d5da035c01
          test "$(git show --pretty=format: --name-only HEAD | sed '/^$/d')" = .github/workflows/nico-reviewed-cb-login-production-20261102.yml
          test "$(git show -s --format=%s HEAD)" = 'release: reviewed partner two-function count-only CB and index-only activation'
          test "$(git hash-object index.html)" = b1499b806973a0a19669d5ad056e349da739e65a
          test "$(git hash-object functions-partner-workspace/service.cjs)" = 4db813b64cecf3f9d842559bc66927a5b6bdabd5
          test "$(git hash-object functions-partner-workspace/shared-direct-counts.cjs)" = 6f66771256f5790dbe18bed6b9e50d01cb3adcad
          test "$(git hash-object functions-partner-workspace/index.js)" = 38da7e9174ffea7c406c92292dccfc651b565eb0
          test "$(git hash-object functions/index.js)" = dfb4c48ada6fa89a24c898cd4a2f911bcede822f
          test "$(git hash-object firestore.rules)" = d9f4df6a2ac0f8b5720534a2461ec66b94379190
          test "$(git hash-object firebase.partner-workspace.json)" = a6ceedec5fab4e22e0a8efe19c685716a2db9750
          test "$(git hash-object tools/hosting/surgical-existing-index.mjs)" = 1c6923e06135dc480e11f342e44f5e74f8c5bbc7
          node -e "const f=require('fs');if(JSON.parse(f.readFileSync('.firebaserc','utf8')).projects.default!=='sales-management-cc116')process.exit(1)"
          node --check functions-partner-workspace/service.cjs
          node --check functions-partner-workspace/shared-direct-counts.cjs
          node --check functions-partner-workspace/index.js
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const html=fs.readFileSync('index.html','utf8');
          const source=html.match(/<script type="module">([\s\S]*?)<\/script>/)?.[1];
          if(!source||!html.includes('partnerSameAppNavigation')||
             !html.includes('partnerInlineSelectedCb')||
             !html.includes('rememberedPartnerWorkspace')||
             !html.includes('monthlyRevenue')||
             !html.includes('signInWithEmailAndPassword'))
           throw Error('STOP_UNEXPECTED_LOGIN_CB_OR_OWNER_REVENUE_SCREEN');
          fs.writeFileSync('/tmp/nico-reviewed-partner-index.mjs',source);
          NODE
          node --check /tmp/nico-reviewed-partner-index.mjs
      - name: Run audited owner revenue, partner count, email, ranking and hosting regression suites
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/partner-repeat-login-cb-parity.test.mjs tests/partner-company-parity-release.test.mjs tests/partner-management-tabs-parity.test.mjs tests/owner-partner-team-detail-screen.test.mjs tests/internal-owner-finance-visibility.test.cjs tests/partner-money-free-workspace.test.cjs tests/sales-regressions.cjs
          node --test tests/partner-workspace.test.cjs tests/partner-count-dashboard.test.cjs tests/partner-count-only-ledger.test.mjs tests/partner-shared-direct-redaction.test.cjs tests/partner-one-login-same-app.test.cjs tests/partner-email-resend-and-join.test.mjs tests/surgical-existing-index.test.mjs
          echo PASS_OFFLINE_COUNT_FINANCE_RECORDS_AND_SAFETY
  release:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      FIREBASE_PROJECT_ID: sales-management-cc116
      NICO_PARTNER_RELEASE_CONFIRMATION: CONFIRM_ADD_PARTNER_RANKING_INDEX_ONLY
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify signed-off readiness evidence, still unchanged main and exact source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api repos/Keikei-p/-/branches/main --jq '.commit.sha')" = 283bc749c97756fc3de03671ae7bac4eccdc46c3
          test "$(gh api repos/Keikei-p/-/actions/runs/41426380030 --jq '.conclusion')" = success
          test "$(gh api repos/Keikei-p/-/actions/runs/41426659543 --jq '.conclusion')" = success
          test "$(git hash-object index.html)" = b1499b806973a0a19669d5ad056e349da739e65a
          echo PASS_PINNED_SOURCE_AND_EXISTING_MAIN
      - name: Load existing production identity without exposing secrets
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          test -n "$FIREBASE_SERVICE_ACCOUNT_JSON" || { echo STOP_NO_PROTECTED_IDENTITY; exit 1; }
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/nico-reviewed-cb-production.json"
          chmod 600 "$RUNNER_TEMP/nico-reviewed-cb-production.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/nico-reviewed-cb-production.json" >> "$GITHUB_ENV"
      - name: Install existing Firebase tools without touching installed production services
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix functions --ignore-scripts --package-lock=false --no-audit --no-fund
          npm install --prefix functions-partner-workspace --ignore-scripts --package-lock=false --no-audit --no-fund
          npm install --global firebase-tools@15.34.1 --no-audit --no-fund
      - name: Recheck original live HTML, Rules, Auth, backups, and all original Functions before any write
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --max-time 30 https://nico-factory.web.app/ > "$RUNNER_TEMP/nico-old-index.html"
          test "$(sha256sum "$RUNNER_TEMP/nico-old-index.html" | cut -d' ' -f1)" = 324f8adb4ee21d4de761381cff6f97eb5b0f93663be8d890435eb0088debe8b3 || { echo STOP_UNREVIEWED_LIVE_INDEX; exit 1; }
          node --input-type=module <<'NODE'
          import {createRequire} from 'node:module';
          import {createHash} from 'node:crypto';
          import {inspect} from './tools/production/inspect-firestore-backups-readonly.mjs';
          const require=createRequire(process.cwd()+'/functions/package.json');
          const credential=require('firebase-admin/app').applicationDefault();
          const token=(await credential.getAccessToken()).access_token;
          const get=async url=>{const r=await fetch(url,{headers:{Authorization:'Bearer '+token},redirect:'error'});if(!r.ok)throw Error('STOP_READONLY_HTTP_'+r.status);return r.json()};
          const config=await get('https://identitytoolkit.googleapis.com/admin/v2/projects/sales-management-cc116/config');
          if(config?.signIn?.email?.enabled!==true||
             config?.signIn?.email?.passwordRequired===true||
             !config.authorizedDomains?.includes('nico-factory.web.app'))
            throw Error('STOP_EMAIL_LINK_AUTH_OR_DOMAIN');
          const rel=await get('https://firebaserules.googleapis.com/v1/projects/sales-management-cc116/releases/cloud.firestore');
          if(!/^projects\/sales-management-cc116\/rulesets\/[A-Za-z0-9_-]+$/.test(rel.rulesetName||''))throw Error('STOP_UNVERIFIED_RULESET');
          const rules=await get('https://firebaserules.googleapis.com/v1/'+rel.rulesetName);
          if(rules.source?.files?.length!==1)throw Error('STOP_RULES_SHAPE');
          const sha=createHash('sha256').update(rules.source.files[0].content.replace(/\r\n/g,'\n').trim()).digest('hex');
          if(sha!=='d1d9998d874a1a31c81ddf6996e08cd9de3a3d13bd684e245140bf03cab32179')throw Error('STOP_FINANCE_RULES_CHANGED');
          const backups=await inspect();
          const age=Date.now()-Date.parse(backups.latestReadySnapshot||'');
          if(backups.readyBackups===0||!Number.isFinite(age)||age<0||age>48*3600000)
            throw Error('STOP_BACKUP_NOT_RECENT');
          const names=['getPartnerWorkspace','managePartnerWorkspace','acceptPartnerWorkspaceInvite',
            'submitPartnerWorkspaceCounts','sendMissingReportReminders'];
          for(const name of names){
            const fn=await get('https://cloudfunctions.googleapis.com/v2/projects/sales-management-cc116/locations/asia-northeast1/functions/'+name);
            if(fn.state!=='ACTIVE'||fn.environment!=='GEN_2')throw Error('STOP_ORIGINAL_FUNCTION_INACTIVE_'+name);
          }
          console.log('PASS_ORIGINAL_OWNER_RULES_AUTH_BACKUPS_FUNCTIONS');
          NODE
          node tools/hosting/surgical-existing-index.mjs --dry-run
          firebase functions:list --project "$FIREBASE_PROJECT_ID" --json > "$RUNNER_TEMP/nico-functions-before.json"
      - name: Update exactly two existing count-only functions, never delete or migrate sales
        shell: bash
        run: |
          set -euo pipefail
          test ! -e functions-partner-workspace/.env.sales-management-cc116
          printf 'PARTNER_WORKSPACE_ENABLED=enabled\nPARTNER_COMPANY_CODE_AUTH_ENABLED=enabled\n' > functions-partner-workspace/.env.sales-management-cc116
          date -u +%Y-%m-%dT%H:%M:%SZ > "$RUNNER_TEMP/nico-cb-functions-start.txt"
          set +e
          firebase deploy --non-interactive --project "$FIREBASE_PROJECT_ID" --config firebase.partner-workspace.json \
            --only functions:partner-workspace:getPartnerWorkspace,functions:partner-workspace:submitPartnerWorkspaceCounts \
            > "$RUNNER_TEMP/nico-cb-functions-deploy.log" 2>&1
          rc=$?
          set -e
          for name in getPartnerWorkspace submitPartnerWorkspaceCounts; do
            grep -F "functions[partner-workspace:$name(asia-northeast1)]" "$RUNNER_TEMP/nico-cb-functions-deploy.log" |
              grep -Fq 'Successful update operation' || { echo STOP_TARGET_FUNCTION_UPDATE_NOT_CONFIRMED; exit 1; }
          done
          if [ "$rc" -ne 0 ]; then
            grep -Fq 'Functions successfully deployed but could not set up cleanup policy' "$RUNNER_TEMP/nico-cb-functions-deploy.log" ||
              { echo STOP_UNEXPECTED_TARGET_FUNCTION_DEPLOY_ERROR; exit 1; }
          fi
          echo PASS_TWO_EXISTING_COUNT_ONLY_FUNCTIONS_UPDATED
      - name: Verify both updated functions ACTIVE, deny anonymous access, preserve all original function names
        shell: bash
        run: |
          set -euo pipefail
          firebase functions:list --project "$FIREBASE_PROJECT_ID" --json > "$RUNNER_TEMP/nico-functions-after.json"
          node <<'NODE'
          const fs=require('node:fs');
          const list=name=>(JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/'+name,'utf8')).result||[])
            .map(fn=>fn.id||fn.name||'');
          const before=list('nico-functions-before.json'),after=list('nico-functions-after.json');
          if(!before.length||before.some(n=>!after.includes(n)))throw Error('STOP_PREEXISTING_FUNCTION_MISSING');
          console.log('PASS_ALL_ORIGINAL_FUNCTIONS_PRESERVED');
          NODE
          node --input-type=module <<'NODE'
          import {createRequire} from 'node:module';
          import {readFileSync} from 'node:fs';
          const require=createRequire(process.cwd()+'/functions/package.json');
          const token=(await require('firebase-admin/app').applicationDefault().getAccessToken()).access_token;
          const start=Date.parse(readFileSync(process.env.RUNNER_TEMP+'/nico-cb-functions-start.txt','utf8'));
          for(const name of ['getPartnerWorkspace','submitPartnerWorkspaceCounts']){
            const fn=await fetch('https://cloudfunctions.googleapis.com/v2/projects/sales-management-cc116/locations/asia-northeast1/functions/'+name,
              {headers:{Authorization:'Bearer '+token},redirect:'error'});
            if(!fn.ok)throw Error('STOP_FUNCTION_READBACK_'+name);
            const data=await fn.json();
            if(data.state!=='ACTIVE'||Date.parse(data.updateTime)<start||
               data.serviceConfig?.environmentVariables?.PARTNER_WORKSPACE_ENABLED!=='enabled')
              throw Error('STOP_TARGET_FUNCTION_NOT_ACTIVE_'+name);
            const anonymous=await fetch('https://asia-northeast1-sales-management-cc116.cloudfunctions.net/'+name,{
              method:'POST',headers:{'Content-Type':'application/json'},body:'{"data":{}}'});
            if(![401,403].includes(anonymous.status))throw Error('STOP_ANONYMOUS_EXPOSED_'+name);
            console.log('PASS_UPDATED_AND_ACCESS_RESTRICTED '+name);
          }
          NODE
      - name: Publish exactly original index.html preserving ALL existing live Hosting assets
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object index.html)" = b1499b806973a0a19669d5ad056e349da739e65a
          test "$(sha256sum "$RUNNER_TEMP/nico-old-index.html" | cut -d' ' -f1)" = 324f8adb4ee21d4de761381cff6f97eb5b0f93663be8d890435eb0088debe8b3
          node tools/hosting/surgical-existing-index.mjs --dry-run
          node tools/hosting/surgical-existing-index.mjs --release
          echo PASS_ONLY_INDEX_CHANGED_AND_MANIFEST_PRESERVED
      - name: Verify exactly newly published code and old routes still active, never infer customer login success
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --max-time 30 'https://nico-factory.web.app/?cb_login_verify=20261102' > "$RUNNER_TEMP/nico-cb-index-after.html"
          cmp -s index.html "$RUNNER_TEMP/nico-cb-index-after.html" || { echo STOP_HOSTING_NEW_INDEX_NOT_EXACT; exit 1; }
          for route in partner-invite.html partner-counts.html partner-workspace.html; do
            curl -fsSL --retry 3 --max-time 30 "https://nico-factory.web.app/$route" > "$RUNNER_TEMP/$route"
          done
          grep -Fq 'createPartnerCompanyInvitation' "$RUNNER_TEMP/partner-invite.html"
          grep -Fq 'submitPartnerWorkspaceCounts' "$RUNNER_TEMP/partner-workspace.html"
          grep -Fq 'getPartnerQuickCounts' "$RUNNER_TEMP/partner-counts.html"
          grep -Fq 'monthlyRevenue' "$RUNNER_TEMP/nico-cb-index-after.html"
          grep -Fq 'partnerInlineSelectedCb' "$RUNNER_TEMP/nico-cb-index-after.html"
          grep -Fq 'rememberedPartnerWorkspace' "$RUNNER_TEMP/nico-cb-index-after.html"
          echo PASS_LIVE_NEW_COUNT_ONLY_CB_AND_ORIGINAL_OWNER_REVENUE_UI
      - name: Remove runner credentials and temporary deploy logs
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/nico-reviewed-cb-production.json" "$RUNNER_TEMP/nico-cb-functions-deploy.log" "$RUNNER_TEMP/nico-cb-functions-start.txt" functions-partner-workspace/.env.sales-management-cc116
