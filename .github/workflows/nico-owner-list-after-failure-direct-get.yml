name: NICO Owner list partial deploy aftermath Cloud Functions API GET only
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/nico-owner-list-after-failure-direct-get.yml'
      - 'tools/production/inspect-owner-list-deploy-aftermath-readonly.mjs'
      - 'tests/inspect-owner-list-deploy-aftermath-readonly.test.mjs'
  push:
    branches: [main]
    paths:
      - '.github/workflows/nico-owner-list-after-failure-direct-get.yml'
      - 'tools/production/inspect-owner-list-deploy-aftermath-readonly.mjs'
      - 'tests/inspect-owner-list-deploy-aftermath-readonly.test.mjs'
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Prove no mutation and immutable original sources
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object tools/production/inspect-owner-list-deploy-aftermath-readonly.mjs)" = c1396dfa52fde4fc9548e2fd73f7f91263d6459e
          test "$(git hash-object tests/inspect-owner-list-deploy-aftermath-readonly.test.mjs)" = 62275f073bbe4ef3a57c65b55c2062023addb80a
          test "$(git hash-object firestore.rules)" = d9f4df6a2ac0f8b5720534a2461ec66b94379190
          test "$(git hash-object functions-partner-workspace/service.cjs)" = b94a6aba231dc2569009580a178297a5b6194bda
          node --check tools/production/inspect-owner-list-deploy-aftermath-readonly.mjs
          node --test tests/inspect-owner-list-deploy-aftermath-readonly.test.mjs
          node --test tests/protect-ranking-original-functions-versions.test.mjs
          echo "CLOUD_FUNCTIONS_AFTER_FAILURE_OFFLINE_GET_ONLY_PASS"
  inspect-cloud-api:
    needs: offline
    if: >-
      ${{ github.event_name == 'push' &&
          github.repository == 'Keikei-p/-' &&
          github.ref == 'refs/heads/main' &&
          needs.offline.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FIREBASE_PROJECT_ID: sales-management-cc116
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify exact SHA and reviewed code before GET
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_SHA" = "$(git rev-parse HEAD)"
          test "$GITHUB_SHA" = "$(gh api repos/Keikei-p/-/branches/main --jq .commit.sha)"
      - name: Install official OAuth library only, no Firebase CLI deploy
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix functions --ignore-scripts --no-audit --no-fund --package-lock=false
      - name: Load existing service identity privately
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$FIREBASE_SERVICE_ACCOUNT_JSON"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/nico-owner-afterfail.private.json"
          chmod 600 "$RUNNER_TEMP/nico-owner-afterfail.private.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/nico-owner-afterfail.private.json" >> "$GITHUB_ENV"
      - name: Inspect two targets and all ORIGINAL Functions with direct Google Cloud GET
        shell: bash
        run: |
          set -euo pipefail
          node tools/production/inspect-owner-list-deploy-aftermath-readonly.mjs --read-only
          echo "DEPLOY_RETRIES=0 FUNCTION_WRITES=0 FIRESTORE_WRITES=0"
      - name: Erase private OAuth credentials
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/nico-owner-afterfail.private.json"
