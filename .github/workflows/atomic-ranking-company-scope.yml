name: Atomic ranking company scope (NO DEPLOY)
on:
  pull_request:
    paths:
      - 'functions-ranking-approvals/ranking/owner-visible-count-atomic-loader.mjs'
      - 'tests/atomic-ranking-company-validation.test.cjs'
      - '.github/workflows/atomic-ranking-company-scope.yml'
  push:
    branches: [main]
    paths:
      - 'functions-ranking-approvals/ranking/owner-visible-count-atomic-loader.mjs'
      - 'tests/atomic-ranking-company-validation.test.cjs'
      - '.github/workflows/atomic-ranking-company-scope.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/atomic-ranking-company-validation.test.cjs
