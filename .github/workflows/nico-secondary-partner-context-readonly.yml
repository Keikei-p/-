name: NICO secondary partner context finance-risk inventory (READ ONLY)
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/nico-secondary-partner-context-readonly.yml'
      - 'tools/production/audit-active-secondary-partner-context-readonly.mjs'
      - 'tests/audit-active-secondary-partner-context-readonly.test.mjs'
  push:
    branches: [main]
    paths:
      - '.github/workflows/nico-secondary-partner-context-readonly.yml'
      - 'tools/production/audit-active-secondary-partner-context-readonly.mjs'
      - 'tests/audit-active-secondary-partner-context-readonly.test.mjs'
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      FIREBASE_SERVICE_ACCOUNT_JSON: ''
      GOOGLE_APPLICATION_CREDENTIALS: ''
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Require original Security Rules and bounded no-secret tests
        shell: bash
        run: |
          set -euo pipefail
          test -z "$FIREBASE_SERVICE_ACCOUNT_JSON"
          test -z "$GOOGLE_APPLICATION_CREDENTIALS"
          test "$(git hash-object firestore.rules)" = 'd9f4df6a2ac0f8b5720534a2461ec66b94379190'
          test "$(git hash-object functions/index.js)" = 'dfb4c48ada6fa89a24c898cd4a2f911bcede822f'
          test "$(git hash-object functions-partner-workspace/index.js)" = '38da7e9174ffea7c406c92292dccfc651b565eb0'
          node --check tools/production/audit-active-secondary-partner-context-readonly.mjs
          node --test tests/audit-active-secondary-partner-context-readonly.test.mjs
  live-bounded-inventory:
    needs: offline
    if: >-
      ${{ github.event_name == 'push' &&
          github.repository == 'Keikei-p/-' &&
          github.ref == 'refs/heads/main' &&
          needs.offline.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 13
    env:
      FIREBASE_PROJECT_ID: sales-management-cc116
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify exact reviewed main Rules and project, never change live data
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_SHA" = "$(git rev-parse HEAD)"
          test "$(git hash-object firestore.rules)" = 'd9f4df6a2ac0f8b5720534a2461ec66b94379190'
          node --test tests/audit-active-secondary-partner-context-readonly.test.mjs
      - name: Install existing Admin SDK without dependency upgrades
        shell: bash
        run: npm install --prefix functions --ignore-scripts --no-audit --no-fund --package-lock=false
      - name: Use existing identity in a temporary private file only
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          test -n "$FIREBASE_SERVICE_ACCOUNT_JSON"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/nico-secondary-ro.private.json"
          chmod 600 "$RUNNER_TEMP/nico-secondary-ro.private.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/nico-secondary-ro.private.json" >> "$GITHUB_ENV"
      - name: READ no more than 25 secondary contexts and 75 identity metadata docs
        shell: bash
        run: |
          set -euo pipefail
          node tools/production/audit-active-secondary-partner-context-readonly.mjs
          echo 'PRODUCTION_DOCUMENT_WRITES=0'
          echo 'PRODUCTION_FINANCIAL_ORIGINAL_READS=0'
          echo 'PRODUCTION_FUNCTION_DEPLOYS=0'
          echo 'PRODUCTION_RULES_DEPLOYS=0'
      - name: Destroy private identity
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/nico-secondary-ro.private.json" firebase-debug.log firestore-debug.log
