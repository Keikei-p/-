name: Main live finance Rules audit (READ ONLY / NO DEPLOY)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/production/audit-live-finance-rules-readonly.cjs'
      - '.github/workflows/main-live-finance-readonly.yml'
  pull_request:
    paths:
      - 'tools/production/audit-live-finance-rules-readonly.cjs'
      - '.github/workflows/main-live-finance-readonly.yml'
permissions:
  contents: read
jobs:
  static-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --check tools/production/audit-live-finance-rules-readonly.cjs
      - run: node --test tests/main-partner-finance-gate-audit.test.cjs
  live-readonly:
    if: (github.event_name == 'workflow_dispatch' || github.event_name == 'push') && github.ref == 'refs/heads/main'
    needs: static-contract
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      NICO_PROD_AUDIT_MODE: READ_ONLY
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install audit-only Google client
        run: npm install --prefix /tmp/nico-readonly-audit google-auth-library@9 --ignore-scripts --no-audit --no-fund
      - name: Run authenticated GET-only live Rules audit
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          test -n "$FIREBASE_SERVICE_ACCOUNT_JSON"
          audit_identity="$(mktemp)"
          trap 'rm -f "$audit_identity"' EXIT
          chmod 600 "$audit_identity"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$audit_identity"
          export GOOGLE_APPLICATION_CREDENTIALS="$audit_identity"
          export NICO_AUDIT_GOOGLE_AUTH_MODULE=/tmp/nico-readonly-audit/node_modules/google-auth-library
          node tools/production/audit-live-finance-rules-readonly.cjs
