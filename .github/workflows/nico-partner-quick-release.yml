name: NICO isolated partner daily counts — additive same-day release
on:
  pull_request:
    branches: [main]
    paths:
      - "functions-partner-quick/**"
      - "firebase.partner-quick.json"
      - "partner-counts.html"
      - "tests/partner-quick-counts.test.cjs"
      - "tests/surgical-existing-partner-counts.test.mjs"
      - "tools/hosting/additive-partner-counts.mjs"
      - "tools/hosting/surgical-existing-partner-counts.mjs"
      - ".github/workflows/nico-partner-quick-release.yml"
  push:
    branches: [main]
    paths:
      - "functions-partner-quick/**"
      - "firebase.partner-quick.json"
      - "partner-counts.html"
      - "tests/partner-quick-counts.test.cjs"
      - "tests/surgical-existing-partner-counts.test.mjs"
      - "tools/hosting/additive-partner-counts.mjs"
      - "tools/hosting/surgical-existing-partner-counts.mjs"
      - ".github/workflows/nico-partner-quick-release.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nico-partner-quick-isolated-release
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check isolated source & original finance Function fingerprints
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object functions/index.js)" = dfb4c48ada6fa89a24c898cd4a2f911bcede822f
          test "$(git hash-object functions/partner-company-invitations.cjs)" = 575865469f68c6a1c1a24b4d32c9150cb42178fe
          node --check functions-partner-quick/quick-counts.cjs
          node --check functions-partner-quick/index.js
          node --check tools/hosting/additive-partner-counts.mjs
          node --check tools/hosting/surgical-existing-partner-counts.mjs
          node --test tests/surgical-existing-partner-counts.test.mjs
          node --test tests/partner-quick-counts.test.cjs
          node --test tests/partner-company-invitations.test.cjs
          node --test tests/additive-partner-invite-hosting.test.mjs
          node - <<'NODE'
          const fs=require('node:fs');
          const cfg=JSON.parse(fs.readFileSync('firebase.partner-quick.json','utf8'));
          if(Object.keys(cfg).join(',')!=='functions'||cfg.functions.source!=='functions-partner-quick'||cfg.functions.codebase!=='partner-quick')throw Error('unsafe config scope');
          const html=fs.readFileSync('partner-counts.html','utf8');
          if(!html.includes('submitPartnerQuickCounts')||!html.includes('getPartnerQuickCounts')||
             !html.includes('approvePartnerQuickCounts')||
             /firebase-firestore\.js|\.deleteDoc\(|\bgetFirestore\(|\bcollection\(/.test(html))
            throw Error('unapproved browser access to Firestore');
          const js=html.match(/<script type="module">([\s\S]+?)<\/script>/)?.[1];
          if(!js)throw Error('module script missing');
          fs.writeFileSync('/tmp/partner-quick-inline.mjs',js);
          NODE
          node --check /tmp/partner-quick-inline.mjs
  release:
    needs: validate
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && needs.validate.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      FIREBASE_PROJECT_ID: sales-management-cc116
      NICO_PARTNER_RELEASE_CONFIRMATION: CONFIRM_REPLACE_PARTNER_COUNTS_ONLY
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify credentials and exact production target (no database changes)
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${FIREBASE_SERVICE_ACCOUNT_JSON:-}"
          node -e "const x=JSON.parse(require('node:fs').readFileSync('.firebaserc','utf8'));if(x.projects.default!=='sales-management-cc116')process.exit(1)"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/partner-quick-credentials.json"
          chmod 600 "$RUNNER_TEMP/partner-quick-credentials.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/partner-quick-credentials.json" >> "$GITHUB_ENV"
      - name: Install Firebase CLI and isolated Functions dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix functions-partner-quick --ignore-scripts --package-lock=false
          npm install --prefix functions --ignore-scripts --package-lock=false
          npm install -g firebase-tools@15.34.1
      - name: Verify existing live count page without replacing it
        id: count_page
        shell: bash
        run: |
          set -euo pipefail
          status=$(curl --silent --location --output "$RUNNER_TEMP/existing-count-page.html" --write-out '%{http_code}' --max-time 25 https://nico-factory.web.app/partner-counts.html || true)
          if [ "$status" = 200 ] && cmp -s "$RUNNER_TEMP/existing-count-page.html" partner-counts.html; then
            echo 'already_live=true' >> "$GITHUB_OUTPUT"
            echo 'PASS: existing count page matches repository byte-for-byte'
          elif [ "$status" = 200 ] && [ "$(git hash-object "$RUNNER_TEMP/existing-count-page.html")" = '1d30231b80cd3e20b7fdb9b9f5dadf67e16c5928' ]; then
            echo 'already_live=false' >> "$GITHUB_OUTPUT"
            echo 'PASS reviewed original count page, only this one file may change'
            node tools/hosting/surgical-existing-partner-counts.mjs --dry-run
          else
            echo 'STOP: expected reviewed current count page missing/changed; no write'
            exit 1
          fi
      - name: Prepare only count-specific Functions environmental switch
        shell: bash
        run: |
          set -euo pipefail
          test ! -e functions-partner-quick/.env.sales-management-cc116
          printf 'PARTNER_QUICK_COUNTS_ENABLED=enabled\n' > functions-partner-quick/.env.sales-management-cc116
      - name: Wait for separately approved invitation Functions without modifying originals
        shell: bash
        run: |
          set -euo pipefail
          ready=false
          for attempt in $(seq 1 45); do
            if firebase functions:list --project "$FIREBASE_PROJECT_ID" --json > "$RUNNER_TEMP/partner-quick-invite-prereq.json"; then
              if FILE="$RUNNER_TEMP/partner-quick-invite-prereq.json" node <<'NODE'
          const data=JSON.parse(require('node:fs').readFileSync(process.env.FILE,'utf8'));
          const names=(Array.isArray(data.result)?data.result:[]).map(x=>x.id||x.name||x.function||'');
          for(const n of ['sendMissingReportReminders','createPartnerCompanyInvitation',
                           'previewPartnerCompanyInvitation','acceptPartnerCompanyInvitation'])
            if(!names.some(x=>x===n||x.endsWith('/'+n)))process.exit(1);
          NODE
              then
                ready=true; break
              fi
            fi
            sleep 10
          done
          if [ "$ready" != true ]; then
            echo "STOP: invitation Function prerequisites are not live; no count deploy attempted"
            exit 1
          fi
      - name: Detect already-created count-only pair (no redundant build)
        id: existing
        shell: bash
        run: |
          set -euo pipefail
          firebase functions:list --project "$FIREBASE_PROJECT_ID" --json > "$RUNNER_TEMP/current-functions.json"
          FILE="$RUNNER_TEMP/current-functions.json" node <<'NODE'
          const data=JSON.parse(require('node:fs').readFileSync(process.env.FILE,'utf8'));
          const entries=Array.isArray(data.result)?data.result:[];
          const names=entries.map(x=>x.id||x.name||x.function||'');
          const original=['submitPartnerQuickCounts','getPartnerQuickCounts'];
          const present=original.filter(n=>names.some(v=>v===n||v.endsWith('/'+n)));
          if(present.length===1)throw Error('PARTIAL_COUNT_DEPLOY_STOP');
          const approvalLive=names.some(v=>v==='approvePartnerQuickCounts'||
            v.endsWith('/approvePartnerQuickCounts'));
          // Two old Functions are explicitly supported during one-time
          // non-destructive addition of the third; never delete either old API.
          if(approvalLive&&present.length!==2)throw Error('ORPHAN_APPROVAL_STOP');
          for(const n of ['sendMissingReportReminders','createPartnerCompanyInvitation',
                          'previewPartnerCompanyInvitation','acceptPartnerCompanyInvitation'])
            if(!names.some(v=>v===n||v.endsWith('/'+n)))
              throw Error('ORIGINAL_FUNCTION_MISSING '+n);
          require('node:fs').appendFileSync(process.env.GITHUB_OUTPUT,
            'already_deployed='+(present.length===2&&approvalLive?'true':'false')+'\n');
          console.log('COUNT_FUNCTIONS '+(present.length===2&&approvalLive?
            'REUSED_EXISTING_THREE':'ADD_NEW_APPROVAL_WITH_EXISTING_PAIR'));
          NODE
      - name: Repair one-day Artifact Registry cleanup (separate noncritical task)
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          firebase functions:artifacts:setpolicy --days 1 --location asia-northeast1 \
            --project "$FIREBASE_PROJECT_ID" --non-interactive
      - name: Enable isolated count-only functions only if not already created
        if: ${{ steps.existing.outputs.already_deployed != 'true' }}
        id: deploy_quick
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          # Only the new isolated codebase. A prior successful create should
          # never be rebuilt merely because Artifact Registry policy failed.
          firebase deploy --non-interactive --project "$FIREBASE_PROJECT_ID" \
            --config firebase.partner-quick.json --only functions:partner-quick
      # Firebase may report exit 1 after successful 2nd Gen creates solely
      # because Artifact Registry cleanup IAM is missing. Never treat the CLI
      # error as success by itself: verify both new Functions and all original
      # Functions below, followed by unauthenticated 401/403 checks and exact
      # Hosting manifest parity. A real create error must still stop the job.
      - name: Verify new pair and existing 4 Functions remain deployed
        shell: bash
        run: |
          set -euo pipefail
          firebase functions:list --project "$FIREBASE_PROJECT_ID" --json > "$RUNNER_TEMP/partner-quick-functions.json"
          FILE="$RUNNER_TEMP/partner-quick-functions.json" node <<'NODE'
          const data=JSON.parse(require('node:fs').readFileSync(process.env.FILE,'utf8'));
          const names=(Array.isArray(data.result)?data.result:[]).map(x=>x.id||x.name||x.function||'');
          for(const n of ['submitPartnerQuickCounts','getPartnerQuickCounts','approvePartnerQuickCounts',
            'sendMissingReportReminders',
            'createPartnerCompanyInvitation','previewPartnerCompanyInvitation','acceptPartnerCompanyInvitation'])
            if(!names.some(s=>s===n||s.endsWith('/'+n)))throw Error('missing '+n);
          console.log('PASS: three isolated count Functions and existing four preserved');
          NODE
      - name: Read-only unauthenticated count API denial check
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          (async()=>{
            for(const name of ['submitPartnerQuickCounts','getPartnerQuickCounts',
              'approvePartnerQuickCounts']){
              const url='https://asia-northeast1-sales-management-cc116.cloudfunctions.net/'+name;
              const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},
                body:JSON.stringify({data:{}})});
              if(r.status!==401&&r.status!==403)throw Error('anonymous_access_failure '+name+' '+r.status);
              console.log('PASS anonymous rejected '+name+' '+r.status);
            }
          })().catch(e=>{console.error(e.message);process.exit(1)});
          NODE
      - name: Replace only reviewed partner-counts.html preserving all other existing Hosting assets
        if: ${{ steps.count_page.outputs.already_live != 'true' }}
        run: node tools/hosting/surgical-existing-partner-counts.mjs --release
      - name: Verify published count page matches the reviewed source exactly
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --max-time 25 https://nico-factory.web.app/partner-counts.html > "$RUNNER_TEMP/final-partner-counts.html"
          cmp -s "$RUNNER_TEMP/final-partner-counts.html" partner-counts.html
      - name: Verify old app, invite, and new report page are all public
        shell: bash
        run: |
          set -euo pipefail
          for route in / /partner-invite.html /partner-counts.html; do
            code=$(curl --silent --location --output /dev/null --write-out '%{http_code}' --max-time 25 "https://nico-factory.web.app$route")
            test "$code" = 200
            echo "PASS canonical Hosting $route HTTP $code"
          done
