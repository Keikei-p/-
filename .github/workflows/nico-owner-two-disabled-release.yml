name: NICO additive Owner correction v3 TWO DISABLED Functions (STRICT ONE-SHOT)
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/nico-owner-two-disabled-release.yml'
      - 'tools/production/owner-two-disabled-release-scope.mjs'
      - 'tests/owner-two-disabled-release-scope.test.mjs'
  push:
    branches: [main]
    paths:
      - '.github/workflows/nico-owner-two-disabled-release.yml'
      - 'tools/production/owner-two-disabled-release-scope.mjs'
      - 'tests/owner-two-disabled-release-scope.test.mjs'
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Audit frozen sales originals, exact 2 targets, versioned correction, trusted principal
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object firestore.rules)" = d9f4df6a2ac0f8b5720534a2461ec66b94379190
          test "$(git hash-object index.html)" = 88ef5636bfe9254e71f2109d452b6d3049f99861
          test "$(git hash-object functions/index.js)" = dfb4c48ada6fa89a24c898cd4a2f911bcede822f
          test "$(git hash-object functions-partner-workspace/index.js)" = 38da7e9174ffea7c406c92292dccfc651b565eb0
          test "$(git hash-object functions-partner-workspace/service.cjs)" = b94a6aba231dc2569009580a178297a5b6194bda
          node --check tools/production/owner-two-disabled-release-scope.mjs
          node --test tests/owner-two-disabled-release-scope.test.mjs
          node --test tests/partner-owner-correction-v3-auth.test.cjs tests/partner-owner-correction-v3.test.cjs
          node --test tests/prepare-hub-owner-correction-v3-package.test.mjs
          echo 'EXACT_ADD_ONLY_TWO_OWNER_CORRECTION_CALLABLES_REVIEWED_NO_DEPLOY'
  deploy-two-disabled-only:
    concurrency:
      group: nico-partner-workspace-production
      cancel-in-progress: false
    needs: offline
    if: >-
      ${{ github.event_name == 'push' &&
          github.repository == 'Keikei-p/-' &&
          github.ref == 'refs/heads/main' &&
          startsWith(github.event.head_commit.message, 'release: owner correction v3 disabled 20261109') &&
          needs.offline.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FIREBASE_PROJECT_ID: sales-management-cc116
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify exact reviewed main and original function/rules hashes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_SHA" = "$(git rev-parse HEAD)"
          test "$GITHUB_SHA" = "$(gh api repos/Keikei-p/-/branches/main --jq .commit.sha)"
          test "$(git hash-object firestore.rules)" = d9f4df6a2ac0f8b5720534a2461ec66b94379190
          test "$(git hash-object index.html)" = 88ef5636bfe9254e71f2109d452b6d3049f99861
          test "$(git hash-object functions/index.js)" = dfb4c48ada6fa89a24c898cd4a2f911bcede822f
          test "$(git hash-object functions-partner-workspace/index.js)" = 38da7e9174ffea7c406c92292dccfc651b565eb0
          test "$(git hash-object functions-partner-workspace/service.cjs)" = b94a6aba231dc2569009580a178297a5b6194bda
          node --test tests/owner-two-disabled-release-scope.test.mjs tests/partner-owner-correction-v3-auth.test.cjs tests/partner-owner-correction-v3.test.cjs
      - name: Install isolated Firebase SDK for the NEW codebase and pinned CLI
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix functions --ignore-scripts --no-audit --no-fund --package-lock=false
          npm install --global firebase-tools@15.34.1 --no-audit --no-fund
      - name: Load existing Firebase identity into ephemeral private file
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          test -n "$FIREBASE_SERVICE_ACCOUNT_JSON"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/nico-owner-v3.private.json"
          chmod 600 "$RUNNER_TEMP/nico-owner-v3.private.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/nico-owner-v3.private.json" >> "$GITHUB_ENV"
      - name: Read existing live Functions inventory and stop if either target already exists
        shell: bash
        run: |
          set -euo pipefail
          firebase functions:list --project "$FIREBASE_PROJECT_ID" --json             > "$RUNNER_TEMP/nico-owner-v3-before.private.json"             2> "$RUNNER_TEMP/nico-owner-v3-cli.private.log"
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          import {NAMES} from './tools/production/owner-two-disabled-release-scope.mjs';
          const j=JSON.parse(readFileSync(process.env.RUNNER_TEMP+'/nico-owner-v3-before.private.json','utf8'));
          if(!Array.isArray(j.result)||j.result.length>500)throw Error('STOP_INVENTORY_UNVERIFIED');
          if(j.result.some(x=>NAMES.includes((x.id||x.name||'').split('/').at(-1))))
            throw Error('STOP_OWNER_FUNCTION_ALREADY_DEPLOYED');
          console.log('EXACT_TWO_NEW_OWNER_FUNCTIONS_BOTH_ABSENT');
          NODE
      - name: Fingerprint original six deployed Finance and partner Functions
        shell: bash
        run: |
          set -euo pipefail
          node tools/production/protect-ranking-original-functions-versions.mjs before
      - name: Build EXACT two-function package in a private disposable runner location
        shell: bash
        run: |
          set -euo pipefail
          node tools/production/prepare-hub-owner-correction-v3-package.mjs --prepare
          root="$RUNNER_TEMP/nico-reviewed-owner-correction-v3-package"
          test "$(find "$root" -type f | wc -l)" -eq 6
          node --check "$root/functions-hub-owner-correction/index.js"
          node --input-type=module - "$root" <<'NODE'
          import {readFileSync} from 'node:fs';
          import {inspectReviewedSource} from './tools/production/owner-two-disabled-release-scope.mjs';
          const root=process.argv[2];
          inspectReviewedSource({
            index:readFileSync(root+'/functions-hub-owner-correction/index.js','utf8'),
            config:readFileSync(root+'/firebase.owner-correction.json','utf8')
          });
          console.log('STRICT_ISOLATED_TWO_TARGETS_CODEBASE_SCOPE_OK');
          NODE
          npm install --prefix "$root/functions-hub-owner-correction"             --ignore-scripts --no-audit --no-fund --package-lock=false
          test ! -e "$root/functions-hub-owner-correction/.env.sales-management-cc116"
          printf 'HUB_OWNER_COUNT_CORRECTION_V3_ENABLED=disabled\n'             > "$root/functions-hub-owner-correction/.env.sales-management-cc116"
          chmod 600 "$root/functions-hub-owner-correction/.env.sales-management-cc116"
          test "$(grep -c '=enabled' "$root/functions-hub-owner-correction/.env.sales-management-cc116" || true)" = 0
      - name: Deploy ONLY TWO NEW disabled owner count correction callables, never Rules or Hosting
        shell: bash
        run: |
          set -euo pipefail
          TARGET="$(node --input-type=module -e "import {TARGETS,exactDeploymentTarget} from './tools/production/owner-two-disabled-release-scope.mjs';process.stdout.write(exactDeploymentTarget(TARGETS.join(',')))")"
          root="$RUNNER_TEMP/nico-reviewed-owner-correction-v3-package"
          (
            cd "$root"
            status=0
            firebase deploy --non-interactive --project "$FIREBASE_PROJECT_ID"               --config firebase.owner-correction.json --only "$TARGET"               > "$RUNNER_TEMP/nico-owner-v3-deploy.private.log" 2>&1 || status=$?
            if [ "$status" -ne 0 ]; then
              echo 'STOP_TWO_DISABLED_OWNER_FUNCTION_DEPLOY_FAILED_NO_RETRY'
              exit 1
            fi
          )
          echo 'TWO_DISABLED_OWNER_FUNCTION_DEPLOY_CLI_COMPLETED'
      - name: Verify both targets disabled in Tokyo and all pre-existing Functions unchanged
        shell: bash
        run: |
          set -euo pipefail
          firebase functions:list --project "$FIREBASE_PROJECT_ID" --json             > "$RUNNER_TEMP/nico-owner-v3-after.private.json"             2>> "$RUNNER_TEMP/nico-owner-v3-cli.private.log"
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          import {verifyDisabledDeployment} from './tools/production/owner-two-disabled-release-scope.mjs';
          const root=process.env.RUNNER_TEMP;
          const before=JSON.parse(readFileSync(root+'/nico-owner-v3-before.private.json','utf8'));
          const after=JSON.parse(readFileSync(root+'/nico-owner-v3-after.private.json','utf8'));
          console.log('OWNER_TWO_DISABLED_METADATA '+JSON.stringify(verifyDisabledDeployment(before,after)));
          NODE
          node tools/production/protect-ranking-original-functions-versions.mjs after
      - name: Confirm a disabled endpoint does not return success to anonymous clients
        shell: bash
        run: |
          set -euo pipefail
          for name in listHubPartnerCounts correctHubPartnerCounts; do
            url="https://asia-northeast1-sales-management-cc116.cloudfunctions.net/$name"
            code="$(curl --connect-timeout 5 --max-time 15 --silent --show-error               --output /dev/null --write-out '%{http_code}' --request POST               --header 'Content-Type: application/json' --data '{"data":{}}' "$url" || true)"
            if [ "$code" = 200 ] || [ "$code" = 204 ]; then
              echo 'STOP_UNEXPECTED_OWNER_CORRECTION_EXPOSURE'
              exit 1
            fi
          done
          echo 'OWNER_CORRECTION_CALLABLES_DEPLOYED_DISABLED_ZERO_BUSINESS_WRITES'
          echo 'FIRESTORE_RULES_CHANGED=NO HOSTING_CHANGED=NO ORIGINAL_FUNCTIONS_CHANGED=NO'
      - name: Destroy private runner credentials, package, logs and function inventories
        if: always()
        shell: bash
        run: |
          rm -rf -- "$RUNNER_TEMP/nico-reviewed-owner-correction-v3-package"
          rm -f "$RUNNER_TEMP/nico-owner-v3.private.json"             "$RUNNER_TEMP/nico-owner-v3-before.private.json"             "$RUNNER_TEMP/nico-owner-v3-after.private.json"             "$RUNNER_TEMP/nico-owner-v3-cli.private.log"             "$RUNNER_TEMP/nico-owner-v3-deploy.private.log"             "$RUNNER_TEMP/nico-original-six-immutable-versions.private.json"
