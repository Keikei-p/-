name: NICO Same App Joint Count HTTP Wiring - NO DEPLOY
on:
  pull_request:
    paths:
      - index.html
      - ranking/same-app-joint-count-projection.mjs
      - ranking/same-app-joint-count-panel.mjs
      - tests/same-app-joint-count-wire.test.mjs
      - functions-ranking-approvals/index.js
      - functions-ranking-approvals/joint-count-http-adapter.cjs
      - tests/joint-count-http-adapter.test.cjs
      - ranking/partner-tab-visibility-policy.mjs
      - ranking/partner-tab-navigation-gate.mjs
      - tests/partner-eight-tab-navigation-bridge.test.mjs
      - functions-partner-tabs/**
      - ranking/owner-partner-tab-settings-panel.mjs
      - tests/partner-tab-publication-*.test.mjs
      - tests/partner-tab-visibility-policy.test.mjs
      - tests/owner-partner-eight-tab-settings-panel.test.mjs
      - ranking/published-partner-tab-server.mjs
      - ranking/published-partner-tab-client.mjs
      - tests/published-partner-tab-client.test.mjs
      - functions-partner-tabs/partner-optional-tab-reader.mjs
      - ranking/published-partner-optional-client.mjs
      - tests/partner-optional-client.test.mjs
      - tests/partner-optional-four-tab-read.test.mjs
      - tests/nico-eight-tab-release-preflight.test.mjs
      - firebase.partner-tabs.json
      - functions-ranking-approvals/ranking/published-partner-tab-server.mjs
      - ranking/owner-visible-count-atomic-loader.mjs
      - functions-ranking-approvals/ranking/owner-visible-count-atomic-loader.mjs
      - ranking/canonical-owner-count-server-factory.mjs
      - functions-ranking-approvals/ranking/canonical-owner-count-server-factory.mjs
      - ranking/owner-visible-count-server-handler.mjs
      - functions-ranking-approvals/ranking/owner-visible-count-server-handler.mjs
      - tests/published-partner-tab-server.test.mjs
      - tests/zero-setup-count-publication-read-gate.test.mjs
      - functions-ranking-approvals/ranking/canonical-joint-count-sku-reader.mjs
      - functions-ranking-approvals/ranking/verified-dual-count-dashboards.mjs
      - functions-ranking-approvals/ranking/partner-month-readonly-loader.mjs
      - functions-ranking-approvals/ranking/partner-workspace-count-source.mjs
      - functions-ranking-approvals/ranking/zero-setup-count-linker.mjs
      - scripts/ci/verify-partner-unified-count-details.cjs
      - .github/workflows/nico-same-app-joint-count-wire-no-deploy.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  read-only-joint-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify pure frontend projection and original partner count details
        run: |
          node --check ranking/same-app-joint-count-projection.mjs
          node --check ranking/same-app-joint-count-panel.mjs
          node --check functions-ranking-approvals/index.js
          node --check functions-ranking-approvals/joint-count-http-adapter.cjs
          node --check ranking/partner-tab-visibility-policy.mjs
          node --check ranking/partner-tab-navigation-gate.mjs
          node --check ranking/owner-partner-tab-settings-panel.mjs
          node --check ranking/published-partner-tab-server.mjs
          node --check ranking/published-partner-tab-client.mjs
          node --check functions-partner-tabs/partner-optional-tab-reader.mjs
          node --check ranking/published-partner-optional-client.mjs
          node --check tests/nico-eight-tab-release-preflight.test.mjs
          node --check functions-ranking-approvals/ranking/published-partner-tab-server.mjs
          node --check ranking/owner-visible-count-atomic-loader.mjs
          node --check functions-ranking-approvals/ranking/owner-visible-count-atomic-loader.mjs
          node --check ranking/canonical-owner-count-server-factory.mjs
          node --check functions-ranking-approvals/ranking/canonical-owner-count-server-factory.mjs
          node --check ranking/owner-visible-count-server-handler.mjs
          node --check functions-ranking-approvals/ranking/owner-visible-count-server-handler.mjs
          node --check functions-partner-tabs/controller.cjs
          node --check functions-partner-tabs/index.js
          node --check functions-partner-tabs/partner-tab-publication-store.mjs
          node --check functions-partner-tabs/trusted-token-reader.mjs
          node --check functions-ranking-approvals/ranking/partner-month-readonly-loader.mjs
          node --check functions-ranking-approvals/ranking/partner-workspace-count-source.mjs
          node --check functions-ranking-approvals/ranking/zero-setup-count-linker.mjs
          node --check functions-ranking-approvals/ranking/canonical-joint-count-sku-reader.mjs
          node --check functions-ranking-approvals/ranking/verified-dual-count-dashboards.mjs
          node --test tests/same-app-joint-count-wire.test.mjs tests/partner-unified-count-team-view.test.mjs tests/joint-count-http-adapter.test.cjs tests/partner-eight-tab-navigation-bridge.test.mjs tests/partner-tab-publication-callables.test.mjs tests/partner-tab-publication-firestore.test.mjs tests/partner-tab-publication-token.test.mjs tests/partner-tab-visibility-policy.test.mjs tests/owner-partner-eight-tab-settings-panel.test.mjs tests/published-partner-tab-server.test.mjs tests/zero-setup-count-publication-read-gate.test.mjs tests/published-partner-tab-client.test.mjs tests/partner-optional-client.test.mjs tests/partner-optional-four-tab-read.test.mjs tests/nico-eight-tab-release-preflight.test.mjs
      - name: Existing count save and self finance remain byte-identical
        run: |
          git fetch --no-tags --depth=1 origin main
          node scripts/ci/verify-partner-unified-count-details.cjs
      - name: Triple release gate and protected source parity (NO DEPLOY)
        run: |
          node - <<'NODE'
          const fs=require("node:fs"),cp=require("node:child_process"),assert=require("node:assert/strict");
          const prev=cp.execFileSync("git",["show","FETCH_HEAD:functions-ranking-approvals/index.js"],{encoding:"utf8"});
          const next=fs.readFileSync("functions-ranking-approvals/index.js","utf8");
          const flag='zeroSetupLink:process.env.NICO_JOINT_ZERO_SETUP_COUNT_LINK_ENABLED==="enabled"';
          const triple='enabled:()=>process.env.NICO_JOINT_COUNT_RANKING_ENABLED==="enabled"&&\n  process.env.NICO_JOINT_ZERO_SETUP_COUNT_LINK_ENABLED==="enabled"&&\n  process.env.NICO_PARTNER_TAB_SERVER_GUARD_VERIFIED==="enabled"';
          assert(next.includes(triple),"All THREE release flags must be enabled");
          assert(next.includes('publishedOnly:true,')&&next.includes('enforcePartnerTabPublication:true'),
           "The ranking API must refuse full unfiltered partner scope");
          assert(next.includes(flag));
          const same=next.replace(triple,
           'enabled:()=>process.env.NICO_JOINT_COUNT_RANKING_ENABLED==="enabled"')
           .replace(' publishedOnly:true,\n','')
           .replace(/zeroSetupLink:process\.env\.NICO_JOINT_ZERO_SETUP_COUNT_LINK_ENABLED==="enabled",[\s\S]*?enforcePartnerTabPublication:true/,
            'zeroSetupLink:false');
          const strip=s=>s.replace(/\/\*[\s\S]*?\*\/|^[ \t]*\/\/.*$/gm,"").replace(/\s+/g,"");
          assert.equal(strip(same),strip(prev));
          const source=[
           "ranking/same-app-joint-count-projection.mjs",
           "ranking/same-app-joint-count-panel.mjs"
          ].map(p=>fs.readFileSync(p,"utf8")).join("\n");
          assert(!/\b(?:getDocs|setDoc|addDoc|updateDoc|deleteDoc|runTransaction|localStorage|fetch|httpsCallable)\s*\(/.test(source));
          const ui=fs.readFileSync("index.html","utf8");
          assert(ui.includes('expectedRole:partner?"partner_owner":"hub_owner"'));
          assert(ui.includes('if(await tryLoadVerifiedSameAppJointCount({'));
          assert(ui.includes('const payload={date,sharedRankings:true};'));
          console.log("J0INT_RELEASE_TWO_GATES_OFF_BY_DEFAULT");
          console.log("SAME_APP_COUNT_SAVE_ORIGINAL_UNCHANGED");
          NODE
      - name: Public production status and unauthenticated denial (NO CREDENTIALS / NO DEPLOY)
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ''
          GOOGLE_APPLICATION_CREDENTIALS: ''
          FIREBASE_TOKEN: ''
        run: |
          set -euo pipefail
          test -z "$FIREBASE_SERVICE_ACCOUNT_JSON"
          test -z "$GOOGLE_APPLICATION_CREDENTIALS"
          test -z "$FIREBASE_TOKEN"
          node --input-type=module <<'NODE'
          import {checkNicoLivePublic} from "./tools/production/nico-live-public-release-audit.mjs";
          const proof=await checkNicoLivePublic({timeoutMs:6500});
          const pages=Object.fromEntries(Object.entries(proof.pages)
            .filter(([key,value])=>value&&Number.isInteger(value.status))
            .map(([key,value])=>[key,{status:value.status,verified:value.verified}]));
          console.log(JSON.stringify({
            project:proof.project,pages,
            callableAnonymousProtected:proof.callableAnonymousProtected,
            gatewayAnonymousProtected:proof.gatewayAnonymousProtected,
            authenticatedOwnerAndPartnerProof:false,
            backupIsolatedRestoreVerified:false,
            productionWrites:0,deployed:false
          }));
          if(!proof.pages.home.verified)
            throw Error("STOP_LIVE_HOME_NOT_VERIFIED");
          if(!proof.callableAnonymousProtected||!proof.gatewayAnonymousProtected)
            throw Error("STOP_ANONYMOUS_ACCESS_BOUNDARY_NOT_VERIFIED");
          console.log("LIVE_PUBLIC_ANONYMOUS_READ_ONLY_PASS_NO_PRODUCTION_WRITE");
          NODE
      - name: No Firebase deploy or source data modifications
        run: echo NO_DEPLOY_NO_FIRESTORE_WRITES
