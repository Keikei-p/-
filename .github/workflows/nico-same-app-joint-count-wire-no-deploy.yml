name: NICO Same App Joint Count HTTP Wiring - NO DEPLOY
on:
  pull_request:
    paths:
      - index.html
      - ranking/same-app-joint-count-projection.mjs
      - ranking/same-app-joint-count-panel.mjs
      - tests/same-app-joint-count-wire.test.mjs
      - functions-ranking-approvals/index.js
      - functions-ranking-approvals/joint-count-http-adapter.cjs
      - tests/joint-count-http-adapter.test.cjs
      - ranking/partner-tab-visibility-policy.mjs
      - ranking/partner-tab-navigation-gate.mjs
      - tests/partner-eight-tab-navigation-bridge.test.mjs
      - functions-partner-tabs/**
      - ranking/owner-partner-tab-settings-panel.mjs
      - tests/partner-tab-publication-*.test.mjs
      - tests/partner-tab-visibility-policy.test.mjs
      - tests/owner-partner-eight-tab-settings-panel.test.mjs
      - functions-ranking-approvals/ranking/canonical-joint-count-sku-reader.mjs
      - functions-ranking-approvals/ranking/verified-dual-count-dashboards.mjs
      - functions-ranking-approvals/ranking/partner-month-readonly-loader.mjs
      - functions-ranking-approvals/ranking/partner-workspace-count-source.mjs
      - functions-ranking-approvals/ranking/zero-setup-count-linker.mjs
      - scripts/ci/verify-partner-unified-count-details.cjs
      - .github/workflows/nico-same-app-joint-count-wire-no-deploy.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  read-only-joint-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify pure frontend projection and original partner count details
        run: |
          node --check ranking/same-app-joint-count-projection.mjs
          node --check ranking/same-app-joint-count-panel.mjs
          node --check functions-ranking-approvals/index.js
          node --check functions-ranking-approvals/joint-count-http-adapter.cjs
          node --check ranking/partner-tab-visibility-policy.mjs
          node --check ranking/partner-tab-navigation-gate.mjs
          node --check ranking/owner-partner-tab-settings-panel.mjs
          node --check functions-partner-tabs/controller.cjs
          node --check functions-partner-tabs/index.js
          node --check functions-partner-tabs/partner-tab-publication-store.mjs
          node --check functions-partner-tabs/trusted-token-reader.mjs
          node --check functions-ranking-approvals/ranking/partner-month-readonly-loader.mjs
          node --check functions-ranking-approvals/ranking/partner-workspace-count-source.mjs
          node --check functions-ranking-approvals/ranking/zero-setup-count-linker.mjs
          node --check functions-ranking-approvals/ranking/canonical-joint-count-sku-reader.mjs
          node --check functions-ranking-approvals/ranking/verified-dual-count-dashboards.mjs
          node --test tests/same-app-joint-count-wire.test.mjs tests/partner-unified-count-team-view.test.mjs tests/joint-count-http-adapter.test.cjs tests/partner-eight-tab-navigation-bridge.test.mjs tests/partner-tab-publication-callables.test.mjs tests/partner-tab-publication-firestore.test.mjs tests/partner-tab-publication-token.test.mjs tests/partner-tab-visibility-policy.test.mjs tests/owner-partner-eight-tab-settings-panel.test.mjs
      - name: Existing count save and self finance remain byte-identical
        run: |
          git fetch --no-tags --depth=1 origin main
          node scripts/ci/verify-partner-unified-count-details.cjs
      - name: Dual release gate unchanged; audited server SKU readers have zero write paths
        run: |
          node - <<'NODE'
          const fs=require("node:fs"),cp=require("node:child_process"),assert=require("node:assert/strict");
          const prev=cp.execFileSync("git",["show","FETCH_HEAD:functions-ranking-approvals/index.js"],{encoding:"utf8"});
          const next=fs.readFileSync("functions-ranking-approvals/index.js","utf8");
          const flag='zeroSetupLink:process.env.NICO_JOINT_ZERO_SETUP_COUNT_LINK_ENABLED==="enabled"';
          assert(next.includes(flag));
          const jointOn='enabled:()=>process.env.NICO_JOINT_COUNT_RANKING_ENABLED==="enabled"&&\n  process.env.NICO_JOINT_ZERO_SETUP_COUNT_LINK_ENABLED==="enabled"';
          assert(next.includes(jointOn),"Both release flags must gate the HTTP route");
          const same=next.replace(flag,"zeroSetupLink:false")
           .replace(jointOn,'enabled:()=>process.env.NICO_JOINT_COUNT_RANKING_ENABLED==="enabled"');
          const strip=s=>s.replace(/\/\*[\s\S]*?\*\/|^[ \t]*\/\/.*$/gm,"").replace(/\s+/g,"");
          assert.equal(strip(same),strip(prev));
          const source=[
           "ranking/same-app-joint-count-projection.mjs",
           "ranking/same-app-joint-count-panel.mjs"
          ].map(p=>fs.readFileSync(p,"utf8")).join("\n");
          assert(!/\b(?:getDocs|setDoc|addDoc|updateDoc|deleteDoc|runTransaction|localStorage|fetch|httpsCallable)\s*\(/.test(source));
          const ui=fs.readFileSync("index.html","utf8");
          assert(ui.includes('expectedRole:partner?"partner_owner":"hub_owner"'));
          assert(ui.includes('if(await tryLoadVerifiedSameAppJointCount({'));
          assert(ui.includes('const payload={date,sharedRankings:true};'));
          console.log("J0INT_RELEASE_TWO_GATES_OFF_BY_DEFAULT");
          console.log("SAME_APP_COUNT_SAVE_ORIGINAL_UNCHANGED");
          NODE
      - name: No Firebase deploy or source data modifications
        run: echo NO_DEPLOY_NO_FIRESTORE_WRITES
