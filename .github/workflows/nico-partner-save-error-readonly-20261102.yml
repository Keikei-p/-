name: NICO partner count-save production error audit READ ONLY
on:
  push:
    branches: [fix/partner-unified-rank-teams-safe-save-20261102]
    paths: [.github/workflows/nico-partner-save-error-readonly-20261102.yml]
permissions:
  contents: read
jobs:
  audit-errors:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Authenticate existing account without exposing secret
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          test -n "${FIREBASE_SERVICE_ACCOUNT_JSON:-}"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/sa.json"
          chmod 600 "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"
      - name: Read Cloud Logging metadata only; no logs contents, emails, UIDs or credentials
        run: |
          set -euo pipefail
          npm install --prefix functions --ignore-scripts --package-lock=false --no-audit --no-fund
          node --input-type=module <<'NODE'
          import {createRequire} from 'node:module';
          const require=createRequire(process.cwd()+'/functions/package.json');
          const token=(await require('firebase-admin/app').applicationDefault().getAccessToken()).access_token;
          const allowed=['permission-denied','failed-precondition','invalid-argument','aborted',
            'unauthenticated','resource-exhausted','data-loss','internal','unavailable',
            'not-found','deadline-exceeded','PERMISSION_DENIED','FAILED_PRECONDITION',
            'INVALID_ARGUMENT','DEADLINE_EXCEEDED','Firestore transaction','Error:'];
          const result=await fetch('https://logging.googleapis.com/v2/entries:list',{
            method:'POST',
            headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},
            body:JSON.stringify({resourceNames:['projects/sales-management-cc116'],
              filter:'resource.type="cloud_run_revision" AND resource.labels.service_name="submitpartnerworkspacecounts" AND timestamp>="2026-11-02T11:10:00Z" AND timestamp<="2026-11-02T11:40:00Z"',
              orderBy:'timestamp desc',pageSize:100})
          });
          if(!result.ok){console.log('READ_ONLY_LOG_UNAVAILABLE_HTTP_'+result.status);process.exit(0);}
          const body=await result.json(),entries=body.entries||[];
          const buckets={};
          for(const entry of entries){
            const raw=JSON.stringify({textPayload:entry.textPayload,jsonPayload:entry.jsonPayload});
            const key=allowed.find(a=>raw.includes(a))||'no_error_code';
            const name=(entry.severity||'DEFAULT')+'_'+key;
            buckets[name]=(buckets[name]||0)+1;
          }
          console.log('LOG_ENTRY_COUNT',entries.length);
          console.log('ERROR_CLASS_COUNTS',JSON.stringify(buckets));
          console.log('NO_PRIVATE_RECORD_CONTENTS_EXPOSED');
          NODE
      - name: Cleanup credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
