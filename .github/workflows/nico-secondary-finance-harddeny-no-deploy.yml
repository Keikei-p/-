name: NICO secondary partner finance hard deny (NO DEPLOY)
on:
  pull_request:
    branches:
      - release/nico-partner-compact-two-column-index-20261102
    paths:
      - firestore.rules
      - tests/rules.test.cjs
      - .github/workflows/nico-secondary-finance-harddeny-no-deploy.yml
  push:
    branches:
      - security/partner-secondary-raw-finance-deny-20261104
permissions:
  contents: read
jobs:
  offline-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Reject any deploy or production credential in this workflow
        shell: bash
        run: |
          set -euo pipefail
          node --check tests/rules.test.cjs
          node - <<'NODE'
          const fs = require('node:fs');
          const workflow = fs.readFileSync('.github/workflows/nico-secondary-finance-harddeny-no-deploy.yml','utf8');
          if (/secrets\.|GOOGLE_APPLICATION_CREDENTIALS|firebase deploy|firebase use|--project sales-management-cc116/.test(workflow)) {
            throw Error('Production access or deployment forbidden in offline test');
          }
          NODE
      - name: Install disposable test-only dependencies
        run: |
          npm install --prefix tests --ignore-scripts --no-audit --no-fund
          npm install --global firebase-tools@15.34.1 --no-audit --no-fund
      - name: Finance and count unit regression without production credentials
        run: |
          node --test tests/internal-owner-finance-visibility.test.cjs tests/partner-money-free-workspace.test.cjs tests/sales-regressions.cjs
      - name: Run all Firestore rules and legacy record tests in isolated emulator
        env:
          FIREBASE_PROJECT_ID: demo-sales-support
        run: |
          firebase emulators:exec --project demo-sales-support --only firestore 'node --test tests/rules.test.cjs'
