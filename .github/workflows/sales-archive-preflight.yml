name: Sales Archive Preflight
on:
  pull_request:
    paths:
      - "sales-archive.js"
      - "index.html"
      - "archive-read-budget.mjs"
      - "tests/archive-read-budget.test.mjs"
      - "tests/archive-ui-routing.test.mjs"
      - ".github/workflows/nico-factory-sync.yml"
      - "archive-*.mjs"
      - "scripts/verify-sales-*.mjs"
      - "scripts/verify-sales-backup.ps1"
      - "scripts/restore-sales-from-env.mjs"
      - "tools/readonly-backup/restore-emulator.mjs"
      - "tools/readonly-backup/restore-emulator.test.mjs"
      - "tests/restore-sales-from-env.test.mjs"
      - "scripts/firestore-readonly-snapshot.mjs"
      - "scripts/verify-firestore-snapshot-pair.mjs"
      - "functions/export-firestore-readonly.mjs"
      - "functions/rehearse-sales-restore.mjs"
      - "tests/archive-*.test.mjs"
      - "tests/sales-archive-unit.test.mjs"
      - "tests/firestore-*.test.mjs"
      - ".github/workflows/sales-archive-preflight.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check archive JavaScript syntax
        run: |
          cp sales-archive.js /tmp/sales-archive.mjs
          node --check /tmp/sales-archive.mjs
          node --check archive-output-policy.mjs
          node --check archive-read-budget.mjs
          node --check archive-coverage.mjs
          node --check scripts/firestore-readonly-snapshot.mjs
          node --check functions/export-firestore-readonly.mjs
          node --check scripts/verify-firestore-snapshot-pair.mjs
          node --check scripts/restore-sales-from-env.mjs
          node --check tools/readonly-backup/restore-emulator.mjs
      - name: Run archive regression suite
        run: node --test tests/archive-ui-routing.test.mjs tests/archive-read-budget.test.mjs tests/sales-archive-unit.test.mjs tests/archive-verifier.test.mjs tests/restore-guard.test.mjs tests/year-archive.test.mjs tests/archive-output-policy.test.mjs tests/archive-pair.test.mjs tests/archive-pair-verifier.test.mjs tests/archive-coverage.test.mjs tests/firestore-readonly-snapshot.test.mjs tests/firestore-snapshot-pair.test.mjs
      - name: Restore 25,001 synthetic documents only through localhost mock (no Firebase access)
        run: node --test tools/readonly-backup/restore-emulator.test.mjs
      - name: Refuse production environment in local backup restore launcher
        run: node --test tests/restore-sales-from-env.test.mjs
      - name: Validate index manifest
        run: node -e "const f=require('./firestore.indexes.json'); if(!f.indexes.some(x=>x.collectionGroup==='records' && x.fields.some(v=>v.fieldPath==='date')))process.exit(1);"
