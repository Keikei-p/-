name: NICO hub owner count correction v3 staging safety (NO DEPLOY)
on:
  pull_request:
    branches: [main]
    paths:
      - 'staging/partner-owner-correction-v3/service.cjs'
      - 'staging/partner-owner-correction-v3/entry.cjs'
      - 'staging/partner-owner-correction-v3/firebase.owner-correction.json'
      - 'tools/production/prepare-hub-owner-correction-v3-package.mjs'
      - 'tests/prepare-hub-owner-correction-v3-package.test.mjs'
      - 'staging/partner-owner-correction-v3/trusted-auth.cjs'
      - 'tests/partner-owner-correction-v3-auth.test.cjs'
      - 'tests/partner-owner-correction-v3.test.cjs'
      - 'tests/partner-sb-v2-workspace.test.cjs'
      - 'staging/partner-sb-v2/partner-conflict-recovery-candidate.mjs'
      - 'tests/partner-conflict-recovery-candidate.test.mjs'
      - 'staging/partner-owner-correction-v3/owner-ui.mjs'
      - 'staging/partner-owner-correction-v3/owner-console.html'
      - 'ranking/partner-count-cache-invalidation.mjs'
      - 'tests/partner-count-cache-invalidation.test.mjs'
      - 'staging/partner-owner-correction-v3/mobile-bootstrap.mjs'
      - 'tests/partner-owner-correction-v3-mobile-bootstrap.test.mjs'
      - 'staging/partner-owner-correction-v3/owner-client.mjs'
      - 'tests/partner-owner-correction-v3-client.test.mjs'
      - 'tests/partner-owner-correction-v3-ui.test.mjs'
      - '.github/workflows/nico-owner-count-correction-v3-offline.yml'
  push:
    branches: [main]
    paths:
      - 'staging/partner-owner-correction-v3/service.cjs'
      - 'staging/partner-owner-correction-v3/entry.cjs'
      - 'staging/partner-owner-correction-v3/firebase.owner-correction.json'
      - 'tools/production/prepare-hub-owner-correction-v3-package.mjs'
      - 'tests/prepare-hub-owner-correction-v3-package.test.mjs'
      - 'staging/partner-owner-correction-v3/trusted-auth.cjs'
      - 'tests/partner-owner-correction-v3-auth.test.cjs'
      - 'tests/partner-owner-correction-v3.test.cjs'
      - 'tests/partner-sb-v2-workspace.test.cjs'
      - 'staging/partner-sb-v2/partner-conflict-recovery-candidate.mjs'
      - 'tests/partner-conflict-recovery-candidate.test.mjs'
      - 'staging/partner-owner-correction-v3/owner-ui.mjs'
      - 'staging/partner-owner-correction-v3/owner-console.html'
      - 'ranking/partner-count-cache-invalidation.mjs'
      - 'tests/partner-count-cache-invalidation.test.mjs'
      - 'staging/partner-owner-correction-v3/mobile-bootstrap.mjs'
      - 'tests/partner-owner-correction-v3-mobile-bootstrap.test.mjs'
      - 'staging/partner-owner-correction-v3/owner-client.mjs'
      - 'tests/partner-owner-correction-v3-client.test.mjs'
      - 'tests/partner-owner-correction-v3-ui.test.mjs'
      - '.github/workflows/nico-owner-count-correction-v3-offline.yml'
permissions:
  contents: read
jobs:
  verify-nonbreaking-count-correction:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Confirm NO DEPLOY and frozen original money/count sources
        id: source_scope
        shell: bash
        run: |
          set -euo pipefail
          # Exact reviewed candidate: exercise new read-only UI and prove
          # the historical signed package remains impossible to prepare.
          # All other sources still pass through the unchanged legacy gate.
          if { [ "$GITHUB_EVENT_NAME" = "pull_request" ] &&
               [ "${GITHUB_HEAD_REF:-}" = "review/owner-partner-correction-ui-safety-no-deploy-20261115" ]; } ||
             { [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF" = "refs/heads/main" ] &&
               [ "$(git hash-object staging/partner-owner-correction-v3/owner-ui.mjs)" = b4f4f24c2da289d9bf64e22c2e64e8f1ce142f07 ]; }; then
            test "$(git hash-object staging/partner-owner-correction-v3/owner-ui.mjs)" = b4f4f24c2da289d9bf64e22c2e64e8f1ce142f07
            test "$(git hash-object staging/partner-owner-correction-v3/owner-client.mjs)" = 83eb3268eb7d1593bc891b286b113c7360061750
            test "$(git hash-object staging/partner-owner-correction-v3/mobile-bootstrap.mjs)" = c35b58367db290aec3f8a86e9bdf73986c5d3f3d
            test "$(git hash-object index.html)" = 5edde6d5e5459ba283d12d157c021d4eee03d587
            test "$(git hash-object firestore.rules)" = d9f4df6a2ac0f8b5720534a2461ec66b94379190
            test "$(git hash-object functions/index.js)" = dfb4c48ada6fa89a24c898cd4a2f911bcede822f
            test "$(git hash-object functions-partner-workspace/index.js)" = 90d51246477cf5cfa6966f3e822326ef06cccd0f
            test "$(git hash-object functions-partner-workspace/service.cjs)" = 614f3216e008642ddf5eda6b93c35cc0469557c3
            node --check staging/partner-owner-correction-v3/owner-ui.mjs
            node --check staging/partner-owner-correction-v3/owner-client.mjs
            node --check staging/partner-owner-correction-v3/mobile-bootstrap.mjs
            node --test tests/partner-owner-correction-v3-client.test.mjs tests/partner-owner-correction-v3-ui.test.mjs tests/partner-owner-correction-v3-mobile-bootstrap.test.mjs
            if node tools/production/prepare-hub-owner-correction-v3-package.mjs --prepare > "$RUNNER_TEMP/owner-frozen-package-result.txt" 2>&1; then
              echo 'STOP_UNREVIEWED_OWNER_PACKAGE_UNEXPECTEDLY_SUCCEEDED'; exit 1
            fi
            grep -Fxq 'STOP_OWNER_V3_PACKAGE_SOURCE_CHANGED' "$RUNNER_TEMP/owner-frozen-package-result.txt"
            test ! -e "$RUNNER_TEMP/nico-reviewed-owner-correction-v3-package"
            echo 'package_allowed=false' >> "$GITHUB_OUTPUT"
            echo 'REVIEWED_STAGED_OWNER_UI_ONLY_FROZEN_RELEASE_STAYS_BLOCKED'
            exit 0
          fi
          echo 'package_allowed=true' >> "$GITHUB_OUTPUT"
          node --check staging/partner-owner-correction-v3/trusted-auth.cjs
          node --check tests/partner-owner-correction-v3-auth.test.cjs
          node --test tests/partner-owner-correction-v3-auth.test.cjs
          node --check staging/partner-owner-correction-v3/entry.cjs
          node --check tools/production/prepare-hub-owner-correction-v3-package.mjs
          node --check tests/prepare-hub-owner-correction-v3-package.test.mjs
          node --test tests/prepare-hub-owner-correction-v3-package.test.mjs
          node --check staging/partner-owner-correction-v3/service.cjs
          node --check tests/partner-owner-correction-v3.test.cjs
          node --test tests/partner-owner-correction-v3.test.cjs
          node --check staging/partner-owner-correction-v3/owner-client.mjs
          node --check tests/partner-owner-correction-v3-client.test.mjs
          node --test tests/partner-owner-correction-v3-client.test.mjs
          node --check staging/partner-owner-correction-v3/mobile-bootstrap.mjs
          node --check tests/partner-owner-correction-v3-mobile-bootstrap.test.mjs
          node --test tests/partner-owner-correction-v3-mobile-bootstrap.test.mjs
          node --check ranking/partner-count-cache-invalidation.mjs
          node --check tests/partner-count-cache-invalidation.test.mjs
          node --test tests/partner-count-cache-invalidation.test.mjs
          node --check staging/partner-owner-correction-v3/owner-ui.mjs
          node --check tests/partner-owner-correction-v3-ui.test.mjs
          node --test tests/partner-owner-correction-v3-ui.test.mjs
          node --check staging/partner-sb-v2/partner-conflict-recovery-candidate.mjs
          node --check tests/partner-conflict-recovery-candidate.test.mjs
          node --test tests/partner-conflict-recovery-candidate.test.mjs
          node --test tests/partner-sb-category-v2.test.cjs tests/partner-sb-v2-workspace.test.cjs tests/partner-sb-v2-dashboard.test.cjs
          node --test tests/partner-workspace.test.cjs
          test "$(git hash-object firestore.rules)" = 'd9f4df6a2ac0f8b5720534a2461ec66b94379190'
          test "$(git hash-object index.html)" = '88ef5636bfe9254e71f2109d452b6d3049f99861'
          test "$(git hash-object functions/index.js)" = 'dfb4c48ada6fa89a24c898cd4a2f911bcede822f'
          test "$(git hash-object functions-partner-workspace/service.cjs)" = 'b94a6aba231dc2569009580a178297a5b6194bda'
          test "$(git hash-object staging/partner-sb-v2/service.cjs)" = '41157a07e159cde651b542bbb9b725039ed7fb58'
          test "$(git hash-object staging/partner-sb-v2/partner-workspace.html)" = '82a1ed0c67b14ea3fd915419da7864b7c99ffe7b'
          node <<'NODE'
          const fs=require('node:fs');
          const source=fs.readFileSync('staging/partner-owner-correction-v3/service.cjs','utf8');
          if(!source.includes('verifyHubOwner')||!source.includes('expectedVersion')||
           !source.includes('partnerWorkAudits')||!source.includes('tx.create(ar,')||
           source.includes('firebase deploy')||/collection\("(?:products|records)"\)/.test(source))
            throw Error('OWNER_CORRECTION_SAFETY_CONTRACT_MISSING');
          NODE
      - name: Prepare reviewed owner correction package in disposable runner (NEVER deploy)
        if: ${{ steps.source_scope.outputs.package_allowed == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          node tools/production/prepare-hub-owner-correction-v3-package.mjs --prepare
          dir="$RUNNER_TEMP/nico-reviewed-owner-correction-v3-package"
          test -d "$dir/functions-hub-owner-correction"
          test "$(find "$dir" -type f | wc -l)" -eq 6
          node --check "$dir/functions-hub-owner-correction/index.js"
          node --check "$dir/functions-hub-owner-correction/service.cjs"
          node --check "$dir/functions-hub-owner-correction/trusted-auth.cjs"
          node --check "$dir/functions-hub-owner-correction/sb-category-v2.cjs"
          test "$(node -e "const f=require('fs');const j=JSON.parse(f.readFileSync(process.argv[1],'utf8'));process.stdout.write(j.functions.codebase)" "$dir/firebase.owner-correction.json")" = 'hub-owner-correction-v3'
          echo 'OWNER_CORRECTION_V3_DISPOSABLE_PACKAGE_VERIFIED_NO_DEPLOY'
      - name: Always remove disposable codebase; do not upload or deploy
        if: always()
        shell: bash
        run: rm -rf -- "$RUNNER_TEMP/nico-reviewed-owner-correction-v3-package"
