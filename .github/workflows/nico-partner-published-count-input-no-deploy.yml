name: NICO partner published count input regression (NO DEPLOY)
on:
  pull_request:
    paths:
      - 'functions-partner-workspace/service.cjs'
      - 'functions-partner-workspace/index.js'
      - 'functions-partner-workspace/shared-count-standings.cjs'
      - 'functions-partner-workspace/submission-publication-guard.cjs'
      - 'ranking/partner-submission-publication-guard.mjs'
      - 'tests/partner-publication-write-ranking-consistency.test.cjs'
      - 'index.html'
      - 'partner-workspace.html'
      - 'finance-partner-boundary-check.html'
      - 'tests/finance-partner-boundary-check.test.mjs'
      - 'tests/partner-workspace.test.cjs'
      - 'tests/approved-partner-count-standings.test.cjs'
      - 'tests/approved-partner-ranking-ui.test.mjs'
      - 'tests/partner-published-count-browser-contract.test.cjs'
      - 'tests/owner-partner-count-browser-contract.test.cjs'
      - 'tests/verified-joint-month-http-bridge.test.mjs'
      - 'tests/owner-visible-count-server-handler.test.mjs'
      - 'tests/record-save-server-confirmation.test.cjs'
      - 'ranking/owner-visible-count-server-handler.mjs'
      - 'functions-ranking-approvals/ranking/owner-visible-count-server-handler.mjs'
      - 'tests/ranking-day-week-deployment-parity.test.cjs'
      - 'tests/verified-two-month-count-input.test.mjs'
      - 'ranking/verified-two-month-count-input.mjs'
      - 'ranking/owner-visible-count-atomic-loader.mjs'
      - 'ranking/canonical-joint-count-sku-reader.mjs'
      - 'functions-ranking-approvals/ranking/verified-two-month-count-input.mjs'
      - 'functions-ranking-approvals/ranking/owner-visible-count-atomic-loader.mjs'
      - 'functions-ranking-approvals/ranking/canonical-joint-count-sku-reader.mjs'
      - 'tests/verified-dual-count-dashboards.test.mjs'
      - 'tests/verified-dual-count-view.test.mjs'
      - 'ranking/verified-joint-month-http-bridge.mjs'
      - 'ranking/verified-dual-count-dashboards.mjs'
      - 'ranking/verified-dual-count-view.mjs'
      - 'functions-ranking-approvals/ranking/verified-dual-count-dashboards.mjs'
      - 'security/secondary-finance-read-fence.mjs'
      - 'tests/secondary-finance-read-fence-emulator.test.mjs'
      - 'tests/secondary-finance-counts-integration-emulator.test.mjs'
      - '.github/workflows/nico-partner-published-count-input-no-deploy.yml'
permissions:
  contents: read
jobs:
  offline-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check count-only backend syntax
        run: |
          node --check functions-partner-workspace/service.cjs
          node --check functions-partner-workspace/shared-count-standings.cjs
          node --check functions-partner-workspace/submission-publication-guard.cjs
          node --check ranking/partner-submission-publication-guard.mjs
          node --check ranking/owner-visible-count-server-handler.mjs
          node --check ranking/verified-joint-month-http-bridge.mjs
          node --check functions-ranking-approvals/ranking/owner-visible-count-server-handler.mjs
          node --check ranking/verified-two-month-count-input.mjs
          node --check ranking/owner-visible-count-atomic-loader.mjs
          node --check ranking/canonical-joint-count-sku-reader.mjs
          node --check functions-ranking-approvals/ranking/verified-two-month-count-input.mjs
          node --check functions-ranking-approvals/ranking/owner-visible-count-atomic-loader.mjs
          node --check functions-ranking-approvals/ranking/canonical-joint-count-sku-reader.mjs
      - name: Test partner ON/OFF read-write contract and stable ranking identities
        run: node --test tests/partner-workspace.test.cjs tests/approved-partner-count-standings.test.cjs tests/partner-published-count-browser-contract.test.cjs tests/owner-partner-count-browser-contract.test.cjs tests/partner-publication-write-ranking-consistency.test.cjs tests/verified-joint-month-http-bridge.test.mjs tests/owner-visible-count-server-handler.test.mjs tests/ranking-day-week-deployment-parity.test.cjs tests/finance-partner-boundary-check.test.mjs tests/approved-partner-ranking-ui.test.mjs tests/verified-dual-count-dashboards.test.mjs tests/verified-dual-count-view.test.mjs tests/verified-two-month-count-input.test.mjs tests/owner-visible-count-atomic-loader.test.mjs tests/canonical-joint-count-sku-reader.test.mjs tests/record-save-server-confirmation.test.cjs

  isolated-finance-counts:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      FIREBASE_PROJECT_ID: demo-nico-secondary-finance-fence
      GCLOUD_PROJECT: demo-nico-secondary-finance-fence
      FIREBASE_SERVICE_ACCOUNT_JSON: ""
      GOOGLE_APPLICATION_CREDENTIALS: ""
      NICO_RULES_APPROVAL: ""
      NICO_PHASE1_INDEPENDENT_SIGNOFF: ""
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Refuse production services and verify exact existing Rules fingerprint
        shell: bash
        run: |
          set -euo pipefail
          test "$FIREBASE_PROJECT_ID" = demo-nico-secondary-finance-fence
          test "$GCLOUD_PROJECT" = demo-nico-secondary-finance-fence
          test -z "$FIREBASE_SERVICE_ACCOUNT_JSON"
          test -z "$GOOGLE_APPLICATION_CREDENTIALS"
          test -z "$NICO_RULES_APPROVAL"
          test -z "$NICO_PHASE1_INDEPENDENT_SIGNOFF"
          test "$(git hash-object firestore.rules)" = d9f4df6a2ac0f8b5720534a2461ec66b94379190
          node --check security/secondary-finance-read-fence.mjs
          node security/secondary-finance-read-fence.mjs --check
      - name: Install isolated emulator dependencies (not deploy)
        run: |
          npm install --prefix tests --ignore-scripts --no-audit --no-fund --package-lock=false
          npm install --prefix functions-partner-workspace --ignore-scripts --no-audit --no-fund --package-lock=false
          npm install --global firebase-tools@15.34.1 --no-audit --no-fund
      - name: Test partner finance GET/LIST/WRITE denial and preserved count saving in real emulator
        shell: bash
        run: |
          firebase emulators:exec --project demo-nico-secondary-finance-fence --only firestore 'node --test --test-concurrency=1 tests/secondary-finance-read-fence-emulator.test.mjs tests/secondary-finance-counts-integration-emulator.test.mjs'
      - name: Confirm NO production activation
        run: |
          echo 'ISOLATED_EMULATOR_ONLY=true'
          echo 'PRODUCTION_RULES_DEPLOYED=false'
          echo 'PRODUCTION_DATA_WRITTEN=false'
          echo 'REAL_PARTNER_UID_DENIAL_NOT_YET_VERIFIED=true'
