name: NICO partner one-tap live Hosting postrelease recheck (READ ONLY)
on:
  push:
    branches: [fix/partner-live-team-one-tap-20261102]
    paths: [.github/workflows/nico-partner-one-tap-live-postverify-readonly.yml]
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Confirm exact expected artifact and safe unchanged original finance
        run: |
          set -euo pipefail
          test "$(git hash-object index.html)" = 66c2b863da883cd479152506e8ddb20e0cd8ab60
          test "$(git hash-object firestore.rules)" = d9f4df6a2ac0f8b5720534a2461ec66b94379190
          test "$(git hash-object functions/index.js)" = dfb4c48ada6fa89a24c898cd4a2f911bcede822f
      - name: GET only - verify newest public HTML after CDN propagation
        run: |
          set -euo pipefail
          for n in 1 2 3 4 5 6; do
            curl -fsSL --retry 2 --max-time 35 -H 'Cache-Control: no-cache' \
              "https://nico-factory.web.app/?nico_one_tap_version=b100b4ebcbbebaee-check-$n" > "$RUNNER_TEMP/live.html"
            sha=$(git hash-object "$RUNNER_TEMP/live.html")
            echo "PUBLIC_INDEX_MATCH_ATTEMPT_$n $([ "$sha" = 66c2b863da883cd479152506e8ddb20e0cd8ab60 ] && echo NEW || echo NONMATCH)"
            if [ "$sha" = 66c2b863da883cd479152506e8ddb20e0cd8ab60 ]; then
              grep -Fq 'partnerCountSaveFailureMessage' "$RUNNER_TEMP/live.html"
              grep -Fq 'p-inline-company-teams' "$RUNNER_TEMP/live.html"
              grep -Fq 'monthlyRevenue' "$RUNNER_TEMP/live.html"
              echo PASS_LIVE_NEW_EXACT_INDEX; exit 0
            fi
            sleep 4
          done
          echo STOP_PUBLISHED_HTML_NOT_MATCHING_EXPECTED; exit 1
      - name: Authenticate existing GET-only Hosting manifest identity
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          test -n "${FIREBASE_SERVICE_ACCOUNT_JSON:-}"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/verify-sa.json"
          chmod 600 "$RUNNER_TEMP/verify-sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/verify-sa.json" >> "$GITHUB_ENV"
      - name: GET only - compare actual new and old Hosting file manifests directly
        run: |
          set -euo pipefail
          npm install --prefix functions --ignore-scripts --package-lock=false --no-audit --no-fund
          node --input-type=module <<'NODE'
          import {createRequire} from 'node:module';
          const require=createRequire(process.cwd()+'/functions/package.json');
          const token=(await require('firebase-admin/app').applicationDefault().getAccessToken()).access_token;
          const base='https://firebasehosting.googleapis.com/v1beta1/';
          const get=async path=>{
            const r=await fetch(base+path,{headers:{Authorization:'Bearer '+token},redirect:'error'});
            if(!r.ok)throw Error('STOP_HOSTING_GET_HTTP_'+r.status);
            return r.json();
          };
          const old='sites/nico-factory/versions/049c92508b8f9b7d';
          const latest='sites/nico-factory/versions/b100b4ebcbbebaee';
          const releases=await get('sites/nico-factory/releases?pageSize=1');
          if(releases.releases?.[0]?.version?.name!==latest)throw Error('STOP_RELEASE_IS_NOT_EXPECTED');
          const [before,after,source,final]=await Promise.all([
            get(old+'/files?pageSize=1000'),
            get(latest+'/files?pageSize=1000'),
            get(old),get(latest)
          ]);
          if(source.status!=='FINALIZED'||final.status!=='FINALIZED'||
             JSON.stringify(source.config)!==JSON.stringify(final.config))
            throw Error('STOP_HOSTING_CONFIG_CHANGED');
          if(before.nextPageToken||after.nextPageToken||
             before.files?.length!==11||after.files?.length!==11)
            throw Error('STOP_HOSTING_FILE_COUNT_CHANGED');
          const oldFiles=new Map(before.files.map(x=>[x.path,x.hash]));
          const newFiles=new Map(after.files.map(x=>[x.path,x.hash]));
          if(oldFiles.size!==11||newFiles.size!==11||
             !oldFiles.has('/index.html')||!newFiles.has('/index.html'))
            throw Error('STOP_INCOMPLETE_MANIFEST');
          for(const [path,hash] of oldFiles)
            if(path!=='/index.html'&&newFiles.get(path)!==hash)
              throw Error('STOP_ORIGINAL_ASSET_MODIFIED');
          if(oldFiles.get('/index.html')===newFiles.get('/index.html'))
            throw Error('STOP_INDEX_NOT_CHANGED');
          console.log('PASS_NEW_VERSION_EXACT_11_FILES_AND_10_PRESERVED_ASSETS');
          NODE
      - name: GET only - original partner invitation URLs
        run: |
          set -euo pipefail
          for page in partner-invite.html partner-counts.html partner-workspace.html; do
            curl -fsSL --retry 3 --max-time 35 "https://nico-factory.web.app/$page" > "$RUNNER_TEMP/$page"
          done
          grep -Fq 'createPartnerCompanyInvitation' "$RUNNER_TEMP/partner-invite.html"
          grep -Fq 'getPartnerQuickCounts' "$RUNNER_TEMP/partner-counts.html"
          grep -Fq 'submitPartnerWorkspaceCounts' "$RUNNER_TEMP/partner-workspace.html"
          echo PASS_ALL_PREEXISTING_PARTNER_ROUTES
      - name: Cleanup protected read-only identity
        if: always()
        run: rm -f "$RUNNER_TEMP/verify-sa.json"
