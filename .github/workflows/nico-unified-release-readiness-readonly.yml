name: NICO unified live release readiness (READ ONLY / NO DEPLOY)
on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/production/unified-release-readiness-readonly.mjs'
      - 'tools/production/inspect-live-partner-callables-readonly.mjs'
      - 'tools/production/audit-secondary-contexts-readonly.mjs'
      - 'tools/production/audit-live-firestore-rules-readonly.mjs'
      - 'tools/production/inspect-project-billing-readonly.mjs'
      - 'security/secondary-finance-read-fence.mjs'
      - 'tests/unified-release-readiness-readonly.test.mjs'
      - 'tests/inspect-live-partner-callables-readonly.test.mjs'
      - '.github/workflows/nico-unified-release-readiness-readonly.yml'
  push:
    branches: [main]
    paths:
      - 'tools/production/unified-release-readiness-readonly.mjs'
      - 'tools/production/inspect-live-partner-callables-readonly.mjs'
      - 'tools/production/audit-secondary-contexts-readonly.mjs'
      - 'tools/production/audit-live-firestore-rules-readonly.mjs'
      - 'tools/production/inspect-project-billing-readonly.mjs'
      - 'security/secondary-finance-read-fence.mjs'
      - 'tests/unified-release-readiness-readonly.test.mjs'
      - 'tests/inspect-live-partner-callables-readonly.test.mjs'
      - '.github/workflows/nico-unified-release-readiness-readonly.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nico-unified-live-readonly-release
  cancel-in-progress: false
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test strict redacted gate and protect all existing finance/partner code
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/production/unified-release-readiness-readonly.mjs
          node --check tools/production/inspect-live-partner-callables-readonly.mjs
          node --check tools/production/audit-secondary-contexts-readonly.mjs
          node --check tools/production/audit-live-firestore-rules-readonly.mjs
          node --check tools/production/inspect-project-billing-readonly.mjs
          node --test tests/unified-release-readiness-readonly.test.mjs tests/inspect-live-partner-callables-readonly.test.mjs
          test "$(git hash-object firestore.rules)" = 'd9f4df6a2ac0f8b5720534a2461ec66b94379190'
          test "$(git hash-object index.html)" = '88ef5636bfe9254e71f2109d452b6d3049f99861'
          test "$(git hash-object functions/index.js)" = 'dfb4c48ada6fa89a24c898cd4a2f911bcede822f'
          test "$(git hash-object functions-partner-workspace/index.js)" = 'ab551981ce12b4d291a20c0b51cbd461be60df54'
          test "$(git hash-object functions-partner-workspace/service.cjs)" = '5334aa48d7f4eb64274a6d7a8bbb4e76d4a2fb65'
          test "$(git hash-object finance-boundary-check.html)" = '7fa664efb17f6d3337e9403498aa8c0857b35be5'
          echo 'PASS_NICO_NO_DEPLOY_READINESS_ONLY'
  live:
    needs: offline
    if: >-
      ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          github.ref == 'refs/heads/main' &&
          github.repository == 'Keikei-p/-' &&
          needs.offline.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FIREBASE_PROJECT_ID: sales-management-cc116
      NICO_SECONDARY_INVENTORY_MODE: READ_ONLY
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact current main and immutable financial sources
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_SHA" = "$(git rev-parse HEAD)"
          test "$GITHUB_SHA" = "$(gh api repos/Keikei-p/-/branches/main --jq '.commit.sha')"
          test "$(git hash-object firestore.rules)" = 'd9f4df6a2ac0f8b5720534a2461ec66b94379190'
          test "$(git hash-object functions-partner-workspace/index.js)" = 'ab551981ce12b4d291a20c0b51cbd461be60df54'
          test "$(git hash-object functions-partner-workspace/service.cjs)" = '5334aa48d7f4eb64274a6d7a8bbb4e76d4a2fb65'
          node --test tests/unified-release-readiness-readonly.test.mjs
      - name: Install existing read-only Firebase SDK dependencies before secrets
        shell: bash
        run: npm install --prefix functions --ignore-scripts --package-lock=false --no-audit --no-fund
      - name: Bind existing audit identity in temporary file
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          test -n "$FIREBASE_SERVICE_ACCOUNT_JSON"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/nico-unified-audit-identity.private.json"
          chmod 600 "$RUNNER_TEMP/nico-unified-audit-identity.private.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/nico-unified-audit-identity.private.json" >> "$GITHUB_ENV"
      - name: Read deployed Firestore Rules metadata only
        shell: bash
        run: |
          set -euo pipefail
          node tools/production/audit-live-firestore-rules-readonly.mjs > "$RUNNER_TEMP/nico-readiness-rules.private.log" 2>&1 || { echo 'STOP_NICO_LIVE_RULES_AUDIT'; exit 1; }
          grep -q '^NICO_LIVE_RULES_SOURCE_AUDIT ' "$RUNNER_TEMP/nico-readiness-rules.private.log"
      - name: Read partner count Functions and joint ranking Function metadata only
        shell: bash
        run: |
          set -euo pipefail
          node tools/production/inspect-live-partner-callables-readonly.mjs > "$RUNNER_TEMP/nico-readiness-partner.private.log" 2>&1 || { echo 'STOP_NICO_PARTNER_FUNCTION_AUDIT'; exit 1; }
          grep -q '^PARTNER_COUNT_FUNCTION_METADATA ' "$RUNNER_TEMP/nico-readiness-partner.private.log"
      - name: Inventory secondary finance path and latest READY backups (GET only)
        shell: bash
        run: |
          set -euo pipefail
          node tools/production/audit-secondary-contexts-readonly.mjs > "$RUNNER_TEMP/nico-readiness-secondary.private.log" 2>&1 || { echo 'STOP_NICO_SECONDARY_BACKUP_AUDIT'; exit 1; }
          grep -q '^NICO_SECONDARY_READ_ONLY ' "$RUNNER_TEMP/nico-readiness-secondary.private.log"
      - name: Read project billing linkage, never infer trial credit or zero future charges
        shell: bash
        run: |
          set -euo pipefail
          node tools/production/inspect-project-billing-readonly.mjs > "$RUNNER_TEMP/nico-readiness-billing.private.log" 2>&1 || { echo 'STOP_NICO_BILLING_AUDIT'; exit 1; }
          grep -q '^NICO_BILLING_METADATA_SAFE ' "$RUNNER_TEMP/nico-readiness-billing.private.log"
      - name: Publish sanitized boolean-only blockers, never private logs or account IDs
        shell: bash
        run: |
          set -euo pipefail
          node tools/production/unified-release-readiness-readonly.mjs
      - name: Destroy temporary key and all private inventory/audit logs
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/nico-unified-audit-identity.private.json"
          rm -f "$RUNNER_TEMP/nico-readiness-rules.private.log"
          rm -f "$RUNNER_TEMP/nico-readiness-partner.private.log"
          rm -f "$RUNNER_TEMP/nico-readiness-secondary.private.log"
          rm -f "$RUNNER_TEMP/nico-readiness-billing.private.log"
