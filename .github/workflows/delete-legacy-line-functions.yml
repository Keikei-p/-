name: Delete Legacy LINE Functions

on:
  push:
    branches:
      - ops/delete-legacy-line-functions-20261003
    paths:
      - .github/workflows/delete-legacy-line-functions.yml

permissions:
  contents: read

jobs:
  delete:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FIREBASE_PROJECT_ID: sales-management-cc116
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Configure credentials
        shell: bash
        run: |
          set -euo pipefail
          tmp="${RUNNER_TEMP}/firebase-service-account.json"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$tmp"
          chmod 600 "$tmp"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$tmp" >> "$GITHUB_ENV"

      - name: List functions before deletion
        run: firebase functions:list --project "$FIREBASE_PROJECT_ID" --non-interactive

      - name: Delete legacy LINE functions only
        run: firebase functions:delete lineWebhook sendMissingReportReminders --region asia-northeast1 --project "$FIREBASE_PROJECT_ID" --force

      - name: Verify no deployed functions remain
        shell: bash
        run: |
          set -euo pipefail
          output="$(firebase functions:list --project "$FIREBASE_PROJECT_ID" --non-interactive)"
          printf '%s\n' "$output"
          if printf '%s' "$output" | grep -Eq 'lineWebhook|sendMissingReportReminders'; then
            echo "::error::Legacy LINE Functions still exist."
            exit 1
          fi
