name: Partner auto-published product rankings (NO DEPLOY)
on:
  push:
    branches: [feature/partner-auto-published-count-ranks-20261105]
    paths:
      - 'functions-partner-workspace/**'
      - 'tests/partner-auto-published-ranking.test.cjs'
      - 'tests/partner-workspace.test.cjs'
      - 'tests/partner-extra-shared-ranking.test.cjs'
      - 'tests/partner-monthly-shared-counts.test.cjs'
      - 'index.html'
      - '.github/workflows/partner-auto-published-rank-no-deploy-20261105.yml'
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GOOGLE_APPLICATION_CREDENTIALS: ''
      FIREBASE_SERVICE_ACCOUNT_JSON: ''
      FIREBASE_PROJECT_ID: demo-partner-auto-rank
      SAFE_INTERNAL_MEMBER_REMOVAL_ENABLED: ''
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check server and tests syntax
        run: |
          node --check functions-partner-workspace/automatic-published-groups.cjs
          node --check functions-partner-workspace/service.cjs
          node --check tests/partner-auto-published-ranking.test.cjs
      - name: Synthetic regression checks for published products and individual rankings
        run: |
          node --test tests/partner-auto-published-ranking.test.cjs tests/partner-workspace.test.cjs tests/partner-extra-shared-ranking.test.cjs tests/partner-monthly-shared-counts.test.cjs tests/partner-catalog-publication.test.cjs tests/partner-catalog-count-links.test.cjs tests/partner-additional-counts-isolation.test.cjs
      - name: NO DEPLOY
        run: echo "NO DEPLOY - synthetic tests only; production Firestore, Rules, Functions, Hosting, Auth, LINE untouched."
