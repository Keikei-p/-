name: NICO live Firestore Rules release classification (GET ONLY / NO DEPLOY)
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/nico-live-rules-release-readonly.yml'
      - 'tools/production/inspect-live-firestore-rules-release.mjs'
      - 'tests/inspect-live-firestore-rules-release.test.mjs'
  push:
    branches: [main]
    paths:
      - '.github/workflows/nico-live-rules-release-readonly.yml'
      - 'tools/production/inspect-live-firestore-rules-release.mjs'
      - 'tests/inspect-live-firestore-rules-release.test.mjs'
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      FIREBASE_SERVICE_ACCOUNT_JSON: ''
      GOOGLE_APPLICATION_CREDENTIALS: ''
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify immutable original financial sources and isolated unit tests
        shell: bash
        run: |
          set -euo pipefail
          test -z "$FIREBASE_SERVICE_ACCOUNT_JSON"
          test -z "$GOOGLE_APPLICATION_CREDENTIALS"
          test "$(git hash-object firestore.rules)" = 'd9f4df6a2ac0f8b5720534a2461ec66b94379190'
          test "$(git hash-object functions/index.js)" = 'dfb4c48ada6fa89a24c898cd4a2f911bcede822f'
          test "$(git hash-object functions-partner-workspace/index.js)" = '38da7e9174ffea7c406c92292dccfc651b565eb0'
          node --check tools/production/inspect-live-firestore-rules-release.mjs
          node --test tests/inspect-live-firestore-rules-release.test.mjs
  live-firebase-rules-readonly:
    needs: offline
    if: >-
      ${{ github.event_name == 'push' &&
          github.repository == 'Keikei-p/-' &&
          github.ref == 'refs/heads/main' &&
          needs.offline.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FIREBASE_PROJECT_ID: sales-management-cc116
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Confirm exact main revision and original Rules unchanged
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_SHA" = "$(git rev-parse HEAD)"
          test "$(git hash-object firestore.rules)" = 'd9f4df6a2ac0f8b5720534a2461ec66b94379190'
          node --test tests/inspect-live-firestore-rules-release.test.mjs
      - name: Install pinned existing Admin SDK for metadata OAuth GET only
        shell: bash
        run: npm install --prefix functions --ignore-scripts --no-audit --no-fund --package-lock=false
      - name: Supply audit service identity without logging or uploading credentials
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          test -n "$FIREBASE_SERVICE_ACCOUNT_JSON"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/nico-rules-readonly.private.json"
          chmod 600 "$RUNNER_TEMP/nico-rules-readonly.private.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/nico-rules-readonly.private.json" >> "$GITHUB_ENV"
      - name: GET exact default Firestore release and active ruleset; emit booleans only
        shell: bash
        run: |
          set -euo pipefail
          node tools/production/inspect-live-firestore-rules-release.mjs
          echo 'PRODUCTION_RULES_RELEASE_WRITES=0'
          echo 'PRODUCTION_FIRESTORE_DOCUMENT_READS=0'
          echo 'PRODUCTION_FIRESTORE_DOCUMENT_WRITES=0'
          echo 'PRODUCTION_FUNCTION_INVOCATIONS=0'
      - name: Remove private temporary identity and CLI logs
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/nico-rules-readonly.private.json"
          rm -f firebase-debug.log firestore-debug.log
