name: NICO legacy quick counts into verified ranking (STAGING / NO DEPLOY)
on:
  pull_request:
    branches: [main]
    paths:
      - 'ranking/partner-legacy-quick-count-reader.mjs'
      - 'ranking/canonical-joint-count-sku-reader.mjs'
      - 'functions-ranking-approvals/ranking/partner-legacy-quick-count-reader.mjs'
      - 'functions-ranking-approvals/ranking/canonical-joint-count-sku-reader.mjs'
      - 'tests/partner-legacy-quick-count-reader.test.mjs'
      - '.github/workflows/nico-partner-legacy-quick-counts-no-deploy.yml'
permissions:
  contents: read
jobs:
  legacy-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GOOGLE_APPLICATION_CREDENTIALS: ''
      FIREBASE_SERVICE_ACCOUNT_JSON: ''
      FIREBASE_TOKEN: ''
      GCLOUD_PROJECT: 'demo-nico-legacy-quick-offline'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify staging-only source and no Firebase credentials
        shell: bash
        run: |
          set -euo pipefail
          test -z "$GOOGLE_APPLICATION_CREDENTIALS"
          test -z "$FIREBASE_SERVICE_ACCOUNT_JSON"
          test -z "$FIREBASE_TOKEN"
          cmp ranking/partner-legacy-quick-count-reader.mjs functions-ranking-approvals/ranking/partner-legacy-quick-count-reader.mjs
          cmp ranking/canonical-joint-count-sku-reader.mjs functions-ranking-approvals/ranking/canonical-joint-count-sku-reader.mjs
          node --check ranking/partner-legacy-quick-count-reader.mjs
          node --check ranking/canonical-joint-count-sku-reader.mjs
          node --check tests/partner-legacy-quick-count-reader.test.mjs
      - name: Verify old saved counts survive ON/OFF and cannot double count or expose prices
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/partner-legacy-quick-count-reader.test.mjs tests/canonical-joint-count-sku-reader.test.mjs tests/owner-product-visibility-rankings.test.mjs
          echo 'STAGING_LEGACY_QUICK_COUNTS_RECONCILED_NO_PRODUCTION_WRITES'
