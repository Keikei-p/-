name = "sales-finance-gateway"
main = "src/index.js"
compatibility_date = "2026-10-22"
workers_dev = true

[vars]
FIREBASE_PROJECT_ID = "sales-management-cc116"
FINANCE_GATEWAY_ENABLED = "disabled"
FINANCE_WRITE_ENABLED = "disabled"
FINANCE_WRITE_APPROVAL = "NOT_APPROVED"
FINANCE_COST_APPROVAL = "NOT_APPROVED"
FINANCE_PARTNER_APPROVAL = "NOT_APPROVED"
# Count-only read API is independent, and stays OFF until public data is reconciled.
PUBLIC_COUNT_GATEWAY_ENABLED = "disabled"
# Separate, default-OFF registration and correction route (independent count ledger).
PARTNER_COUNT_WRITE_ENABLED = "disabled"
# User-facing finance-free product labels; never enables without verified count ledger.
PARTNER_COUNT_CATALOG_ENABLED = "disabled"
PUBLIC_COUNT_PROJECTION_APPROVAL = "NOT_APPROVED"

# SECURITY: Do not deploy this branch to production while legacy SDK listeners
# read full money-bearing products/records documents. No credentials in repo.
# Blaze is not free-by-default. Require explicit OWNER-approved budget, backup,
# dual-host/PWA test evidence before replacing FINANCE_COST_APPROVAL value.
# This default must never be changed during ordinary builds or test runs.
# Set FIREBASE_SERVICE_ACCOUNT_JSON only via Cloudflare secret when approved.
