<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>営業実績管理</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      background: #f4f6f8;
      color: #222;
    }

    button,
    input,
    select {
      font: inherit;
    }

    .app {
      min-height: 100vh;
    }

    /* =========================
       ヘッダー
    ========================= */

    header {
      background: #111827;
      color: white;
      padding: 18px 16px;
    }

    .header-inner {
      max-width: 1100px;
      margin: 0 auto;
    }

    .title {
      font-size: 22px;
      font-weight: 700;
    }

    .subtitle {
      margin-top: 4px;
      font-size: 13px;
      color: #9ca3af;
    }

    /* =========================
       メイン
    ========================= */

    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 20px 16px 50px;
    }

    /* =========================
       ログイン画面
    ========================= */

    .auth-wrapper {
      min-height: calc(100vh - 80px);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .auth-card {
      width: 100%;
      max-width: 420px;
      background: white;
      border-radius: 18px;
      padding: 28px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
    }

    .auth-logo {
      text-align: center;
      font-size: 42px;
      margin-bottom: 8px;
    }

    .auth-title {
      text-align: center;
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .auth-description {
      text-align: center;
      color: #6b7280;
      font-size: 14px;
      margin-bottom: 24px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 7px;
    }

    input {
      width: 100%;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      padding: 13px;
      outline: none;
      background: white;
    }

    input:focus {
      border-color: #2563eb;
    }

    .primary-button {
      width: 100%;
      border: none;
      border-radius: 10px;
      padding: 14px;
      background: #2563eb;
      color: white;
      font-weight: 700;
      cursor: pointer;
    }

    .primary-button:hover {
      opacity: 0.9;
    }

    .secondary-button {
      width: 100%;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      padding: 13px;
      background: white;
      color: #374151;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
    }

    .error-message {
      display: none;
      background: #fef2f2;
      color: #b91c1c;
      border: 1px solid #fecaca;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 16px;
      font-size: 13px;
    }

    .success-message {
      display: none;
      background: #ecfdf5;
      color: #047857;
      border: 1px solid #a7f3d0;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 16px;
      font-size: 13px;
    }

    .switch-text {
      text-align: center;
      margin-top: 18px;
      color: #6b7280;
      font-size: 13px;
    }

    .link-button {
      border: none;
      background: none;
      color: #2563eb;
      cursor: pointer;
      font-weight: 600;
    }

    /* =========================
       アプリ画面
    ========================= */

    #appScreen {
      display: none;
    }

    .user-bar {
      background: white;
      border-radius: 14px;
      padding: 15px;
      margin-bottom: 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
    }

    .user-info {
      min-width: 0;
    }

    .user-name {
      font-weight: 700;
    }

    .user-email {
      font-size: 12px;
      color: #6b7280;
      margin-top: 3px;
      word-break: break-all;
    }

    .role-badge {
      display: inline-block;
      margin-top: 5px;
      background: #eff6ff;
      color: #1d4ed8;
      padding: 4px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
    }

    .logout-button {
      flex-shrink: 0;
      border: none;
      background: #f3f4f6;
      color: #374151;
      padding: 9px 12px;
      border-radius: 9px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
    }

    .welcome-card {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: white;
      border-radius: 18px;
      padding: 24px;
      margin-bottom: 18px;
    }

    .welcome-title {
      font-size: 22px;
      font-weight: 700;
    }

    .welcome-text {
      margin-top: 8px;
      font-size: 14px;
      opacity: 0.9;
      line-height: 1.6;
    }

    .status-card {
      background: white;
      border-radius: 14px;
      padding: 20px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
    }

    .status-title {
      font-weight: 700;
      margin-bottom: 10px;
    }

    .status-text {
      color: #6b7280;
      line-height: 1.7;
      font-size: 14px;
    }

    .setup-warning {
      margin-top: 15px;
      padding: 14px;
      background: #fff7ed;
      border: 1px solid #fed7aa;
      border-radius: 10px;
      color: #9a3412;
      font-size: 13px;
      line-height: 1.6;
    }

    @media (max-width: 600px) {
      .auth-card {
        padding: 22px;
      }

      .user-bar {
        align-items: flex-start;
      }

      .logout-button {
        margin-top: 2px;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <!-- =========================
       ヘッダー
  ========================== -->

  <header>
    <div class="header-inner">
      <div class="title">営業実績管理</div>
      <div class="subtitle">Sales Management System</div>
    </div>
  </header>


  <!-- =========================
       ログイン画面
  ========================== -->

  <main id="authScreen">

    <div class="auth-wrapper">

      <div class="auth-card">

        <div class="auth-logo">📊</div>

        <div class="auth-title" id="authTitle">
          ログイン
        </div>

        <div class="auth-description">
          営業実績管理システム
        </div>

        <div
          id="errorMessage"
          class="error-message">
        </div>

        <div
          id="successMessage"
          class="success-message">
        </div>


        <!-- 名前 -->

        <div
          class="form-group"
          id="nameGroup"
          style="display:none;">

          <label for="name">
            名前
          </label>

          <input
            id="name"
            type="text"
            placeholder="例：山田太郎">
        </div>


        <!-- メール -->

        <div class="form-group">

          <label for="email">
            メールアドレス
          </label>

          <input
            id="email"
            type="email"
            placeholder="example@gmail.com">
        </div>


        <!-- パスワード -->

        <div class="form-group">

          <label for="password">
            パスワード
          </label>

          <input
            id="password"
            type="password"
            placeholder="6文字以上">
        </div>


        <!-- メインボタン -->

        <button
          id="authButton"
          class="primary-button">

          ログイン

        </button>


        <!-- モード切替 -->

        <div class="switch-text">

          <span id="switchDescription">
            アカウントを持っていない？
          </span>

          <button
            id="switchButton"
            class="link-button">

            新規登録

          </button>

        </div>

      </div>

    </div>

  </main>


  <!-- =========================
       アプリ画面
  ========================== -->

  <main id="appScreen">

    <div class="user-bar">

      <div class="user-info">

        <div
          id="userName"
          class="user-name">
          -
        </div>

        <div
          id="userEmail"
          class="user-email">
          -
        </div>

        <div
          id="userRole"
          class="role-badge">
          メンバー
        </div>

      </div>

      <button
        id="logoutButton"
        class="logout-button">

        ログアウト

      </button>

    </div>


    <div class="welcome-card">

      <div class="welcome-title">
        営業実績管理へようこそ
      </div>

      <div class="welcome-text">
        Firebaseとの接続が完了しました。<br>
        ここから班・メンバー・実績・全体ダッシュボードを追加していきます。
      </div>

    </div>


    <div class="status-card">

      <div class="status-title">
        現在の状態
      </div>

      <div class="status-text">

        ログイン：
        <strong id="loginStatus">
          確認中
        </strong>

        <br>

        Firebase：
        <strong id="firebaseStatus">
          接続済み
        </strong>

        <br>

        データベース：
        <strong id="databaseStatus">
          接続確認中
        </strong>

      </div>


      <div
        id="setupWarning"
        class="setup-warning"
        style="display:none;">

        現在、このアカウントは
        <strong>メンバー</strong>
        として登録されています。<br><br>

        次の段階でリーダー設定・班設定を作ります。

      </div>

    </div>

  </main>

</div>


<!-- =====================================================
     Firebase
===================================================== -->

<script type="module">

  /* =========================
     Firebase SDK
  ========================== */

  import {
    initializeApp
  } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

  import {
    getAuth,
    createUserWithEmailAndPassword,
    signInWithEmailAndPassword,
    signOut,
    onAuthStateChanged
  } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";

  import {
    getFirestore,
    doc,
    setDoc,
    getDoc,
    serverTimestamp
  } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


  /* =========================
     Firebase設定
  ========================== */

  const firebaseConfig = {

    apiKey:
      "AIzaSyDhwCVqn28Rne0IjEjbihI0GNZOBrSKd94",

    authDomain:
      "sales-management-cc116.firebaseapp.com",

    projectId:
      "sales-management-cc116",

    storageBucket:
      "sales-management-cc116.firebasestorage.app",

    messagingSenderId:
      "904932511564",

    appId:
      "1:904932511564:web:6583e8b0c585231b9049e"

  };


  /* =========================
     Firebase初期化
  ========================== */

  const app =
    initializeApp(firebaseConfig);

  const auth =
    getAuth(app);

  const db =
    getFirestore(app);


  /* =========================
     HTML取得
  ========================== */

  const authScreen =
    document.getElementById("authScreen");

  const appScreen =
    document.getElementById("appScreen");

  const authTitle =
    document.getElementById("authTitle");

  const authButton =
    document.getElementById("authButton");

  const switchButton =
    document.getElementById("switchButton");

  const switchDescription =
    document.getElementById("switchDescription");

  const nameGroup =
    document.getElementById("nameGroup");

  const nameInput =
    document.getElementById("name");

  const emailInput =
    document.getElementById("email");

  const passwordInput =
    document.getElementById("password");

  const errorMessage =
    document.getElementById("errorMessage");

  const successMessage =
    document.getElementById("successMessage");

  const userName =
    document.getElementById("userName");

  const userEmail =
    document.getElementById("userEmail");

  const userRole =
    document.getElementById("userRole");

  const logoutButton =
    document.getElementById("logoutButton");

  const loginStatus =
    document.getElementById("loginStatus");

  const databaseStatus =
    document.getElementById("databaseStatus");

  const setupWarning =
    document.getElementById("setupWarning");


  /* =========================
     ログイン / 新規登録切替
  ========================== */

  let isRegisterMode = false;


  switchButton.addEventListener(
    "click",
    () => {

      isRegisterMode =
        !isRegisterMode;

      clearMessages();

      if (isRegisterMode) {

        authTitle.textContent =
          "新規登録";

        authButton.textContent =
          "アカウントを作成";

        switchDescription.textContent =
          "すでにアカウントを持っている？";

        switchButton.textContent =
          "ログイン";

        nameGroup.style.display =
          "block";

      } else {

        authTitle.textContent =
          "ログイン";

        authButton.textContent =
          "ログイン";

        switchDescription.textContent =
          "アカウントを持っていない？";

        switchButton.textContent =
          "新規登録";

        nameGroup.style.display =
          "none";
      }

    }
  );


  /* =========================
     メッセージ
  ========================== */

  function showError(message) {

    errorMessage.textContent =
      message;

    errorMessage.style.display =
      "block";

  }


  function showSuccess(message) {

    successMessage.textContent =
      message;

    successMessage.style.display =
      "block";

  }


  function clearMessages() {

    errorMessage.textContent =
      "";

    successMessage.textContent =
      "";

    errorMessage.style.display =
      "none";

    successMessage.style.display =
      "none";

  }


  /* =========================
     Firebaseエラー変換
  ========================== */

  function firebaseErrorMessage(error) {

    switch (error.code) {

      case "auth/email-already-in-use":
        return "このメールアドレスはすでに登録されています。";

      case "auth/invalid-email":
        return "メールアドレスの形式が正しくありません。";

      case "auth/weak-password":
        return "パスワードは6文字以上にしてください。";

      case "auth/invalid-credential":
        return "メールアドレスまたはパスワードが違います。";

      case "auth/user-not-found":
        return "アカウントが見つかりません。";

      case "auth/wrong-password":
        return "パスワードが違います。";

      default:
        return "エラーが発生しました。もう一度試してください。";

    }

  }


  /* =========================
     新規登録
  ========================== */

  async function registerUser() {

    const name =
      nameInput.value.trim();

    const email =
      emailInput.value.trim();

    const password =
      passwordInput.value;


    if (!name) {

      showError(
        "名前を入力してください。"
      );

      return;
    }


    if (!email) {

      showError(
        "メールアドレスを入力してください。"
      );

      return;
    }


    if (password.length < 6) {

      showError(
        "パスワードは6文字以上にしてください。"
      );

      return;
    }


    try {

      authButton.disabled =
        true;

      authButton.textContent =
        "登録中...";


      const result =
        await createUserWithEmailAndPassword(
          auth,
          email,
          password
        );


      const user =
        result.user;


      /* =========================
         Firestoreにユーザー情報保存
      ========================== */

      await setDoc(
        doc(db, "users", user.uid),
        {

          uid: user.uid,

          name: name,

          email: email,

          role: "member",

          teamId: null,

          active: true,

          createdAt:
            serverTimestamp()

        }
      );


      showSuccess(
        "アカウントを作成しました。"
      );


    } catch (error) {

      console.error(error);

      showError(
        firebaseErrorMessage(error)
      );

    } finally {

      authButton.disabled =
        false;

      authButton.textContent =
        isRegisterMode
          ? "アカウントを作成"
          : "ログイン";

    }

  }


  /* =========================
     ログイン
  ========================== */

  async function loginUser() {

    const email =
      emailInput.value.trim();

    const password =
      passwordInput.value;


    if (!email) {

      showError(
        "メールアドレスを入力してください。"
      );

      return;
    }


    if (!password) {

      showError(
        "パスワードを入力してください。"
      );

      return;
    }


    try {

      authButton.disabled =
        true;

      authButton.textContent =
        "ログイン中...";


      await signInWithEmailAndPassword(
        auth,
        email,
        password
      );


    } catch (error) {

      console.error(error);

      showError(
        firebaseErrorMessage(error)
      );

    } finally {

      authButton.disabled =
        false;

      authButton.textContent =
        "ログイン";

    }

  }


  /* =========================
     ボタン処理
  ========================== */

  authButton.addEventListener(
    "click",
    async () => {

      clearMessages();

      if (isRegisterMode) {

        await registerUser();

      } else {

        await loginUser();

      }

    }
  );


  /* =========================
     ログアウト
  ========================== */

  logoutButton.addEventListener(
    "click",
    async () => {

      await signOut(auth);

    }
  );


  /* =========================
     ログイン状態監視
  ========================== */

  onAuthStateChanged(
    auth,
    async (user) => {

      if (user) {

        console.log(
          "ログイン中:",
          user.uid
        );


        authScreen.style.display =
          "none";

        appScreen.style.display =
          "block";

        loginStatus.textContent =
          "ログイン中";


        await loadUserData(
          user
        );


      } else {

        authScreen.style.display =
          "block";

        appScreen.style.display =
          "none";

        loginStatus.textContent =
          "未ログイン";

      }

    }
  );


  /* =========================
     ユーザー情報取得
  ========================== */

  async function loadUserData(user) {

    try {

      const userRef =
        doc(
          db,
          "users",
          user.uid
        );


      const userSnap =
        await getDoc(userRef);


      if (userSnap.exists()) {

        const data =
          userSnap.data();


        userName.textContent =
          data.name || "名前未設定";

        userEmail.textContent =
          data.email || user.email;


        if (data.role === "leader") {

          userRole.textContent =
            "👑 リーダー";

          setupWarning.style.display =
            "none";

        } else {

          userRole.textContent =
            "👤 メンバー";

          setupWarning.style.display =
            "block";

        }


        if (data.teamId) {

          console.log(
            "所属班:",
            data.teamId
          );

        }


      } else {

        userName.textContent =
          "ユーザー情報未登録";

        userRole.textContent =
          "👤 メンバー";

        setupWarning.style.display =
          "block";

      }


      databaseStatus.textContent =
        "接続済み";


    } catch (error) {

      console.error(error);

      databaseStatus.textContent =
        "接続エラー";

    }

  }

</script>

</body>
</html>
