<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>営業実績管理</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="app-header">
  <div>
    <p class="eyebrow">SALES PERFORMANCE</p>
    <h1>営業実績管理</h1>
  </div>

  <button id="monthButton" class="month-button"></button>
</header>

<nav class="tab-nav">
  <button class="tab active" data-page="home">ホーム</button>
  <button class="tab" data-page="performance">個人実績</button>
  <button class="tab" data-page="history">履歴</button>
</nav>

<main class="container">

  <!-- =========================
       ホーム
  ========================== -->

  <section id="homePage" class="page active">

    <section class="hero-card">

      <div>
        <p class="muted">今月の収益</p>
        <p id="totalRevenue" class="hero-number">¥0</p>
      </div>

      <div class="hero-progress">

        <div class="progress-label">
          <span>目標達成率</span>
          <strong id="overallRate">0%</strong>
        </div>

        <div class="progress-track">
          <div id="overallProgress" class="progress-bar"></div>
        </div>

        <p id="overallTargetText" class="muted">
          0件 / 0件
        </p>

      </div>

    </section>

    <section class="summary-grid">

      <article class="stat-card">
        <span>総獲得数</span>
        <strong id="totalCount">0</strong>
        <small>件</small>
      </article>

      <article class="stat-card">
        <span>目標残り</span>
        <strong id="remainingCount">0</strong>
        <small>件</small>
      </article>

      <article class="stat-card">
        <span>登録商材</span>
        <strong id="itemCount">0</strong>
        <small>種類</small>
      </article>

    </section>

    <section class="section">

      <div class="section-title">

        <div>
          <p class="eyebrow">PROGRESS</p>
          <h2>商材別進捗</h2>
        </div>

        <button id="addItemButton" class="primary-button">
          ＋ 商材追加
        </button>

      </div>

      <div id="itemsContainer" class="items-list"></div>

    </section>

    <section class="section">

      <div class="section-title">

        <div>
          <p class="eyebrow">QUICK INPUT</p>
          <h2>実績を入力</h2>
        </div>

      </div>

      <form id="entryForm" class="entry-form">

        <label>
          日付
          <input id="entryDate" type="date" required>
        </label>

        <label>
          商材
          <select id="entryItem" required></select>
        </label>

        <label>
          獲得数
          <input
            id="entryQuantity"
            type="number"
            min="1"
            value="1"
            required
          >
        </label>

        <button class="primary-button" type="submit">
          実績を登録
        </button>

      </form>

      <p id="emptyHint" class="empty-hint"></p>

    </section>

  </section>


  <!-- =========================
       個人実績
  ========================== -->

  <section id="performancePage" class="page">

    <div class="page-heading">

      <p class="eyebrow">MY PERFORMANCE</p>

      <h2>個人実績</h2>

      <p class="muted">
        今月の営業実績をまとめて確認できます。
      </p>

    </div>


    <section class="performance-summary">

      <article class="performance-card">

        <span>総獲得数</span>

        <strong id="performanceCount">
          0
        </strong>

        <small>件</small>

      </article>


      <article class="performance-card">

        <span>総収益</span>

        <strong id="performanceRevenue">
          ¥0
        </strong>

      </article>


      <article class="performance-card">

        <span>1日平均</span>

        <strong id="dailyAverage">
          0
        </strong>

        <small>件</small>

      </article>

    </section>


    <section class="section">

      <div class="section-title">

        <div>

          <p class="eyebrow">
            BREAKDOWN
          </p>

          <h2>
            商材別実績
          </h2>

        </div>

      </div>

      <div id="performanceItems" class="performance-list"></div>

    </section>

  </section>


  <!-- =========================
       履歴
  ========================== -->

  <section id="historyPage" class="page">

    <div class="page-heading">

      <p class="eyebrow">
        HISTORY
      </p>

      <h2>
        実績履歴
      </h2>

      <p class="muted">
        登録した営業実績を確認できます。
      </p>

    </div>


    <section class="section">

      <div id="historyList" class="history-list"></div>

    </section>

  </section>

</main>


<!-- =========================
     商材追加モーダル
========================== -->

<div id="itemModal" class="modal hidden">

  <div
    class="modal-backdrop"
    data-close-modal
  ></div>

  <div class="modal-card">

    <button
      class="modal-close"
      data-close-modal
    >
      ×
    </button>

    <p class="eyebrow">
      NEW ITEM
    </p>

    <h2>
      商材を追加
    </h2>


    <form id="itemForm">

      <label>
        商材名

        <input
          id="itemName"
          type="text"
          placeholder="例：NURO光"
          required
        >
      </label>


      <label>
        月間目標

        <input
          id="itemTarget"
          type="number"
          min="0"
          placeholder="例：10"
          required
        >
      </label>


      <label>
        1件あたりの収益

        <input
          id="itemRevenue"
          type="number"
          min="0"
          placeholder="例：25000"
          required
        >
      </label>


      <button
        class="primary-button full"
        type="submit"
      >
        追加する
      </button>

    </form>

  </div>

</div>


<script src="script.js"></script>

</body>
</html>
