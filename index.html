<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>営業実績管理</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
  background: #f5f7fb;
  color: #1f2937;
}

header {
  background: #111827;
  color: white;
  padding: 20px;
}

header h1 {
  margin: 0;
  font-size: 22px;
}

header p {
  margin: 5px 0 0;
  font-size: 13px;
  opacity: .75;
}

main {
  max-width: 900px;
  margin: auto;
  padding: 16px;
  padding-bottom: 100px;
}

.tabs {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 6px;
  margin-bottom: 16px;
}

.tab {
  border: none;
  background: white;
  padding: 12px 4px;
  border-radius: 10px;
  font-size: 12px;
  cursor: pointer;
  font-weight: 600;
}

.tab.active {
  background: #111827;
  color: white;
}

.page {
  display: none;
}

.page.active {
  display: block;
}

.card {
  background: white;
  border-radius: 16px;
  padding: 18px;
  margin-bottom: 14px;
  box-shadow: 0 3px 12px rgba(0,0,0,.05);
}

.card h2 {
  margin: 0 0 15px;
  font-size: 18px;
}

.card h3 {
  margin: 18px 0 12px;
  font-size: 15px;
}

.form-group {
  margin-bottom: 14px;
}

label {
  display: block;
  font-size: 13px;
  font-weight: 600;
  margin-bottom: 6px;
}

select,
input {
  width: 100%;
  padding: 12px;
  border: 1px solid #d1d5db;
  border-radius: 10px;
  font-size: 16px;
  background: white;
}

.primary-btn {
  width: 100%;
  background: #111827;
  color: white;
  padding: 14px;
  border-radius: 11px;
  font-size: 15px;
  font-weight: 700;
  margin-top: 8px;
}

.secondary-btn {
  background: #e5e7eb;
  color: #374151;
  padding: 10px 12px;
  border-radius: 9px;
  font-size: 13px;
}

.danger-btn {
  background: #fee2e2;
  color: #b91c1c;
  padding: 8px 10px;
  border-radius: 8px;
  font-size: 12px;
}

.product-row {
  display: grid;
  grid-template-columns: 1fr 44px 60px 44px;
  gap: 6px;
  align-items: center;
  margin-bottom: 8px;
}

.product-name {
  font-size: 14px;
  font-weight: 600;
}

.count {
  text-align: center;
  font-weight: 700;
}

.count-btn {
  height: 42px;
  border: none;
  border-radius: 10px;
  background: #eef2f7;
  font-size: 20px;
  cursor: pointer;
}

.summary-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
}

.summary-box {
  background: #f8fafc;
  border-radius: 12px;
  padding: 14px;
}

.summary-box .name {
  font-size: 12px;
  color: #6b7280;
}

.summary-box .number {
  font-size: 24px;
  font-weight: 800;
  margin-top: 4px;
}

.summary-box .sub {
  font-size: 12px;
  color: #6b7280;
  margin-top: 3px;
}

.revenue-total {
  background: #111827;
  color: white;
  border-radius: 14px;
  padding: 18px;
  margin-bottom: 14px;
}

.revenue-total .label {
  font-size: 12px;
  opacity: .75;
}

.revenue-total .value {
  font-size: 30px;
  font-weight: 800;
  margin-top: 5px;
}

.member-card {
  border: 1px solid #e5e7eb;
  border-radius: 12px;
  padding: 14px;
  margin-bottom: 12px;
}

.member-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
}

.member-name {
  font-weight: 800;
  font-size: 17px;
}

.member-total {
  font-size: 13px;
  font-weight: 700;
}

.result-line {
  display: flex;
  justify-content: space-between;
  padding: 8px 0;
  border-bottom: 1px solid #f0f0f0;
  font-size: 14px;
}

.result-line:last-child {
  border-bottom: none;
}

.result-number {
  font-weight: 800;
}

.result-revenue {
  color: #4b5563;
  font-size: 12px;
  margin-left: 8px;
}

.history-item {
  border-bottom: 1px solid #e5e7eb;
  padding: 12px 0;
}

.history-item:last-child {
  border-bottom: none;
}

.history-top {
  display: flex;
  justify-content: space-between;
  margin-bottom: 8px;
}

.history-member {
  font-weight: 700;
}

.history-date {
  font-size: 12px;
  color: #6b7280;
}

.history-results {
  font-size: 13px;
  color: #4b5563;
  line-height: 1.8;
}

.management-row {
  display: grid;
  grid-template-columns: 1fr 120px auto;
  gap: 7px;
  align-items: center;
  margin-bottom: 8px;
}

.management-row input {
  min-width: 0;
}

.empty {
  text-align: center;
  color: #9ca3af;
  padding: 30px 10px;
  font-size: 14px;
}

@media (min-width: 700px) {
  .summary-grid {
    grid-template-columns: repeat(3, 1fr);
  }
}
</style>
</head>

<body>

<header>
  <h1>営業実績管理</h1>
  <p>件数・個人実績・チーム実績・収益を一括管理</p>
</header>

<main>

<!-- =========================
     タブ
========================= -->

<div class="tabs">

  <button class="tab active"
    onclick="showPage('input', this)">
    ➕ 入力
  </button>

  <button class="tab"
    onclick="showPage('team', this)">
    👥 チーム
  </button>

  <button class="tab"
    onclick="showPage('personal', this)">
    👤 個人
  </button>

  <button class="tab"
    onclick="showPage('history', this)">
    📋 履歴
  </button>

  <button class="tab"
    onclick="showPage('settings', this)">
    ⚙️ 管理
  </button>

</div>


<!-- =========================
     入力
========================= -->

<section id="input" class="page active">

  <div class="card">

    <h2>実績を入力</h2>

    <div class="form-group">
      <label>担当者</label>
      <select id="inputMember"></select>
    </div>

    <div class="form-group">
      <label>日付</label>
      <input type="date" id="inputDate">
    </div>

    <h3>商材別実績</h3>

    <div id="inputProducts"></div>

    <button
      class="primary-btn"
      onclick="saveRecord()">
      実績を登録する
    </button>

  </div>

</section>


<!-- =========================
     チーム
========================= -->

<section id="team" class="page">

  <div class="card">

    <h2>チーム全体</h2>

    <div class="revenue-total">

      <div class="label">
        チーム総収益
      </div>

      <div
        class="value"
        id="teamRevenue">
        0円
      </div>

    </div>

    <div
      id="teamSummary"
      class="summary-grid">
    </div>

  </div>

</section>


<!-- =========================
     個人
========================= -->

<section id="personal" class="page">

  <div class="card">

    <h2>個人実績</h2>

    <div id="personalResults"></div>

  </div>

</section>


<!-- =========================
     履歴
========================= -->

<section id="history" class="page">

  <div class="card">

    <h2>実績履歴</h2>

    <div id="historyList"></div>

  </div>

</section>


<!-- =========================
     管理
========================= -->

<section id="settings" class="page">

  <div class="card">

    <h2>商材管理</h2>

    <p style="font-size:12px;color:#6b7280;">
      商材名と1件あたりの収益を設定できます。
    </p>

    <div class="form-group">

      <label>商材名</label>

      <input
        id="newProductName"
        placeholder="例：NURO光">

    </div>

    <div class="form-group">

      <label>1件あたりの収益</label>

      <input
        id="newProductRevenue"
        type="number"
        inputmode="numeric"
        placeholder="例：25000">

    </div>

    <button
      class="primary-btn"
      onclick="addProduct()">
      ＋ 商材を追加
    </button>

    <div
      style="margin-top:18px"
      id="productList">
    </div>

  </div>


  <div class="card">

    <h2>スタッフ管理</h2>

    <div class="form-group">

      <label>スタッフ名</label>

      <input
        id="newMemberName"
        placeholder="例：山田">

    </div>

    <button
      class="primary-btn"
      onclick="addMember()">
      ＋ スタッフを追加
    </button>

    <div
      style="margin-top:18px"
      id="memberList">
    </div>

  </div>


  <div class="card">

    <h2>データ管理</h2>

    <button
      class="danger-btn"
      onclick="resetAllData()">
      全データを削除
    </button>

  </div>

</section>

</main>


<script>

/*
============================================================
初期データ
============================================================
*/

const defaultProducts = [

  {
    id: Date.now(),
    name: "MNP",
    revenue: 20000
  },

  {
    id: Date.now() + 1,
    name: "NURO光",
    revenue: 25000
  },

  {
    id: Date.now() + 2,
    name: "ウォーター",
    revenue: 40000
  },

  {
    id: Date.now() + 3,
    name: "つばさ電気",
    revenue: 20000
  },

  {
    id: Date.now() + 4,
    name: "HTBエナジー",
    revenue: 10000
  }

];


const defaultMembers = [

  {
    id: Date.now() + 100,
    name: "中本"
  },

  {
    id: Date.now() + 101,
    name: "灘野"
  },

  {
    id: Date.now() + 102,
    name: "異儀田"
  },

  {
    id: Date.now() + 103,
    name: "扇"
  }

];


/*
============================================================
データ読み込み
============================================================
*/

let products =
  JSON.parse(
    localStorage.getItem("sales_products")
  ) || defaultProducts;


let members =
  JSON.parse(
    localStorage.getItem("sales_members")
  ) || defaultMembers;


let records =
  JSON.parse(
    localStorage.getItem("sales_records")
  ) || [];


/*
============================================================
保存
============================================================
*/

function saveData() {

  localStorage.setItem(
    "sales_products",
    JSON.stringify(products)
  );

  localStorage.setItem(
    "sales_members",
    JSON.stringify(members)
  );

  localStorage.setItem(
    "sales_records",
    JSON.stringify(records)
  );

}


/*
============================================================
起動
============================================================
*/

document.addEventListener(
  "DOMContentLoaded",
  () => {

    document.getElementById(
      "inputDate"
    ).value =
      new Date()
      .toISOString()
      .split("T")[0];

    renderAll();

  }
);


/*
============================================================
ページ切り替え
============================================================
*/

function showPage(pageId, button) {

  document
    .querySelectorAll(".page")
    .forEach(page => {

      page.classList.remove("active");

    });


  document
    .querySelectorAll(".tab")
    .forEach(tab => {

      tab.classList.remove("active");

    });


  document
    .getElementById(pageId)
    .classList.add("active");


  button.classList.add("active");

  renderAll();

}


/*
============================================================
入力画面
============================================================
*/

function renderInput() {

  const memberSelect =
    document.getElementById(
      "inputMember"
    );


  memberSelect.innerHTML = "";


  members.forEach(member => {

    const option =
      document.createElement("option");

    option.value =
      member.id;

    option.textContent =
      member.name;

    memberSelect.appendChild(option);

  });


  const container =
    document.getElementById(
      "inputProducts"
    );


  container.innerHTML = "";


  products.forEach(product => {

    const row =
      document.createElement("div");

    row.className =
      "product-row";


    row.innerHTML = `

      <div class="product-name">
        ${escapeHtml(product.name)}
      </div>

      <button
        class="count-btn"
        onclick="changeCount(
          '${product.id}',
          -1
        )">
        −
      </button>

      <div
        class="count"
        id="count-${product.id}">
        0
      </div>

      <button
        class="count-btn"
        onclick="changeCount(
          '${product.id}',
          1
        )">
        ＋
      </button>

    `;


    container.appendChild(row);

  });

}


/*
============================================================
件数変更
============================================================
*/

function changeCount(
  productId,
  amount
) {

  const element =
    document.getElementById(
      `count-${productId}`
    );


  let count =
    Number(element.textContent);


  count += amount;


  if (count < 0) {

    count = 0;

  }


  element.textContent =
    count;

}


/*
============================================================
実績登録
============================================================
*/

function saveRecord() {

  const memberId =
    Number(
      document.getElementById(
        "inputMember"
      ).value
    );


  const date =
    document.getElementById(
      "inputDate"
    ).value;


  if (!date) {

    alert("日付を入力してください");

    return;

  }


  const results = {};


  products.forEach(product => {

    const element =
      document.getElementById(
        `count-${product.id}`
      );


    const count =
      Number(
        element.textContent
      );


    if (count > 0) {

      /*
      登録時点の単価を保存
      */

      results[product.id] = {

        count: count,

        revenuePerUnit:
          Number(product.revenue)

      };

    }

  });


  if (
    Object.keys(results).length === 0
  ) {

    alert(
      "実績を1件以上入力してください"
    );

    return;

  }


  records.push({

    id: Date.now(),

    date,

    memberId,

    results

  });


  saveData();


  alert(
    "実績を登録しました！"
  );


  renderAll();

}


/*
============================================================
チーム集計
============================================================
*/

function getTeamResults() {

  const totals = {};


  products.forEach(product => {

    totals[product.id] = {

      count: 0,

      revenue: 0

    };

  });


  records.forEach(record => {

    Object.entries(
      record.results
    ).forEach(
      ([productId, data]) => {

        if (
          !totals[productId]
        ) {

          totals[productId] = {

            count: 0,

            revenue: 0

          };

        }


        totals[productId].count +=
          Number(data.count);


        totals[productId].revenue +=
          Number(data.count) *
          Number(data.revenuePerUnit);

      }
    );

  });


  return totals;

}


/*
============================================================
チーム表示
============================================================
*/

function renderTeam() {

  const container =
    document.getElementById(
      "teamSummary"
    );


  container.innerHTML = "";


  const totals =
    getTeamResults();


  let totalRevenue = 0;


  let totalCount = 0;


  products.forEach(product => {

    const data =
      totals[product.id] || {

        count: 0,

        revenue: 0

      };


    totalCount +=
      data.count;


    totalRevenue +=
      data.revenue;


    const box =
      document.createElement(
        "div"
      );


    box.className =
      "summary-box";


    box.innerHTML = `

      <div class="name">
        ${escapeHtml(product.name)}
      </div>

      <div class="number">
        ${data.count}件
      </div>

      <div class="sub">
        収益 ${formatYen(
          data.revenue
        )}
      </div>

    `;


    container.appendChild(box);

  });


  const totalBox =
    document.createElement(
      "div"
    );


  totalBox.className =
    "summary-box";


  totalBox.innerHTML = `

    <div class="name">
      全商材合計
    </div>

    <div class="number">
      ${totalCount}件
    </div>

    <div class="sub">
      収益 ${formatYen(
        totalRevenue
      )}
    </div>

  `;


  container.prepend(totalBox);


  document.getElementById(
    "teamRevenue"
  ).textContent =
    formatYen(totalRevenue);

}


/*
============================================================
個人集計
============================================================
*/

function getMemberResults(
  memberId
) {

  const totals = {};


  products.forEach(product => {

    totals[product.id] = {

      count: 0,

      revenue: 0

    };

  });


  records
    .filter(
      record =>
        record.memberId === memberId
    )
    .forEach(record => {

      Object.entries(
        record.results
      ).forEach(
        ([productId, data]) => {

          if (
            !totals[productId]
          ) {

            totals[productId] = {

              count: 0,

              revenue: 0

            };

          }


          totals[productId].count +=
            Number(data.count);


          totals[productId].revenue +=
            Number(data.count) *
            Number(data.revenuePerUnit);

        }
      );

    });


  return totals;

}


/*
============================================================
個人表示
============================================================
*/

function renderPersonal() {

  const container =
    document.getElementById(
      "personalResults"
    );


  container.innerHTML = "";


  members.forEach(member => {

    const totals =
      getMemberResults(
        member.id
      );


    let totalCount = 0;

    let totalRevenue = 0;


    products.forEach(product => {

      totalCount +=
        totals[product.id]?.count || 0;

      totalRevenue +=
        totals[product.id]?.revenue || 0;

    });


    const card =
      document.createElement(
        "div"
      );


    card.className =
      "member-card";


    let resultHtml = "";


    products.forEach(product => {

      const data =
        totals[product.id] || {

          count: 0,

          revenue: 0

        };


      resultHtml += `

        <div class="result-line">

          <span>
            ${escapeHtml(
              product.name
            )}
          </span>

          <span>

            <strong>
              ${data.count}件
            </strong>

            <span
              class="result-revenue">
              ${formatYen(
                data.revenue
              )}
            </span>

          </span>

        </div>

      `;

    });


    card.innerHTML = `

      <div class="member-header">

        <div class="member-name">
          ${escapeHtml(
            member.name
          )}
        </div>

        <div class="member-total">
          ${totalCount}件
          /
          ${formatYen(
            totalRevenue
          )}
        </div>

      </div>

      ${resultHtml}

    `;


    container.appendChild(card);

  });

}


/*
============================================================
履歴
============================================================
*/

function renderHistory() {

  const container =
    document.getElementById(
      "historyList"
    );


  container.innerHTML = "";


  if (
    records.length === 0
  ) {

    container.innerHTML =
      `<div class="empty">
        まだ実績がありません。
      </div>`;

    return;

  }


  const sorted =
    [...records].sort(
      (a,b) => b.id - a.id
    );


  sorted.forEach(record => {

    const member =
      members.find(
        m =>
          m.id === record.memberId
      );


    const memberName =
      member
        ? member.name
        : "不明";


    let resultHtml = "";


    let totalRevenue = 0;


    Object.entries(
      record.results
    ).forEach(
      ([productId, data]) => {

        const product =
          products.find(
            p =>
              p.id == productId
          );


        if (!product) return;


        const revenue =
          Number(data.count) *
          Number(data.revenuePerUnit);


        totalRevenue +=
          revenue;


        resultHtml += `

          ${escapeHtml(
            product.name
          )}

          ${data.count}件

          ×

          ${formatYen(
            data.revenuePerUnit
          )}

          ＝

          ${formatYen(
            revenue
          )}

          <br>

        `;

      }
    );


    const item =
      document.createElement(
        "div"
      );


    item.className =
      "history-item";


    item.innerHTML = `

      <div class="history-top">

        <span class="history-member">
          ${escapeHtml(
            memberName
          )}
        </span>

        <span class="history-date">
          ${record.date}
        </span>

      </div>

      <div class="history-results">

        ${resultHtml}

        <strong>
          合計 ${formatYen(
            totalRevenue
          )}
        </strong>

      </div>

      <div style="margin-top:8px">

        <button
          class="danger-btn"
          onclick="deleteRecord(
            ${record.id}
          )">
          削除
        </button>

      </div>

    `;


    container.appendChild(item);

  });

}


/*
============================================================
商材追加
============================================================
*/

function addProduct() {

  const name =
    document
      .getElementById(
        "newProductName"
      )
      .value
      .trim();


  const revenue =
    Number(
      document.getElementById(
        "newProductRevenue"
      ).value
    );


  if (!name) {

    alert(
      "商材名を入力してください"
    );

    return;

  }


  if (
    !Number.isFinite(revenue) ||
    revenue < 0
  ) {

    alert(
      "1件あたりの収益を入力してください"
    );

    return;

  }


  const exists =
    products.some(
      product =>
        product.name === name
    );


  if (exists) {

    alert(
      "同じ名前の商材があります"
    );

    return;

  }


  products.push({

    id: Date.now(),

    name,

    revenue

  });


  document.getElementById(
    "newProductName"
  ).value = "";


  document.getElementById(
    "newProductRevenue"
  ).value = "";


  saveData();

  renderAll();


  alert(
    "商材を追加しました！"
  );

}


/*
============================================================
商材一覧
============================================================
*/

function renderProducts() {

  const container =
    document.getElementById(
      "productList"
    );


  container.innerHTML = "";


  products.forEach(product => {

    const row =
      document.createElement(
        "div"
      );


    row.className =
      "management-row";


    row.innerHTML = `

      <input
        value="${escapeAttribute(
          product.name
        )}"
        onchange="
          renameProduct(
            ${product.id},
            this.value
          )
        "
      >

      <input
        type="number"
        value="${product.revenue}"
        onchange="
          changeProductRevenue(
            ${product.id},
            this.value
          )
        "
      >

      <button
        class="danger-btn"
        onclick="
          deleteProduct(
            ${product.id}
          )
        ">
        削除
      </button>

    `;


    container.appendChild(row);

  });

}


/*
============================================================
商材名変更
============================================================
*/

function renameProduct(
  id,
  newName
) {

  newName =
    newName.trim();


  if (!newName) {

    alert(
      "商材名を空にできません"
    );

    renderAll();

    return;

  }


  const duplicate =
    products.some(
      product =>
        product.id !== id &&
        product.name === newName
    );


  if (duplicate) {

    alert(
      "同じ名前の商材があります"
    );

    renderAll();

    return;

  }


  const product =
    products.find(
      product =>
        product.id === id
    );


  if (product) {

    product.name =
      newName;

  }


  saveData();

  renderAll();

}


/*
============================================================
商材単価変更
============================================================
*/

function changeProductRevenue(
  id,
  value
) {

  const revenue =
    Number(value);


  if (
    !Number.isFinite(revenue) ||
    revenue < 0
  ) {

    alert(
      "正しい収益を入力してください"
    );

    renderAll();

    return;

  }


  const product =
    products.find(
      product =>
        product.id === id
    );


  if (product) {

    product.revenue =
      revenue;

  }


  saveData();

  renderAll();

}


/*
============================================================
商材削除
============================================================
*/

function deleteProduct(id) {

  const product =
    products.find(
      product =>
        product.id === id
    );


  if (!product) return;


  if (
    !confirm(
      `「${product.name}」を削除しますか？`
    )
  ) {

    return;

  }


  products =
    products.filter(
      product =>
        product.id !== id
    );


  saveData();

  renderAll();

}


/*
============================================================
スタッフ追加
============================================================
*/

function addMember() {

  const input =
    document.getElementById(
      "newMemberName"
    );


  const name =
    input.value.trim();


  if (!name) {

    alert(
      "スタッフ名を入力してください"
    );

    return;

  }


  if (
    members.some(
      member =>
        member.name === name
    )
  ) {

    alert(
      "同じ名前のスタッフがあります"
    );

    return;

  }


  members.push({

    id: Date.now(),

    name

  });


  input.value = "";


  saveData();

  renderAll();


  alert(
    "スタッフを追加しました！"
  );

}


/*

*/

function renderMembers() {

  const container =
    document.getElementById(

    );


  container.innerHTML = "";


  members.forEach(member => {

      <button
        class="danger-btn"
        onclick="

    `;


    container.appendChild(row);

  });

}

    );


  if (
    answer !== "削除"
  ) {

    return;

  }


  localStorage.removeItem(
    "sales_products"
  );

  localStorage.removeItem(
    "sales_members"
  );

  localStorage.removeItem(
    "sales_records"
  );


  location.reload();

/*
============================================================
円表示
============================================================
*/

function formatYen(value) {

  return Number(value)
    .toLocaleString("ja-JP")
    + "円";

}


/*
============================================================
HTMLエスケープ
============================================================
*/

function escapeHtml(value) {

  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll(
      "'",
      "&#039;"
    );

}


function escapeAttribute(value) {

  return escapeHtml(value);

}
